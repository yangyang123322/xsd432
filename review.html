<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>复盘 · 诊断 · 432 统计</title>
<link rel="stylesheet" href="assets/katex/katex.min.css">
<link rel="stylesheet" href="assets/app.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('ds432.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))</script>
<style>
  .dx{display:grid;grid-template-columns:1fr 120px 90px 90px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .mastery{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px}
  .mastery div{font-size:10.5px;padding:6px 5px;border-radius:5px;text-align:center;line-height:1.3;white-space:normal;word-break:break-all}
</style>
</head>
<body data-page="review.html">
<div class="shell">
  <aside class="side"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="sub">REVIEW · 个人闭环（数据只在本机）</div>
        <h1>复盘 · 诊断</h1>
      </div>
      <div class="actions">
        <button class="btn" id="btnReset">清空全部记录</button>
        <button class="btn" id="themeBtn" title="切换主题">☀</button>
      </div>
    </div>

    <div class="grid g4" id="kpi" style="margin-bottom:16px"></div>

    <div class="grid g2">
      <div class="card">
        <div class="spread"><h3 style="margin:0">今日复习队列</h3><span class="small muted" id="dueNote"></span></div>
        <div id="due" style="margin-top:8px"></div>
      </div>
      <div class="card">
        <div class="spread"><h3 style="margin:0">诊断：先补哪里</h3><span class="small muted">正确率 × 考频</span></div>
        <div class="small muted" style="margin:8px 0 4px">排序键 = (1 − 正确率) × 主考点题数。这个口径的好处是：错得少但必考的考点，会排在错得多但只考过一次的考点前面。</div>
        <div id="diag"></div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="spread"><h3 style="margin:0">掌握图</h3><span class="small muted">绿 = 做过且对 · 红 = 做过但错 · 灰 = 未碰</span></div>
      <div class="mastery" id="mastery" style="margin-top:10px"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="spread"><h3 style="margin:0">错题本</h3><a class="small" href="bank.html?f=wrong">去题库刷 →</a></div>
      <div id="wrong" style="margin-top:8px"></div>
    </div>

    <footer class="foot">复习调度是简化 SM-2：<b>忘了</b> → 间隔 1 天、难度系数 −0.2；<b>记得</b> → 间隔 × 难度系数（默认 2.5）；<b>太简单</b> → 再 × 1.25。它不是 FSRS，但对「回忆式复习」足够，且完全离线。</footer>
  </main>
</div>

<script src="data/data.js"></script>
<script src="assets/katex/katex.min.js"></script>
<script src="assets/app.js"></script>
<script>
U.boot("review.html");
(function(){
  const D = window.DATA, Q = D.qs;

  function draw(){
    const st = U.qs.stat(), due = U.srs.due(), all = U.qs.all();
    document.getElementById("kpi").innerHTML = [
      ["做过", st.done, "题 / 共 "+Q.length], ["错题", st.wrong, "待清"],
      ["收藏", st.star, "题"], ["待复习", due.length, "今天到期"]
    ].map(([k,v,h])=>'<div class="kpi"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="h">'+h+'</div></div>').join("");

    // 今日复习
    document.getElementById("dueNote").textContent = "到期 " + due.length + " 题";
    document.getElementById("due").innerHTML = due.length ? due.slice(0,6).map(id=>{
      const q = U.q(id); if (!q) return "";
      return U.qcard(q, {}).replace('<div class="q-open">','<div class="q-open" style="display:block">');
    }).join("") + (due.length>6?'<div class="small muted">还有 '+(due.length-6)+' 题，去 <a href="bank.html?f=wrong">题库</a> 继续。</div>':"")
      : '<div class="empty">今天没有到期复习。<br><span class="small">去 <a href="bank.html">题库</a> 做几题，用「记住了 / 没做出」把它们排进队列。</span></div>';

    // 诊断
    const byKp = {};
    Q.forEach(q=>{ const s = all[q.id]; if (!s || s.acc===undefined) return; (byKp[q.kp]=byKp[q.kp]||[]).push(s.acc); });
    const rows = Object.entries(byKp).map(([k,v])=>{
      const acc = v.reduce((a,b)=>a+b,0)/v.length;
      const kp = U.kp(k);
      return {kp:k, acc:acc, n:v.length, weight: kp?kp.main:1, score:(1-acc)*(kp?kp.main:1)};
    }).sort((a,b)=>b.score-a.score);
    const mx = rows.length ? rows[0].score : 1;
    document.getElementById("diag").innerHTML = rows.length ? rows.slice(0,10).map(r=>
      '<div class="dx"><a href="bank.html?kp='+encodeURIComponent(r.kp)+'">'+r.kp+'</a>'+
      '<div class="bar"><i style="width:'+(r.score/(mx||1)*100)+'%"></i></div>'+
      '<span class="small" style="text-align:right">'+Math.round(r.acc*100)+'% 正确</span>'+
      '<span class="small muted" style="text-align:right">优先 '+r.weight+'</span></div>').join("")
      : '<div class="empty">还没有做题记录。做完题点「记住了 / 没做出」，这里才会出现诊断。</div>';

    // 掌握图
    document.getElementById("mastery").innerHTML = [...D.kps].sort((a,b)=>b.main-a.main).map(k=>{
      const qs = Q.filter(q=>q.kp===k.name);
      const done = qs.filter(q=>all[q.id] && all[q.id].acc!==undefined);
      const ok = done.filter(q=>all[q.id].acc===1).length;
      let bg = "var(--bg-soft)", fg = "var(--ink-3)", label = k.name;
      if (done.length){
        const p = ok/done.length;
        bg = p>=.8 ? "rgba(31,122,77,.85)" : p>=.5 ? "rgba(160,123,31,.75)" : "rgba(179,52,31,.75)";
        fg = "#fff";
        label = k.name + " " + ok + "/" + done.length;
      }
      return '<div style="background:'+bg+';color:'+fg+'" title="'+k.name+' · 主考 '+k.main+' 题 · 做过 '+done.length+'">'+label+'</div>';
    }).join("");

    // 错题本
    const wrong = Object.keys(all).filter(id=>all[id].wrong).map(id=>U.q(id)).filter(Boolean);
    document.getElementById("wrong").innerHTML = wrong.length
      ? '<div class="pill-row">'+wrong.sort((a,b)=>b.year-a.year).map(q=>'<a class="chip" style="text-decoration:none" href="bank.html?qid='+encodeURIComponent(q.id)+'">'+q.id+'</a>').join("")+"</div>"
      : '<div class="empty">还没有错题。做错时点「没做出」，题目会进这里并排进复习。</div>';

    U.bindCards(document);
    document.querySelectorAll("#due [data-a]").forEach(()=>{});
    document.querySelectorAll("#due .q").forEach(el=>{
      const id = el.getAttribute("data-id");
      const box = el.querySelector(".q-open");
      const act = document.createElement("div");
      act.className = "row";
      act.style.cssText = "gap:6px;padding:8px 0";
      act.innerHTML = '<span class="small muted">复习打分：</span>'+
        '<button class="btn sm" data-g="again">忘了</button><button class="btn sm" data-g="good">记得</button><button class="btn sm" data-g="easy">很简单</button>';
      box.insertBefore(act, box.firstChild);
      act.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click", ev=>{
        ev.stopPropagation();
        U.srs.grade(id, b.getAttribute("data-g"));
        U.qs.patch(id, {acc: b.getAttribute("data-g")==="again"?0:1});
        draw();
      }));
    });
  }

  document.getElementById("btnReset").addEventListener("click", ()=>{
    if (!confirm("清空所有做题记录、错题与复习进度？")) return;
    U.srs.reset(); U.del("qstate"); U.del("quiz"); draw();
  });
  draw();
})();
</script>
</body>
</html>
