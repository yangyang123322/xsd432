<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>笔记汇总 · 432 统计</title>
<link rel="stylesheet" href="assets/katex/katex.min.css">
<link rel="stylesheet" href="assets/app.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('ds432.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))</script>
<style>
  .ntbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .ntbar input{flex:1;min-width:180px;font-family:inherit;font-size:13px;padding:8px 11px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  .ntcard{border:1px solid var(--line);border-radius:var(--radius-s);background:var(--panel);padding:11px 13px;margin:8px 0}
  .ntcard .q{font-family:var(--serif);font-size:13.5px;color:var(--ink-3);border-left:3px solid rgba(214,168,32,.6);
    padding-left:9px;margin-bottom:7px;line-height:1.65;max-height:88px;overflow:auto}
  .ntcard .t{font-size:13.5px;line-height:1.75;white-space:pre-wrap}
  .ntcard .m{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--ink-3)}
  .ntcard .m a{color:var(--accent);text-decoration:none}
  .ntcard .m button{font-family:inherit;font-size:11.5px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);
    background:transparent;color:var(--ink-3);cursor:pointer}
  .ntcard .m button:hover{color:var(--warn);border-color:rgba(179,52,31,.4)}
  .ntcard .m .sp{flex:1}
  .ntcard textarea{width:100%;min-height:66px;font-family:inherit;font-size:13px;padding:8px;border-radius:7px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);box-sizing:border-box;resize:vertical}
  .grp{margin:18px 0 4px;font-size:12px;color:var(--ink-3);letter-spacing:.6px}
  .grp b{color:var(--ink)}
  .empty{padding:30px 0;text-align:center;color:var(--ink-3);font-size:13px}
</style>
</head>
<body data-page="notes.html">
<div class="shell">
  <aside class="side"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="sub">NOTES · 全站划词笔记（只存本机）</div>
        <h1>笔记汇总</h1>
      </div>
      <div class="actions">
        <button class="btn" id="btnExport">导出 JSON</button>
        <button class="btn" id="btnImport">导入</button>
        <input type="file" id="fileIn" accept="application/json,.json" style="display:none">
        <button class="btn" id="themeBtn" title="切换主题">☀</button>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <p style="margin:0">在任意页面<b>选中一段文字</b>，右上角会出现「＋ 加笔记」；写下的笔记会以黄色虚线下划线锚在原文上，点一下就展开。这一页把所有页面的笔记汇总在一起，按页面分组，可搜索、可改、可删、可跳回原文<b>#nt-</b>位置。</p>
    </div>

    <div class="ntbar">
      <input id="kw" placeholder="搜索笔记内容 / 原文 / 页面…">
      <span class="small muted" id="cnt"></span>
    </div>

    <div id="list"></div>

    <footer class="foot">笔记存在浏览器 localStorage 的 <span class="mono">ds432.notes</span> 里：换浏览器、清缓存会丢，重要内容请「导出 JSON」留一份。</footer>
  </main>
</div>

<script src="assets/app.js"></script>
<script src="assets/notes.js"></script>
<script>
U.boot("notes.html");
(function(){
  const KEY = "ds432.notes";
  const TITLES = {
    "index.html":"首页","dashboard.html":"数据大盘","structure.html":"命题结构","chapters.html":"考纲树",
    "pojue.html":"破题诀 34 招","graph.html":"招法网络","path.html":"学习路径","bank.html":"真题题库",
    "exam.html":"组卷模考","papers.html":"八套卷","ladder.html":"阶梯练 93","concepts.html":"辨析卡 87",
    "formulas.html":"公式手册","quiz.html":"默写自测","review.html":"复盘 · 诊断","plan.html":"计划"
  };
  const title = p => TITLES[p] || p.replace(/\.html$/, "");
  let kw = "";

  function load(){ try { return JSON.parse(localStorage.getItem(KEY)||"[]")||[]; } catch(e){ return []; } }
  function save(a){
    localStorage.setItem(KEY, JSON.stringify(a));
    try { window.dispatchEvent(new CustomEvent("ds432:notes-change")); } catch(e){}
    draw();
  }
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function draw(){
    const all = load();
    const list = all.filter(n=>{
      if (!kw) return true;
      const b = (n.text+" "+n.quote+" "+title(n.page)).toLowerCase();
      return b.indexOf(kw.toLowerCase()) >= 0;
    }).slice().sort((a,b)=> (a.page===b.page ? (b.time||"").localeCompare(a.time||"") : a.page.localeCompare(b.page)));

    document.getElementById("cnt").textContent = "共 " + all.length + " 条" + (kw ? " · 命中 " + list.length : "");

    if (!list.length){
      document.getElementById("list").innerHTML = '<div class="empty">' +
        (all.length ? "没有命中「" + esc(kw) + "」的笔记" : "还没有笔记。去任意页面选一段文字，点「＋ 加笔记」试试。") + "</div>";
      return;
    }

    const byPage = {};
    list.forEach(n=>{ (byPage[n.page] = byPage[n.page] || []).push(n); });

    document.getElementById("list").innerHTML = Object.keys(byPage).sort().map(p=>{
      const items = byPage[p];
      return '<div class="grp"><b>' + esc(title(p)) + '</b> · ' + items.length + ' 条 · <a href="' + esc(p) + '" style="color:var(--accent);text-decoration:none">打开页面 →</a></div>' +
        items.map(n=>'<div class="ntcard" data-id="'+esc(n.id)+'">'+
          '<div class="q">'+esc(n.quote||"")+'</div>'+
          '<div class="t">'+esc(n.text||"")+'</div>'+
          '<div class="m"><span>'+esc(n.time||"")+'</span><span class="sp"></span>'+
          '<a href="'+esc(p)+'#nt-'+esc(n.id)+'">定位原文</a>'+
          '<button data-act="edit">编辑</button><button data-act="del">删除</button></div>'+
        '</div>').join("");
    }).join("");

    document.querySelectorAll(".ntcard").forEach(card=>{
      const id = card.getAttribute("data-id");
      card.querySelector('[data-act="del"]').onclick = ()=>{
        if (!confirm("删除这条笔记？")) return;
        save(load().filter(n=>n.id!==id));
      };
      card.querySelector('[data-act="edit"]').onclick = ()=>{
        const all2 = load(); const n = all2.find(x=>x.id===id); if (!n) return;
        card.innerHTML = '<div class="q">'+esc(n.quote||"")+'</div>'+
          '<textarea>'+esc(n.text||"")+'</textarea>'+
          '<div class="m"><span class="sp"></span><button data-act="save">保存</button><button data-act="cancel">取消</button></div>';
        const ta = card.querySelector("textarea"); ta.focus();
        card.querySelector('[data-act="save"]').onclick = ()=>{
          const v = ta.value.trim();
          if (!v) return;
          const arr = load(); arr.forEach(x=>{ if (x.id===id) x.text = v; });
          save(arr);
        };
        card.querySelector('[data-act="cancel"]').onclick = draw;
      };
    });
  }

  document.getElementById("kw").addEventListener("input", e=>{ kw = e.target.value.trim(); draw(); });

  document.getElementById("btnExport").onclick = ()=>{
    const data = JSON.stringify(load(), null, 2);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    a.download = "432笔记_" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  };

  document.getElementById("btnImport").onclick = ()=> document.getElementById("fileIn").click();
  document.getElementById("fileIn").addEventListener("change", e=>{
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try {
        const inc = JSON.parse(rd.result);
        if (!Array.isArray(inc)) throw new Error("格式不对");
        const cur = load(), have = new Set(cur.map(n=>n.id));
        let add = 0;
        inc.forEach(n=>{ if (n && n.id && !have.has(n.id)) { cur.push(n); add++; } });
        save(cur);
        alert("导入完成：新增 " + add + " 条，跳过重复 " + (inc.length - add) + " 条。");
      } catch(err){ alert("导入失败：" + err.message); }
      e.target.value = "";
    };
    rd.readAsText(f, "utf-8");
  });

  window.addEventListener("ds432:notes-change", draw);
  window.addEventListener("storage", draw);
  draw();
})();
</script>
</body>
</html>
