_XF_Y$（或 $f=f_Xf_Y$），分布层面互不影响。","b":"不相关：$\\rho_{XY}=0$，等价于 $\\mathrm{Cov}(X,Y)=0$，等价于 $E(XY)=EX\\cdot EY$。","diff":["层面：整个分布 / 只看二阶矩的线性关系；","含蕴：独立 $\\Rightarrow$ 不相关，反之一般不成立；","例外：二维正态下二者等价。"],"link":"独立是更强的条件，把「任何函数都无关」都包含了；不相关只排除线性关系，仍可能存在非线性依赖。","ex":"$X\\sim U(-1,1)$，$Y=X^2$：$E(XY)=E(X^3)=0=EX\\cdot EY$，不相关；但 $Y$ 由 $X$ 完全决定，显然不独立。"},"bx2":{"def":"若对任意 $x,y$ 有 $F(x,y)=F_X(x)F_Y(y)$，连续型即 $f(x,y)=f_X(x)f_Y(y)$，称 $X,Y$ 相互独立；若 $\\mathrm{Cov}(X,Y)=0$，即 $E(XY)=EX\\cdot EY$，称二者不相关。","diff":"独立是分布层面的条件，要求任意 $g(X)$ 与 $h(Y)$ 都无关，等价于 $E[g(X)h(Y)]=Eg(X)Eh(Y)$；不相关只约束二阶矩，仅排除线性关联，非线性依赖仍可存在。","link":"独立必不相关，反之一般不成立；其逆成立的充要条件是 $(X,Y)$ 服从二维正态，此时 $\\rho=0$ 与独立等价，因为二维正态密度完全由两个边际与 $\\rho$ 确定。"}},{"no":27,"star":2,"title":"独立 vs 互不相容（随机变量版本）","ch":3,"sections":[{"name":"一句话","body":"随机变量谈独立，事件谈互不相容；两者不在一个层面。"},{"name":"得分点","body":"> \"独立\"用于描述随机变量（或事件）在概率上互不影响，判据是联合分布等于边际之积；\"互不相容\"只用于事件，指不能同时发生（交集为空）。对随机变量而言，\"互不相容\"这个说法没有意义。若把 $X,Y$ 各自的事件 $A=\\{X\\in\\}$、$B=\\{Y\\in\\}$ 拿出来讨论，则 $A,B$ 互不相容与 $X,Y$ 独立是两个不同问题：前者是样本点不重叠，后者是概率可乘。考试中常见错误是把\"$X,Y$ 不相互独立\"写成\"$X,Y$ 互不相容\"。"},{"name":"钩子","body":"变量说独立，事件说互斥。"}],"one":"随机变量谈独立，事件谈互不相容；两者不在一个层面。","hook":"变量说独立，事件说互斥。","bx":{"a":"独立：用于随机变量（或事件），指概率上互不影响，判据是联合等于边际之积。","b":"互不相容：只用于事件，指不能同时发生（交集为空）。","diff":["对象：随机变量 / 事件；","性质：概率可乘 / 集合不重叠；","对随机变量本身说「互不相容」是没有意义的。"],"link":"把 $X,Y$ 各自的事件 $\\{X\\in A\\},\\{Y\\in B\\}$ 拿出来才谈互不相容；那时「两事件互不相容」与「$X,Y$ 独立」是两个独立的问题：前者讲样本点不相交，后者讲概率能拆。","ex":"$X\\sim U(0,1)$：事件 $\\{X<0.5\\}$ 与 $\\{X>0.5\\}$ 互不相容；但说「$X$ 与 $X$ 独立」是错的——同一变量谈不上独立。"},"bx2":{"def":"若 $P(AB)=P(A)P(B)$，称事件 $A,B$ 相互独立；若 $AB=\\varnothing$，称 $A,B$ 互不相容。对随机变量，独立指 $F(x,y)=F_X(x)F_Y(y)$ 对一切 $x,y$ 成立。","diff":"互不相容是样本点集合的关系，只对事件而言，说两个随机变量互不相容没有意义；独立是概率可乘的关系，对事件与随机变量都成立，判据是联合等于边际之积。","link":"若 $P(A)>0$、$P(B)>0$ 且互不相容，则 $P(AB)=0\\ne P(A)P(B)$，故必不独立；二者只在某个事件概率为 $0$ 时可能同时成立，随机变量的独立须落到 $\\{X\\in A\\}$ 与 $\\{Y\\in B\\}$ 上讨论。"}},{"no":28,"star":3,"title":"协方差 vs 相关系数","ch":3,"sections":[{"name":"一句话","body":"协方差有量纲、无上下界；相关系数无量纲、落在 $[-1,1]$。"},{"name":"定义卡","body":"- $\\mathrm{Cov}(X,Y)=E[(X-EX)(Y-EY)]=E(XY)-EX\\cdot EY$。\n- $\\rho_{XY}=\\dfrac{\\mathrm{Cov}(X,Y)}{\\sqrt{DX}\\sqrt{DY}}$。"},{"name":"对比表","body":"| 维度 | 协方差 | 相关系数 |\n|---|---|---|\n| 量纲 | 有（$X$ 量纲 × $Y$ 量纲） | 无量纲 |\n| 范围 | $(-\\infty,+\\infty)$ | $[-1,1]$ |\n| 含义 | 线性关联方向与强度（受量纲影响） | 线性关联的强度与方向 |"},{"name":"得分点","body":"> 协方差刻画两随机变量线性关联的方向，正负表示同向或反向变动，但数值受量纲影响，无法直接比较关联强弱；相关系数是协方差的标准化，$\\rho_{XY}=\\mathrm{Cov}(X,Y)/(\\sigma_X\\sigma_Y)$，无量纲且满足 $|\\rho|\\le1$。$|\\rho|=1$ 的充要条件是存在常数 $a\\neq0,b$ 使 $P(Y=aX+b)=1$，即完全线性相关。联系：独立 ⟹ $\\rho=0$，但 $\\rho=0$ 只表示无线性关系，可能存在非线性关系。"},{"name":"钩子","body":"协方差带单位，相关系数归一化。"}],"one":"协方差有量纲、无上下界；相关系数无量纲、落在 $[-1,1]$。","hook":"协方差带单位，相关系数归一化。","bx":{"a":"协方差 $\\mathrm{Cov}(X,Y)=E(XY)-EX\\cdot EY$：线性关联的方向，带量纲、无界。","b":"相关系数 $\\rho=\\dfrac{\\mathrm{Cov}(X,Y)}{\\sqrt{DX}\\sqrt{DY}}$：标准化的线性关联，无量纲，$|\\rho|\\le1$。","diff":["量纲：有 / 无量纲；","范围：$(-\\infty,+\\infty)$ / $[-1,1]$；","可比性：跨变量不可比 / 可直接比强弱。"],"link":"相关系数就是协方差除以两个标准差，故符号相同；$|\\rho|=1\\iff$ 存在 $a\\neq0,b$ 使 $P(Y=aX+b)=1$（完全线性）。","ex":"$\\mathrm{Cov}(X,Y)=12$、$DX=16$、$DY=25$：$\\rho=\\dfrac{12}{4\\times5}=0.6$。"},"bx2":{"def":"协方差 $\\mathrm{Cov}(X,Y)=E[(X-EX)(Y-EY)]$ 度量 $X,Y$ 线性关联的方向与强弱；相关系数 $\\rho_{XY}=\\dfrac{\\mathrm{Cov}(X,Y)}{\\sqrt{DX}\\sqrt{DY}}$ 是其标准化，度量线性关联的强弱。","diff":"协方差带量纲，数值随计量单位缩放，不能跨变量对比较；相关系数无量纲，满足 $|\\rho|\\le1$，可直接比较不同变量对的线性关联强弱，且不受单位影响。","link":"二者同号，只差正的常数 $\\sqrt{DX}\\sqrt{DY}$，故 $\\rho=0$ 与 $\\mathrm{Cov}(X,Y)=0$ 等价；由柯西—施瓦茨不等式得 $|\\rho|\\le1$，等号当且仅当 $Y$ 与 $X$ 以概率 1 成线性关系。"}},{"no":29,"star":2,"title":"相关系数 vs 回归系数","ch":3,"sections":[{"name":"一句话","body":"相关系数对称，回归系数不对称且带方向。"},{"name":"得分点","body":"> 相关系数 $\\rho$ 度量两变量的线性关联强度，对 $X,Y$ 对称，$|\\rho|\\le1$；回归系数 $\\hat b$ 是回归直线的斜率，表示 $X$ 每增加一个单位 $Y$ 的平均变化量，具有方向性（$Y$ 对 $X$ 回归与 $X$ 对 $Y$ 回归的斜率不同）。二者关系为 $\\hat b=\\rho\\dfrac{\\sigma_Y}{\\sigma_X}$（总体）或 $\\hat b=r\\dfrac{s_y}{s_x}$（样本），故 $\\hat b$ 的符号与 $r$ 一致。注意 $r$ 无量纲、$\\hat b$ 有量纲；$r$ 衡量关联，$\\hat b$ 衡量效应大小。"},{"name":"钩子","body":"相关看强弱，回归看斜率，中间差一个标准差比。"}],"one":"相关系数对称，回归系数不对称且带方向。","hook":"相关看强弱，回归看斜率，中间差一个标准差比。","bx":{"a":"相关系数 $\\rho$：度量线性关联强弱，对 $X,Y$ 对称，$|\\rho|\\le1$。","b":"回归系数 $\\hat b$：回归直线斜率，表示 $X$ 每增 1 单位 $Y$ 的平均变化，有方向。","diff":["对称性：对称 / 不对称（$Y$ 对 $X$ 与 $X$ 对 $Y$ 的斜率不同）；","量纲：无量纲 / 有量纲；","取值：$[-1,1]$ / 任意实数。"],"link":"$\\hat b=\\rho\\dfrac{\\sigma_Y}{\\sigma_X}$（样本 $\\hat b=r\\dfrac{s_y}{s_x}$），故二者符号一致，中间只差一个标准差之比。","ex":"$r=0.8$、$s_x=2$、$s_y=5$：$\\hat b=0.8\\times\\dfrac{5}{2}=2$，即 $X$ 增 1，$Y$ 平均增 2。"},"bx2":{"def":"相关系数 $\\rho$ 度量 $X,Y$ 线性关联的强弱与方向，取值于 $[-1,1]$ 且对 $X,Y$ 对称；回归系数 $\\hat b=\\dfrac{\\mathrm{Cov}(X,Y)}{DX}$ 是一元线性回归直线的斜率，表示 $X$ 增一单位时 $Y$ 的平均增量。","diff":"相关系数对称、无量纲、有界；回归系数不对称且有量纲，$Y$ 对 $X$ 与 $X$ 对 $Y$ 的斜率不同，可取任意实数，其数值随 $X,Y$ 的单位改变。","link":"恒有 $\\hat b=\\rho\\dfrac{\\sigma_Y}{\\sigma_X}$，故二者同号；$|\\rho|=1$ 时残差为零、直线过全部样本点，$\\rho=0$ 时 $\\hat b=0$，回归直线水平，$X$ 对 $Y$ 无线性预测力。"}},{"no":30,"star":2,"title":"条件分布 vs 边际分布","ch":3,"sections":[{"name":"一句话","body":"边际是\"不看另一个\"，条件是\"已知另一个\"。"},{"name":"得分点","body":"> 边际分布是单个分量的分布，由联合分布对另一变量求和（积分）得到；条件分布是在已知另一变量取某值的条件下该分量的分布：离散 $P(X=x_i\\mid Y=y_j)=\\dfrac{p_{ij}}{p_{\\cdot j}}$，连续 $f_{X|Y}(x|y)=\\dfrac{f(x,y)}{f_Y(y)}$（要求 $f_Y(y)>0$）。二者的关键差别：边际不需要任何已知信息，条件分布需要\"$Y=y$\"这一信息，且条件分布随 $y$ 变化。当 $X,Y$ 独立时条件分布等于边际分布，这是独立的等价刻画之一。"},{"name":"钩子","body":"边际是\"忽略\"，条件是\"已知\"。"}],"one":"边际是\"不看另一个\"，条件是\"已知另一个\"。","hook":"边际是\"忽略\"，条件是\"已知\"。","bx":{"a":"边际分布：不看另一个变量，$p_{X}(x_i)=\\sum_j p_{ij}$、$f_X(x)=\\int f(x,y)\\mathrm dy$。","b":"条件分布：已知另一个取某值，$f_{X\\mid Y}(x\\mid y)=\\dfrac{f(x,y)}{f_Y(y)}$，要求 $f_Y(y)>0$。","diff":["是否需要已知信息：不需要 / 需要 $Y=y$；","是否随另一变量变化：不随 / 随 $y$ 变；","独立时条件分布等于边际分布。"],"link":"二者都由联合分布导出：边际是「对另一个求和」，条件是「除以另一个的边际」；$f_{X\\mid Y}(x\\mid y)=\\dfrac{f(x,y)}{f_Y(y)}$ 与 $f(x,y)=f_X(x)f_{Y\\mid X}(y\\mid x)$ 互为反解。","ex":"两变量独立时 $f_{X\\mid Y}(x\\mid y)=f_X(x)$；不独立时随 $y$ 变化——这正是独立性的等价刻画。"},"bx2":{"def":"边际分布是不看另一变量时该变量的分布，$f_X(x)=\\int f(x,y)\\mathrm{d}y$；条件分布是已知 $Y=y$ 时 $X$ 的分布，$f_{X\\mid Y}(x\\mid y)=\\dfrac{f(x,y)}{f_Y(y)}$，要求 $f_Y(y)>0$。","diff":"边际分布无需附加信息，由联合对另一变量求和或积分得到；条件分布以另一变量取定值为前提，是联合在截面上的归一化，随 $y$ 变化，二者一般不相等。","link":"二者由联合导出并满足乘法公式 $f(x,y)=f_X(x)f_{Y\\mid X}(y\\mid x)=f_Y(y)f_{X\\mid Y}(x\\mid y)$；当且仅当 $X,Y$ 独立时条件分布与边际分布恒等。"}},{"no":31,"star":2,"title":"二维均匀分布 vs 二维正态分布","ch":3,"sections":[{"name":"得分点","body":"> 二维均匀分布在某区域 $D$ 上密度为常数 $\\dfrac{1}{S_D}$（区域外为 0），其边际一般不是均匀分布（除非 $D$ 是矩形），且两分量一般不独立（矩形区域时独立）。二维正态分布由 $\\mu_1,\\mu_2,\\sigma_1^2,\\sigma_2^2,\\rho$ 五个参数完全确定，其边际都是一维正态，条件分布也是正态，且**独立 ⟺ 不相关 ⟺ $\\rho=0$**，这是二维正态独有的性质。判断两个正态变量独立，只需验证 $\\rho=0$。"},{"name":"钩子","body":"均匀看区域形状，正态看 $\\rho$。"}],"one":"","hook":"均匀看区域形状，正态看 $\\rho$。","bx":{"a":"二维均匀：在区域 $D$ 上密度为常数 $\\dfrac{1}{S_D}$，区域外为 0。","b":"二维正态：由 $\\mu_1,\\mu_2,\\sigma_1^2,\\sigma_2^2,\\rho$ 五个参数完全确定。","diff":["形状：由区域 $D$ 决定（可矩形、可三角、可圆） / 椭球等高线；","边际：一般不是均匀（除矩形）/ 都是一维正态；","独立性：矩形区域才独立 / $\\rho=0$ 即独立。"],"link":"两者都是二维连续型的基本模型，但正态是「独立 $\\iff$ 不相关」的唯一常用情形，均匀分布没有这个性质（区域不是矩形时两分量不独立）。","ex":"$D$ 取单位圆盘上的均匀分布：边际 $f_X(x)=\\dfrac{2\\sqrt{1-x^2}}{\\pi}$ 不是均匀分布，两分量也不独立。"},"bx2":{"def":"若 $(X,Y)$ 在平面区域 $D$ 上的密度为常数 $1/S_D$、区域外为 $0$，则称它在 $D$ 上服从二维均匀分布；若联合密度为二维正态曲面、由 $\\mu_1,\\mu_2,\\sigma_1^2,\\sigma_2^2,\\rho$ 五个参数完全确定，则称二维正态分布。","diff":"前者的等高线形状随区域 $D$ 而变，两个边际一般不再均匀，只有 $D$ 为矩形时两分量才独立；后者的等高线是同心椭圆，两个边际都仍是一维正态，且 $\\rho=0$ 与独立等价。","link":"二维正态是常用的「独立与不相关等价」的连续型二元分布，均匀分布没有这个性质：如 $D$ 取单位圆盘时 $f_X(x)=\\dfrac{2\\sqrt{1-x^2}}{\\pi}$，两分量不独立。"}},{"no":32,"star":2,"title":"卷积公式 vs 变量变换法（雅可比）","ch":3,"sections":[{"name":"一句话","body":"卷积是\"和的分布\"的特例，变量变换法是一般工具的通用形式。"},{"name":"对比表","body":"| 方法 | 适用 | 条件 |\n|---|---|---|\n| 卷积公式 | $Z=X+Y$ | $X,Y$ 独立 |\n| 变量变换法 | $Z=g(X,Y)$ 一般 | 变换一一对应、偏导连续 |"},{"name":"得分点","body":"> 卷积公式只适用于独立随机变量之和：$f_Z(z)=\\int_{-\\infty}^{+\\infty}f_X(x)f_Y(z-x)\\mathrm dx$（连续型），独立性是必要前提，若 $X,Y$ 不独立必须用联合密度 $f(x,z-x)$ 积分。变量变换法处理一般二元变换 $\\begin{cases}U=g_1(X,Y)\\\\V=g_2(X,Y)\\end{cases}$，需变换存在唯一反函数、雅可比行列式 $J=\\dfrac{\\partial(x,y)}{\\partial(u,v)}$ 非零，则 $f_{U,V}(u,v)=f_{X,Y}(x(u,v),y(u,v))|J|$。卷积可视为变量变换法在 $U=X+Y,V=X$ 下的特例。"},{"name":"钩子","body":"独立才卷积，一般用雅可比。"}],"one":"卷积是\"和的分布\"的特例，变量变换法是一般工具的通用形式。","hook":"独立才卷积，一般用雅可比。","bx":{"a":"卷积公式：$f_Z(z)=\\int f_X(x)f_Y(z-x)\\mathrm dx$，专求 $Z=X+Y$。","b":"变量变换法（雅可比）：处理一般变换 $U=g_1(X,Y),V=g_2(X,Y)$。","diff":["适用范围：只用于和，且要求 $X,Y$ 独立 / 一般二元变换；","条件：独立 + 联合密度 / 变换一一对应、雅可比非零；","结果：一维密度 / 二维联合密度（再求边际）。"],"link":"卷积是变量变换法在 $Z=X+Y$ 上的特例；若不独立，卷积要换成 $\\int f(x,z-x)\\mathrm dx$（用联合密度），本质仍是变换法。","ex":"$X,Y$ iid $U(0,1)$：$f_Z(z)=z\\,(0\\le z<1)$、$=2-z\\,(1\\le z\\le2)$，三角分布。"},"bx2":{"def":"对独立的连续型 $X,Y$，$Z=X+Y$ 的密度由 $f_Z(z)=\\int f_X(x)f_Y(z-x)\\mathrm dx$ 给出，称卷积公式；对一般的二元一一变换 $U=g_1(X,Y),V=g_2(X,Y)$，用雅可比行列式把联合密度换成 $f_{UV}=f_{XY}|J|$，称变量变换法。","diff":"卷积只处理「和」这一类变换，且必须已知 $X,Y$ 独立、有联合密度，算出的是一维密度；变量变换法处理任意可逆变换，不要求独立，只要求变换一一对应、雅可比不为零，算出的是二维联合密度，还须再求边际。","link":"卷积是变量变换法取 $U=X+Y,V=X$ 时的特例；若 $X,Y$ 不独立，把被积函数换成联合密度 $f(x,z-x)$ 即可，本质仍是变换法。"}},{"no":33,"star":2,"title":"最大值/最小值的分布 vs 次序统计量","ch":3,"sections":[{"name":"得分点","body":"> 设 $X_1,\\dots,X_n$ 独立同分布、分布函数为 $F$，则最大值 $X_{(n)}$ 的分布函数 $F_{\\max}(x)=[F(x)]^n$，最小值 $F_{\\min}(x)=1-[1-F(x)]^n$；密度分别为 $n[F(x)]^{n-1}f(x)$ 与 $n[1-F(x)]^{n-1}f(x)$。次序统计量 $X_{(k)}$ 的密度为\n> $$f_{(k)}(x)=\\dfrac{n!}{(k-1)!(n-k)!}[F(x)]^{k-1}[1-F(x)]^{n-k}f(x).$$\n> 注意最大值、最小值是 $k=n$、$k=1$ 的特例；二者必须\"独立同分布\"才能用上述乘积公式，若不同分布则 $F_{\\max}=\\prod F_i$。西大真题曾考均匀分布的次序统计量，需记住 $U(0,1)$ 下 $X_{(k)}\\sim Be(k,n-k+1)$。"},{"name":"钩子","body":"最大值全部 ≤，最小值至少一个 ≤。"}],"one":"","hook":"最大值全部 ≤，最小值至少一个 ≤。","bx":{"a":"样本极值：$F_{\\max}(x)=[F(x)]^n$，$F_{\\min}(x)=1-[1-F(x)]^n$。","b":"次序统计量 $X_{(k)}$：密度 $\\dfrac{n!}{(k-1)!(n-k)!}[F]^{k-1}[1-F]^{n-k}f$。","diff":["关注：两端 / 第 $k$ 个；","公式：只有 $F^n$ 与 $1-(1-F)^n$ / 带组合系数与两侧幂次；","极值是 $k=1$ 与 $k=n$ 的特例。"],"link":"最大值、最小值都是次序统计量的特例（$k=n$、$k=1$），把 $k$ 代进通式就能退化出极值公式；中位数是 $k\\approx n/2$ 的次序统计量。","ex":"$n=3$，$X_i$ iid $U(0,1)$：$f_{\\max}(x)=3x^2$，故 $E X_{(3)}=\\frac34$；中位数密度 $f_{(2)}=6x(1-x)$，$EX_{(2)}=\\frac12$。"},"bx2":{"def":"容量为 $n$ 的样本中，$X_{(n)}=\\max X_i$ 与 $X_{(1)}=\\min X_i$ 的分布分别由 $F^n(x)$ 与 $1-[1-F(x)]^n$ 给出，称极值（最大、最小）分布；把样本自小到大排成 $X_{(1)}\\le\\cdots\\le X_{(n)}$，第 $k$ 个 $X_{(k)}$（$1\\le k\\le n$）称第 $k$ 次序统计量，其密度为 $\\dfrac{n!}{(k-1)!(n-k)!}[F(x)]^{k-1}[1-F(x)]^{n-k}f(x)$。","diff":"极值只关心两端，只需总体分布函数 $F$ 就能写出，式子里只有 $F$ 的 $n$ 次幂；次序统计量的通式要带组合系数和两侧的幂次，$k$ 取中间值时还须用到密度 $f$，计算量明显更大。","link":"最大值、最小值分别是 $k=n$、$k=1$ 的次序统计量，代入通式即退化为极值公式；中位数是 $k\\approx n/2$ 的次序统计量，如 $U(0,1)$ 的 $n=3$ 样本有 $EX_{(2)}=1/2$。"}},{"no":34,"star":1,"title":"重期望公式（全期望公式）","ch":3,"sections":[{"name":"得分点","body":"> $E(X)=E\\big[E(X\\mid Y)\\big]$，即先对条件求期望再对 $Y$ 求期望。其作用是把难以直接计算的期望分解为两步：先固定 $Y=y$ 求 $E(X\\mid Y=y)$，再对该结果（它是 $Y$ 的函数）求期望。离散形式 $E(X)=\\sum_j E(X\\mid Y=y_j)P(Y=y_j)$。同理有全方差公式 $D(X)=E[D(X\\mid Y)]+D[E(X\\mid Y)]$，常用于分层数据或混合分布的方差计算。"},{"name":"钩子","body":"先条件、后平均。"}],"one":"","hook":"先条件、后平均。","bx":{"a":"重期望公式：$E(X)=E\\big[E(X\\mid Y)\\big]$，先条件期望再对 $Y$ 平均。","b":"全方差公式：$D(X)=E[D(X\\mid Y)]+D[E(X\\mid Y)]$，方差 = 组内 + 组间。","diff":["目标：一阶矩 / 二阶中心矩；","分解项：只有一项 / 两项（条件方差 + 条件期望的方差）；","用途：求期望 / 求方差。"],"link":"两个公式是同一思想（先固定 $Y$ 再平均）在两个矩上的版本；全方差公式右端第一项是「层内波动」，第二项是「层间差异」。","ex":"分层抽样：若 $Y$ 表示层，$E(X\\mid Y=y)$ 是层均值，则总均值是层均值的加权平均，总方差 = 层内方差均值 + 层均值之间的方差。"},"bx2":{"def":"对期望存在的 $X,Y$，先对 $Y$ 取条件期望再平均，得 $E(X)=E[E(X\\mid Y)]$，称重期望（全期望）公式；把方差按 $Y$ 分层分解为层内与层间，得 $D(X)=E[D(X\\mid Y)]+D[E(X\\mid Y)]$，称全方差公式。","diff":"前者针对一阶矩，右端只有一项，作用是把难求的期望化为分层平均；后者针对二阶中心矩，右端必须两项俱全，一项是条件方差的期望即层内波动，一项是条件期望的方差即层间差异，漏写一项即错。","link":"两式是同一「先固定 $Y$ 再平均」的思想在两个矩上的版本；由 $D(X)=E(X^2)-[EX]^2$ 与重期望公式可直接推出全方差公式。"}},{"no":35,"star":1,"title":"施瓦茨不等式与协方差不等式","ch":3,"sections":[{"name":"得分点","body":"> 对任意随机变量 $X,Y$（二阶矩存在），有 $\\left[E(XY)\\right]^2\\le E(X^2)E(Y^2)$，取 $X,Y$ 中心化即得 $\\mathrm{Cov}^2(X,Y)\\le D(X)D(Y)$，这正是 $|\\rho_{XY}|\\le1$ 的来源。等号成立当且仅当存在常数 $a,b$（不全为 0）使 $P(aX+bY=0)=1$，即完全线性关系。该不等式是证明相关系数性质、最小二乘最优性的工具。"},{"name":"钩子","body":"柯西-施瓦茨撑起 $|\\rho|\\le1$。"}],"one":"","hook":"柯西-施瓦茨撑起 $|\\rho|\\le1$。","bx":{"a":"施瓦茨（柯西）不等式：$[E(XY)]^2\\le E(X^2)E(Y^2)$，对二阶矩存在的任意 $X,Y$ 成立。","b":"协方差不等式：$\\mathrm{Cov}^2(X,Y)\\le D(X)D(Y)$，即 $|\\rho|\\le1$。","diff":["对象：原变量 / 中心化后的变量；","结论：内积的界 / 相关系数的界；","等号条件相同：存在 $a,b$ 不全为 0 使 $P(aX+bY=0)=1$。"],"link":"把 $X,Y$ 换成 $X-EX,\\,Y-EY$ 代入施瓦茨不等式，立即得到协方差不等式，所以后者是前者的特例；$|\\rho|\\le1$ 就是这么来的。","ex":"$X$ 与 $Y=X$ 时取等：$\\mathrm{Cov}^2=DX\\cdot DX$，$\\rho=1$；若 $Y=-X$ 则 $\\rho=-1$。"},"bx2":{"def":"对二阶矩存在的任意 $X,Y$ 都有 $[E(XY)]^2\\le E(X^2)E(Y^2)$，称施瓦茨（柯西-施瓦茨）不等式；把中心化变量 $X-EX$、$Y-EY$ 代入又得 $\\mathrm{Cov}^2(X,Y)\\le D(X)D(Y)$，即 $|\\rho|\\le1$，称协方差不等式。两式都不要求 $X$ 与 $Y$ 独立，只要求相应的二阶矩存在。","diff":"前者作用于原变量，界的是内积，不涉及中心化，$EX,EY$ 不为零时照样成立；后者作用于中心化变量，界的是协方差与相关系数，量纲被消去，才给出与单位无关的 $|\\rho|\\le1$。","link":"协方差不等式是施瓦茨不等式的特例，取 $X-EX$、$Y-EY$ 代入即得；两者等号成立的条件相同，即存在不全为零的 $a,b$ 使 $P(aX+bY=0)=1$，此时 $|\\rho|=1$。"}},{"no":36,"star":1,"title":"期望向量与协方差矩阵","ch":3,"sections":[{"name":"得分点","body":"> 对随机向量 $\\mathbf X=(X_1,\\dots,X_p)^{\\mathrm T}$，期望向量 $\\mathbf\\mu=E\\mathbf X$，协差阵 $\\Sigma=\\mathrm{Cov}(\\mathbf X)=E[(\\mathbf X-\\mathbf\\mu)(\\mathbf X-\\mathbf\\mu)^{\\mathrm T}]$，其 $(i,j)$ 元为 $\\mathrm{Cov}(X_i,X_j)$，对角元为 $D(X_i)$。$\\Sigma$ 对称且半正定。线性变换性质：$E(A\\mathbf X+\\mathbf b)=A\\mathbf\\mu+\\mathbf b$，$\\mathrm{Cov}(A\\mathbf X)=A\\Sigma A^{\\mathrm T}$。多元正态 $\\mathbf X\\sim N_p(\\mathbf\\mu,\\Sigma)$ 的独立性与 $\\Sigma$ 的非对角元为 0 等价。"},{"name":"钩子","body":"一维的期望方差，升维成向量矩阵。"}],"one":"","hook":"一维的期望方差，升维成向量矩阵。","bx":{"a":"期望向量 $\\boldsymbol\\mu=E\\mathbf X=(EX_1,\\dots,EX_p)^{\\mathrm T}$：每个分量各取期望。","b":"协差阵 $\\Sigma=\\mathrm{Cov}(\\mathbf X)=E[(\\mathbf X-\\boldsymbol\\mu)(\\mathbf X-\\boldsymbol\\mu)^{\\mathrm T}]$：对角元是各方差，非对角元是协方差。","diff":["形状：$p\\times1$ 向量 / $p\\times p$ 矩阵；","信息：只给位置 / 还给离散与线性关联；","$\\Sigma$ 必对称半正定。"],"link":"一维的 $EX$ 与 $DX$ 升维后就是 $\\boldsymbol\\mu$ 与 $\\Sigma$；线性变换下 $E(A\\mathbf X)=\\mathbf A\\boldsymbol\\mu$，$\\mathrm{Cov}(A\\mathbf X)=A\\Sigma A^{\\mathrm T}$——这条是多元统计与回归的基础。","ex":"$\\mathbf X=(X_1,X_2)^{\\mathrm T}$，$DX_1=4,DX_2=9,\\mathrm{Cov}=3$：$\\Sigma=\\begin{pmatrix}4&3\\\\3&9\\end{pmatrix}$，其行列式 $27>0$ 半正定。"},"bx2":{"def":"设 $\\mathbf X=(X_1,\\dots,X_p)^{\\mathrm T}$ 为 $p$ 维随机向量，把各分量的期望按原次序排成列向量 $\\boldsymbol\\mu=E\\mathbf X=(EX_1,\\dots,EX_p)^{\\mathrm T}$，称期望向量；把二阶中心混合矩排成矩阵 $\\Sigma=E[(\\mathbf X-\\boldsymbol\\mu)(\\mathbf X-\\boldsymbol\\mu)^{\\mathrm T}]$，称协方差矩阵（协差阵）。","diff":"前者是 $p\\times1$ 向量，只描述随机向量取值的中心位置；后者是 $p\\times p$ 矩阵，对角元为各方差、非对角元为协方差，同时刻画离散程度与线性关联，且必是对称半正定阵。","link":"一维的 $EX$ 与 $DX$ 升维后就是 $\\boldsymbol\\mu$ 与 $\\Sigma$；线性变换下 $E(A\\mathbf X)=A\\boldsymbol\\mu$、$\\mathrm{Cov}(A\\mathbf X)=A\\Sigma A^{\\mathrm T}$，这两条式子正是多元线性模型与回归分析的基础。"}},{"no":37,"star":3,"title":"大数定律 vs 中心极限定理","ch":4,"sections":[{"name":"一句话","body":"大数定律说\"平均值趋于常数\"，中心极限定理说\"偏差的分布趋于正态\"。"},{"name":"对比表","body":"| 维度 | 大数定律 | 中心极限定理 |\n|---|---|---|\n| 结论 | $\\bar X_n\\xrightarrow{P}\\mu$（依概率收敛） | $\\dfrac{\\bar X_n-\\mu}{\\sigma/\\sqrt n}\\xrightarrow{d}N(0,1)$ |\n| 回答 | 平均值稳定在哪 | 波动服从什么分布 |\n| 用途 | 频率估计概率、样本均值估计总体均值 | 近似计算、构造置信区间与检验统计量 |\n| 条件 | 独立（或弱相关）、期望存在 | iid、方差有限（列维-林德伯格） |"},{"name":"得分点","body":"> 大数定律说明当 $n\\to\\infty$ 时样本均值依概率收敛于总体均值，即\"平均结果稳定\"，是频率估计概率、矩估计相合性的理论基础；中心极限定理进一步给出偏差 $\\bar X_n-\\mu$ 的渐近分布为正态，标准化后依分布收敛于 $N(0,1)$，是区间估计与假设检验中大样本方法的依据。二者相辅相成：大数定律保证估计量收敛，中心极限定理给出收敛速度与误差分布。注意中心极限定理要求方差有限（李雅普诺夫条件更弱但仍需矩条件）。"},{"name":"钩子","body":"大数定律管\"收敛到哪\"，中心极限定理管\"如何波动\"。"}],"one":"大数定律说\"平均值趋于常数\"，中心极限定理说\"偏差的分布趋于正态\"。","hook":"大数定律管\"收敛到哪\"，中心极限定理管\"如何波动\"。","bx":{"a":"大数定律：$\\bar X_n\\xrightarrow{P}\\mu$，样本均值依概率收敛于总体均值。","b":"中心极限定理：$\\dfrac{\\bar X_n-\\mu}{\\sigma/\\sqrt n}\\xrightarrow{d}N(0,1)$，偏差的分布趋于正态。","diff":["结论类型：收敛到常数 / 依分布收敛到正态；","回答的问题：平均值稳定在哪 / 波动服从什么分布；","条件：期望存在（辛钦）/ 方差有限（列维-林德伯格）。"],"link":"大数定律管「落到哪」，中心极限定理管「怎么绕过去」；前者保证估计量相合，后者给出误差的分布，因而才能构造置信区间与检验统计量。","ex":"$n=100$，$X_i$ iid 均值 5、方差 4：$\\bar X\\approx N(5,0.04)$，故 $P(|\\bar X-5|<0.4)\\approx P(|Z|<2)=0.954$。"},"bx2":{"def":"设 $X_1,\\dots,X_n$ 独立同分布，期望为 $\\mu$，方差为 $\\sigma^2\\in(0,\\infty)$。若样本均值满足 $\\bar X_n\\xrightarrow{P}\\mu$，即对任意 $\\varepsilon>0$ 有 $P(|\\bar X_n-\\mu|\\ge\\varepsilon)\\to0$，则称大数定律成立；若 $\\dfrac{\\bar X_n-\\mu}{\\sigma/\\sqrt n}\\xrightarrow{d}N(0,1)$，则称中心极限定理成立。","diff":"前者断言样本均值依概率收敛到一个常数，回答平均值稳定在哪里，只用到一阶矩；后者断言标准化偏差依分布收敛到标准正态，回答波动服从什么分布，必须用到方差，结论落在分布层面。","link":"大数定律保证估计量相合，中心极限定理给出误差的近似分布，据此才能构造置信区间与检验统计量；辛钦定律只需期望存在，列维-林德伯格定理需方差有限。"}},{"no":38,"star":3,"title":"辛钦 vs 伯努利 vs 切比雪夫大数定律","ch":4,"sections":[{"name":"一句话","body":"条件从宽到严：辛钦（iid 期望存在）→ 伯努利（0-1 变量）→ 切比雪夫（独立、方差有界，不要求同分布）。"},{"name":"对比表","body":"| 定律 | 条件 | 结论 |\n|---|---|---|\n| 伯努利 | $n$ 重伯努利试验 | 频率 $\\xrightarrow{P}p$ |\n| 辛钦 | 独立同分布，$EX_i=\\mu$ 存在 | $\\bar X_n\\xrightarrow{P}\\mu$ |\n| 切比雪夫 | 相互独立，$DX_i\\le C$（一致有界） | $\\bar X_n\\xrightarrow{P}\\mu$ |\n| 马尔可夫 | 独立，$\\dfrac{1}{n^2}D\\!\\left(\\sum X_i\\right)\\to0$ | $\\bar X_n\\xrightarrow{P}\\mu$ |"},{"name":"得分点","body":"> 伯努利大数定律针对 $n$ 重伯努利试验，断言频率依概率收敛于成功概率，是\"频率稳定于概率\"的严格表述；辛钦大数定律是独立同分布情形，只要求期望存在、不要求方差存在；切比雪夫大数定律要求相互独立且方差一致有界，不要求同分布；马尔可夫大数定律条件最弱，只要求 $\\frac{1}{n^2}D(\\sum X_i)\\to0$。证明工具是切比雪夫不等式 $P(|\\bar X-\\mu|\\ge\\varepsilon)\\le\\dfrac{D(\\bar X)}{\\varepsilon^2}$，故凡方差有界即可证得。"},{"name":"钩子","body":"伯努利是辛钦的 0-1 特例；切比雪夫换方差换独立。"}],"one":"条件从宽到严：辛钦（iid 期望存在）→ 伯努利（0-1 变量）→ 切比雪夫（独立、方差有界，不要求同分布）。","hook":"伯努利是辛钦的 0-1 特例；切比雪夫换方差换独立。","bx":{"a":"辛钦大数定律：独立同分布、$EX_i=\\mu$ 存在即可，$\\bar X_n\\xrightarrow{P}\\mu$。","b":"切比雪夫大数定律：只需相互独立且 $DX_i\\le C$ 一致有界，不要求同分布。","diff":["是否要求同分布：要求 / 不要求；","矩条件：一阶矩存在 / 方差一致有界；","伯努利定律是 0-1 变量的特例。"],"link":"三者都断言 $\\bar X_n\\xrightarrow{P}\\mu$，证明工具都是切比雪夫不等式；条件宽严不同：伯努利（0-1 试验）$\\subset$ 辛钦（iid）与切比雪夫（独立+方差有界）并列，马尔可夫条件最弱（$\\frac{1}{n^2}D\\sum X_i\\to0$）。","ex":"测量同一物体（iid）用辛钦；不同仪器精度不同（方差有界但不同分布）用切比雪夫；抛硬币的频率收敛用伯努利。"},"bx2":{"def":"若 $X_i$ 独立同分布且 $EX_i=\\mu$ 存在，则 $\\bar X_n\\xrightarrow{P}\\mu$，称辛钦大数定律；若 $X_i$ 相互独立、$DX_i\\le C$ 一致有界而不要求同分布，则仍有 $\\bar X_n\\xrightarrow{P}\\mu$，称切比雪夫大数定律。","diff":"辛钦要求同分布，矩条件只到一阶矩，方差可以不存在；切比雪夫不要求同分布，却要求方差一致有界，矩条件更严；伯努利定律只管 $0$-$1$ 变量，用频率收敛于概率，是二者共同覆盖的特例。","link":"三者都断言 $\\bar X_n\\xrightarrow{P}\\mu$，证明都靠切比雪夫不等式；伯努利是 $0$-$1$ 变量的特例，条件最宽的是马尔可夫大数定律，只要求 $\\dfrac{1}{n^2}D\\sum X_i\\to0$。"}},{"no":39,"star":3,"title":"依概率收敛 vs 依分布收敛","ch":4,"sections":[{"name":"一句话","body":"依概率收敛强于依分布收敛；依分布收敛只要求分布函数逼近。"},{"name":"定义卡","body":"- 依概率收敛：$\\forall\\varepsilon>0,\\ P(|X_n-X|\\ge\\varepsilon)\\to0$。\n- 依分布收敛：在 $F$ 的连续点处 $F_n(x)\\to F(x)$。"},{"name":"对比表","body":"| 维度 | 依概率收敛 | 依分布收敛 |\n|---|---|---|\n| 刻画 | 数值接近 | 分布接近 |\n| 强弱 | 强 | 弱 |\n| 常量情形 | — | $X_n\\xrightarrow{d}c\\iff X_n\\xrightarrow{P}c$（$c$ 为常数） |"},{"name":"得分点","body":"> 依概率收敛指 $X_n$ 与 $X$ 的偏差超过任意 $\\varepsilon$ 的概率趋于 0，刻画\"数值上接近\"；依分布收敛指分布函数在连续点处收敛，刻画\"分布形状接近\"，不涉及同一概率空间。依概率收敛蕴含依分布收敛，反之不成立；但当极限为常数时二者等价。另有几乎处处收敛（$P(\\lim X_n=X)=1$），它强于依概率收敛。连续映射定理：若 $X_n\\xrightarrow{P}X$，$g$ 连续，则 $g(X_n)\\xrightarrow{P}g(X)$；依分布收敛需 $g$ 连续且考察 $g(X_n)\\xrightarrow{d}g(X)$。"},{"name":"钩子","body":"依分布最弱，依概率较强，几乎处处最强。"}],"one":"依概率收敛强于依分布收敛；依分布收敛只要求分布函数逼近。","hook":"依分布最弱，依概率较强，几乎处处最强。","bx":{"a":"依概率收敛：$\\forall\\varepsilon>0,\\ P(|X_n-X|\\ge\\varepsilon)\\to0$，数值上接近。","b":"依分布收敛：在 $F$ 的连续点处 $F_n(x)\\to F(x)$，分布形状接近。","diff":["刻画对象：数值 / 分布；","强弱：依概率更强；","极限为常数时二者等价（$X_n\\xrightarrow{d}c\\iff X_n\\xrightarrow{P}c$）。"],"link":"依概率收敛 $\\Rightarrow$ 依分布收敛，反之不成立（依分布收敛不要求两个变量在同一概率空间）；更强的还有几乎处处收敛（$P(\\lim X_n=X)=1$）。","ex":"$X_n$ 与 $X$ 同分布但不独立：$X_n\\xrightarrow{d}X$ 成立，$X_n\\xrightarrow{P}X$ 不成立。"},"bx2":{"def":"设 $X_n$ 与 $X$ 定义在同一概率空间上，若对任意 $\\varepsilon>0$ 有 $P(|X_n-X|\\ge\\varepsilon)\\to0$，则称 $X_n$ 依概率收敛于 $X$；设 $F_n,F$ 分别为 $X_n,X$ 的分布函数，若在 $F$ 的一切连续点上有 $F_n(x)\\to F(x)$，则称依分布收敛。","diff":"前者刻画 $X_n$ 与 $X$ 的数值接近，要求二者定义在同一概率空间上，否则 $|X_n-X|$ 无意义；后者只要求分布函数逐点逼近，可以对应不同的概率空间，不涉及二者的联合分布。","link":"依概率收敛必推出依分布收敛，反之不成立；当极限为常数 $c$ 时二者等价，即 $X_n\\xrightarrow{P}c\\iff X_n\\xrightarrow{d}c$，而以概率 $1$ 收敛更强。"}},{"no":40,"star":2,"title":"二项分布的正态近似 vs 泊松近似","ch":4,"sections":[{"name":"一句话","body":"$n$ 大 $p$ 中等用正态，$n$ 大 $p$ 极小用泊松。"},{"name":"对比表","body":"| 近似 | 条件 | 参数 | 连续性修正 |\n|---|---|---|---|\n| 正态近似 | $np\\ge5$ 且 $n(1-p)\\ge5$ | $\\mu=np,\\ \\sigma^2=np(1-p)$ | 需 $\\pm0.5$ 修正 |\n| 泊松近似 | $n\\ge20,\\ p\\le0.05$（或 $np\\le5$） | $\\lambda=np$ | 一般不需要 |"},{"name":"得分点","body":"> 当 $n$ 较大且 $p$ 不太接近 0 或 1（一般 $np\\ge5,n(1-p)\\ge5$）时，由中心极限定理 $B(n,p)$ 近似服从 $N(np,np(1-p))$，计算 $P(a\\le X\\le b)$ 时应用连续性修正 $P\\!\\left(\\dfrac{a-0.5-np}{\\sqrt{np(1-p)}}\\le Z\\le\\dfrac{b+0.5-np}{\\sqrt{np(1-p)}}\\right)$；当 $n$ 大而 $p$ 很小、$np=\\lambda$ 适中时，由泊松定理近似为 $P(\\lambda)$，此时不需要连续性修正。判据：方差 $np(1-p)$ 与期望 $np$ 接近（即 $p$ 小）用泊松；否则用正态。"},{"name":"钩子","body":"对称用正态，稀有用泊松。"}],"one":"$n$ 大 $p$ 中等用正态，$n$ 大 $p$ 极小用泊松。","hook":"对称用正态，稀有用泊松。","bx":{"a":"正态近似：$np\\ge5$ 且 $n(1-p)\\ge5$ 时 $B(n,p)\\approx N(np,np(1-p))$，需连续性修正 $\\pm0.5$。","b":"泊松近似：$n\\ge20$、$p\\le0.05$（或 $np\\le5$）时 $B(n,p)\\approx P(np)$。","diff":["适用区：$p$ 中等、$np$ 与 $n(1-p)$ 都大 / $p$ 极小、$np$ 适中；","参数：两个 / 一个；","是否做修正：要 / 一般不要。"],"link":"两者都来自极值定理：正态近似是中心极限定理的推论，泊松近似是泊松定理的推论；交界处（$np$ 适中、$p$ 小）两种算法差别不大，考试按题给条件选。","ex":"$n=100,p=0.5$：用正态，$P(X\\le55)\\approx\\Phi\\!\\left(\\frac{55.5-50}{5}\\right)=\\Phi(1.1)=0.8643$；$n=200,p=0.01$：用泊松 $\\lambda=2$。"},"bx2":{"def":"当 $n$ 大而 $p$ 不接近 $0$ 或 $1$（常要求 $np\\ge5$、$n(1-p)\\ge5$）时，用 $N(np,np(1-p))$ 近似 $B(n,p)$，称正态近似；当 $n$ 大而 $p$ 很小（常取 $n\\ge20$、$p\\le0.05$ 或 $np\\le5$）时，用参数为 $\\lambda=np$ 的泊松分布近似 $B(n,p)$，称泊松近似。","diff":"正态近似适用于 $p$ 居中、$np$ 与 $n(1-p)$ 都大的场合，近似分布有两个参数，且因取值离散须做 $\\pm0.5$ 的连续性修正；泊松近似适用于 $p$ 极小、$np$ 适中的场合，只有一个参数 $\\lambda=np$，一般不作修正。","link":"两者都是极限定理的推论：正态近似来自列维-林德伯格中心极限定理，泊松近似来自泊松定理（$np_n\\to\\lambda$）；交界处二法差别不大，按题给条件择一。"}},{"no":41,"star":1,"title":"列维-林德伯格 vs 李雅普诺夫中心极限定理","ch":4,"sections":[{"name":"得分点","body":"> 列维-林德伯格定理要求 $X_1,\\dots,X_n$ 独立同分布、$EX_i=\\mu$、$DX_i=\\sigma^2\\in(0,\\infty)$，结论为 $\\dfrac{\\sum X_i-n\\mu}{\\sigma\\sqrt n}\\xrightarrow{d}N(0,1)$；李雅普诺夫定理放宽\"同分布\"，只要求相互独立且满足李雅普诺夫条件 $\\lim_{n\\to\\infty}\\dfrac{1}{B_n^3}\\sum E|X_i-\\mu_i|^3=0$（$B_n^2=\\sum DX_i$），结论同样是标准化和依分布收敛于 $N(0,1)$。应用中\"同分布\"未知但独立时用李雅普诺夫；棣莫弗-拉普拉斯定理是列维-林德伯格在 $B(n,p)$ 上的特例。"},{"name":"钩子","body":"同分布用列维，不同分布用李雅普诺夫。"}],"one":"","hook":"同分布用列维，不同分布用李雅普诺夫。","bx":{"a":"列维-林德伯格：独立同分布、$EX=\\mu$、$0<DX=\\sigma^2<\\infty$，则标准化和 $\\xrightarrow{d}N(0,1)$。","b":"李雅普诺夫：只要求相互独立，并满足 $\\lim\\dfrac{1}{B_n^3}\\sum E|X_i-\\mu_i|^3=0$。","diff":["是否要求同分布：要求 / 不要求；","矩条件：二阶矩 / 三阶绝对矩（李雅普诺夫条件）；","结论相同：都是标准化和趋于标准正态。"],"link":"李雅普诺夫是列维-林德伯格的推广（放宽同分布、加强矩条件），两者结论一样，故做题时判「独立同分布」用前者，判「独立不同分布」用后者。","ex":"同一天平重复称量同一物体（iid）走列维-林德伯格；不同精度仪器各测一次（独立不同分布）走李雅普诺夫。"},"bx2":{"def":"若 $X_i$ 独立同分布、$EX_i=\\mu$、$0<\\sigma^2=DX_i<\\infty$，则 $\\dfrac{1}{\\sigma\\sqrt n}\\sum(X_i-\\mu)\\xrightarrow{d}N(0,1)$，称列维-林德伯格定理；若 $X_i$ 仅相互独立，且满足 $\\dfrac{1}{B_n^3}\\sum E|X_i-\\mu_i|^3\\to0$（其中 $B_n^2=D\\sum X_i$），同样有标准化和 $\\xrightarrow{d}N(0,1)$，称李雅普诺夫定理。","diff":"前者要求同分布，矩条件止于二阶矩；后者放弃同分布，改用三阶绝对矩的李雅普诺夫条件控制各变量对总波动的相对贡献，矩条件更严，却允许各变量分布不同。","link":"李雅普诺夫定理是列维-林德伯格定理的推广：同分布且三阶绝对矩有限时李雅普诺夫条件自动满足，故后者是前者的特例，两者结论完全相同。"}},{"no":42,"star":1,"title":"特征函数 vs 分布函数","ch":4,"sections":[{"name":"得分点","body":"> 特征函数定义为 $\\varphi(t)=E(\\mathrm e^{\\mathrm itX})=E\\cos tX+\\mathrm iE\\sin tX$，对一切分布存在（因 $|\\mathrm e^{\\mathrm itX}|=1$），且与分布函数一一对应（逆转公式）。性质：$\\varphi(0)=1$，$|\\varphi(t)|\\le1$，$\\varphi(-t)=\\overline{\\varphi(t)}$；独立和的特征函数等于特征函数之积，这是证明中心极限定理与求和的分布的核心工具；$E(X^k)=\\mathrm i^{-k}\\varphi^{(k)}(0)$（若矩存在）。分布函数只对有密度的情形便于求导，特征函数则对离散、连续统一处理，且比母函数适用范围更广（母函数要求矩存在）。"},{"name":"钩子","body":"特征函数是分布的\"指纹\"，独立变乘积。"}],"one":"","hook":"特征函数是分布的\"指纹\"，独立变乘积。","bx":{"a":"分布函数 $F(x)=P(X\\le x)$：实变量实值函数，直观、可直接算概率。","b":"特征函数 $\\varphi(t)=E(e^{\\mathrm itX})$：复变量函数，对一切分布都存在。","diff":["存在性：某些分布（如柯西）矩不存在但 $F$ 总有 / $\\varphi$ 恒存在（$|e^{\\mathrm itX}|=1$）；","运算：卷积麻烦 / 独立和变乘积；","信息：一一对应（逆转公式）。"],"link":"两者一一对应（同一分布的两套「指纹」）：$\\varphi$ 求导可得矩 $E(X^k)=\\mathrm i^{-k}\\varphi^{(k)}(0)$，独立和的特征函数等于各自之积，这正是证明中心极限定理的核心工具。","ex":"$X\\sim N(\\mu,\\sigma^2)$ 的 $\\varphi(t)=e^{\\mathrm i\\mu t-\\sigma^2t^2/2}$；两个独立正态相加，$\\varphi$ 相乘仍是指数形式，故和仍是正态。"},"bx2":{"def":"分布函数 $F(x)=P(X\\le x)$ 是实变量的实值函数，单调不减、右连续，且 $F(-\\infty)=0$、$F(+\\infty)=1$；特征函数 $\\varphi(t)=E(e^{\\mathrm itX})=E\\cos tX+\\mathrm iE\\sin tX$ 是实变量的复值函数，对任意随机变量都存在。","diff":"分布函数有直接的概率含义，可据此算区间概率，但独立和的分布要做卷积；特征函数没有直接概率含义，却把卷积化为乘法，即独立和的特征函数等于各自特征函数之积，求和的分布时方便得多。","link":"二者一一对应，是同一分布的两套指纹，由逆转公式可互相还原；当 $k$ 阶矩存在时有 $E(X^k)=\\mathrm i^{-k}\\varphi^{(k)}(0)$，这条性质是证明中心极限定理的核心工具。"}},{"no":43,"star":2,"title":"切比雪夫不等式与其他不等式","ch":4,"sections":[{"name":"得分点","body":"> 切比雪夫不等式：若 $DX$ 存在，则对任意 $\\varepsilon>0$，$P(|X-EX|\\ge\\varepsilon)\\le\\dfrac{DX}{\\varepsilon^2}$，等价形式 $P(|X-EX|<\\varepsilon)\\ge1-\\dfrac{DX}{\\varepsilon^2}$。它只用到期望与方差，故适用范围极广，是大数定律证明的核心工具；缺点是估计粗糙（未利用分布信息）。另有马尔可夫不等式 $P(|X|\\ge\\varepsilon)\\le\\dfrac{E|X|}{\\varepsilon}$（切比雪夫是其特例，取 $|X-EX|^2$）。考试中\"估计概率上界\"类问题优先用切比雪夫，并要求给出 $\\varepsilon$ 与 $n$ 的关系。"},{"name":"钩子","body":"只有期望方差，也能卡住概率。"}],"one":"","hook":"只有期望方差，也能卡住概率。","bx":{"a":"切比雪夫不等式：$P(|X-EX|\\ge\\varepsilon)\\le\\dfrac{DX}{\\varepsilon^2}$，只用期望与方差。","b":"马尔可夫不等式：$P(|X|\\ge\\varepsilon)\\le\\dfrac{E|X|}{\\varepsilon}$，只用一阶绝对矩。","diff":["用到的矩：二阶 / 一阶；","适用范围：方差存在 / 一阶矩存在即可；","精度：都粗糙，切比雪夫在方差已知时更紧。"],"link":"切比雪夫是马尔可夫不等式作用在 $(X-EX)^2$ 上的结果（取 $Y=(X-EX)^2$），故后者更基本；两者都是「不依赖分布形状」的通用界，也是大数定律的证明工具。","ex":"$EX=10,DX=4$：$P(|X-10|\\ge5)\\le\\frac{4}{25}=0.16$；若已知分布为正态，实际值是 $P(|Z|\\ge2.5)=0.0124$，界很松。"},"bx2":{"def":"设随机变量 $X$ 的期望与方差都存在，则对任意 $\\varepsilon>0$ 有 $P(|X-EX|\\ge\\varepsilon)\\le DX/\\varepsilon^2$，称切比雪夫不等式；设 $X$ 的一阶绝对矩存在，则对任意 $\\varepsilon>0$ 有 $P(|X|\\ge\\varepsilon)\\le E|X|/\\varepsilon$，称马尔可夫不等式。","diff":"马尔可夫不等式只用一阶绝对矩，适用范围更宽，方差不存在时仍可用；切比雪夫不等式用二阶中心矩，要求方差存在，条件更严，但在方差已知时给出的界更紧。","link":"切比雪夫不等式是马尔可夫不等式取 $Y=(X-EX)^2$ 的结果，故后者更基本；二者都不依赖分布形状，是证明大数定律的工具，代价是界偏松。"}},{"no":44,"star":3,"title":"总体 vs 样本 vs 样本值","ch":5,"sections":[{"name":"一句话","body":"总体是分布，样本是随机向量，样本值是观测数据。"},{"name":"定义卡","body":"- 总体：研究对象的全体，用分布 $F(x;\\theta)$ 刻画。\n- 样本：$X_1,\\dots,X_n$ 独立同分布于 $F$ 的随机变量（二维以前是随机向量）。\n- 样本值：一次具体观测得到的数据 $x_1,\\dots,x_n$。"},{"name":"得分点","body":"> 总体指研究对象的全部可能取值及其分布规律，通常用分布函数 $F(x;\\theta)$ 或参数 $\\theta$ 描述；样本是从总体中按简单随机抽样得到的 $n$ 个相互独立且与总体同分布的随机变量 $X_1,\\dots,X_n$，是随机向量，在观测前不确定；样本值 $x_1,\\dots,x_n$ 是样本的一次具体实现，是确定的数。三者的关系是\"分布 → 随机变量 → 数值\"。统计推断就是用样本（随机）对总体（未知）作结论，故必须先明确讨论对象是随机变量还是数值。"},{"name":"钩子","body":"总体是分布，样本是变量，样本值是数字。"}],"one":"总体是分布，样本是随机向量，样本值是观测数据。","hook":"总体是分布，样本是变量，样本值是数字。","bx":{"a":"总体：研究对象的全体，用分布 $F(x;\\theta)$ 或参数 $\\theta$ 刻画，未知。","b":"样本 $X_1,\\dots,X_n$：独立同分布于 $F$ 的随机变量（随机向量），观测前不确定。","diff":["身份：分布 / 随机变量；","是否可观测：不可 / 观测前不可、观测后成样本值 $x_1,\\dots,x_n$；","统计推断的方向：用样本推断总体。"],"link":"三者的链条是「分布 $\\to$ 随机变量 $\\to$ 数值」：总体给出分布，样本是从该分布抽出的随机变量，样本值是样本的一次实现；一切统计量都是样本的函数，故讨论对象必须先分清是随机变量还是数。","ex":"$X\\sim N(\\mu,1)$、$\\mu$ 未知：$\\bar X$ 是随机变量（样本），$\\bar x=4.82$ 是样本值，$\\mu$ 是总体参数。"},"bx2":{"def":"总体指研究对象的全体，用分布 $F(x;\\theta)$ 或未知参数 $\\theta$ 刻画；从中随机抽取的 $n$ 个相互独立、与总体同分布的随机变量 $X_1,\\dots,X_n$ 称样本，其一次观测结果 $x_1,\\dots,x_n$ 称样本值。","diff":"总体是未知的分布或参数，本身不是随机变量，无法直接观测；样本是随机变量，观测前取值不确定，观测后才成为确定的样本值；样本值只是一组数，已无随机性可言。","link":"三者构成「分布到随机变量再到数值」的链条：总体给出分布，样本是该分布的随机抽样，样本值是一次实现；统计量只能是样本的函数，故须先分清对象是随机变量还是数。"}},{"no":45,"star":3,"title":"参数 vs 统计量","ch":5,"sections":[{"name":"一句话","body":"统计量是**不含任何未知参数**的样本函数——这是唯一判据。"},{"name":"定义卡","body":"- 参数：总体分布中的未知常数 $\\theta$（如 $\\mu,\\sigma^2,p$）。\n- 统计量：$T=T(X_1,\\dots,X_n)$，且 $T$ 中**不含未知参数**。"},{"name":"对比表","body":"| 维度 | 参数 | 统计量 |\n|---|---|---|\n| 对象 | 总体 | 样本 |\n| 性质 | 未知常数 | 随机变量（观测前） |\n| 含未知参数 | 是 | **否** |\n| 例子 | $\\mu,\\sigma^2$ | $\\bar X,S^2,\\max X_i$ |"},{"name":"例子","body":"设 $X\\sim N(\\mu,\\sigma^2)$，$\\mu$ 未知、$\\sigma$ 已知。则 $\\bar X$、$\\sum(X_i-\\bar X)^2$ 是统计量；$\\bar X-\\mu$ **不是**统计量（含未知参数）；$\\dfrac{\\bar X-\\mu}{\\sigma/\\sqrt n}$ 是统计量（$\\sigma$ 已知）。"},{"name":"得分点","body":"> 参数是总体分布中的未知常数，反映总体特征；统计量是完全由样本决定、不含任何未知参数的函数。判定一个量是否为统计量，只需检查它是否含未知参数。统计量在抽样前是随机变量，有自身的分布（抽样分布），这是构造估计量与检验统计量的基础。联系：估计量是统计量，用来估计参数；检验统计量也是统计量，用来做假设检验。"},{"name":"钩子","body":"有未知参数 → 不是统计量。"}],"one":"统计量是**不含任何未知参数**的样本函数——这是唯一判据。","hook":"有未知参数 → 不是统计量。","bx":{"a":"参数 $\\theta$：总体分布中的未知常数（如 $\\mu,\\sigma^2,p$），不随样本变。","b":"统计量 $T=T(X_1,\\dots,X_n)$：完全由样本决定、**不含任何未知参数**的样本函数。","diff":["所属：总体 / 样本；","性质：未知常数 / 随机变量；","判据只有一条：是否含未知参数。"],"link":"统计量是「能算出来的量」，参数是「要估计的量」；估计量与检验统计量都是统计量，这正是用样本推断参数的桥梁。","ex":"$X\\sim N(\\mu,\\sigma^2)$、$\\mu$ 未知、$\\sigma$ 已知：$\\bar X$ 是统计量；$\\bar X-\\mu$ 不是（含未知参数）；$(\\bar X-\\mu)/(\\sigma/\\sqrt n)$ 是统计量。"},"bx2":{"def":"参数 $\\theta$ 是总体分布中的未知常数，如 $\\mu,\\sigma^2,p$，不随抽样改变；统计量 $T=T(X_1,\\dots,X_n)$ 是完全由样本确定、不含任何未知参数的样本函数，本身是随机变量。","diff":"参数属于总体，是待估计的未知常数，其取值与这一次抽样无关；统计量属于样本，随抽样而变，是一个随机变量，且表达式中一旦出现未知参数就不再是统计量。","link":"二者是「被估计」与「用来估计」的关系：由辛钦大数定律 $\\bar X\\xrightarrow{P}\\mu$，故 $\\bar X$ 是 $\\mu$ 的相合估计，这正是用统计量推断参数的依据。"}},{"no":46,"star":2,"title":"估计量 vs 估计值","ch":5,"sections":[{"name":"一句话","body":"估计量是随机变量，估计值是它的一次取值。"},{"name":"得分点","body":"> 用于估计未知参数 $\\theta$ 的统计量 $\\hat\\theta=\\hat\\theta(X_1,\\dots,X_n)$ 称为估计量，它是随机变量，随样本不同而变化；把具体样本值代入后得到的数值 $\\hat\\theta(x_1,\\dots,x_n)$ 称为估计值。评价估计量好坏（无偏、有效、相合）都是针对估计量（随机变量）而言的，例如\"无偏\"指 $E\\hat\\theta=\\theta$，涉及分布而非某次取值。这一区分是名词解释的常见考点，答题时须点明\"随机变量 vs 具体数值\"。"},{"name":"钩子","body":"估计量是公式，估计值是算出来的数。"}],"one":"估计量是随机变量，估计值是它的一次取值。","hook":"估计量是公式，估计值是算出来的数。","bx":{"a":"估计量 $\\hat\\theta=\\hat\\theta(X_1,\\dots,X_n)$：用于估计参数的统计量，是随机变量。","b":"估计值 $\\hat\\theta(x_1,\\dots,x_n)$：把样本值代入后算出的具体数字。","diff":["是随机变量 / 是常数；","随样本变 / 固定；","无偏、有效、相合等评价都针对估计量。"],"link":"估计量是「公式」，估计值是「一次结果」；$E\\hat\\theta=\\theta$ 这类命题只能对估计量说，对某个估计值谈期望没有意义。","ex":"$\\hat\\mu=\\bar X$ 是估计量（随机）；抽到 $3.1,3.4,3.0$ 后 $\\bar x=3.17$ 是估计值。"},"bx2":{"def":"用于估计未知参数的统计量 $\\hat\\theta$ 是样本的函数，随样本而变，因而是随机变量，称为估计量；把一组样本观测值代入后算出的具体数字称为估计值，它是常数。","diff":"估计量有分布，可以讨论期望、方差、无偏性与有效性；估计值只是该分布中的一个实现，对它谈期望没有意义，同一个估计量换一组样本就得到另一个估计值。","link":"二者是随机变量与其取值的关系：$E\\hat\\theta=\\theta$ 一类命题只对估计量成立，而区间估计与假设检验最终代入计算的是估计值。"}},{"no":47,"star":2,"title":"简单随机样本 vs 一般样本","ch":5,"sections":[{"name":"得分点","body":"> 简单随机样本要求 $X_1,\\dots,X_n$ 相互独立且与总体同分布（iid），即每个个体被抽到的机会相同、抽取相互独立（对应有放回抽样，或在总体无限大时近似成立）；一般样本可能只要求同分布或只要求独立。茆书后续所有统计量（$\\bar X$、$S^2$、三大抽样分布的构造）都以简单随机样本为前提，缺\"独立\"或\"同分布\"任一条，抽样分布定理即失效。故考题若说\"从总体中抽取容量为 $n$ 的样本\"，默认是简单随机样本。"},{"name":"钩子","body":"独立 + 同分布 = 简单随机样本。"}],"one":"","hook":"独立 + 同分布 = 简单随机样本。","bx":{"a":"简单随机样本：$X_1,\\dots,X_n$ 相互独立且与总体同分布（iid）。","b":"一般样本：可能只要求同分布，或只要求独立。","diff":["独立性：要求 / 不要求；","同分布：要求 / 不要求；","对应抽样方式：有放回（或总体无限）/ 各种抽样设计。"],"link":"茆书后面所有结论（$\\bar X$ 的分布、$\\chi^2$ 定理、$t$ 与 $F$ 的构造）都以简单随机样本为前提，缺「独立」或「同分布」任一条，抽样分布定理即失效。","ex":"题目说「从总体中抽取容量为 $n$ 的样本」，默认就是简单随机样本；若无放回且 $n/N>0.1$，严格说各次不独立，只是近似。"},"bx2":{"def":"简单随机样本指 $X_1,\\dots,X_n$ 相互独立且都与总体同分布，两条同时成立；一般样本只要求同分布、或只要求相互独立，是条件更宽的样本。","diff":"简单随机样本的独立性排除了无放回抽样的相依性，同分布性排除了分层、整群抽样的异质性；一般样本恰好允许其中一条不成立，故不能与之混用。","link":"教材中 $\\bar X$ 的分布、$\\chi^2$ 定理以及 $t$ 与 $F$ 的构造都以简单随机样本为前提，缺独立性或同分布任一条，这些抽样分布定理即不成立。"}},{"no":48,"star":3,"title":"经验分布函数 vs 理论分布函数","ch":5,"sections":[{"name":"一句话","body":"经验分布函数是阶梯函数（由数据画出），理论分布函数是总体的真分布（未知）。"},{"name":"定义卡","body":"- 经验分布函数：$F_n(x)=\\dfrac{1}{n}\\#\\{i:X_i\\le x\\}$。\n- 理论分布函数：$F(x)=P(X\\le x)$。"},{"name":"对比表","body":"| 维度 | 经验分布函数 | 理论分布函数 |\n|---|---|---|\n| 来源 | 样本数据 | 总体 |\n| 形态 | 阶梯函数，跳跃 $\\frac1n$ | 光滑或一般 |\n| 已知性 | 可计算 | 通常未知 |\n| 关系 | $F_n(x)\\xrightarrow{P}F(x)$（格里汶科定理：几乎处处一致收敛） | — |"},{"name":"得分点","body":"> 经验分布函数由样本定义：$F_n(x)=\\dfrac{1}{n}\\sum_{i=1}^{n}I(X_i\\le x)$，它在每个样本点处跳跃 $1/n$，是阶梯函数，且是统计量（不含未知参数）；理论分布函数 $F(x)=P(X\\le x)$ 是总体的真分布，一般未知。由格里汶科定理，$F_n(x)$ 以概率 1 一致收敛于 $F(x)$，故 $F_n$ 可作为 $F$ 的非参数估计，这正是非参数统计与 KS 检验的基础。注意区分：$F_n$ 有 $n$ 个跳跃点、右连续阶梯；$F$ 连续时两者形态完全不同。"},{"name":"钩子","body":"数据画出来的是阶梯，总体那条是真曲线。"}],"one":"经验分布函数是阶梯函数（由数据画出），理论分布函数是总体的真分布（未知）。","hook":"数据画出来的是阶梯，总体那条是真曲线。","bx":{"a":"经验分布函数 $F_n(x)=\\dfrac{1}{n}\\#\\{i:X_i\\le x\\}$：由样本画出的阶梯函数，跳跃 $1/n$。","b":"理论分布函数 $F(x)=P(X\\le x)$：总体的真分布，一般未知。","diff":["来源：样本 / 总体；","形态：阶梯（右连续，跳 $1/n$）/ 光滑或一般；","已知性：可算 / 未知。"],"link":"格里汶科定理：$\\sup_x|F_n(x)-F(x)|\\xrightarrow{a.s.}0$，故 $F_n$ 是 $F$ 的非参数估计，这正是非参数统计与 KS 检验的基础。","ex":"样本 $1,2,2,4$（$n=4$）：$F_n(2)=\\frac34$，即在 $x=2$ 处跳到 $0.75$；真分布若为 $N(2,1)$，则 $F(2)=0.5$。"},"bx2":{"def":"理论分布函数 $F(x)=P(X\\le x)$ 是总体真分布的取值，通常未知；经验分布函数 $F_n(x)$ 定义为样本中不超过 $x$ 的观测值所占的比例，完全由数据确定。","diff":"$F$ 单调不减、右连续，两端极限为 $0$ 与 $1$；$F_n$ 是阶梯函数，只在样本点处跳跃 $1/n$，取值离散，故两者的光滑性与已知性都不同。","link":"格里汶科定理给出 $\\sup_x|F_n(x)-F(x)|\\to0$（几乎必然），即 $F_n$ 是 $F$ 的强相合估计，这也是用样本频率代替概率以及 KS 检验的依据。"}},{"no":49,"star":3,"title":"样本方差 $S^2$ vs 样本二阶中心矩 $S_n^2$","ch":5,"sections":[{"name":"一句话","body":"分母 $n-1$ 无偏，分母 $n$ 有偏。"},{"name":"定义卡","body":"- $S^2=\\dfrac{1}{n-1}\\sum_{i=1}^{n}(X_i-\\bar X)^2$。\n- $S_n^2=\\dfrac{1}{n}\\sum_{i=1}^{n}(X_i-\\bar X)^2=\\dfrac{n-1}{n}S^2$。"},{"name":"对比表","body":"| 维度 | $S^2$（分母 $n-1$） | $S_n^2$（分母 $n$） |\n|---|---|---|\n| 无偏性 | $E(S^2)=\\sigma^2$ 无偏 | $E(S_n^2)=\\frac{n-1}{n}\\sigma^2$ 有偏 |\n| 用途 | 推断（区间估计、检验） | 描述统计 |\n| 正态下 | $\\frac{(n-1)S^2}{\\sigma^2}\\sim\\chi^2(n-1)$ | — |"},{"name":"得分点","body":"> 样本方差 $S^2=\\frac{1}{n-1}\\sum(X_i-\\bar X)^2$ 是总体方差 $\\sigma^2$ 的无偏估计，分母取 $n-1$ 正是为了修正\"用 $\\bar X$ 代替 $\\mu$\"带来的损失（自由度少 1）；样本二阶中心矩 $S_n^2=\\frac1n\\sum(X_i-\\bar X)^2$ 是 $\\sigma^2$ 的有偏估计，$E(S_n^2)=\\frac{n-1}{n}\\sigma^2$，但当 $n\\to\\infty$ 时二者之差趋于 0，故 $S_n^2$ 仍相合。总体方差已知时用 $\\sigma^2$ 构造 $\\chi^2$ 统计量，未知时只能用 $S^2$ 得 $t$ 统计量，这一区别贯穿区间估计与假设检验。"},{"name":"钩子","body":"减一除一，换无偏。"}],"one":"分母 $n-1$ 无偏，分母 $n$ 有偏。","hook":"减一除一，换无偏。","bx":{"a":"样本方差 $S^2=\\dfrac{1}{n-1}\\sum(X_i-\\bar X)^2$：$E(S^2)=\\sigma^2$，无偏。","b":"样本二阶中心矩 $S_n^2=\\dfrac{1}{n}\\sum(X_i-\\bar X)^2=\\dfrac{n-1}{n}S^2$：$E(S_n^2)=\\dfrac{n-1}{n}\\sigma^2$，有偏。","diff":["分母：$n-1$ / $n$；","无偏性：无偏 / 有偏（偏低）；","用途：区间估计与检验 / 描述统计。"],"link":"二者只差系数 $\\frac{n-1}{n}$，且 $S_n^2\\xrightarrow{P}\\sigma^2$ 相合；正态下 $\\frac{(n-1)S^2}{\\sigma^2}\\sim\\chi^2(n-1)$，故推断一律用 $S^2$（自由度 $n-1$ 的来源就是分母）。","ex":"$n=5$，$\\sum(X_i-\\bar X)^2=20$：$S^2=\\frac{20}{4}=5$（无偏估计 $\\sigma^2$）；$S_n^2=\\frac{20}{5}=4$，系统性偏小 20%。"},"bx2":{"def":"样本方差 $S^2=\\frac{1}{n-1}\\sum(X_i-\\bar X)^2$ 以 $n-1$ 为分母，是无偏的；样本二阶中心矩 $S_n^2$ 以 $n$ 为分母，是有偏的，两者都刻画样本的离散程度。","diff":"分母相差 $n-1$ 与 $n$ 两数，因而 $S_n^2=\\frac{n-1}{n}S^2$ 系统性偏小；$S^2$ 用于区间估计与假设检验，$S_n^2$ 只作描述统计量使用，两者用途不可互换。","link":"$S_n^2$ 与 $S^2$ 只差系数 $(n-1)/n$，故前者有偏却仍相合；正态下 $S^2$ 的自由度为 $n-1$，这正是推断一律用 $S^2$ 而弃用 $S_n^2$ 的原因。"}},{"no":50,"star":2,"title":"χ² 分布 vs t 分布 vs F 分布","ch":5,"sections":[{"name":"一句话","body":"三个分布都是\"正态造出来的\"，区别在有没有未知 $\\sigma$、比较几组。\n\n| 分布 | 构造 | 参数 | 用途 |\n|---|---|---|---|\n| $\\chi^2(n)$ | 标准正态平方和 | 自由度 $n$ | 方差推断、拟合优度 |\n| $t(n)$ | $Z/\\sqrt{\\chi^2(n)/n}$ | 自由度 $n$ | 均值推断（$\\sigma$ 未知） |\n| $F(m,n)$ | $\\dfrac{\\chi^2(m)/m}{\\chi^2(n)/n}$ | 两个自由度 | 方差比、方差分析、回归显著性 |"},{"name":"得分点","body":"> 设 $Z\\sim N(0,1)$，$Y\\sim\\chi^2(n)$ 且相互独立。$\\chi^2(n)$ 是 $n$ 个独立标准正态变量平方和，期望 $n$、方差 $2n$，可加性：独立 $\\chi^2$ 之和仍为 $\\chi^2$（自由度相加）。$t(n)=Z/\\sqrt{Y/n}$，密度关于 0 对称，$n\\to\\infty$ 时趋于 $N(0,1)$，故大样本可用 $u$ 近似 $t$。$F(m,n)=\\frac{Y_1/m}{Y_2/n}$，两个独立 $\\chi^2$ 之比，且 $F\\sim F(m,n)\\Rightarrow 1/F\\sim F(n,m)$。三者关系：$t^2(n)=F(1,n)$。"},{"name":"钩子","body":"$\\chi^2$ 是平方和，$t$ 是标准化，$F$ 是两方差比。"}],"one":"三个分布都是\"正态造出来的\"，区别在有没有未知 $\\sigma$、比较几组。\n\n| 分布 | 构造 | 参数 | 用途 |\n|---|---|---|---|\n| $\\chi^2(n)$ | 标准正态平方和 | 自由度 $n$ | 方差推断、拟合优度 |\n| $t(n)$ | $Z/\\sqrt{\\chi^2(n)/n}$ | 自由度 $n$ | 均值推断（$\\sigma$ 未知） |\n| $F(m,n)$ | $\\dfrac{\\chi^2(m)/m}{\\chi^2(n)/n}$ | 两个自由度 | 方差比、方差分析、回归显著性 |","hook":"$\\chi^2$ 是平方和，$t$ 是标准化，$F$ 是两方差比。","bx":{"a":"$\\chi^2(n)$：$n$ 个独立标准正态的平方和，$E=n$、$D=2n$，可加（自由度相加）。","b":"$t(n)=Z/\\sqrt{Y/n}$：$Z\\sim N(0,1)$ 与 $Y\\sim\\chi^2(n)$ 独立，密度关于 0 对称，$n\\to\\infty$ 趋于 $N(0,1)$。","diff":["构造：平方和 / 标准正态除以卡方开方；","用途：方差推断、拟合优度 / 均值推断（$\\sigma$ 未知）；","另 $F(m,n)=\\dfrac{\\chi^2(m)/m}{\\chi^2(n)/n}$ 比较两个方差，且 $t^2(n)=F(1,n)$。"],"link":"三个分布都由正态造出来：$\\chi^2$ 是「平方和」，$t$ 是「正态 $\\div$ 卡方的根」，$F$ 是「两个卡方之比」；这也解释了为什么 $t$ 检验、$F$ 检验都要求正态总体。","ex":"$n=10$ 的正态样本：$\\frac{9S^2}{\\sigma^2}\\sim\\chi^2(9)$；$\\frac{\\bar X-\\mu}{S/\\sqrt{10}}\\sim t(9)$；两组方差比 $\\frac{S_1^2}{S_2^2}\\sim F(9,9)$（同方差时）。"},"bx2":{"def":"$\\chi^2(n)$ 为 $n$ 个独立标准正态变量的平方和；$t(n)$ 为标准正态变量除以 $\\sqrt{\\chi^2(n)/n}$，二者独立；$F(m,n)$ 为两个独立卡方变量各除自由度后的比值。","diff":"卡方只有一个自由度，用于方差推断与拟合优度检验；$t$ 多一个正态分子，用于方差未知时的均值推断；$F$ 有两个自由度，用于方差比与方差分析。","link":"三者同由正态构造，卡方是共同构件；$t^2(n)=F(1,n)$，$n\\to\\infty$ 时 $t(n)\\to N(0,1)$，这也是 $t$ 检验与 $F$ 检验都要求正态总体的原因。"}},{"no":51,"star":2,"title":"自由度","ch":5,"sections":[{"name":"得分点","body":"> 自由度指平方和中独立变量的个数，或数据中可自由变动而受约束限制的个数。$\\sum(X_i-\\bar X)^2$ 的自由度为 $n-1$，因为 $\\sum(X_i-\\bar X)=0$ 是一个约束，$n$ 个偏差只有 $n-1$ 个可自由变动；$S^2$ 与 $\\sigma^2$ 之比服从 $\\chi^2(n-1)$ 正是由此。卡方拟合优度检验中自由度 $=k-1-m$（$k$ 为分组数，$m$ 为估计的参数个数）；列联表独立性检验自由度 $=(r-1)(c-1)$。方差分析中 $SSA$ 的自由度为 $r-1$，$SSE$ 为 $n-r$，$SST$ 为 $n-1$。"},{"name":"钩子","body":"每用一个估计量，就少一个自由度。"}],"one":"","hook":"每用一个估计量，就少一个自由度。","bx":{"a":"自由度：平方和中独立变量的个数（或受约束后可自由变动的个数）。","b":"样本量 $n$：参与计算的观测个数。","diff":["含义：独立信息量 / 数据条数；","关系：$\\sum(X_i-\\bar X)^2$ 用掉一个约束 $\\sum(X_i-\\bar X)=0$，故 $df=n-1$；","不同场合算法不同：拟合优度 $k-1-m$、列联表 $(r-1)(c-1)$、方差分析 $r-1$ 与 $n-r$。"],"link":"自由度 = 样本量减去已估计的参数个数：每用一个估计量（如 $\\bar X$）就少一个自由度，这正是不用 $n$ 而用 $n-1$ 的根源。","ex":"$n=10$ 时 $\\frac{9S^2}{\\sigma^2}\\sim\\chi^2(9)$ 而非 $\\chi^2(10)$；$3\\times4$ 列联表独立性检验 $df=(3-1)(4-1)=6$。"},"bx2":{"def":"自由度指平方和中可以独立变动的变量个数，等于参与求和的项数减去其中已用的约束个数；样本量 $n$ 是参与计算的观测个数，二者含义不同。","diff":"自由度随估计与约束的个数而变，同一批数据在均值已知时取 $n$，在均值需估计时降为 $n-1$；样本量只由数据条数决定，不因模型设定而改变。","link":"一般地，自由度等于样本量减去已估参数个数；离差平方和受离差和为零这一约束而失去一个自由度，这正是 $S^2$ 分母取 $n-1$ 的根源。"}},{"no":52,"star":1,"title":"次序统计量 vs 样本极值 vs 样本中位数","ch":5,"sections":[{"name":"得分点","body":"> 将样本按大小排列 $X_{(1)}\\le X_{(2)}\\le\\cdots\\le X_{(n)}$，称为次序统计量，$X_{(k)}$ 的密度为 $\\frac{n!}{(k-1)!(n-k)!}[F(x)]^{k-1}[1-F(x)]^{n-k}f(x)$。最小值 $X_{(1)}$、最大值 $X_{(n)}$ 称为样本极值，$F_{\\min}=1-(1-F)^n$、$F_{\\max}=F^n$。样本中位数是 $n$ 为奇数时的 $X_{((n+1)/2)}$、偶数时两端平均，是总体中位数的稳健估计，不受极端值影响。西大曾考均匀总体的次序统计量分布，需会推出 $X_{(k)}/X_{(n)}$ 等比值量的分布。"},{"name":"钩子","body":"排序取第 $k$ 个，叫次序统计量。"}],"one":"","hook":"排序取第 $k$ 个，叫次序统计量。","bx":{"a":"次序统计量 $X_{(1)}\\le\\cdots\\le X_{(n)}$：排序后的第 $k$ 个，密度含组合系数与 $[F]^{k-1}[1-F]^{n-k}$。","b":"样本极值：$X_{(1)}$ 与 $X_{(n)}$，$F_{\\min}=1-(1-F)^n$、$F_{\\max}=F^n$。","diff":["范围：任意 $k$ / 两端；","分布：通式 / 两个特例；","样本中位数是 $k$ 取中间位置的次序统计量。"],"link":"极值与中位数都是次序统计量的特例：$k=n$ 得最大值，$k=1$ 得最小值，$k\\approx n/2$ 得中位数；中位数是总体中位数的稳健估计，不受极端值影响。","ex":"$n=4$ 的样本 $2,5,7,9$：$X_{(1)}=2$、$X_{(4)}=9$、中位数 $=\\frac{5+7}{2}=6$；$U(0,\\theta)$ 下 $E X_{(4)}=\\frac{4}{5}\\theta$。"},"bx2":{"def":"样本按大小排成 $X_{(1)}\\le\\cdots\\le X_{(n)}$，第 $k$ 个即第 $k$ 个次序统计量；样本极值指两端的 $X_{(1)}$ 与 $X_{(n)}$，样本中位数取居中的次序统计量。","diff":"次序统计量是一族统计量，其分布含组合系数 $[F]^{k-1}[1-F]^{n-k}$；极值只取两端，中位数只取中部，分别刻画样本的范围与中心位置。","link":"三者同属一族：$k=1$ 与 $k=n$ 给出极值，$k$ 取中间位置给出中位数；中位数是总体中位数的稳健估计，不受极端值影响，这与 $\\bar X$ 不同。"}},{"no":53,"star":2,"title":"充分统计量 vs 完备统计量","ch":5,"sections":[{"name":"一句话","body":"充分是\"信息不丢\"，完备是\"没有多余的无用信息\"。"},{"name":"定义卡","body":"- 充分：给定 $T$ 后，样本的条件分布与 $\\theta$ 无关（因子分解定理）。\n- 完备：$E_\\theta[g(T)]=0\\ \\forall\\theta\\Rightarrow P_\\theta(g(T)=0)=1$。"},{"name":"得分点","body":"> 若在统计量 $T$ 取值的条件下，样本的条件分布不依赖于未知参数 $\\theta$，则称 $T$ 为充分统计量，意为 $T$ 已包含样本中关于 $\\theta$ 的全部信息；判据是因子分解定理：$f(x;\\theta)=g(T(x);\\theta)h(x)$。完备统计量是指不存在非平凡的无偏零估计，即 $E_\\theta g(T)=0$ 对一切 $\\theta$ 成立可推出 $g\\equiv0$（几乎处处）。二者结合得 Lehmann-Scheffé 定理：完备充分统计量的任意函数，若是无偏估计，则必为一致最小方差无偏估计（UMVUE）。所以\"找 UMVUE\"的标准路线是：先找完备充分统计量，再对其作无偏修正。"},{"name":"钩子","body":"充分不丢信息，完备不多余，两者合体出 UMVUE。"}],"one":"充分是\"信息不丢\"，完备是\"没有多余的无用信息\"。","hook":"充分不丢信息，完备不多余，两者合体出 UMVUE。","bx":{"a":"充分统计量：给定 $T$ 后样本的条件分布与 $\\theta$ 无关，判据是因子分解 $f=g(T;\\theta)h(x)$。","b":"完备统计量：$E_\\theta[g(T)]=0\\ (\\forall\\theta)\\Rightarrow P_\\theta(g(T)=0)=1$，不存在非平凡的无偏零估计。","diff":["回答的问题：信息有没有丢 / 有没有多余信息；","判据：因子分解 / 零期望唯一性；","一个管压缩、一个管唯一性。"],"link":"两者结合得 Lehmann-Scheffé 定理：完备充分统计量的任意无偏函数必是 UMVUE，这是求最小方差无偏估计最常用的路径。","ex":"$X_i$ iid $N(\\mu,\\sigma^2)$、$\\sigma^2$ 已知：$\\bar X$ 是充分且完备的，故 $\\bar X$ 就是 $\\mu$ 的 UMVUE。"},"bx2":{"def":"给定统计量 $T$ 后样本条件分布与 $\\theta$ 无关，称 $T$ 充分，信息无损失；若 $E_\\theta[g(T)]=0$ 对一切 $\\theta$ 成立只能推出 $g(T)=0$ 必然成立，称 $T$ 完备。","diff":"充分性由因子分解定理判定，即联合密度可写成 $g(T;\\theta)h(x)$，回答信息是否压缩干净；完备性由零期望方程只有零解判定，回答是否还残留多余信息。","link":"二者结合即 Lehmann-Scheffé 定理：完备充分统计量的任一可测无偏函数是唯一的 UMVUE，故求最小方差无偏估计常先找完备充分统计量。"}},{"no":54,"star":2,"title":"正态总体中 $\\bar X$ 与 $S^2$ 独立","ch":5,"sections":[{"name":"得分点","body":"> 设 $X_1,\\dots,X_n$ iid $N(\\mu,\\sigma^2)$，则 $\\bar X\\sim N\\!\\left(\\mu,\\dfrac{\\sigma^2}{n}\\right)$，$\\dfrac{(n-1)S^2}{\\sigma^2}\\sim\\chi^2(n-1)$，且 $\\bar X$ 与 $S^2$ **相互独立**。这条独立性是三大抽样分布定理的核心，也是构造 $t$ 统计量的前提（分子正态、分母卡方且独立，才能造出 $t$）。注意该结论对正态总体成立，非正态总体下 $\\bar X$ 与 $S^2$ 一般不独立。由此得 $\\dfrac{\\bar X-\\mu}{S/\\sqrt n}\\sim t(n-1)$。"},{"name":"钩子","body":"正态下均值与方差各管各的。"}],"one":"","hook":"正态下均值与方差各管各的。","bx":{"a":"$\\bar X\\sim N\\!\\left(\\mu,\\dfrac{\\sigma^2}{n}\\right)$：样本均值的分布，正态的线性组合仍正态。","b":"$\\dfrac{(n-1)S^2}{\\sigma^2}\\sim\\chi^2(n-1)$：样本方差的分布，与 $\\bar X$ 相互独立。","diff":["刻画：位置 / 波动；","分布：正态 / 卡方；","关键结论：二者独立（仅正态总体成立）。"],"link":"这条独立性是三大抽样分布定理的核心：分子正态、分母卡方且独立，才能造出 $t=\\dfrac{\\bar X-\\mu}{S/\\sqrt n}$；非正态总体下 $\\bar X$ 与 $S^2$ 一般不独立。","ex":"$n=16$ 的正态样本，$\\sigma=2$：$\\bar X\\sim N(\\mu,0.25)$，$\\frac{15S^2}{4}\\sim\\chi^2(15)$，且两者独立，故 $\\frac{\\bar X-\\mu}{S/4}\\sim t(15)$。"},"bx2":{"def":"正态总体下样本均值 $\\bar X$ 服从 $N(\\mu,\\sigma^2/n)$，只反映位置；样本方差的标准化量服从自由度为 $n-1$ 的卡方分布，只反映波动，且两者相互独立。","diff":"$\\bar X$ 服从正态分布，$S^2$ 的标准化服从卡方分布；独立性是正态总体特有的结论，一般总体下二者可以相关，故不能随意套用 $t$ 分布。","link":"该独立性是三大抽样分布定理的核心：分子正态、分母卡方且相互独立，才构造出 $t=\\frac{\\bar X-\\mu}{S/\\sqrt n}\\sim t(n-1)$，非正态时此式不成立。"}},{"no":55,"star":3,"title":"无偏性 vs 有效性 vs 相合性","ch":6,"sections":[{"name":"一句话","body":"无偏管\"平均准\"，有效管\"波动小\"，相合管\"样本多了就准\"。"},{"name":"定义卡","body":"- 无偏：$E(\\hat\\theta)=\\theta$。\n- 有效：两个无偏估计中 $D(\\hat\\theta_1)\\le D(\\hat\\theta_2)$ 者更有效。\n- 相合（一致）：$\\hat\\theta_n\\xrightarrow{P}\\theta$。"},{"name":"对比表","body":"| 维度 | 无偏性 | 有效性 | 相合性 |\n|---|---|---|---|\n| 关注 | 期望 = 真值 | 方差更小 | $n\\to\\infty$ 收敛 |\n| 样本量 | 与 $n$ 无关 | 与 $n$ 有关 | 大样本性质 |\n| 关系 | 无偏 + $D\\to0$ ⟹ 相合 | — | 相合不一定无偏 |"},{"name":"得分点","body":"> 无偏性要求估计量的期望等于被估参数，即 $E\\hat\\theta=\\theta$，保证\"多次估计平均而言没有系统偏差\"；有效性在无偏估计之间比较方差，方差越小越有效，即在相同样本量下更集中；相合性（一致性）是大样本性质，要求 $\\hat\\theta_n$ 依概率收敛于 $\\theta$。三者关系：无偏且方差趋于 0 可推出相合（由切比雪夫不等式），但相合估计未必无偏（如 $S_n^2$ 有偏但相合）；无偏估计也未必相合。评价估计量应同时考察三者，其中相合性是最基本的大样本要求。"},{"name":"钩子","body":"无偏看期望，有效看方差，相合看极限。"}],"one":"无偏管\"平均准\"，有效管\"波动小\"，相合管\"样本多了就准\"。","hook":"无偏看期望，有效看方差，相合看极限。","bx":{"a":"无偏性 $E\\hat\\theta=\\theta$ 与有效性（同为无偏时比 $D\\hat\\theta$ 大小）：小样本准则。","b":"相合性（一致性）$\\hat\\theta_n\\xrightarrow{P}\\theta$：大样本准则。","diff":["对 $n$ 的依赖：与 $n$ 无关 / 只看 $n\\to\\infty$；","回答：平均准不准、稳不稳 / 样本多了会不会准；","相合不一定无偏（$S_n^2$ 有偏但相合）。"],"link":"三者的逻辑顺序是：无偏管「平均对」，有效管「波动小」，相合管「极限对」；无偏 + $D\\hat\\theta\\to0$ 可推出相合（切比雪夫不等式），反之不成立。","ex":"$S_n^2=\\frac{1}{n}\\sum(X_i-\\bar X)^2$：$E=\\frac{n-1}{n}\\sigma^2$ 有偏，但 $\\xrightarrow{P}\\sigma^2$ 相合——有偏却可用。"},"bx2":{"def":"无偏性指 $E\\hat\\theta=\\theta$，即估计量平均而言等于真值；有效性指同为无偏时方差更小；相合性指 $n\\to\\infty$ 时 $\\hat\\theta_n$ 依概率收敛于 $\\theta$。","diff":"前两条是小样本准则，对每个固定的 $n$ 都可检验，且有效性只在无偏估计之间比较；相合性是大样本准则，只描述极限行为，有偏估计也可能相合。","link":"若期望等于 $\\theta$ 且方差趋于 0，切比雪夫不等式给出依概率收敛，故无偏且方差趋于零蕴含相合；反之相合未必无偏，如 $S_n^2$。"}},{"no":56,"star":3,"title":"矩估计 vs 极大似然估计","ch":6,"sections":[{"name":"一句话","body":"矩估计\"用样本矩替换总体矩\"，极大似然\"选让样本最可能出现的参数\"。"},{"name":"定义卡","body":"- 矩估计：令样本矩 = 总体矩，解方程得 $\\hat\\theta$。一阶即 $\\hat\\mu=\\bar X$。\n- MLE：$\\hat\\theta=\\arg\\max L(\\theta)=\\arg\\max\\ln L(\\theta)$，令 $\\dfrac{\\partial\\ln L}{\\partial\\theta}=0$。"},{"name":"对比表","body":"| 维度 | 矩估计 | 极大似然估计 |\n|---|---|---|\n| 思想 | 矩相等 | 概率最大 |\n| 计算 | 解代数方程 | 求导/求极值 |\n| 性质 | 相合，但常有偏、不一定有效 | 相合、渐近正态、渐近有效（正则条件下） |\n| 缺点 | 可能不唯一、可能超出参数空间 | 边界情形需求导失败，需直接看 $L$ 单调性 |\n\n**【例子（必背对比）】** $X\\sim U(0,\\theta)$：矩估计 $\\hat\\theta=2\\bar X$（有偏，可取到小于 $X_{(n)}$ 的值，不合理）；MLE $\\hat\\theta=X_{(n)}$（有偏但更合理，且 $\\frac{n+1}{n}X_{(n)}$ 才无偏）。"},{"name":"得分点","body":"> 矩估计基于\"样本矩依概率收敛于总体矩\"，令二者相等解出参数，计算简单、一定相合，但不保证唯一且可能不满足参数约束（如均匀分布上界）；极大似然估计基于\"已发生的事件应具有最大概率\"的思想，最大化似然函数，具有相合性、渐近正态性与渐近有效性，且在参数变换下不变（$\\widehat{g(\\theta)}=g(\\hat\\theta)$）。当似然函数关于参数单调时（如 $U(0,\\theta)$），驻点法失效，必须由示性函数约束直接取边界值，这是 MLE 最常见的失分点。"},{"name":"钩子","body":"矩估计解方程，MLE 求最大；单调时看边界。"}],"one":"矩估计\"用样本矩替换总体矩\"，极大似然\"选让样本最可能出现的参数\"。","hook":"矩估计解方程，MLE 求最大；单调时看边界。","bx":{"a":"矩估计：令样本矩 = 总体矩解方程，如 $\\hat\\mu=\\bar X$。","b":"极大似然估计：$\\hat\\theta=\\arg\\max L(\\theta)$，令 $\\dfrac{\\partial\\ln L}{\\partial\\theta}=0$。","diff":["思想：矩相等 / 让样本最可能出现；","计算：解代数方程 / 求导或直接看单调性；","性质：一定相合但常不唯一、可能有偏 / 相合、渐近正态、渐近有效、变换不变。"],"link":"两者都是「用样本造估计」的通用方法，且都相合；当分布是指数族时二者常给出同一结果（如正态的 $\\bar X$），但均匀分布 $U(0,\\theta)$ 就分道扬镳：矩估计 $2\\bar X$，MLE 是 $X_{(n)}$。","ex":"$X\\sim U(0,\\theta)$：$\\hat\\theta_{\\text{矩}}=2\\bar X$（可能小于 $X_{(n)}$，不合约束）；$\\hat\\theta_{\\text{MLE}}=X_{(n)}$（由示性函数取边界，驻点法失效）。"},"bx2":{"def":"矩估计令样本矩等于总体矩，解方程得参数，如 $\\hat\\mu=\\bar X$；极大似然估计取使样本联合密度即似然函数最大的参数，即 $\\hat\\theta=\\arg\\max L(\\theta)$。","diff":"矩估计只要求总体矩存在，计算是解代数方程，估计量未必唯一、也常有偏；极大似然需先写出似然函数，常由求导或单调性得到，且具有相合与变换不变性。","link":"两者都相合；指数族下常给出同一结果，而 $U(0,\\theta)$ 时分离：矩估计为 $2\\bar X$，极大似然为 $X_{(n)}$，因似然在参数边界上取得最大。"}},{"no":57,"star":2,"title":"无偏 vs 渐近无偏","ch":6,"sections":[{"name":"得分点","body":"> 无偏要求对任意 $n$ 都有 $E\\hat\\theta_n=\\theta$；渐近无偏只要求 $\\lim_{n\\to\\infty}E\\hat\\theta_n=\\theta$，允许有限 $n$ 时有偏。例如 $S_n^2$ 有偏但渐近无偏（$E S_n^2=\\frac{n-1}{n}\\sigma^2\\to\\sigma^2$），$X_{(n)}$ 作为 $U(0,\\theta)$ 的估计渐近无偏（$E X_{(n)}=\\frac{n}{n+1}\\theta$）。渐近无偏 + 方差趋于 0 ⟹ 相合。考试中若题目问\"是否无偏\"，必须严格按 $E\\hat\\theta=\\theta$ 判断，不能因 $n$ 大就当作无偏。"},{"name":"钩子","body":"无偏是每一处，渐近是极限处。"}],"one":"","hook":"无偏是每一处，渐近是极限处。","bx":{"a":"无偏：对**任意** $n$ 都有 $E\\hat\\theta_n=\\theta$。","b":"渐近无偏：只要求 $\\lim_{n\\to\\infty}E\\hat\\theta_n=\\theta$，允许有限 $n$ 有偏。","diff":["成立的 $n$ 范围：全部 / 极限；","偏差：恒为 0 / 可以不为 0 但趋于 0；","渐近无偏 + 方差趋于 0 $\\Rightarrow$ 相合。"],"link":"渐近无偏是无偏的弱化版，属于「大样本下的公平」；很多 MLE 只是渐近无偏（如 $U(0,\\theta)$ 的 $X_{(n)}$，$E=\\frac{n}{n+1}\\theta$）。","ex":"$X_{(n)}$ 估 $U(0,\\theta)$：$E X_{(n)}=\\frac{n}{n+1}\\theta\\to\\theta$，渐近无偏但永不无偏；乘 $\\frac{n+1}{n}$ 才修正为无偏。"},"bx2":{"def":"若对任意样本量 $n$ 都有 $E\\hat\\theta_n=\\theta$，称该估计量无偏；若只要求 $n\\to\\infty$ 时期望的极限等于 $\\theta$，允许有限样本下有偏，则称渐近无偏。","diff":"无偏是逐点的严格等式，偏差恒为零；渐近无偏只约束偏差的极限，偏差可以不为零但必须趋于零，因而它比无偏弱，属于大样本下的公平性。","link":"渐近无偏加方差趋于零即得相合；$U(0,\\theta)$ 的 $X_{(n)}$ 的期望为 $\\frac{n}{n+1}\\theta$，恒小于 $\\theta$ 却趋于 $\\theta$，故渐近无偏而不无偏。"}},{"no":58,"star":2,"title":"均方误差 = 偏差² + 方差","ch":6,"sections":[{"name":"得分点","body":"> 均方误差 $\\mathrm{MSE}(\\hat\\theta)=E(\\hat\\theta-\\theta)^2=D(\\hat\\theta)+\\left[E\\hat\\theta-\\theta\\right]^2$，即方差加上偏差的平方。它同时惩罚随机波动与系统偏差，是无偏性之外更全面的评价标准：有偏估计若方差足够小，MSE 仍可能优于无偏估计（如 $U(0,\\theta)$ 中 $\\frac{n+1}{n}X_{(n)}$ 优于 $X_{(n)}$ 而 MSE 更小）。无偏时 $\\mathrm{MSE}=D(\\hat\\theta)$。该分解常用于比较估计量与说明\"无偏不是唯一标准\"。"},{"name":"钩子","body":"误差 = 波动 + 系统性偏移。"}],"one":"","hook":"误差 = 波动 + 系统性偏移。","bx":{"a":"均方误差 $\\mathrm{MSE}(\\hat\\theta)=E(\\hat\\theta-\\theta)^2=D(\\hat\\theta)+[E\\hat\\theta-\\theta]^2$：同时惩罚波动与偏差。","b":"方差 $D(\\hat\\theta)$：只度量随机波动，不含偏差。","diff":["是否含偏差：含（偏差平方） / 不含；","无偏时二者相等；","评价标准：MSE 更全面，方差只适用于无偏估计之间比较。"],"link":"MSE 把「准」与「稳」合成一个数，故有偏估计若方差足够小，MSE 反可优于无偏估计——这正是「偏差-方差权衡」的来源。","ex":"$U(0,\\theta)$：$\\frac{n+1}{n}X_{(n)}$ 无偏、$X_{(n)}$ 有偏，但后者的 MSE 更小（$\\frac{\\theta^2}{n(n+2)}$ 量级），故按 MSE 选它。"},"bx2":{"def":"均方误差 $\\mathrm{MSE}$ 等于 $E(\\hat\\theta-\\theta)^2$，同时惩罚偏差与随机波动；方差 $D\\hat\\theta$ 只度量估计量围绕自身均值的散布，对是否偏离真值不作惩罚。","diff":"分解式 $\\mathrm{MSE}=D\\hat\\theta+[E\\hat\\theta-\\theta]^2$ 表明 MSE 多出偏差平方项，仅当无偏时二者相等；方差只宜在无偏估计之间比较，MSE 可跨有偏与无偏比较。","link":"MSE 把准确与稳定合成一个数，故有偏估计只要方差足够小，其 MSE 可小于无偏估计，这正是偏差与方差权衡的来源，也是选估计量的常用标准。"}},{"no":59,"star":2,"title":"最小方差无偏估计（UMVUE）vs 有效估计","ch":6,"sections":[{"name":"一句话","body":"有效估计是\"达到 C-R 下界\"的无偏估计，是 UMVUE 中最理想的一类。"},{"name":"得分点","body":"> 在所有无偏估计中方差最小者称一致最小方差无偏估计（UMVUE）；若某无偏估计的方差达到 Cramer-Rao 下界 $D(\\hat\\theta)\\ge\\dfrac{1}{nI(\\theta)}$（$I(\\theta)$ 为单样本 Fisher 信息量），则称其为有效估计。有效估计必是 UMVUE，但 UMVUE 未必达到 C-R 下界（如均匀分布 $U(0,\\theta)$ 的 UMVUE 是 $\\frac{n+1}{n}X_{(n)}$，其方差大于 C-R 下界，因正则条件不满足）。UMVUE 的求法有三条：①由 Lehmann-Scheffé 定理用完备充分统计量构造；②有效估计法（验证达到 C-R 下界）；③已知某估计是 UMVUE 时用其线性组合。"},{"name":"钩子","body":"UMVUE 是最优无偏，有效估计是\"打满下界\"的那种。"}],"one":"有效估计是\"达到 C-R 下界\"的无偏估计，是 UMVUE 中最理想的一类。","hook":"UMVUE 是最优无偏，有效估计是\"打满下界\"的那种。","bx":{"a":"UMVUE：所有无偏估计中方差最小者（一致最小方差无偏估计）。","b":"有效估计：方差达到 C-R 下界 $\\dfrac{1}{nI(\\theta)}$ 的无偏估计。","diff":["定义方式：与所有无偏估计比 / 与理论下界比；","包含关系：有效估计 $\\subset$ UMVUE；","UMVUE 未必达到 C-R 下界（正则条件不满足时）。"],"link":"有效估计是 UMVUE 中最理想的一类；求 UMVUE 常用两条路：①完备充分统计量的无偏函数（Lehmann-Scheffé）；②若 C-R 下界可达，直接由 $D\\hat\\theta=\\frac{1}{nI(\\theta)}$ 判定。","ex":"$X_i$ iid $N(\\mu,\\sigma^2)$、$\\sigma^2$ 已知：$\\bar X$ 方差 $\\frac{\\sigma^2}{n}$ 恰等于 C-R 下界，故 $\\bar X$ 是有效估计也是 UMVUE。"},"bx2":{"def":"一致最小方差无偏估计即 UMVUE，指在所有无偏估计中方差一致最小者；有效估计指方差达到 C-R 下界 $\\frac{1}{nI(\\theta)}$ 的无偏估计，是最理想的一类。","diff":"UMVUE 是与同类竞争者比较得出的相对最优，存在性由完备充分统计量保证；有效估计是与理论下界比较，下界可达才有有效估计，正则条件不满足时 UMVUE 也达不到下界。","link":"有效估计必为 UMVUE，反之不然；求 UMVUE 有两条路，取完备充分统计量的无偏函数，或验证方差等于 $\\frac{1}{nI(\\theta)}$ 以判定其有效。"}},{"no":60,"star":2,"title":"Cramer-Rao 下界与 Fisher 信息量","ch":6,"sections":[{"name":"得分点","body":"> Fisher 信息量 $I(\\theta)=E\\!\\left[\\dfrac{\\partial\\ln f(X;\\theta)}{\\partial\\theta}\\right]^2=-E\\!\\left[\\dfrac{\\partial^2\\ln f(X;\\theta)}{\\partial\\theta^2}\\right]$，度量样本对参数的\"信息含量\"；$n$ 个样本为 $nI(\\theta)$。对任意无偏估计 $\\hat\\theta$，在正则条件下有 $D(\\hat\\theta)\\ge\\dfrac{1}{nI(\\theta)}$，等号成立当且仅当 $\\dfrac{\\partial\\ln L}{\\partial\\theta}=A(\\theta)\\left[\\hat\\theta-\\theta\\right]$（指数族情形）。该下界给出无偏估计方差的绝对下限，是判断\"有效\"的工具；注意它依赖正则条件（积分与求导可交换、支撑与参数无关），均匀分布因支撑含 $\\theta$ 而不满足，故其 UMVUE 方差可低于该式给出的\"下界\"。"},{"name":"钩子","body":"信息量越大，方差下界越小。"}],"one":"","hook":"信息量越大，方差下界越小。","bx":{"a":"Fisher 信息量 $I(\\theta)=E\\!\\left[\\dfrac{\\partial\\ln f}{\\partial\\theta}\\right]^2=-E\\!\\left[\\dfrac{\\partial^2\\ln f}{\\partial\\theta^2}\\right]$：单样本所含信息，$n$ 个样本为 $nI(\\theta)$。","b":"C-R 下界 $\\dfrac{1}{nI(\\theta)}$：任一无偏估计方差的下界。","diff":["是什么：信息量（越大越好） / 方差下界（越小越好）；","关系：互为倒数；","前提：正则条件（积分与求导可交换、支撑与 $\\theta$ 无关）。"],"link":"信息量越大，方差下界越小，估计才能更精确；C-R 下界是否可达，是判断「有效估计」的唯一标准。","ex":"$X\\sim N(\\mu,\\sigma^2)$、$\\sigma^2$ 已知：$I(\\mu)=\\frac{1}{\\sigma^2}$，故 $D\\hat\\mu\\ge\\frac{\\sigma^2}{n}$，而 $\\bar X$ 恰取等号。"},"bx2":{"def":"Fisher 信息量 $I(\\theta)$ 定义为对数似然函数一阶导数的平方的期望，衡量单个样本所含参数信息的多少，越大估计越精确；C-R 下界 $\\frac{1}{nI(\\theta)}$ 给出无偏估计方差的下界。","diff":"信息量由总体分布决定，是可加的，$n$ 个独立样本为 $nI(\\theta)$；下界是估计精度的理论极限，只对无偏估计成立，且要求积分与求导可交换、支撑与 $\\theta$ 无关。","link":"信息量越大，下界越小，估计可越精确；无偏估计的方差等于下界当且仅当它是有效估计，如正态均值 $\\bar X$ 的方差 $\\sigma^2/n$ 恰为该下界。"}},{"no":61,"star":2,"title":"贝叶斯估计 vs 经典（频率派）估计","ch":6,"sections":[{"name":"一句话","body":"经典把 $\\theta$ 看作未知常数，贝叶斯把它看作随机变量。"},{"name":"对比表","body":"| 维度 | 经典估计 | 贝叶斯估计 |\n|---|---|---|\n| $\\theta$ 的身份 | 未知常数 | 随机变量，有先验分布 |\n| 信息 | 只用样本 | 先验 + 样本 |\n| 输出 | 点估计/区间 | 后验分布、后验均值/中位数 |\n| 依据 | 无偏、有效、相合 | 后验风险最小（平方损失下为后验均值） |"},{"name":"得分点","body":"> 经典统计把参数 $\\theta$ 视为固定但未知的常数，估计的好坏由估计量的抽样分布评价（无偏性、有效性、相合性），置信区间的覆盖率是\"重复抽样\"意义下的；贝叶斯统计把 $\\theta$ 视为随机变量，先给先验分布 $\\pi(\\theta)$，由贝叶斯公式得后验 $\\pi(\\theta\\mid x)\\propto L(\\theta;x)\\pi(\\theta)$，再以某种损失函数下的后验期望最小为准则（平方损失下取后验均值）。二者不是对错之分，而是对\"概率\"理解不同；当先验为无信息先验且样本量较大时，两者结论接近（Bernstein-von Mises）。西大历年考的是概念辨析，务必答出\"参数身份\"与\"信息来源\"两点。"},{"name":"钩子","body":"常数 vs 随机变量，是全部差异的根。"}],"one":"经典把 $\\theta$ 看作未知常数，贝叶斯把它看作随机变量。","hook":"常数 vs 随机变量，是全部差异的根。","bx":{"a":"经典（频率派）估计：$\\theta$ 是未知**常数**，好坏由抽样分布评价（无偏/有效/相合）。","b":"贝叶斯估计：$\\theta$ 是**随机变量**，有先验 $\\pi(\\theta)$，由后验 $\\pi(\\theta\\mid x)\\propto L(\\theta;x)\\pi(\\theta)$ 作推断。","diff":["$\\theta$ 的身份：常数 / 随机变量；","信息：只用样本 / 先验 + 样本；","输出：点估计与置信区间 / 后验分布（平方损失下取后验均值）。"],"link":"二者不是对错之分，而是对「概率」的理解不同；先验取无信息先验且 $n$ 大时，后验集中到 MLE 附近，两种结论趋于一致。","ex":"$X\\sim B(n,p)$，先验 $p\\sim Beta(1,1)$：后验 $Beta(1+x,1+n-x)$，后验均值 $\\frac{x+1}{n+2}$，与 MLE $\\frac{x}{n}$ 只差平滑项。"},"bx2":{"def":"经典估计把未知参数 $\\theta$ 看作固定常数，用样本构造统计量并按抽样分布评价其优劣；贝叶斯估计把 $\\theta$ 看作随机变量，先设先验，再由后验 $\\pi(\\theta\\mid x)$ 作推断。","diff":"前者的随机性只来自样本，评价标准为无偏、有效、相合；后者的随机性还来自先验，推断结果是整条后验分布，平方损失下取后验均值作点估计，可信区间由后验分位数给出。","link":"二者不是对错之分；当先验取无信息先验且样本量增大时，后验向似然集中，后验均值趋于极大似然估计，两种结论一致。"}},{"no":62,"star":2,"title":"先验分布 vs 后验分布 vs 共轭先验","ch":6,"sections":[{"name":"得分点","body":"> 先验分布 $\\pi(\\theta)$ 是在观测样本之前对 $\\theta$ 的认识，由历史数据或主观判断确定；后验分布 $\\pi(\\theta\\mid x)=\\dfrac{L(\\theta;x)\\pi(\\theta)}{\\int L(\\theta;x)\\pi(\\theta)\\mathrm d\\theta}$ 是综合样本信息后对 $\\theta$ 的更新认识，是贝叶斯推断的全部依据。若后验分布与先验同属一个分布族，则称该先验为该似然函数的共轭先验，例如二项似然配 Beta 先验得 Beta 后验、正态均值（方差已知）配正态先验得正态后验、泊松配 Gamma。共轭先验的作用是使后验有解析形式，便于计算。"},{"name":"钩子","body":"先验是入场前的判断，后验是看完数据后的判断。"}],"one":"","hook":"先验是入场前的判断，后验是看完数据后的判断。","bx":{"a":"先验分布 $\\pi(\\theta)$：观测样本之前对 $\\theta$ 的认识，由历史数据或主观判断给出。","b":"后验分布 $\\pi(\\theta\\mid x)=\\dfrac{L(\\theta;x)\\pi(\\theta)}{\\int L\\pi\\,\\mathrm d\\theta}$：看完样本后更新的认识。","diff":["时点：观测前 / 观测后；","作用：提供初始信息 / 是贝叶斯推断的全部依据；","同族时称共轭先验（如二项 + Beta → Beta）。"],"link":"后验 = 先验 × 似然（再归一化），即「用样本把先验更新一次」；若后验与先验同族，则称该先验为共轭先验，好处是更新只需改参数（$Beta(a,b)\\to Beta(a+x,b+n-x)$）。","ex":"$p$ 的先验 $Beta(1,1)$（均匀），观测 10 次成功 3 次：后验 $Beta(4,8)$，后验均值 $\\frac{4}{12}=0.333$。"},"bx2":{"def":"先验分布 $\\pi(\\theta)$ 是观测样本之前对参数 $\\theta$ 的认识，由历史资料或主观判断给出；后验分布是观测样本之后经贝叶斯公式更新得到的分布，等于先验与似然之积再归一化。","diff":"时点上先验在抽样前给定、后验在抽样后算出；作用上先验只提供初始信息，后验才是贝叶斯推断的全部依据；若后验与先验同族，则称该先验为共轭先验。","link":"后验正比于先验乘似然；共轭先验下更新只改参数，如二项分布配 $Beta(a,b)$ 先验，观测 $x$ 次成功后后验为 $Beta(a+x,b+n-x)$。"}},{"no":63,"star":3,"title":"置信区间 vs 置信水平（置信度）","ch":6,"sections":[{"name":"一句话","body":"置信水平说的是\"**方法**的可靠度\"，不是\"这个区间包含真值的概率\"。"},{"name":"定义卡","body":"- 置信区间：$[\\hat\\theta_L,\\hat\\theta_U]$，端点由样本决定（随机）。\n- 置信水平：$P_\\theta(\\hat\\theta_L\\le\\theta\\le\\hat\\theta_U)=1-\\alpha$。"},{"name":"对比表","body":"| 维度 | 置信区间 | 置信水平 |\n|---|---|---|\n| 是什么 | 随机区间（随样本变） | 一个概率（方法的可靠度） |\n| 谁是随机 | 区间 | — |\n| 正确表述 | \"重复抽样中约 $100(1-\\alpha)\\%$ 的区间覆盖 $\\theta$\" | — |"},{"name":"得分点","body":"> 置信区间是由样本构造的随机区间 $[\\hat\\theta_L,\\hat\\theta_U]$，其两个端点都是统计量，随样本变化；置信水平 $1-\\alpha$ 指在重复抽样下，所构造的区间包含真参数的概率，反映**构造方法**的可靠程度。因此对已经算出的一个具体区间，不能再说\"$\\theta$ 落入该区间的概率为 $1-\\alpha$\"——$\\theta$ 是常数，区间已固定，要么包含要么不包含。正确表述是\"该区间以 $1-\\alpha$ 的置信水平覆盖 $\\theta$\"或\"重复抽样中约有 $100(1-\\alpha)\\%$ 的区间包含 $\\theta$\"。置信水平越高，区间越宽，这正是\"可靠性与精度\"的权衡。"},{"name":"钩子","body":"区间随机、参数固定——所以不能说\"概率\"。"}],"one":"置信水平说的是\"**方法**的可靠度\"，不是\"这个区间包含真值的概率\"。","hook":"区间随机、参数固定——所以不能说\"概率\"。","bx":{"a":"置信区间 $[\\hat\\theta_L,\\hat\\theta_U]$：端点是统计量，随样本变化的**随机区间**。","b":"置信水平 $1-\\alpha$：$P_\\theta(\\hat\\theta_L\\le\\theta\\le\\hat\\theta_U)=1-\\alpha$，是**方法**的可靠度。","diff":["是什么：随机区间 / 一个概率；","谁是随机：区间 / 无；","正确表述：「重复抽样中约 $100(1-\\alpha)\\%$ 的区间覆盖 $\\theta$」。"],"link":"$1-\\alpha$ 描述的是构造方法的覆盖率，不是某一个具体区间包含真值的概率；区间算出后 $\\theta$ 是常数，只能说「覆盖」不能说「落入的概率」。","ex":"$\\bar x\\pm1.96\\frac{\\sigma}{\\sqrt n}$ 算得 $[19.86,21.14]$：不能说「$\\theta$ 在其中的概率 95%」，只能说「该方法 95% 可靠」。"},"bx2":{"def":"置信区间是由样本构造的随机区间，两端点均为统计量；置信水平是该构造方法在重复抽样中覆盖真参数的概率，即 $P(\\hat\\theta_L\\le\\theta\\le\\hat\\theta_U)=1-\\alpha$。","diff":"前者是随样本变化的一个区间，后者是一个固定的概率数值；区间的随机性来自样本，置信水平描述重复抽样下该方法覆盖真值的频率，而非某个已算出区间的可靠程度。","link":"区间一旦算出即固定，$\\theta$ 也是常数，故只能说该区间覆盖 $\\theta$，不能说 $\\theta$ 落入其中的概率为 $1-\\alpha$；频率含义只在重复抽样意义下成立。"}},{"no":64,"star":2,"title":"单侧置信区间 vs 双侧置信区间","ch":6,"sections":[{"name":"得分点","body":"> 双侧置信区间给出上下两个置信限，$P(\\hat\\theta_L\\le\\theta\\le\\hat\\theta_U)=1-\\alpha$，两个尾部各分 $\\alpha/2$，故同置信水平下它比单侧区间更宽；单侧置信区间只给一个置信限：$P(\\theta\\ge\\hat\\theta_L)=1-\\alpha$（下限）或 $P(\\theta\\le\\hat\\theta_U)=1-\\alpha$（上限），全部 $\\alpha$ 放在一侧，故同水平下更窄。当只关心\"至少多少\"或\"至多多少\"时用单侧。与假设检验对应：单侧区间对应单侧检验，双侧区间对应双侧检验。"},{"name":"钩子","body":"双侧两头分，单侧一头全给。"}],"one":"","hook":"双侧两头分，单侧一头全给。","bx":{"a":"双侧置信区间：$P(\\hat\\theta_L\\le\\theta\\le\\hat\\theta_U)=1-\\alpha$，两个尾部各分 $\\alpha/2$。","b":"单侧置信区间：$P(\\theta\\ge\\hat\\theta_L)=1-\\alpha$ 或 $P(\\theta\\le\\hat\\theta_U)=1-\\alpha$，$\\alpha$ 全放一侧。","diff":["置信限：两个 / 一个；","同水平下宽度：更宽 / 更窄；","对应检验：双侧 / 单侧。"],"link":"同一 $\\alpha$ 下，单侧区间用 $u_\\alpha$、双侧用 $u_{\\alpha/2}$，故单侧更窄；只关心「至少多少」或「至多多少」时用单侧，能白得精度。","ex":"$\\sigma$ 已知，95% 双侧用 1.96，单侧下限用 1.645：$\\bar x-1.645\\frac{\\sigma}{\\sqrt n}$ 比 $\\bar x-1.96\\frac{\\sigma}{\\sqrt n}$ 更靠近 $\\bar x$。"},"bx2":{"def":"双侧置信区间由两个置信限给出，把 $\\alpha$ 分到两尾各一半，覆盖真值的概率为 $1-\\alpha$；单侧置信区间只给一个置信限，把全部 $\\alpha$ 放在一侧，只有置信下限或上限。","diff":"双侧把 $\\alpha$ 分成两个尾部各 $\\alpha/2$，单侧把 $\\alpha$ 全部放在一侧；同一置信水平下双侧区间更宽而单侧区间更窄，因所用分位数由 $u_{\\alpha/2}$ 换成 $u_\\alpha$。","link":"单侧区间与单侧检验对偶，双侧区间与双侧检验对偶；只关心参数至少或至多是多少时改用单侧，可在同一置信水平下得到更精确的界限。"}},{"no":65,"star":2,"title":"枢轴量法构造置信区间","ch":6,"sections":[{"name":"得分点","body":"> 设 $G=G(X_1,\\dots,X_n;\\theta)$ 的分布已知且**不依赖任何未知参数**，则称 $G$ 为枢轴量。构造置信区间的步骤：①找枢轴量 $G$；②取 $g_1,g_2$ 使 $P(g_1\\le G\\le g_2)=1-\\alpha$；③由不等式 $g_1\\le G\\le g_2$ 反解出 $\\theta$，得置信区间。正态总体常用枢轴量：$\\dfrac{\\bar X-\\mu}{\\sigma/\\sqrt n}\\sim N(0,1)$（$\\sigma$ 已知）、$\\dfrac{\\bar X-\\mu}{S/\\sqrt n}\\sim t(n-1)$（$\\sigma$ 未知）、$\\dfrac{(n-1)S^2}{\\sigma^2}\\sim\\chi^2(n-1)$（方差）。要点：枢轴量的分布必须已知且不含未知参数，这是能否构造区间的前提。"},{"name":"钩子","body":"分布已知、参数未知——能反解就能造区间。"}],"one":"","hook":"分布已知、参数未知——能反解就能造区间。","bx":{"a":"枢轴量 $G(X_1,\\dots,X_n;\\theta)$：含未知参数，但**分布已知且不依赖任何未知参数**。","b":"统计量 $T(X_1,\\dots,X_n)$：不含未知参数，但分布可能依赖参数。","diff":["是否含 $\\theta$：含 / 不含；","分布：已知且与 $\\theta$ 无关 / 常依赖 $\\theta$；","用途：反解区间 / 作估计与检验。"],"link":"两者是「互补」的：统计量去掉 $\\theta$ 才好算，枢轴量偏偏要保留 $\\theta$ 才能把它反解出来——$\\frac{\\bar X-\\mu}{\\sigma/\\sqrt n}\\sim N(0,1)$ 就是标准枢轴量。","ex":"$\\sigma$ 未知时用 $\\frac{\\bar X-\\mu}{S/\\sqrt n}\\sim t(n-1)$ 作枢轴量，反解得 $\\bar X\\pm t_{\\alpha/2}(n-1)\\frac{S}{\\sqrt n}$。"},"bx2":{"def":"统计量 $T(X_1,\\dots,X_n)$ 是样本的函数，且不含任何未知参数；枢轴量 $G(X_1,\\dots,X_n;\\theta)$ 必定含未知参数 $\\theta$，但其分布已知并且不依赖于 $\\theta$。","diff":"统计量不允许含未知参数，枢轴量必须含未知参数；统计量的分布常依赖参数，枢轴量的分布完全确定；前者用于估计与检验，后者用于反解出置信区间。","link":"二者互补，统计量须去掉参数才好算，枢轴量须保留参数才能反解；正态总体下 $\\frac{\\bar X-\\mu}{\\sigma/\\sqrt n}\\sim N(0,1)$ 即标准枢轴量。"}},{"no":66,"star":1,"title":"区间估计与假设检验的对偶性","ch":6,"sections":[{"name":"得分点","body":"> 参数 $\\theta$ 的置信水平 $1-\\alpha$ 的置信区间与水平 $\\alpha$ 的双侧假设检验存在一一对偶关系：$\\theta_0$ 落在该置信区间内 $\\iff$ 在水平 $\\alpha$ 下不拒绝 $H_0:\\theta=\\theta_0$；反之，由检验的接受域可反解出置信区间。因此\"求置信区间\"与\"做假设检验\"在数学上是同一件事的两种表述。对偶性还可用来快速判断：若某值在置信区间外，则在相应水平下应拒绝 $H_0$。单侧区间与单侧检验同理对偶。"},{"name":"钩子","body":"区间装得下就不拒绝，装不下就拒绝。"}],"one":"","hook":"区间装得下就不拒绝，装不下就拒绝。","bx":{"a":"置信区间：$\\theta$ 的 $1-\\alpha$ 置信区间，覆盖真值则「证据相容」。","b":"检验的接受域：水平 $\\alpha$ 下不拒绝 $H_0$ 的统计量取值集合。","diff":["对象：参数集合 / 统计量集合；","判定：$\\theta_0$ 落在区间内 $\\iff$ 不拒绝 $H_0:\\theta=\\theta_0$；","同一 $\\alpha$ 下二者一一对应。"],"link":"对偶性的实质是同一个不等式两种读法：把区间不等式看成「关于 $\\theta_0$ 的条件」就是检验，看成「关于统计量的条件」就是区间；单侧区间对应单侧检验同理。","ex":"$\\mu$ 的 95% 区间为 $[19.86,21.14]$，则检验 $H_0:\\mu=21$（$\\alpha=0.05$）不拒绝，$H_0:\\mu=22$ 拒绝。"},"bx2":{"def":"参数 $\\theta$ 的 $1-\\alpha$ 置信区间是覆盖真值概率为 $1-\\alpha$ 的随机区间；水平 $\\alpha$ 的检验的接受域是使 $H_0$ 不被拒绝的统计量取值集合。","diff":"置信区间的对象是参数空间中的集合，接受域的对象是统计量空间中的集合；前者回答参数可能取哪些值，后者回答样本与某个给定参数值是否相容。","link":"二者由同一不等式对偶给出，$\\theta_0$ 落在 $1-\\alpha$ 置信区间内当且仅当水平 $\\alpha$ 的检验不拒绝 $H_0:\\theta=\\theta_0$；单侧同理。"}},{"no":67,"star":3,"title":"原假设 vs 备择假设","ch":7,"sections":[{"name":"一句话","body":"原假设是\"受保护的、要被检验的\"，备择假设是\"我们想证明的\"。"},{"name":"得分点","body":"> 原假设 $H_0$ 是关于总体参数的待检验命题，通常取\"无差异\"\"无效应\"\"符合标准\"的表述，处于被保护地位；备择假设 $H_1$ 是与 $H_0$ 对立的命题，通常是研究者希望证实的结论。假设检验的逻辑是\"反证法 + 小概率原理\"：假定 $H_0$ 成立，若观测结果是小概率事件，则拒绝 $H_0$，否则不拒绝。注意：检验结果只有\"拒绝 $H_0$\"与\"不拒绝 $H_0$\"，**不存在\"接受 $H_0$\"**——不拒绝只说明证据不足。$H_0$ 与 $H_1$ 必须互斥且完备（$\\Theta_0\\cup\\Theta_1=\\Theta$）。"},{"name":"钩子","body":"只拒绝、不接受。"}],"one":"原假设是\"受保护的、要被检验的\"，备择假设是\"我们想证明的\"。","hook":"只拒绝、不接受。","bx":{"a":"原假设 $H_0$：待检验的命题，通常取「无差异、无效应、符合标准」，处于被保护地位。","b":"备择假设 $H_1$：与 $H_0$ 对立、研究者希望证实的命题。","diff":["地位：受保护、默认成立 / 要被证据支持；","结论：只能「拒绝」或「不拒绝」/ 拒绝 $H_0$ 即接受 $H_1$；","关系：互斥且完备（$\\Theta_0\\cup\\Theta_1=\\Theta$）。"],"link":"检验逻辑是「反证法 + 小概率原理」：假定 $H_0$ 成立，若观测到的是小概率事件就拒绝它；正因为是反证，所以**永远没有「接受 $H_0$」**，只有「证据不足，不拒绝」。","ex":"检验新药是否有效：$H_0:\\mu=\\mu_0$（无效）、$H_1:\\mu>\\mu_0$；算出 $p<0.05$ 才敢说「有效」。"},"bx2":{"def":"原假设 $H_0$ 是待检验的命题，通常取无差异、无效应或符合标准的情形；备择假设 $H_1$ 是与 $H_0$ 对立的命题，是研究者希望证实的结论。","diff":"$H_0$ 处于被保护地位、默认成立，只有证据充分时才被拒绝；$H_1$ 需要证据支持，拒绝 $H_0$ 即接受 $H_1$；两者的参数空间互斥且并为整个参数空间。","link":"检验采用反证法与小概率原理，先假定 $H_0$ 成立，若样本落入小概率的拒绝域则拒绝它；因此结论只有拒绝与不拒绝两种，不存在接受 $H_0$。"}},{"no":68,"star":3,"title":"第一类错误 vs 第二类错误（及为什么只控制 $\\alpha$）","ch":7,"sections":[{"name":"一句话","body":"弃真 vs 存伪；$\\alpha$ 可控，$\\beta$ 只能间接降。"},{"name":"定义卡","body":"- 第一类错误（弃真）：$H_0$ 真却拒绝，$P=\\alpha$。\n- 第二类错误（存伪）：$H_0$ 假却不拒绝，$P=\\beta$。\n- 功效（势）：$1-\\beta=P(\\text{拒绝}H_0\\mid H_0\\text{假})$。"},{"name":"对比表","body":"| 维度 | 第一类错误 $\\alpha$ | 第二类错误 $\\beta$ |\n|---|---|---|\n| 情形 | 弃真 | 存伪 |\n| 可控性 | 可直接给定（显著性水平） | 不能直接控制，随 $\\alpha$、$n$、效应量变化 |\n| 减小办法 | 减小 $\\alpha$ | 增大 $n$、增大效应量、放宽 $\\alpha$ |"},{"name":"得分点","body":"> 第一类错误是\"原假设为真却被拒绝\"（弃真），其概率记为 $\\alpha$，即显著性水平；第二类错误是\"原假设为假却未被拒绝\"（存伪），概率记为 $\\beta$；$1-\\beta$ 称为检验的功效（势），表示正确拒绝错误原假设的能力。二者此消彼长：在样本量固定时，减小 $\\alpha$ 必然增大 $\\beta$，故不能同时降低。实际中优先控制第一类错误，因为\"无病诊断成有病\"的代价通常更高，故先给定 $\\alpha$ 再选择使 $\\beta$ 尽量小的检验（最大功效检验）。同时降低两类错误的唯一办法是增大样本量 $n$。"},{"name":"钩子","body":"弃真优先控，存伪靠加样本。"}],"one":"弃真 vs 存伪；$\\alpha$ 可控，$\\beta$ 只能间接降。","hook":"弃真优先控，存伪靠加样本。","bx":{"a":"第一类错误（弃真）：$H_0$ 为真却拒绝，概率 $\\alpha$，即显著性水平。","b":"第二类错误（存伪）：$H_0$ 为假却不拒绝，概率 $\\beta$；$1-\\beta$ 称功效（势）。","diff":["错误方向：弃真 / 存伪；","可控性：可直接设定 $\\alpha$ / 不能直接控制，随 $\\alpha,n$、效应量变；","减小办法：减小 $\\alpha$ / 增大 $n$、增大效应量。"],"link":"样本量固定时二者此消彼长（减小 $\\alpha$ 必然增大 $\\beta$），故实践中先控第一类错误（把「无病诊断成有病」的代价设得更高），再在给定 $\\alpha$ 下选使 $\\beta$ 最小的检验；同时降低两类错误的唯一办法是增大样本量。","ex":"$\\alpha=0.05$ 时若 $\\beta=0.2$，功效 $1-\\beta=0.8$；把 $n$ 翻倍可让 $\\beta$ 降到 0.05 左右而 $\\alpha$ 不变。"},"bx2":{"def":"$H_0$ 为真却被拒绝称第一类错误，其概率记为 $\\alpha$，即显著性水平；$H_0$ 为假却未被拒绝称第二类错误，其概率记为 $\\beta$，而 $1-\\beta$ 称为检验的功效。","diff":"前者是弃真，后者是存伪；$\\alpha$ 可由研究者事先设定并直接控制，$\\beta$ 不能直接设定，它随 $\\alpha$、样本量与真实参数值而变。","link":"样本量固定时 $\\alpha$ 减小必使 $\\beta$ 增大，二者此消彼长；同时降低两者的唯一办法是增大样本量，故实践中只控 $\\alpha$，再选 $\\beta$ 最小的检验。"}},{"no":69,"star":3,"title":"显著性水平 $\\alpha$ vs p 值","ch":7,"sections":[{"name":"一句话","body":"$\\alpha$ 是事先给定的门槛，$p$ 值是由样本算出的\"证据强度\"。"},{"name":"对比表","body":"| 维度 | 显著性水平 $\\alpha$ | $p$ 值 |\n|---|---|---|\n| 给定时间 | 检验前，人为选定 | 检验后，由样本算出 |\n| 含义 | 允许犯第一类错误的最大概率 | $H_0$ 成立时，出现当前或更极端结果的概率 |\n| 判定 | $p\\le\\alpha$ 拒绝 | — |\n| 数值 | 固定（0.05、0.01） | 随样本变，越小越有理由拒绝 |"},{"name":"得分点","body":"> 显著性水平 $\\alpha$ 是检验前人为设定的、允许犯第一类错误的最大概率，是判定标准；$p$ 值是在原假设成立的前提下，出现当前观测结果或更极端结果的概率，反映样本对 $H_0$ 的不利证据强度，越小越有理由拒绝 $H_0$。判定规则：$p\\le\\alpha$ 则拒绝 $H_0$。$p$ 值的优点是给出了比\"拒绝/不拒绝\"更细的信息，便于不同水平下比较；但 $p$ 值**不是**\"$H_0$ 为真的概率\"，也**不是**\"犯第一类错误的概率\"，这是最常见的错误表述。"},{"name":"钩子","body":"$\\alpha$ 先定后比，$p$ 后算再比。"}],"one":"$\\alpha$ 是事先给定的门槛，$p$ 值是由样本算出的\"证据强度\"。","hook":"$\\alpha$ 先定后比，$p$ 后算再比。","bx":{"a":"显著性水平 $\\alpha$：检验**前**人为设定的门槛，是允许犯第一类错误的最大概率。","b":"$p$ 值：检验**后**由样本算出的概率，指 $H_0$ 成立时出现当前或更极端结果的概率。","diff":["时点：事前给定 / 事后计算；","数值：固定（0.05、0.01）/ 随样本变；","判定：$p\\le\\alpha$ 则拒绝 $H_0$。"],"link":"$p$ 值是「证据强度」，$\\alpha$ 是「判断标准」，两者必须比较才有结论；$p$ 值**不是**「$H_0$ 为真的概率」，也**不是**「犯第一类错误的概率」——这是最常见的错误表述。","ex":"算得 $p=0.03$：在 $\\alpha=0.05$ 下拒绝 $H_0$，在 $\\alpha=0.01$ 下不拒绝——同一数据、不同标准，结论可以不同。"},"bx2":{"def":"显著性水平 $\\alpha$ 是检验之前人为给定的门槛，即允许犯第一类错误的最大概率；$p$ 值是由样本算出的概率，指 $H_0$ 成立时得到当前或更极端结果的概率。","diff":"$\\alpha$ 在抽样前确定且取值固定，$p$ 值在抽样后算出并随样本变化；$\\alpha$ 是判断标准，$p$ 值是证据强度，二者比较之后才能作出结论。","link":"当 $p\\le\\alpha$ 时拒绝 $H_0$，否则不拒绝；须注意 $p$ 值既不是 $H_0$ 为真的概率，也不是犯第一类错误的概率，同一数据在不同 $\\alpha$ 下结论可以不同。"}},{"no":70,"star":2,"title":"双侧检验 vs 单侧检验","ch":7,"sections":[{"name":"得分点","body":"> 双侧检验的备择假设为 $\\theta\\neq\\theta_0$，拒绝域位于统计量分布的两侧尾部（各 $\\alpha/2$），用于检验\"是否有差异\"；单侧检验的备择假设为 $\\theta>\\theta_0$ 或 $\\theta<\\theta_0$，拒绝域全部集中在一侧（整个 $\\alpha$ 放一侧），用于检验\"是否更大/更小\"。选择依据是研究目的，而非数据：想看有无差异用双侧，想证实偏大或偏小用单侧。注意同一数据下，单侧检验的 $p$ 值是双侧的一半，更易显著；不能看到数据偏向一侧后再改为单侧（那是数据驱动，属不规范做法）。"},{"name":"钩子","body":"双侧看差异，单侧看方向。"}],"one":"","hook":"双侧看差异，单侧看方向。","bx":{"a":"双侧检验：$H_1:\\theta\\neq\\theta_0$，拒绝域在两尾，各 $\\alpha/2$。","b":"单侧检验：$H_1:\\theta>\\theta_0$ 或 $\\theta<\\theta_0$，整个 $\\alpha$ 放一侧。","diff":["拒绝域位置：两侧各半 / 全在一侧；","同数据下 $p$ 值：单侧是双侧的一半；","适用：只看有无差异 / 要看方向。"],"link":"选择依据是**研究目的**，不是数据：先定单双侧再做检验；绝不能看到数据偏向一侧后改成单侧（那是数据驱动，属学术不端，也破坏 $\\alpha$ 的意义）。","ex":"$z=1.8$：双侧 $p=2\\times0.0359=0.0718>0.05$ 不拒绝；单侧 $p=0.0359<0.05$ 拒绝——同一 $z$、结论相反。"},"bx2":{"def":"双侧检验的备择假设为 $H_1:\\theta\\ne\\theta_0$，拒绝域对称地分居分布两侧；单侧检验备择假设为 $H_1:\\theta>\\theta_0$ 或 $\\theta<\\theta_0$，拒绝域只在分布一侧。","diff":"双侧把显著性水平平分为两尾各 $\\alpha/2$，单侧把全部 $\\alpha$ 放在一侧；同一数据下双侧 $p$ 值是单侧的两倍，故单侧更容易拒绝 $H_0$。","link":"单双侧须由研究目的在收集数据之前确定，不得看了数据偏向一侧再改成单侧；同一统计量下二者临界值不同，对应的 $p$ 值也不可混用。"}},{"no":71,"star":2,"title":"拒绝域 vs 接受域（\"接受\"是措辞陷阱）","ch":7,"sections":[{"name":"得分点","body":"> 拒绝域是检验统计量取值中使 $H_0$ 被拒绝的区域，其大小由显著性水平 $\\alpha$ 决定，边界值称为临界值；与之互补的是\"不拒绝域\"（习惯称接受域）。由于假设检验的结论只能是\"拒绝 $H_0$\"或\"不拒绝 $H_0$\"，把后者说成\"接受 $H_0$\"是不严谨的：不拒绝仅表示样本证据不足以推翻 $H_0$，并不证明 $H_0$ 为真（可能只是样本量不够、功效不足）。答题时应写\"不拒绝原假设\"或\"没有充分理由拒绝原假设\"，这与区间估计的对偶性也一致。"},{"name":"钩子","body":"说\"不拒绝\"，不说\"接受\"。"}],"one":"","hook":"说\"不拒绝\"，不说\"接受\"。","bx":{"a":"拒绝域 $W$：统计量取值中使 $H_0$ 被拒绝的区域，大小由 $\\alpha$ 决定，边界叫临界值。","b":"接受域（更准确叫「不拒绝域」）$\\bar W$：拒绝域的补集，$H_0$ 不被拒绝的区域。","diff":["结论表述：拒绝 $H_0$ / **不拒绝** $H_0$；","严格性：「拒绝」是有证据 / 「不拒绝」只是证据不足；","不能说「接受 $H_0$」——那只说明没找到反证。"],"link":"两者互补、合起来是整个统计量空间；由于检验是反证逻辑，$\\bar W$ 里只是「没有充分理由拒绝」，并不证明 $H_0$ 为真（可能只是样本量不够、功效不足）。","ex":"$\\bar x=4.9$、临界值 5.1：落在不拒绝域，应写「不拒绝 $H_0:\\mu=5$」，不能写「接受 $\\mu=5$」。"},"bx2":{"def":"拒绝域 $W$ 是统计量取值中使 $H_0$ 被拒绝的区域，其大小由显著性水平 $\\alpha$ 决定；接受域 $\\bar W$ 是 $W$ 的补集，即 $H_0$ 不被拒绝的区域。","diff":"落入 $W$ 时结论为拒绝 $H_0$，落入 $\\bar W$ 时只能说没有充分理由拒绝；前者是有证据支持 $H_1$，后者只是证据不足，并不等于 $H_0$ 为真。","link":"二者互补且并为整个统计量取值空间，分界点即临界值；由于检验是反证逻辑，$\\bar W$ 中不拒绝 $H_0$ 可能仅因样本量不足或功效偏低。"}},{"no":72,"star":2,"title":"功效函数（势函数）","ch":7,"sections":[{"name":"得分点","body":"> 检验的功效函数定义为 $g(\\theta)=P_\\theta(\\text{拒绝 }H_0)$，它是参数 $\\theta$ 的函数：当 $\\theta\\in\\Theta_0$ 时 $g(\\theta)\\le\\alpha$ 即犯第一类错误的概率；当 $\\theta\\in\\Theta_1$ 时 $g(\\theta)=1-\\beta$ 即功效。理想的检验应满足：对 $\\theta\\in\\Theta_0$，$g(\\theta)$ 不超过 $\\alpha$；对 $\\theta\\in\\Theta_1$，$g(\\theta)$ 尽可能大（越接近 1 越好），且随 $|\\theta-\\theta_0|$ 增大而增大（无偏检验）。在水平 $\\alpha$ 下使功效一致最大的检验称一致最大功效检验（UMP）。"},{"name":"钩子","body":"功效函数画出\"拒绝的概率曲线\"，水平看左侧、功效看右侧。"}],"one":"","hook":"功效函数画出\"拒绝的概率曲线\"，水平看左侧、功效看右侧。","bx":{"a":"功效函数 $g(\\theta)=P_\\theta(\\text{拒绝 }H_0)$：把「拒绝的概率」写成参数 $\\theta$ 的函数。","b":"功效（势）$1-\\beta=P(\\text{拒绝}H_0\\mid H_0\\text{假})$：功效函数在 $\\Theta_1$ 上的取值。","diff":["定义域：全部 $\\Theta$ / 只在备择域 $\\Theta_1$；","在 $\\Theta_0$ 上 $g(\\theta)\\le\\alpha$（即犯第一类错误的概率）/ 在 $\\Theta_1$ 上 $g(\\theta)=1-\\beta$；","一个是整条曲线，一个是曲线右半段的值。"],"link":"功效函数是一条完整曲线：左段（$\\Theta_0$）被 $\\alpha$ 压住，右段（$\\Theta_1$）越高越好；理想的检验是左段处处 $\\le\\alpha$、右段尽量接近 1，这正是一致最大功效检验（UMP）的判据。","ex":"$H_0:\\mu=0$ 对 $H_1:\\mu>0$，$\\alpha=0.05$：$g(0)=0.05$；当真值 $\\mu=1$ 时 $g(1)=0.87$，即功效 87%。"},"bx2":{"def":"功效函数 $g(\\theta)$ 定义为参数真值为 $\\theta$ 时拒绝 $H_0$ 的概率；功效 $1-\\beta$ 是 $H_0$ 为假时拒绝它的概率，即它在备择域 $\\Theta_1$ 上的取值。","diff":"功效函数的定义域是整个参数空间，功效只取备择域上的一段；在 $\\Theta_0$ 上 $g(\\theta)\\le\\alpha$，在 $\\Theta_1$ 上 $g(\\theta)=1-\\beta$，后者越大越好。","link":"功效函数是一条完整曲线，左段被 $\\alpha$ 压住、右段越接近 1 越好；一致最大功效检验即要求该曲线在 $\\Theta_1$ 上处处不小于同水平其他检验的功效函数。"}},{"no":73,"star":2,"title":"参数检验 vs 非参数检验","ch":7,"sections":[{"name":"得分点","body":"> 参数检验假定总体分布类型已知（如正态），只对未知参数（$\\mu,\\sigma^2$）作假设，如 $t$ 检验、$F$ 检验；非参数检验不假定总体分布的具体形式，只对分布的一般特征（中位数、对称性、独立性）作假设，如符号检验、秩和检验、游程检验、KS 检验、卡方拟合优度检验。非参数检验的优点是适用面广、对异常值稳健，缺点是若总体确实服从某分布，则功效低于对应的参数检验（信息利用不充分）。西大 432 真题以参数检验为主，非参数只需知道概念与典型方法名。"},{"name":"钩子","body":"知道分布用参数，不知道用秩和符号。"}],"one":"","hook":"知道分布用参数，不知道用秩和符号。","bx":{"a":"参数检验：假定总体分布类型已知（如正态），只对参数作假设，如 $t$ 检验、$F$ 检验。","b":"非参数检验：不假定分布形式，只对一般特征（中位数、对称性、独立性）作假设，如符号检验、秩和检验、游程检验、KS 检验、卡方拟合优度检验。","diff":["前提：分布类型已知 / 不需要；","信息利用：充分（功效高）/ 只用秩或符号（功效低）；","稳健性：对异常值敏感 / 稳健。"],"link":"两者的取舍是「效率 vs 稳健」：分布确实已知时参数检验功效更高；分布可疑或有异常值时才用非参数。西大 432 以参数检验为主，非参数只需记方法与典型场合。","ex":"比较两种工艺的产量，若产量近似正态用两样本 $t$ 检验；若分布明显偏态或有离群值，改用 Wilcoxon 秩和检验。"},"bx2":{"def":"参数检验假定总体分布类型已知，只对分布中的未知参数作假设，如 $t$ 检验与 $F$ 检验；非参数检验不假定分布形式，只对中位数、对称性、独立性等一般特征作假设。","diff":"参数检验依赖分布已知这一前提，充分利用样本信息，功效较高但对异常值敏感；非参数检验只用秩或符号信息，前提宽松且稳健，代价是功效偏低。","link":"二者取舍在于效率与稳健的权衡，正态总体下秩和检验相对 $t$ 检验的渐近效率为 $3/\\pi\\approx0.955$，故分布已知时优先用参数检验。"}},{"no":74,"star":1,"title":"似然比检验","ch":7,"sections":[{"name":"得分点","body":"> 设 $H_0:\\theta\\in\\Theta_0$ 与 $H_1:\\theta\\in\\Theta_1$，似然比统计量 $\\Lambda=\\dfrac{\\sup_{\\theta\\in\\Theta_0}L(\\theta)}{\\sup_{\\theta\\in\\Theta}L(\\theta)}$，取值 $[0,1]$，$\\Lambda$ 越小越倾向于拒绝 $H_0$。在大样本下 $-2\\ln\\Lambda\\approx\\chi^2(k)$（$k$ 为自由度之差），可用于构造检验。似然比检验的思想是\"比较约束模型与无约束模型的最大似然值能差多少\"，是最一般的检验构造方法，$t$ 检验、$F$ 检验、卡方检验都是其特例。"},{"name":"钩子","body":"两个最大似然值之比，就是似然比。"}],"one":"","hook":"两个最大似然值之比，就是似然比。","bx":{"a":"似然比统计量 $\\Lambda=\\dfrac{\\sup_{\\theta\\in\\Theta_0}L(\\theta)}{\\sup_{\\theta\\in\\Theta}L(\\theta)}$：约束下最大似然与无约束最大似然之比，取值 $[0,1]$。","b":"渐近统计量 $-2\\ln\\Lambda$：大样本下近似服从 $\\chi^2(k)$，$k$ 为自由度之差。","diff":["形式：比值 / 对数比；","分布：一般无精确分布 / 有渐近卡方分布；","判定方向：$\\Lambda$ 越小越拒绝 / $-2\\ln\\Lambda$ 越大越拒绝。"],"link":"二者是同一检验的两副面孔：$-2\\ln\\Lambda$ 把比值变成「卡方量」才能查表；当 $H_0$ 是简单假设时，它正是似然比检验的常用形式。","ex":"$H_0:\\theta=\\theta_0$ 对 $H_1:\\theta\\neq\\theta_0$，算得 $\\Lambda=0.82$：$-2\\ln\\Lambda=0.397$，与 $\\chi^2(1)$ 的临界值 3.84 比，不拒绝。"},"bx2":{"def":"似然比统计量 $\\Lambda$ 定义为约束下最大似然与无约束最大似然之比，取值介于 0 与 1 之间；检验时取其对数变换 $-2\\ln\\Lambda$ 作为统计量。","diff":"$\\Lambda$ 越小说明约束越不合理，越倾向拒绝 $H_0$；$-2\\ln\\Lambda$ 则越大越拒绝；前者一般没有精确分布，后者在大样本下渐近服从卡方分布。","link":"由 Wilks 定理，$H_0$ 下 $-2\\ln\\Lambda$ 渐近服从 $\\chi^2(k)$，$k$ 为两参数空间维数之差；实际检验即先取对数比再查卡方表。"}},{"no":75,"star":2,"title":"卡方拟合优度检验 vs 列联表独立性检验","ch":7,"sections":[{"name":"一句话","body":"都是卡方，但自由度算法与检验对象不同。\n\n| 检验 | 原假设 | 统计量 | 自由度 |\n|---|---|---|---|\n| 拟合优度 | 总体服从某指定分布 | $\\chi^2=\\sum\\dfrac{(O_i-E_i)^2}{E_i}$ | $k-1-m$ |\n| 独立性 | 两分类变量独立 | $\\chi^2=\\sum\\dfrac{(O_{ij}-E_{ij})^2}{E_{ij}}$ | $(r-1)(c-1)$ |"},{"name":"得分点","body":"> 拟合优度检验用于判断样本是否来自某个指定分布，先把数据分成 $k$ 组，算理论频数 $E_i=np_i$，统计量 $\\chi^2=\\sum\\frac{(O_i-E_i)^2}{E_i}$ 近似服从 $\\chi^2(k-1-m)$，其中 $m$ 为由样本估计的参数个数（参数需估计时每估一个减 1 个自由度）。独立性检验用于列联表，检验两个分类变量是否独立，理论频数 $E_{ij}=\\frac{n_{i\\cdot}n_{\\cdot j}}{n}$，自由度 $(r-1)(c-1)$。二者前提都是 $E_i\\ge5$（否则需合并组）。注意自由度差异是两者最容易被扣分的点。"},{"name":"钩子","body":"拟合减参数，列联乘行列。"}],"one":"都是卡方，但自由度算法与检验对象不同。\n\n| 检验 | 原假设 | 统计量 | 自由度 |\n|---|---|---|---|\n| 拟合优度 | 总体服从某指定分布 | $\\chi^2=\\sum\\dfrac{(O_i-E_i)^2}{E_i}$ | $k-1-m$ |\n| 独立性 | 两分类变量独立 | $\\chi^2=\\sum\\dfrac{(O_{ij}-E_{ij})^2}{E_{ij}}$ | $(r-1)(c-1)$ |","hook":"拟合减参数，列联乘行列。","bx":{"a":"拟合优度检验：$H_0$ 为「总体服从某指定分布」，$\\chi^2=\\sum\\dfrac{(O_i-E_i)^2}{E_i}$，$df=k-1-m$。","b":"列联表独立性检验：$H_0$ 为「两分类变量独立」，$\\chi^2=\\sum\\dfrac{(O_{ij}-E_{ij})^2}{E_{ij}}$，$df=(r-1)(c-1)$。","diff":["检验对象：一个变量的分布 / 两个变量的关系；","理论频数：$E_i=np_i$ / $E_{ij}=\\dfrac{n_{i\\cdot}n_{\\cdot j}}{n}$；","自由度：$k-1-m$（$m$ 为估计的参数个数）/ $(r-1)(c-1)$。"],"link":"两者用的是同一个卡方统计量形式（观测与理论之差的加权平方和），都要求 $E\\ge5$（否则合并组）；区别只在「理论频数怎么算、自由度怎么数」，这也是最容易混的两处。","ex":"掷骰子 60 次检验均匀（$k=6$）：$df=5$；$2\\times3$ 列联表检验性别与偏好是否独立：$df=(2-1)(3-1)=2$。"},"bx2":{"def":"拟合优度检验的原假设是总体服从某指定分布，统计量由各组 $(O_i-E_i)^2/E_i$ 求和；列联表独立性检验的原假设是两分类变量独立，统计量由各格 $(O_{ij}-E_{ij})^2/E_{ij}$ 求和。","diff":"前者只涉及一个变量，理论频数由 $E_i=np_i$ 算出，自由度为 $k-1-m$，$m$ 为用样本估计的参数个数；后者涉及两个变量，理论频数由行和与列和算出，自由度为 $(r-1)(c-1)$。","link":"两者共用同一卡方形式，即观测频数与理论频数之差的加权平方和，且都要求各格理论频数不小于 5，否则需合并组；差别只在理论频数的算法与自由度的数法。"}},{"no":76,"star":1,"title":"正态性检验（W 检验、KS 检验、偏度峰度检验）","ch":7,"sections":[{"name":"得分点","body":"> 正态性检验的原假设为\"总体服从正态分布\"。常用方法：①W 检验（Shapiro-Wilk，小样本 $n<50$ 首选）；②KS 检验（大样本，需参数已知或作估计修正）；③偏度—峰度检验：正态的偏度为 0、峰度为 3，用样本偏度 $G_1$、峰度 $G_2$ 构造统计量，大样本下近似正态；④图示法：Q-Q 图、P-P 图，点近似在直线上则接受正态。注意正态性检验的结论同样是\"不拒绝\"而非\"证明服从正态\"。"},{"name":"钩子","body":"小样本 W，大样本 KS，图示看 Q-Q。"}],"one":"","hook":"小样本 W，大样本 KS，图示看 Q-Q。","bx":{"a":"正态性检验（W 检验、KS 检验、偏度-峰度检验）：给出「是否拒绝正态」的统计判断。","b":"图示法（Q-Q 图、P-P 图）：把样本分位数与理论分位数对照，用眼睛判断。","diff":["输出：$p$ 值与结论 / 图形；","样本量适配：W 适合 $n<50$，KS 适合大样本 / 任意 $n$ 都能看；","客观性：可量化 / 依赖读图经验。"],"link":"两者互补：图示法先看形状（是否有系统弯曲、离群点），检验法再给量化结论；都要记住结论只能是「不拒绝正态」，不能「证明服从正态」。","ex":"$n=30$ 的残差：W 检验 $p=0.42$ 不拒绝正态；Q-Q 图上点基本落在 $y=x$ 直线上，两个证据一致。"},"bx2":{"def":"正态性检验用统计量对「样本是否来自正态总体」给出可量化的判断，如 W 检验、KS 检验与偏度峰度检验；图示法把样本分位数与理论分位数对照，由散点走向目测判断。","diff":"W 检验对 $n<50$ 的小样本较灵敏，KS 检验基于经验分布函数、适用于大样本；前者输出 $p$ 值与结论，后者输出图形，判读依赖读图经验。","link":"各法的原假设同为「样本来自正态总体」，故只能拒绝、不能证明；$n$ 很大时检验对微小偏离也判显著，此时须回到图上判断偏离是否实质。"}},{"no":77,"star":3,"title":"方差分析 vs 回归分析","ch":8,"sections":[{"name":"一句话","body":"方差分析看\"分类变量对均值有无影响\"，回归分析看\"数值变量间的依赖关系\"。"},{"name":"对比表","body":"| 维度 | 方差分析 | 回归分析 |\n|---|---|---|\n| 自变量 | 分类（因素） | 数值（连续） |\n| 因变量 | 数值，均值 | 数值 |\n| 目标 | 检验各组均值是否相等 | 建立方程用于预测 |\n| 共同点 | 都是线性模型，都用 $F$ 检验、平方和分解 | 同左 |"},{"name":"得分点","body":"> 方差分析研究一个或多个分类因素（水平）对数值型因变量的影响是否显著，本质是检验各水平下总体均值是否相等，把总平方和分解为组间（因素）平方和与组内（误差）平方和，用 $F=\\frac{MSA}{MSE}$ 检验；回归分析研究数值型自变量与因变量之间的依赖关系，建立回归方程并检验其显著性，用于预测与控制。二者统一于线性模型：方差分析可看作自变量为虚拟变量（0-1）的回归，两水平时方差分析的 $F$ 值等于两样本 $t$ 检验的 $t$ 值的平方。区别在于自变量类型与分析目的。"},{"name":"钩子","body":"分类看均值，连续看斜率。"}],"one":"方差分析看\"分类变量对均值有无影响\"，回归分析看\"数值变量间的依赖关系\"。","hook":"分类看均值，连续看斜率。","bx":{"a":"方差分析：自变量是**分类**因素（水平），检验各组均值是否相等，用 $F=\\dfrac{MSA}{MSE}$。","b":"回归分析：自变量是**数值**变量，建立方程 $\\hat y=\\hat a+\\hat bx$ 用于预测与控制。","diff":["自变量类型：分类（虚拟变量）/ 连续；","目标：比较均值 / 刻画依赖关系；","输出：$F$ 检验结论与多重比较 / 回归系数与 $R^2$。"],"link":"二者统一于线性模型：方差分析就是自变量取 0-1 虚拟变量的回归；两水平时 $F=t^2$，结论完全一致；平方和分解 $SST=SSA+SSE$ 与回归的 $SST=SSR+SSE$ 是同一套分解。","ex":"三种饲料对增重的影响：分类因素 3 水平 → 方差分析；若同时记录初始体重，则用回归（协方差分析）控制它。"},"bx2":{"def":"方差分析把自变量取为分类因素的水平，用 $F=MSA/MSE$ 检验各组均值是否相等；回归分析把自变量取为数值变量，建立 $\\hat y=\\hat a+\\hat bx$ 刻画条件均值并用于预测。","diff":"前者回答各组均值是否相等，输出 $F$ 值与多重比较；后者回答 $y$ 如何随 $x$ 变化，输出回归系数与 $R^2$，并可对给定 $x$ 预测。","link":"二者同属线性模型：$r$ 水平的单因素方差分析等价于取 $r-1$ 个 0-1 虚拟变量的回归，$SST=SSA+SSE$ 与 $SST=SSR+SSE$ 同构，两水平时 $F=t^2$。"}},{"no":78,"star":2,"title":"相关分析 vs 回归分析","ch":8,"sections":[{"name":"一句话","body":"相关是对称的\"有没有关系\"，回归是有方向的\"怎么影响\"。"},{"name":"得分点","body":"> 相关分析研究两个变量之间是否存在线性关联及其强度，用相关系数 $r$ 度量，$r$ 对两变量对称，且不区分自变量与因变量；回归分析要建立因变量对自变量的依赖方程 $\\hat y=\\hat a+\\hat bx$，有明确的方向（谁是自变量、谁是因变量），并可用于预测。二者联系：一元线性回归中 $r$ 与 $\\hat b$ 同号，且 $R^2=r^2$，即回归平方和占总平方和的比例等于相关系数的平方；但\"相关不等于因果\"，回归系数也不能直接解释为因果效应。"},{"name":"钩子","body":"相关无方向，回归有箭头。"}],"one":"相关是对称的\"有没有关系\"，回归是有方向的\"怎么影响\"。","hook":"相关无方向，回归有箭头。","bx":{"a":"相关分析：用相关系数 $r$ 度量两变量的线性关联强度，对 $X,Y$ **对称**、不分主次。","b":"回归分析：建立 $\\hat y=\\hat a+\\hat bx$，有明确的**方向**（谁是自变量），可用于预测。","diff":["对称性：对称 / 有方向；","输出：一个数 $r\\in[-1,1]$ / 一条直线与系数；","能否预测：不能 / 能。"],"link":"一元线性回归中 $r$ 与 $\\hat b$ 同号且 $R^2=r^2$，故「相关强弱」与「回归解释比例」是同一件事的两种说法；但「相关不等于因果」，回归系数也不能直接当因果效应。","ex":"$r=0.9$：相关很强；回归得 $\\hat y=2+1.5x$，$R^2=0.81$——只能说 $x$ 解释了 81% 的变异，不能说 $x$ 导致 $y$。"},"bx2":{"def":"相关分析用相关系数 $r$ 度量两变量线性关联的强弱与方向，对 $X,Y$ 地位对称；回归分析建立 $\\hat y=\\hat a+\\hat bx$，须先指定自变量与因变量，用于预测与控制。","diff":"交换 $X,Y$ 时 $r$ 不变，回归系数 $\\hat b=L_{xy}/L_{xx}$ 却随之改变；$r$ 只描述伴随强度，回归还要求误差零均值、等方差才有预测意义。","link":"一元回归中 $\\hat b$ 与 $r$ 同号且 $R^2=r^2$，故相关强弱与回归解释比例是同一事实的两种表述；但二者都只刻画伴随关系，不能推出因果。"}},{"no":79,"star":1,"title":"单因子方差分析 vs 两样本 $t$ 检验","ch":8,"sections":[{"name":"得分点","body":"> 单因子方差分析用于比较 $r\\ge2$ 个水平下均值是否相等，$r=2$ 时它与两独立样本 $t$ 检验（等方差）完全等价：$F(1,n-2)=t^2(n-2)$，结论一致。之所以推广到方差分析，是因为对 $r\\ge3$ 组两两做 $t$ 检验会导致第一类错误累积膨胀（犯至少一次错误的概率为 $1-(1-\\alpha)^{\\binom{r}{2}}$），而方差分析用一个整体 $F$ 检验先把关，再作多重比较。前提不同：$t$ 检验对两组，方差分析对多组，但都要求正态性、独立性、方差齐性。"},{"name":"钩子","body":"两组用 $t$，多组用 $F$，本质是同一个 $t^2$。"}],"one":"","hook":"两组用 $t$，多组用 $F$，本质是同一个 $t^2$。","bx":{"a":"单因子方差分析：比较 $r\\ge2$ 个水平的均值是否相等，$F=\\dfrac{MSA}{MSE}$。","b":"两独立样本 $t$ 检验：只比较两组均值，$t=\\dfrac{\\bar x_1-\\bar x_2}{s_p\\sqrt{1/n_1+1/n_2}}$。","diff":["组数：$r\\ge2$ / 恰好 2；","等价关系：$r=2$ 时 $F(1,n-2)=t^2(n-2)$，结论完全一致；","多组时：方差分析一个 $F$ 先把关，再多重比较。"],"link":"两者本质相同（都是「组间变异 / 组内变异」），方差分析是 $t$ 检验的推广；之所以 $r\\ge3$ 不能两两做 $t$，是因为比较次数增多会让第一类错误累积膨胀到 $1-(1-\\alpha)^{\\binom{r}{2}}$。","ex":"$r=3$、每组 10 人：若两两做 $t$ 共 3 次，$\\alpha=0.05$ 时族错误率升到 $1-0.95^3=0.143$；用方差分析则整体仍控制 0.05。"},"bx2":{"def":"单因子方差分析在 $r\\ge2$ 个水平下检验 $H_0:\\mu_1=\\cdots=\\mu_r$，统计量 $F=MSA/MSE$；两样本 $t$ 检验只比较两组均值，用合并方差 $s_p^2$ 构造 $t$ 统计量。","diff":"前者容纳 $r\\ge3$ 组，一次 $F$ 检验即控制整体显著性水平；后者每次只比较一对均值，比较次数一多，族错误率就明显超过名义 $\\alpha$。","link":"$r=2$ 时 $F(1,n-2)=t^2(n-2)$，两法完全等价，方差分析就是 $t$ 检验的推广；组数更多时若逐对做 $t$，族错误率按 $1-(1-\\alpha)^m$ 上升，须先做 $F$ 检验再定位差异。"}},{"no":80,"star":2,"title":"平方和分解：$SST=SSA+SSE$","ch":8,"sections":[{"name":"得分点","body":"> $SST=\\sum_{i=1}^{r}\\sum_{j=1}^{n_i}(x_{ij}-\\bar x_{\\cdot\\cdot})^2$（总平方和，自由度 $n-1$），$SSA=\\sum_{i=1}^{r}n_i(\\bar x_{i\\cdot}-\\bar x_{\\cdot\\cdot})^2$（组间/因素平方和，自由度 $r-1$），$SSE=\\sum_i\\sum_j(x_{ij}-\\bar x_{i\\cdot})^2$（组内/误差平方和，自由度 $n-r$），且 $SST=SSA+SSE$，自由度同样相加。检验统计量 $F=\\dfrac{SSA/(r-1)}{SSE/(n-r)}\\sim F(r-1,n-r)$（$H_0$ 成立时）。方差分析表须列：来源、平方和、自由度、均方、$F$ 值、$p$ 值。方差齐性、正态性、独立性是三项基本假定。"},{"name":"钩子","body":"总 = 组间 + 组内，自由度也相加。"}],"one":"","hook":"总 = 组间 + 组内，自由度也相加。","bx":{"a":"平方和分解 $SST=SSA+SSE$：总变异 = 组间（因素）+ 组内（误差）。","b":"自由度分解 $n-1=(r-1)+(n-r)$：与平方和一一对应。","diff":["分解对象：变异（平方和）/ 独立信息个数（自由度）；","对应关系：$SST\\leftrightarrow n-1$、$SSA\\leftrightarrow r-1$、$SSE\\leftrightarrow n-r$；","均方：$MSA=SSA/(r-1)$、$MSE=SSE/(n-r)$。"],"link":"两套分解必须同时成立才能算 $F$：$F=\\dfrac{SSA/(r-1)}{SSE/(n-r)}$ 的分子分母都是「平方和 ÷ 各自自由度」，这也解释了为什么自由度算错，$F$ 就必然错。","ex":"$r=3$、每组 $n_i=10$（$n=30$）：$df$ 为 $29=2+27$；若 $SSA=60,SSE=270$，则 $MSA=30,MSE=10,F=3$。"},"bx2":{"def":"平方和分解把总变异拆为组间（因素所致）与组内（误差）两部分，$SST=SSA+SSE$；自由度分解把独立信息个数拆开，$n-1=(r-1)+(n-r)$，与三个平方和逐项对应。","diff":"前者是代数量，来自 $\\sum(y_{ij}-\\bar y)^2$ 的恒等变形；后者是维数，来自各组均值与观测值所受的约束；平方和只有除以对应自由度才成均方。","link":"两套分解必须同时成立才能构造 $F=\\dfrac{SSA/(r-1)}{SSE/(n-r)}$：分子与分母都是平方和除以各自的自由度，自由度算错则 $F$ 必错，检验随之失效。"}},{"no":81,"star":2,"title":"决定系数 $R^2$ vs 相关系数 $r$","ch":8,"sections":[{"name":"一句话","body":"一元回归里 $R^2=r^2$，但 $R^2$ 能用于多元，$r$ 不能。"},{"name":"得分点","body":"> 决定系数 $R^2=\\dfrac{SSR}{SST}=1-\\dfrac{SSE}{SST}$，表示回归方程解释的变异占总变异的比例，取值 $[0,1]$，越大拟合越好；一元线性回归中 $R^2=r^2$，故二者一致。区别：$r$ 只适用于两个变量且对二者对称，取值 $[-1,1]$，能反映方向；$R^2$ 适用于多元回归，只反映解释比例、不含方向，且随自变量增多而单调不减，故多元比较需用调整 $R^2_{adj}=1-\\dfrac{SSE/(n-p-1)}{SST/(n-1)}$。注意 $R^2$ 高不代表模型正确（可能过拟合或伪回归）。"},{"name":"钩子","body":"$r$ 带方向，$R^2$ 只管解释了多少。"}],"one":"一元回归里 $R^2=r^2$，但 $R^2$ 能用于多元，$r$ 不能。","hook":"$r$ 带方向，$R^2$ 只管解释了多少。","bx":{"a":"决定系数 $R^2=\\dfrac{SSR}{SST}=1-\\dfrac{SSE}{SST}\\in[0,1]$：回归解释的变异比例。","b":"相关系数 $r\\in[-1,1]$：只用于两个变量，对称，带方向。","diff":["变量个数：多元也能用 / 只能两个；","符号：无方向 / 有正负；","单调性：随自变量增多单调不减 / —。"],"link":"一元回归中 $R^2=r^2$，故二者信息等价（$R^2$ 丢了方向）；多元时 $r$ 无法定义，只能用 $R^2$，且因「加变量必增 $R^2$」需用调整 $R^2_{adj}=1-\\dfrac{SSE/(n-p-1)}{SST/(n-1)}$。","ex":"$r=0.8$ 时 $R^2=0.64$；加一个无关变量后 $R^2$ 升到 0.66，但 $R^2_{adj}$ 反而下降——说明新变量没带来真信息。"},"bx2":{"def":"决定系数 $R^2=SSR/SST=1-SSE/SST$ 度量回归解释的变异占总变异的比例，取值于 $[0,1]$；相关系数 $r$ 度量两变量线性关联的强弱与方向，取值于 $[-1,1]$。","diff":"$R^2$ 无方向，可推广到多元，且随自变量增加单调不减；$r$ 有正负，只对两个变量有定义，交换 $X,Y$ 后数值不变，故它只是二元的量。","link":"一元回归中 $R^2=r^2$，两数信息等价而 $R^2$ 丢掉方向；多元时 $r$ 无定义，「加变量必增 $R^2$」使模型比较须改用 $R^2_{adj}$。"}},{"no":82,"star":2,"title":"残差 vs 误差（随机误差）","ch":8,"sections":[{"name":"一句话","body":"残差可观测，误差不可观测。"},{"name":"得分点","body":"> 随机误差 $\\varepsilon_i=y_i-E(y_i)$ 是观测值与理论均值之差，含未知参数，**不可观测**；残差 $e_i=y_i-\\hat y_i$ 是观测值与拟合值之差，由样本算得，**可观测**，是误差的估计。最小二乘估计使 $\\sum e_i^2$ 最小，且满足 $\\sum e_i=0$、$\\sum e_i x_i=0$（正规方程），故残差携带模型诊断信息：残差图可查异方差、非线性、异常点；残差平方和 $SSE=\\sum e_i^2$ 是 $\\sigma^2$ 的估计来源（$\\hat\\sigma^2=\\frac{SSE}{n-2}$）。答题时须点明\"误差是理论量、残差是经验量\"。"},{"name":"钩子","body":"误差在心里，残差在纸上。"}],"one":"残差可观测，误差不可观测。","hook":"误差在心里，残差在纸上。","bx":{"a":"随机误差 $\\varepsilon_i=y_i-E(y_i)$：观测值与理论均值之差，含未知参数，**不可观测**。","b":"残差 $e_i=y_i-\\hat y_i$：观测值与拟合值之差，由样本算得，**可观测**。","diff":["已知性：不可观测 / 可计算；","是否含未知参数：含 / 不含；","地位：模型假定 / 误差的估计与诊断工具。"],"link":"残差是误差的「替身」：最小二乘使 $\\sum e_i^2$ 最小，且满足 $\\sum e_i=0$、$\\sum e_ix_i=0$（正规方程），故残差图能查异方差、非线性与异常点，$\\hat\\sigma^2=\\dfrac{SSE}{n-2}$ 也是由残差估出来的。","ex":"模型 $\\hat y=2+1.5x$，观测 $(x,y)=(4,9)$：$\\hat y=8$，残差 $e=1$；而误差 $\\varepsilon=9-E(y\\mid x=4)$ 未知。"},"bx2":{"def":"随机误差 $\\varepsilon_i=y_i-E(y_i)$ 是观测值与理论均值之差，含未知参数，不可观测；残差 $e_i=y_i-\\hat y_i$ 是观测值与拟合值之差，由样本算出，可观测。","diff":"前者是模型假定中的随机项，要求零均值、等方差、不相关；后者是样本的函数，最小二乘解满足 $\\sum e_i=0$、$\\sum e_ix_i=0$，故 $n$ 个残差并不独立。","link":"残差是误差的估计量：$\\hat\\sigma^2=SSE/(n-2)$ 由残差平方和给出，残差图可查异方差、非线性与异常点，是检验误差假定的主要工具。"}},{"no":83,"star":1,"title":"最小二乘估计 vs 极大似然估计（回归中）","ch":8,"sections":[{"name":"得分点","body":"> 一元线性回归中，最小二乘估计通过使残差平方和 $Q=\\sum(y_i-a-bx_i)^2$ 最小求 $\\hat b=\\dfrac{L_{xy}}{L_{xx}}$、$\\hat a=\\bar y-\\hat b\\bar x$，不依赖分布假定；极大似然估计需假定误差 $\\varepsilon_i\\sim N(0,\\sigma^2)$，最大化似然函数。可以证明：在正态误差假定下，二者的估计值完全相同，且 $\\hat b$ 是 $\\beta$ 的 BLUE（高斯-马尔可夫定理，只需零均值、等方差、不相关即可）。故最小二乘的适用面更广，MLE 则额外给出 $\\hat\\sigma^2$ 与区间估计。"},{"name":"钩子","body":"正态下两者同解，最小二乘不挑分布。"}],"one":"","hook":"正态下两者同解，最小二乘不挑分布。","bx":{"a":"最小二乘估计：使 $Q=\\sum(y_i-a-bx_i)^2$ 最小，$\\hat b=\\dfrac{L_{xy}}{L_{xx}}$，**不依赖分布假定**。","b":"极大似然估计：假定 $\\varepsilon_i\\sim N(0,\\sigma^2)$，最大化似然函数。","diff":["前提：只需二阶矩 / 需正态假定；","目标：残差平方和最小 / 似然最大；","结果：正态假定下二者数值完全相同。"],"link":"正态误差下 $\\ln L$ 与 $Q$ 只差常数倍，故两法同解；而高斯-马尔可夫定理说明只要零均值、等方差、不相关，最小二乘已是 BLUE——这就是它被普遍使用的原因。","ex":"$n=5$ 的数据算得 $L_{xy}=12,L_{xx}=10$：$\\hat b=1.2$；若假定正态误差，MLE 给出的 $\\hat b$ 也是 1.2。"},"bx2":{"def":"最小二乘估计取使残差平方和 $Q=\\sum(y_i-a-bx_i)^2$ 达到最小的系数，只须二阶矩存在；极大似然估计在 $\\varepsilon_i\\sim N(0,\\sigma^2)$ 下最大化似然函数求出参数。","diff":"前者不依赖分布假定，后者须指定误差分布；正态误差下两者的 $\\hat b$ 数值相同，而 $\\hat\\sigma^2$ 不同，极大似然估计除以 $n$ 而非 $n-2$。","link":"正态误差时 $\\ln L$ 与 $Q$ 只差常数倍，
