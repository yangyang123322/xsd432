故两法同解；高斯-马尔可夫定理说明只要零均值、等方差、不相关，最小二乘已是 BLUE。"}},{"no":84,"star":1,"title":"一元线性回归 vs 多元线性回归","ch":8,"sections":[{"name":"得分点","body":"> 一元线性回归 $y=\\beta_0+\\beta_1x+\\varepsilon$ 只有一个自变量，回归直线；多元线性回归 $y=\\beta_0+\\beta_1x_1+\\cdots+\\beta_px_p+\\varepsilon$ 有多个自变量，用矩阵形式 $\\mathbf y=X\\mathbf\\beta+\\mathbf\\varepsilon$，$\\hat{\\mathbf\\beta}=(X^{\\mathrm T}X)^{-1}X^{\\mathrm T}\\mathbf y$。多元场合需注意：①各回归系数是\"控制其他变量不变\"的偏效应；②需检验模型整体显著性（$F$ 检验）与单个系数显著性（$t$ 检验）；③自变量间高度相关会导致多重共线性，使系数估计不稳定（方差膨胀）。一元是多元的特例。"},{"name":"钩子","body":"一元一条线，多元一个超平面，系数变偏效应。"}],"one":"","hook":"一元一条线，多元一个超平面，系数变偏效应。","bx":{"a":"一元线性回归 $y=\\beta_0+\\beta_1x+\\varepsilon$：一个自变量，几何上是一条直线。","b":"多元线性回归 $\\mathbf y=X\\boldsymbol\\beta+\\boldsymbol\\varepsilon$：多个自变量，$\\hat{\\boldsymbol\\beta}=(X^{\\mathrm T}X)^{-1}X^{\\mathrm T}\\mathbf y$。","diff":["自变量个数：1 / $p$；","几何：直线 / 超平面；","系数解释：斜率 / 偏回归系数（控制其他变量后的效应）。"],"link":"一元是多元的特例（$X$ 只有两列）；多元的系数含义变了——不再是「$x_j$ 增 1 时 $y$ 变多少」，而是「在其他变量不变时」。这是多元与一元最本质的差别。","ex":"$y$ 对 $x_1,x_2$ 回归得 $\\hat\\beta_1=3$：含义是 $x_2$ 不变时 $x_1$ 增 1，$y$ 平均增 3，而不是 $x_1$ 单独变化的效果。"},"bx2":{"def":"一元线性回归假定 $E(y)=\\beta_0+\\beta_1x$，几何上是一条直线；多元线性回归假定 $E(y)=X\\beta$，几何上是 $p$ 维超平面，参数由最小二乘估计得到。","diff":"前者的斜率是 $x$ 增 1 时 $y$ 的平均增量；后者的偏回归系数是其他自变量不变时 $x_j$ 增 1 的效应，自变量相关时二者含义差别很大。","link":"一元是多元在 $p=1$ 时的特例；多元须要求设计阵列满秩，否则 $X^{\\mathrm T}X$ 不可逆，须剔除共线变量或改用广义逆。"}},{"no":85,"star":1,"title":"线性回归 vs 可线性化的非线性回归","ch":8,"sections":[{"name":"得分点","body":"> 线性回归指\"对参数线性\"，$y=\\beta_0+\\beta_1x+\\varepsilon$ 与 $y=\\beta_0+\\beta_1x+\\beta_2x^2+\\varepsilon$ 都是线性回归（后者对 $x$ 非线性但对参数线性）。非线性回归指参数非线性，如 $y=a\\mathrm e^{bx}$、$y=\\frac{1}{a+bx}$，可通过变换化为线性：取对数、取倒数后对新变量作最小二乘，称可线性化的非线性回归。注意变换后残差平方和的意义改变（最小化的是变换后的残差），故参数估计不再等价于原模型的最小二乘；此外变换可能改变误差结构（如对数变换要求误差乘性）。"},{"name":"钩子","body":"看参数是否线性，不看 $x$ 的次数。"}],"one":"","hook":"看参数是否线性，不看 $x$ 的次数。","bx":{"a":"线性回归：**对参数**线性，如 $y=\\beta_0+\\beta_1x+\\beta_2x^2+\\varepsilon$ 仍是线性回归。","b":"可线性化的非线性回归：参数非线性，如 $y=ae^{bx}$、$y=\\dfrac{1}{a+bx}$，取对数或倒数后可化为线性。","diff":["判据：看**参数**是否线性 / 看能否通过变换化为线性；","估计：直接最小二乘 / 先变换再最小二乘；","残差意义：原尺度 / 变换后尺度（不再是原模型的最小二乘）。"],"link":"「线性」指的是参数线性，不是 $x$ 的次数——这是最常见的误解；变换后最小化的是变换尺度的残差平方和，故估计值与原模型最小二乘不等价（只有少数情形恰好一致）。","ex":"$y=ae^{bx}$ 取对数得 $\\ln y=\\ln a+bx$，对 $(x,\\ln y)$ 作最小二乘；但 $y=\\beta_0+\\beta_1x+\\beta_2x^2$ 无需变换，本身就是线性回归。"},"bx2":{"def":"线性回归指模型对参数线性，如 $y=\\beta_0+\\beta_1x+\\beta_2x^2$ 仍属线性回归；可线性化的非线性回归指参数非线性、经对数或倒数变换可化为线性的模型，如 $y=ae^{bx}$。","diff":"判据是参数是否线性，与 $x$ 的次数无关；变换后最小二乘最小化的是变换尺度的残差平方和，故与原尺度上的最小二乘不等价。","link":"只有少数情形变换前后同解；$\\ln y=\\ln a+bx$ 给出的是 $\\ln y$ 的最优拟合，反变换回原尺度后对 $y$ 的均值有偏，故宜用非线性最小二乘直接拟合原模型。"}},{"no":86,"star":1,"title":"方差齐性检验","ch":8,"sections":[{"name":"得分点","body":"> 方差分析、两样本 $t$ 检验都要求各总体方差相等（方差齐性）。检验方法：①Hartley 检验（最大方差与最小方差之比，要求等样本量且正态）；②Bartlett 检验（对正态敏感，功效高）；③Levene 检验（基于绝对偏差，对非正态稳健，最常用）。原假设 $H_0:\\sigma_1^2=\\cdots=\\sigma_r^2$，统计量在 $H_0$ 下近似服从 $F$ 或 $\\chi^2$。若方差不齐，可改用 Welch $t$ 检验（近似 $t$ 分布，校正自由度）或变量变换（对数、平方根）。西大真题 8 年中方差齐性未单独命题，属低优先。"},{"name":"钩子","body":"先看方差齐不齐，再做均值检验。"}],"one":"","hook":"先看方差齐不齐，再做均值检验。","bx":{"a":"方差齐性检验（多组）：$H_0:\\sigma_1^2=\\cdots=\\sigma_r^2$，判断各组方差是否相等。","b":"单组方差检验：$H_0:\\sigma^2=\\sigma_0^2$，用 $\\chi^2=\\dfrac{(n-1)S^2}{\\sigma_0^2}\\sim\\chi^2(n-1)$。","diff":["组数：$r\\ge2$ / 1；","统计量：Hartley（$F_{\\max}$ 型）、Bartlett（卡方型）、Levene（基于绝对偏差）/ 卡方；","稳健性：Levene 对非正态稳健，Bartlett 对正态敏感。"],"link":"两者都检验「方差」，但多组情形不能直接套单组卡方（要同时比较多组），故改用比值型统计量；方差齐性是 $t$ 检验与方差分析的前提，不齐时改用 Welch $t$ 或变量变换。","ex":"三组数据 $s_1^2=4,s_2^2=9,s_3^2=25$：Levene 检验 $p=0.02<0.05$ 拒绝齐性，改用 Welch 方法。"},"bx2":{"def":"方差齐性检验判别 $r\\ge2$ 组方差是否相等，常用 Bartlett、Levene 检验；单组方差检验用 $\\chi^2=(n-1)S^2/\\sigma_0^2$ 检验 $\\sigma^2=\\sigma_0^2$。","diff":"前者同时比较多个方差，统计量取方差的比或加权对数；后者只与一个已知常数比，且须假定总体正态；Levene 对非正态稳健，Bartlett 敏感。","link":"多组不能逐对套用单组 $\\chi^2$，否则族错误率膨胀，故改用比值型统计量；方差齐性是 $t$ 检验与方差分析的前提，不齐时改用 Welch 校正。"}},{"no":87,"star":1,"title":"多重比较（LSD、Bonferroni、Tukey）","ch":8,"sections":[{"name":"得分点","body":"> 方差分析 $F$ 检验显著只说明\"至少有一组均值不同\"，不能指出具体是哪几组，故需多重比较。①LSD 法：对每对均值作 $t$ 检验，用 $MSE$ 作合并方差，简单但未控制整体第一类错误；②Bonferroni 法：每对用 $\\alpha/m$（$m$ 为比较次数），控制族错误率，保守；③Tukey HSD 法：基于学生化极差分布，专用于所有两两比较，控制整体错误率且功效较高，是最常用方法。选择原则：两两比较用 Tukey，与对照组比较用 Dunnett。"},{"name":"钩子","body":"多组显著后还要找出\"谁和谁不同\"。"}],"one":"","hook":"多组显著后还要找出\"谁和谁不同\"。","bx":{"a":"方差分析的 $F$ 检验：只回答「至少有一组均值不同」，不指出是哪几组。","b":"多重比较（LSD、Bonferroni、Tukey）：在 $F$ 显著后进一步找出「谁和谁不同」。","diff":["结论粒度：整体 / 两两；","错误控制：控制整体 $\\alpha$ / 需控制族错误率；","方法选择：— / 两两比较用 Tukey，与对照组比较用 Dunnett。"],"link":"二者是「先把关、再定位」的两步：$F$ 不显著就停，显著才做多重比较；多重比较必须校正 $\\alpha$（Bonferroni 用 $\\alpha/m$，Tukey 用学生化极差分布），否则比较次数一多就会假阳性。","ex":"$r=4$ 组、$F$ 显著：用 Tukey HSD 得「第 1 组与第 4 组差异显著，其余不显著」；若做 6 次 $t$ 检验而不校正，族错误率会升到 $1-0.95^6=0.265$。"},"bx2":{"def":"方差分析的 $F$ 检验用 $F=MSA/MSE$ 判断各组均值是否全相等，只给整体结论；多重比较在 $F$ 显著后定位哪几对均值不同，常用 LSD、Bonferroni、Tukey。","diff":"前者做一次检验，控制的是整体第一类错误；后者做 $\\binom{r}{2}$ 次两两比较，须控制族错误率，Bonferroni 取 $\\alpha/m$，Tukey 用学生化极差分布。","link":"二者是先把关、再定位的两步，$F$ 不显著即停止；若跳过 $F$ 直接两两做 $t$，$r=4$ 时族错误率升至 $1-0.95^6=0.265$，远超名义 $\\alpha$。"}}],"quiz":[{"ch":1,"no":1,"q":"写出三事件加法公式，并说明\"至少有一个\"与\"都不发生\"如何互化。"},{"ch":1,"no":2,"q":"$P(A-B)$ 等于什么？若 $B\\subset A$ 呢？"},{"ch":1,"no":3,"q":"全概率公式的前提条件是什么？缺了会怎样？"},{"ch":1,"no":4,"q":"贝叶斯公式中\"先验\"\"后验\"\"似然\"各指哪一项？"},{"ch":1,"no":5,"q":"$n$ 个事件相互独立需要多少个等式？为什么不是 $n$ 个？"},{"ch":1,"no":6,"q":"频率与概率的区别，谁由谁决定？"},{"ch":2,"no":7,"q":"分布函数的三条性质，为什么必须右连续？"},{"ch":2,"no":8,"q":"$P(X=a)=0$ 对连续型成立，对离散型呢？"},{"ch":2,"no":9,"q":"二项分布最可能值怎么求？"},{"ch":2,"no":10,"q":"泊松定理的条件与结论。"},{"ch":2,"no":11,"q":"几何分布与指数分布的无记忆性各写成什么式子？"},{"ch":2,"no":12,"q":"正态标准化的完整链条（含线性变换）。"},{"ch":2,"no":13,"q":"随机变量函数分布的两种方法，何时只能用分布函数法？"},{"ch":2,"no":14,"q":"切比雪夫不等式的两种写法及其用途。"},{"ch":3,"no":15,"q":"边缘密度怎么由联合密度求？"},{"ch":3,"no":16,"q":"判断两个连续型随机变量独立的两条实用判据。"},{"ch":3,"no":17,"q":"卷积公式的适用条件。"},{"ch":3,"no":18,"q":"最大值、最小值分布的公式。"},{"ch":3,"no":19,"q":"二维正态中\"不相关\"与\"独立\"的关系，为什么只在二维正态成立？"},{"ch":3,"no":20,"q":"协方差的双线性性质写三条。"},{"ch":3,"no":21,"q":"$|\\rho|=1$ 的充要条件是什么？"},{"ch":3,"no":22,"q":"重期望公式及其在求 $DX$ 中的用法。"},{"ch":4,"no":23,"q":"辛钦大数定律的条件与结论（与切比雪夫大数定律比少了什么）。"},{"ch":4,"no":2 误：$\\dfrac{1}{6}\\times\\dfrac{1}{3}$ 误算为 $\\dfrac{1}{9}$ 或 $\\dfrac{1}{2}$。"],"ext":["考纲定位：条件概率是概率论基础核心考点，几乎每年必考，常以填空或计算第一题出现；","前置知识点：事件的关系与运算、概率的公理化定义与基本性质；","后置串联：乘法公式、全概率公式、贝叶斯公式（本题可扩展为已知 $P(AB)$ 反求条件概率，或结合全概率公式）；","命题延伸方向：条件概率与独立性结合判断、多事件条件概率的链式法则、条件概率在实际场景（抽检、医疗检测）中的应用。"],"kps":["条件概率与乘法公式"],"pts":4},{"year":2026,"no":2,"type":"填空","stem":"设随机变量 $X$ 在 $(0,1)$ 区域内均匀分布，求 $Y=|\\ln X|$ 的密度函数。","sol":"$X\\sim U(0,1)$，$f_X(x)=1,\\ 0<x<1$。$Y=|\\ln X|=-\\ln X$（因 $0<X<1$ 时 $\\ln X<0$），$y>0$。分布函数法：\n\n$$F_Y(y)=P(Y\\leq y)=P(-\\ln X\\leq y)=P(X\\geq e^{-y})=1-e^{-y},\\quad y>0.$$\n\n故\n\n$$f_Y(y)=e^{-y},\\quad y>0,\\quad \\text{即 } Y\\sim \\mathrm{Exp}(1).$$","traps":["未去掉绝对值直接讨论：$Y=|\\ln X|$ 在 $0<X<1$ 上 $\\ln X$ 恒负，应先化简为 $-\\ln X$，考生易分区间讨论导致混乱；","分布函数法中不等式方向错误：$-\\ln X\\leq y$ 等价于 $X\\geq e^{-y}$，而非 $X\\leq e^{-y}$；","忽略 $Y$ 的取值范围：$Y>0$，$y\\leq 0$ 时 $F_Y(y)=0$，密度为 $0$；","公式法使用时导数符号处理：单调递减函数 $y=-\\ln x$，$\\mathrm{d}y/\\mathrm{d}x=-1/x$，取绝对值后 $f_Y(y)=f_X(x)\\,|\\mathrm{d}x/\\mathrm{d}y|=1\\cdot e^{-y}$。"],"ext":["考纲定位：随机变量函数的分布是高频考点，几乎每年以填空或计算形式出现，均匀分布+对数/指数变换是经典组合；","前置知识点：均匀分布的密度与分布函数、连续型随机变量函数分布的分布函数法与公式法；","后置串联：指数分布的无记忆性、二维随机变量函数的分布（和、差、积、商、最大最小值）；","命题延伸方向：$X\\sim U(0,1)$ 时 $Y=-2\\ln X$ 服从 $\\chi^2(2)$、$Y=-(1/\\lambda)\\ln X$ 服从 $\\mathrm{Exp}(\\lambda)$，可与卡方分布、指数分布性质结合。"],"kps":["随机变量函数的分布","连续型密度与常见分布","分布函数与分布列","二维区域型分布"],"pts":4},{"year":2026,"no":3,"type":"填空","stem":"抛掷一个硬币 $n$ 次，用 $X$ 和 $Y$ 分别表示正面向上和反面向上的次数，则 $X$ 和 $Y$ 的相关系数是____。","sol":"$X\\sim b(n,p)$，$Y=n-X$，故 $Y$ 与 $X$ 呈完全负线性关系。\n\n$$\\mathrm{Cov}(X,Y)=\\mathrm{Cov}(X,n-X)=-\\mathrm{Var}(X)=-np(1-p).$$\n\n$$\\rho_{XY}=\\dfrac{\\mathrm{Cov}(X,Y)}{\\sqrt{\\mathrm{Var}(X)}\\cdot\\sqrt{\\mathrm{Var}(Y)}}=\\dfrac{-np(1-p)}{np(1-p)}=-1.$$","traps":["误认为 $X$ 与 $Y$ 独立：$X+Y=n$ 为确定值，二者完全线性相关，绝不独立；","计算 $\\mathrm{Var}(Y)$ 时出错：$Y=n-X$，$\\mathrm{Var}(Y)=\\mathrm{Var}(X)=np(1-p)$，考生易误算为 $n^2p(1-p)$ 或其他；","相关系数公式中协方差符号错误：$\\mathrm{Cov}(X,n-X)=-\\mathrm{Var}(X)$，负号易丢；","未意识到完全线性负相关直接得 $-1$，而选择硬算导致计算失误。"],"ext":["考纲定位：相关系数是数字特征板块核心考点，常与二项分布、正态分布结合考察；","前置知识点：方差与协方差的定义与性质、二项分布的期望与方差；","后置串联：相关系数与独立性的关系（独立→不相关，不相关未必独立，正态分布下等价）、不相关的判定；","命题延伸方向：$X\\sim b(n,p)$，$Y=n-X$ 求 $\\mathrm{Cov}(X,Y)$ 与 $\\rho$；$X$、$Y$ 为多项分布中两类计数时的相关系数（负值）；相关系数为 $\\pm1$ 的充要条件（完全线性相关）。"],"kps":["常见离散分布","数字特征与矩","协方差与相关系数"],"pts":4},{"year":2026,"no":4,"type":"填空","stem":"设 $X_1,X_2$ 来自于总体 $N(0,\\sigma^2)$ 的样本，则 $Y=\\left(\\dfrac{X_1+X_2}{X_1-X_2}\\right)^2$ 属于（分布类型和参数）____。","sol":"$X_1,X_2$ i.i.d. $N(0,\\sigma^2)$。\n\n$$X_1+X_2\\sim N(0,2\\sigma^2),\\qquad \\dfrac{(X_1+X_2)^2}{2\\sigma^2}\\sim \\chi^2(1);$$\n\n$$X_1-X_2\\sim N(0,2\\sigma^2),\\qquad \\dfrac{(X_1-X_2)^2}{2\\sigma^2}\\sim \\chi^2(1);$$\n\n关键：$X_1+X_2$ 与 $X_1-X_2$ 独立（联合正态且 $\\mathrm{Cov}(X_1+X_2,X_1-X_2)=\\mathrm{Var}(X_1)-\\mathrm{Var}(X_2)=0$）；\n\n$$Y=\\dfrac{(X_1+X_2)^2/(2\\sigma^2)}{(X_1-X_2)^2/(2\\sigma^2)}\\sim F(1,1).$$","traps":["未识别 $X_1+X_2$ 与 $X_1-X_2$ 的独立性：二者协方差为 $0$ 且联合正态，故独立，这是构造 $F$ 分布的前提；","方差计算错误：$X_1+X_2$ 的方差为 $2\\sigma^2$ 而非 $\\sigma^2$，标准化时系数易错；","误判为 $t$ 分布：$t$ 分布构造为 $N(0,1)/\\sqrt{\\chi^2(n)/n}$，本题是两个 $\\chi^2(1)$ 之比，应为 $F$ 分布；","$F$ 分布自由度写反：分子自由度 $1$，分母自由度 $1$，$F(1,1)$，注意顺序。"],"ext":["考纲定位：三大抽样分布（$\\chi^2$、$t$、$F$）的构造与识别是数理统计基础必考内容，西北大学偏好考察正态样本线性组合的分布识别；","前置知识点：正态分布的可加性、独立正态变量线性组合仍为正态、协方差与独立性的关系（联合正态下不相关=独立）；","后置串联：$F$ 分布的性质（$F_{1-\\alpha}(n_1,n_2)=1/F_{\\alpha}(n_2,n_1)$）、两正态总体方差比的区间估计与假设检验；","命题延伸方向：$X_1,\\ldots,X_n\\sim N(0,\\sigma^2)$，构造 $\\dfrac{n\\bar X^2}{S^2}\\sim F(1,n-1)$；样本均值与样本方差独立的证明与应用；$F$ 分布与 $t$ 分布的关系（$t^2(n)=F(1,n)$）。"],"kps":["抽样分布与三大分布构造","多维函数的分布","连续型密度与常见分布","总体与样本、统计量"],"pts":4},{"year":2026,"no":5,"type":"填空","stem":"已知有一批产品长度为 $X\\sim N(\\mu,0.5^2)$，问样本容量至少为____时，样本均值和总体均值的绝对误差在置信水平 $0.95$ 下小于 $0.1$。","sol":"$X\\sim N(\\mu,0.5^2)$，$\\sigma=0.5$ 已知。$\\bar X\\sim N\\!\\left(\\mu,\\dfrac{\\sigma^2}{n}\\right)$。\n\n要求 $P(|\\bar X-\\mu|<0.1)\\geq 0.95$。标准化：\n\n$$P\\!\\left(\\dfrac{|\\bar X-\\mu|}{\\sigma/\\sqrt n}<\\dfrac{0.1\\sqrt n}{\\sigma}\\right)=2\\Phi\\!\\left(\\dfrac{0.1\\sqrt n}{0.5}\\right)-1\\geq 0.95.$$\n\n故 $\\Phi(0.2\\sqrt n)\\geq 0.975$，$0.2\\sqrt n\\geq 1.96$，$\\sqrt n\\geq 9.8$，$n\\geq 96.04$。取整 $n\\geq 97$。","traps":["分位数用错：置信水平 $0.95$ 对应双侧分位数 $z_{0.975}=1.96$，考生易误用 $z_{0.95}=1.645$；","标准差与标准误混淆：$\\bar X$ 的标准差为 $\\dfrac{\\sigma}{\\sqrt n}=\\dfrac{0.5}{\\sqrt n}$，而非 $0.5$；","取整方向错误：$n\\geq 96.04$ 应向上取整为 $97$，而非四舍五入为 $96$；","绝对误差与边际误差概念混淆：本题 $|\\bar X-\\mu|<0.1$ 即边际误差 $E=0.1$，公式 $n\\geq\\left(\\dfrac{z_{\\alpha/2}\\sigma}{E}\\right)^2$。"],"ext":["考纲定位：样本容量确定是区间估计的实际应用考点，西北大学偶有考察，常以填空形式出现；","前置知识点：正态总体均值的置信区间公式、标准正态分布分位数；","后置串联：比例估计的样本容量确定、有限总体修正系数下的样本量调整、假设检验中样本量与功效的关系；","命题延伸方向：$\\sigma$ 未知时用样本标准差代替并迭代确定 $n$、估计总体比例时 $n\\geq\\dfrac{z^2p(1-p)}{E^2}$、考虑调查成本的最优样本量。"],"kps":["总体与样本、统计量","区间估计","联合分布与边际分布"],"pts":4},{"year":2026,"no":1,"type":"辨析","stem":"分布函数和经验分布函数（做出解释并分析区别和联系）","sol":"**分布函数 $F(x)$**：设 $X$ 为随机变量，对任意实数 $x$，称 $F(x)=P(X\\leq x)$ 为 $X$ 的分布函数。性质：单调不减、右连续、$F(-\\infty)=0$、$F(+\\infty)=1$。完整描述随机变量的统计规律性。\n\n**经验分布函数 $F_n(x)$**：设 $X_1,\\ldots,X_n$ 为来自总体 $X$ 的样本，将样本观测值从小到大排列为 $x_{(1)}\\leq\\cdots\\leq x_{(n)}$，定义\n\n$$F_n(x)=\\begin{cases}0, & x<x_{(1)};\\\\[2pt] \\dfrac{k}{n}, & x_{(k)}\\leq x<x_{(k+1)};\\\\[2pt] 1, & x\\geq x_{(n)}.\\end{cases}$$\n\n即 $F_n(x)=\\dfrac{\\text{样本中 }\\leq x\\text{ 的个数}}{n}$。\n\n**区别：**\n- 本质不同：$F(x)$ 是总体的理论分布函数，确定性函数；$F_n(x)$ 是样本的函数，是统计量（随机变量），每次抽样得到不同的 $F_n(x)$；\n- 依赖对象不同：$F(x)$ 由总体分布唯一确定；$F_n(x)$ 依赖于具体样本和样本量 $n$；\n- 精确性不同：$F(x)$ 精确刻画总体；$F_n(x)$ 是对 $F(x)$ 的近似。\n\n**联系：**\n- 当 $n\\to\\infty$ 时，$F_n(x)$ 依概率收敛（实际上是几乎必然一致收敛）到 $F(x)$，即格里汶科定理：$P\\!\\left(\\lim_{n\\to\\infty}\\sup_x|F_n(x)-F(x)|=0\\right)=1$；\n- $F_n(x)$ 是 $F(x)$ 的一致估计量，样本量越大近似越好；\n- 都满足分布函数的基本性质（单调不减、右连续、值域 $[0,1]$）。","traps":["只定义不比较：辨析题要求\"分析区别和联系\"，考生易只写两个定义而缺少对比；","经验分布函数定义中排序与分段写错：$x_{(k)}\\leq x<x_{(k+1)}$ 时 $F_n(x)=\\dfrac{k}{n}$，边界点处理易错；","混淆经验分布函数与频率分布直方图：前者是阶梯函数，后者是图形展示；","格里汶科定理表述不准确：是\"一致收敛\"而非仅逐点收敛，强调 $\\sup_x$；","忽略 $F_n(x)$ 的随机性：$F_n(x)$ 作为统计量本身是随机变量，不同样本有不同实现。"],"ext":["考纲定位：分布函数是概率论基础概念，经验分布函数是数理统计的起点，二者辨析体现\"总体—样本\"的核心统计思想，西北大学偏好概念辨析题；","前置知识点：随机变量的定义、样本与统计量的概念；","后置串联：格里汶科定理是大数定律的应用、经验分布函数与分位数的关系、非参数统计中基于经验分布函数的检验（Kolmogorov-Smirnov 检验）；","命题延伸方向：给定样本值求经验分布函数并画图、利用 $F_n(x)$ 估计 $P(a<X\\leq b)$、经验分布函数与直方图的对比辨析。"],"kps":["经验分布函数","分布函数与分布列"],"pts":5},{"year":2026,"no":2,"type":"辨析","stem":"最小方差无偏估计和有效估计（做出解释并分析区别和联系）","sol":"**最小方差无偏估计（MVUE）**：设 $\\hat\\theta$ 是 $\\theta$ 的无偏估计，若对 $\\theta$ 的任意无偏估计 $\\tilde\\theta$，都有 $\\mathrm{Var}(\\hat\\theta)\\leq\\mathrm{Var}(\\tilde\\theta)$，则称 $\\hat\\theta$ 为 $\\theta$ 的最小方差无偏估计。MVUE 是在无偏估计类中方差最小的估计量，其存在性和求解常依赖充分统计量与完备性（Lehmann-Scheffé 定理）。\n\n**有效估计**：设 $\\hat\\theta$ 是 $\\theta$ 的无偏估计，若其方差达到 Cramér-Rao 下界，即 $\\mathrm{Var}(\\hat\\theta)=\\mathrm{CRLB}=\\dfrac{1}{n\\,I(\\theta)}$（正则条件下），则称 $\\hat\\theta$ 为 $\\theta$ 的有效估计。有效估计一定是 MVUE（因为 CRLB 是所有无偏估计方差的下界），但 MVUE 不一定是有效估计（MVUE 的方差可能大于 CRLB）。\n\n**区别：**\n- 判定标准不同：MVUE 比较的是无偏估计类内部的方差大小；有效估计比较的是无偏估计方差与理论下界 CRLB 是否相等；\n- 存在性不同：MVUE 在一定条件下（完备充分统计量存在）一定存在；有效估计不一定存在，因为 CRLB 可能不可达；\n- 范围不同：有效估计 $\\subset$ MVUE，有效估计是更强的概念。\n\n**联系：**\n- 都属于无偏估计的优良性评价，都关注方差大小；\n- 有效估计一定是 MVUE（CRLB 是所有无偏估计方差的下界，达到下界自然方差最小）；\n- 当 CRLB 可达时，MVUE 就是有效估计；当 CRLB 不可达时，MVUE 的方差大于 CRLB，不是有效估计；\n- 求解都依赖 Fisher 信息量与充分统计量理论。","traps":["概念混淆：误认为 MVUE 就是有效估计，忽略了 CRLB 可能不可达的情况；","CRLB 公式记错：正则条件下单参数 $\\mathrm{CRLB}=\\dfrac{1}{n\\,I(\\theta)}$，其中 $I(\\theta)=E\\!\\left[\\left(\\dfrac{\\partial\\ln f}{\\partial\\theta}\\right)^2\\right]$，考生易漏掉 $n$ 或 Fisher 信息量的定义；","有效估计的前提是无偏：有偏估计即使方差小也不能称为有效估计；","只写定义不写区别联系：辨析题必须有对比分析；","Lehmann-Scheffé 定理与 MVUE 的关系不清楚：完备充分统计量的函数若为无偏估计则是 MVUE。"],"ext":["考纲定位：点估计的评价标准（无偏性、有效性、相合性）是参数估计板块核心，西北大学几乎每年以名词解释或辨析题考察，MVUE 与有效估计的辨析是高频考点；","前置知识点：无偏估计的定义、方差计算、Fisher 信息量、充分统计量；","后置串联：相合估计（一致性）、渐近有效估计、估计量的均方误差（MSE）准则（允许有偏）；","命题延伸方向：给定分布求 CRLB 并判断某估计是否有效、利用完备充分统计量求 MVUE、有效估计与充分统计量的关系（有效估计必为充分统计量的函数）。"],"kps":["有效性与 C-R 下界","无偏性","数字特征与矩"],"pts":5},{"year":2026,"no":1,"type":"计算","stem":"盒子里有黑白两种颜色的 5 个球，均匀混合并同时摸出两个球，发现都是白色，问盒子中恰好有两个白球的概率。","sol":"设 $A_i=$\"盒子中有 $i$ 个白球\"，$i=0,1,2,3,4,5$。由于白球数未知，通常假设各情况等可能，即 $P(A_i)=\\dfrac{1}{6}$。设 $B=$\"摸出两个球都是白色\"。\n\n$P(B\\mid A_i)=\\dfrac{\\binom{i}{2}}{\\binom{5}{2}}$，当 $i\\geq 2$；$i<2$ 时 $P(B\\mid A_i)=0$。\n\n$$P(B)=\\sum_{i=2}^{5}P(A_i)P(B\\mid A_i)=\\dfrac{1}{6}\\times\\dfrac{\\binom{2}{2}+\\binom{3}{2}+\\binom{4}{2}+\\binom{5}{2}}{\\binom{5}{2}}=\\dfrac{1}{6}\\times\\dfrac{1+3+6+10}{10}=\\dfrac{1}{6}\\times\\dfrac{20}{10}=\\dfrac{1}{3}.$$\n\n$$P(A_2\\mid B)=\\dfrac{P(A_2)P(B\\mid A_2)}{P(B)}=\\dfrac{\\frac{1}{6}\\times\\frac{1}{10}}{\\frac{1}{3}}=\\dfrac{1/60}{1/3}=\\dfrac{1}{20}=0.05.$$","traps":["先验概率假设不明确：题目未给出白球数的先验分布，需假设等可能（无差别原则），考生易忽略说明；","条件概率计算错误：从 $i$ 个白球中摸 $2$ 个白球的概率为 $\\dfrac{\\binom{i}{2}}{\\binom{5}{2}}$，考生易误用有放回抽样的 $\\left(\\dfrac{i}{5}\\right)^2$；","全概率公式求和范围遗漏：$i=0,1$ 时 $P(B\\mid A_i)=0$，可只从 $i=2$ 求和，但需说明；","贝叶斯公式分母算错：$P(B)$ 的计算是核心，$\\binom{2}{2}+\\binom{3}{2}+\\binom{4}{2}+\\binom{5}{2}=1+3+6+10=20$，再除以 $\\binom{5}{2}=10$ 得 $2$，乘以 $\\dfrac{1}{6}$ 得 $\\dfrac{1}{3}$；","\"同时摸出两个\"与\"先后摸出两个\"混淆：同时摸出对应组合数 $\\binom{5}{2}$，结果一致但思路不同。"],"ext":["考纲定位：贝叶斯公式是概率论基础必考考点，西北大学几乎每年以计算题第一题或填空题出现，\"摸球\"是经典场景；","前置知识点：古典概型、条件概率、全概率公式；","后置串联：贝叶斯估计（参数的后验分布）、先验分布的选择对后验的影响、主观概率；","命题延伸方向：改变先验分布（如白球数服从二项分布）、有放回抽样场景、多阶段摸球的贝叶斯更新、与最大后验估计（MAP）结合。"],"kps":["全概率与贝叶斯","常见离散分布","古典概型与计数"],"pts":15},{"year":2026,"no":2,"type":"计算","stem":"在直线 $(0,1)$ 上随机取 $n$ 个点，求相距最远的两个点的距离的数学期望。","sol":"设 $n$ 个点为 $X_1,\\ldots,X_n$ i.i.d. $U(0,1)$，排序为 $X_{(1)}\\leq X_{(2)}\\leq\\cdots\\leq X_{(n)}$。相距最远的两个点的距离即极差 $R=X_{(n)}-X_{(1)}$。\n\n方法一：分别求 $X_{(1)}$ 和 $X_{(n)}$ 的期望。\n\n$$f_{X_{(n)}}(x)=n\\,x^{n-1},\\ 0<x<1;\\qquad E(X_{(n)})=\\int_0^1 x\\cdot n\\,x^{n-1}\\,\\mathrm{d}x=\\dfrac{n}{n+1}.$$\n\n$$f_{X_{(1)}}(x)=n(1-x)^{n-1},\\ 0<x<1;\\qquad E(X_{(1)})=\\int_0^1 x\\cdot n(1-x)^{n-1}\\,\\mathrm{d}x=\\dfrac{1}{n+1}.$$\n\n$$E(R)=E(X_{(n)})-E(X_{(1)})=\\dfrac{n}{n+1}-\\dfrac{1}{n+1}=\\dfrac{n-1}{n+1}.$$\n\n方法二：直接求 $R$ 的密度。$R$ 的密度为 $f_R(r)=n(n-1)\\,r^{n-2}(1-r),\\ 0<r<1$（$\\mathrm{Beta}(n-1,2)$ 分布），$E(R)=\\dfrac{n-1}{n+1}$。","traps":["未识别\"相距最远\"即极差：最远两点距离 $=$ 最大值 $-$ 最小值 $=X_{(n)}-X_{(1)}$；","次序统计量密度公式记错：$X_{(k)}$ 的密度为 $f_{X_{(k)}}(x)=\\dfrac{n!}{(k-1)!(n-k)!}[F(x)]^{k-1}[1-F(x)]^{n-k}f(x)$，$U(0,1)$ 下 $F(x)=x,\\ f(x)=1$；","积分计算错误：$E(X_{(1)})=\\int_0^1 n\\,x(1-x)^{n-1}\\,\\mathrm{d}x$，需用分部积分或 Beta 函数，结果为 $\\dfrac{1}{n+1}$；","误认为 $E(R)=E(X_{(n)})+E(X_{(1)})$：极差是差不是和；","忽略 $n=1$ 的特殊情况：$n=1$ 时只有一个点，\"最远两点\"无意义，公式 $\\dfrac{n-1}{n+1}=0$ 合理。"],"ext":["考纲定位：次序统计量是数理统计基础重要考点，西北大学偏好考察均匀分布的次序统计量及其数字特征，本题是经典题型；","前置知识点：均匀分布、次序统计量的定义与密度公式、期望的线性性质；","后置串联：极差的分布（Beta 分布）、中位数的分布、间距（spacing）$X_{(k+1)}-X_{(k)}$ 的分布（指数分布相关）、非参数统计中基于极差的估计；","命题延伸方向：求极差的方差、求中位数的期望、求第 $k$ 个次序统计量的期望、$n$ 个点将 $(0,1)$ 分成 $n+1$ 段的每段长度期望（均为 $\\dfrac{1}{n+1}$）。"],"kps":["次序统计量","连续型密度与常见分布","总体与样本、统计量","数字特征与矩"],"pts":15},{"year":2026,"no":3,"type":"计算","stem":"二维随机变量 $X,Y$ 的联合密度函数为 $f(x,y)=\\begin{cases}c\\,x\\,e^{-y}, & 0<x<1,\\ 0<y<+\\infty;\\\\ 0, & \\text{其他}\\end{cases}$\n（1）求常数 $c$；\n（2）求解 $X,Y$ 的边际密度函数；\n（3）求 $Z=X+Y$ 的密度函数；\n（4）求概率 $P(X+Y<1)$。","sol":"（1）归一化：\n\n$$\\int_0^1\\!\\int_0^{\\infty}c\\,x\\,e^{-y}\\,\\mathrm{d}y\\,\\mathrm{d}x=c\\int_0^1 x\\,\\mathrm{d}x\\cdot\\int_0^{\\infty}e^{-y}\\,\\mathrm{d}y=c\\cdot\\dfrac{1}{2}\\cdot 1=\\dfrac{c}{2}=1,\\quad \\text{故 } c=2.$$\n\n（2）边际密度：\n\n$$f_X(x)=\\int_0^{\\infty}2x\\,e^{-y}\\,\\mathrm{d}y=2x,\\ 0<x<1;\\qquad \\text{其他为 }0.$$\n\n$$f_Y(y)=\\int_0^1 2x\\,e^{-y}\\,\\mathrm{d}x=e^{-y}\\,[x^2]_0^1=e^{-y},\\ y>0;\\qquad \\text{其他为 }0.$$\n\n可见 $f(x,y)=f_X(x)\\,f_Y(y)$，$X$ 与 $Y$ 独立。\n\n（3）$Z=X+Y$ 的密度（卷积公式）：\n\n$$f_Z(z)=\\int_{-\\infty}^{\\infty}f_X(x)\\,f_Y(z-x)\\,\\mathrm{d}x.$$\n\n需 $0<x<1$ 且 $z-x>0$ 即 $x<z$。\n\n- 当 $z\\leq 0$：$f_Z(z)=0$；\n- 当 $0<z<1$：$x\\in(0,z)$，\n\n$$f_Z(z)=\\int_0^z 2x\\cdot e^{-(z-x)}\\,\\mathrm{d}x=2e^{-z}\\int_0^z x\\,e^x\\,\\mathrm{d}x=2e^{-z}\\big[(z-1)e^z+1\\big]=2(z-1+e^{-z});$$\n\n- 当 $z\\geq 1$：$x\\in(0,1)$，\n\n$$f_Z(z)=\\int_0^1 2x\\cdot e^{-(z-x)}\\,\\mathrm{d}x=2e^{-z}\\int_0^1 x\\,e^x\\,\\mathrm{d}x=2e^{-z}\\cdot 1=2e^{-z}.$$\n\n（4）\n\n$$P(X+Y<1)=\\iint_{x+y<1}f(x,y)\\,\\mathrm{d}x\\,\\mathrm{d}y=\\int_0^1\\!\\int_0^{1-x}2x\\,e^{-y}\\,\\mathrm{d}y\\,\\mathrm{d}x=\\int_0^1 2x(1-e^{-(1-x)})\\,\\mathrm{d}x$$\n\n$$=\\int_0^1 2x\\,\\mathrm{d}x-2\\int_0^1 x\\,e^{-(1-x)}\\,\\mathrm{d}x=1-2e^{-1}\\int_0^1 x\\,e^x\\,\\mathrm{d}x=1-2e^{-1}\\cdot 1=1-\\dfrac{2}{e}\\approx 0.264.$$\n\n也可利用（3）的结果：$P(Z<1)=\\int_0^1 2(z-1+e^{-z})\\,\\mathrm{d}z=[z^2-2z-2e^{-z}]_0^1=(1-2-2/e)-(0-0-2)=1-\\dfrac{2}{e}$。","traps":["归一化积分拆分错误：$\\int_0^1 x\\,\\mathrm{d}x=\\dfrac{1}{2}$，$\\int_0^{\\infty}e^{-y}\\,\\mathrm{d}y=1$，$c=2$，考生易算成 $c=1$ 或 $c=4$；","边际密度积分限错误：$f_X(x)$ 对 $y$ 积分从 $0$ 到 $\\infty$，$f_Y(y)$ 对 $x$ 积分从 $0$ 到 $1$；","卷积公式积分限讨论不全：$Z=X+Y$ 的密度需分 $z\\leq 0$、$0<z<1$、$z\\geq 1$ 三段，考生易漏掉分段或积分限写错；","卷积中 $f_Y(z-x)$ 的自变量替换错误：应为 $e^{-(z-x)}$ 而非 $e^{-z}$ 或 $e^{-x}$；","$P(X+Y<1)$ 积分区域确定错误：$x\\in(0,1)$，$y\\in(0,1-x)$，注意 $y>0$ 的约束；","分部积分计算失误：$\\int x\\,e^x\\,\\mathrm{d}x=(x-1)e^x+C$，考生易记错公式。"],"ext":["考纲定位：二维连续型随机变量的联合密度、边际密度、独立性判断、和的分布是概率论核心考点，西北大学几乎每年以计算题形式出现，是分值最高的板块之一；","前置知识点：二重积分计算、连续型随机变量密度的性质、卷积公式；","后置串联：独立性判断（$f(x,y)=f_X(x)f_Y(y)$）、条件密度、$Z=\\max/\\min$ 的分布、$Z=X-Y$、$Z=XY$ 的分布；","命题延伸方向：增加独立性判断、求条件密度 $f_{X\\mid Y}(x\\mid y)$、求 $Z=X-Y$ 或 $Z=XY$ 的密度、求协方差与相关系数、联合密度中 $x,y$ 区域更复杂（如三角形、环形）。"],"kps":["多维函数的分布","连续型密度与常见分布","联合分布与边际分布"],"pts":15},{"year":2026,"no":4,"type":"计算","stem":"$X$ 的概率密度函数为 $f(x;\\theta)=\\begin{cases}\\theta\\,x^{\\theta-1}, & 0<x<1;\\\\ 0, & \\text{其他}\\end{cases}$，其中 $\\theta$ 为未知参数，$\\theta>0$，$X_1,X_2,\\ldots,X_n$ 为总体 $X$ 的样本，求参数 $\\theta$ 的矩估计和最大似然估计。","sol":"总体 $X\\sim\\mathrm{Beta}(\\theta,1)$，$f(x;\\theta)=\\theta\\,x^{\\theta-1},\\ 0<x<1$。\n\n**矩估计：**\n\n$$E(X)=\\int_0^1 x\\cdot\\theta\\,x^{\\theta-1}\\,\\mathrm{d}x=\\theta\\int_0^1 x^{\\theta}\\,\\mathrm{d}x=\\dfrac{\\theta}{\\theta+1}.$$\n\n令 $E(X)=\\bar X$，即 $\\dfrac{\\theta}{\\theta+1}=\\bar X$，解得 $\\hat\\theta_M=\\dfrac{\\bar X}{1-\\bar X}$。\n\n**最大似然估计：**\n\n似然函数 $L(\\theta)=\\prod_{i=1}^{n}\\theta\\,x_i^{\\theta-1}=\\theta^n\\!\\left(\\prod x_i\\right)^{\\theta-1}$。\n\n对数似然 $\\ln L=n\\ln\\theta+(\\theta-1)\\sum\\ln x_i$。求导\n\n$$\\dfrac{\\mathrm{d}\\ln L}{\\mathrm{d}\\theta}=\\dfrac{n}{\\theta}+\\sum\\ln x_i=0,\\quad \\text{解得 } \\hat\\theta_{\\mathrm{MLE}}=-\\dfrac{n}{\\sum\\ln X_i}=-\\dfrac{1}{\\ln\\bar X_g},$$\n\n其中 $\\ln\\bar X_g=\\dfrac{1}{n}\\sum\\ln X_i$ 为对数均值。验证二阶导数 $\\dfrac{\\mathrm{d}^2\\ln L}{\\mathrm{d}\\theta^2}=-\\dfrac{n}{\\theta^2}<0$，故为最大值点。","traps":["矩估计中 $E(X)$ 积分错误：$\\int_0^1\\theta\\,x^{\\theta}\\,\\mathrm{d}x=\\dfrac{\\theta}{\\theta+1}$，考生易误算为 $\\dfrac{\\theta}{\\theta-1}$ 或 $\\dfrac{1}{\\theta+1}$；","矩估计方程求解错误：$\\dfrac{\\theta}{\\theta+1}=\\bar X\\Rightarrow\\theta=\\bar X(\\theta+1)\\Rightarrow\\theta(1-\\bar X)=\\bar X\\Rightarrow\\theta=\\dfrac{\\bar X}{1-\\bar X}$，移项易错；","似然函数连乘时指数处理错误：$\\prod x_i^{\\theta-1}=\\left(\\prod x_i\\right)^{\\theta-1}$，对数后为 $(\\theta-1)\\sum\\ln x_i$；","对数似然求导错误：$\\dfrac{\\mathrm{d}}{\\mathrm{d}\\theta}\\big[n\\ln\\theta+(\\theta-1)\\sum\\ln x_i\\big]=\\dfrac{n}{\\theta}+\\sum\\ln x_i$，注意 $(\\theta-1)$ 求导为 $1$；","MLE 结果符号错误：$\\hat\\theta=-\\dfrac{n}{\\sum\\ln X_i}$，因 $0<X_i<1$ 时 $\\ln X_i<0$，故 $\\sum\\ln X_i<0$，$\\hat\\theta>0$，负号不能丢；","未验证二阶导数或说明最大值：虽然本题显然，但规范答题应验证。"],"ext":["考纲定位：矩估计与 MLE 是参数估计板块绝对核心，西北大学每年必考计算题，通常给出一个含单参数的密度函数要求两种估计，本题是最典型的考法；","前置知识点：期望积分计算、似然函数构造、对数求导；","后置串联：估计量的评价（无偏性、有效性、相合性）、充分统计量、指数族分布、贝叶斯估计；","命题延伸方向：双参数同时估计（如 Weibull 分布、Gamma 分布）、离散分布的 MLE（如泊松、二项、几何）、似然方程无解时的边界 MLE（如 $U(0,\\theta)$ 中 $\\hat\\theta=X_{(n)}$）、MLE 的不变性。"],"kps":["极大似然估计","矩估计","连续型密度与常见分布","总体与样本、统计量"],"pts":15},{"year":2026,"no":5,"type":"计算","stem":"$X_1,X_2,\\ldots,X_9$ 来自于总体正态 $N(\\mu,1)$，检验假设 $H_0:\\mu=0$ vs $H_1:\\mu\\neq 0$，取拒绝域为 $W=\\{|\\bar X|\\geq C\\}$。\n（1）在显著性水平 $\\alpha=0.05$ 下，求常数 $C$；若 $\\bar X=0.1$，是否可以据此推断出 $\\mu=0$？\n（2）若取拒绝域 $W=\\{|\\bar X|>1.15\\}$，求检验犯第二类错误的概率。","sol":"$n=9$，$\\sigma^2=1$ 已知，$\\bar X\\sim N\\!\\left(\\mu,\\dfrac{1}{9}\\right)$，$\\dfrac{\\sigma}{\\sqrt n}=\\dfrac{1}{3}$。\n\n（1）显著性水平 $\\alpha=P(\\text{拒绝 }H_0\\mid H_0\\text{ 为真})=P(|\\bar X|\\geq C\\mid\\mu=0)$。$H_0$ 下 $\\bar X\\sim N\\!\\left(0,\\dfrac{1}{9}\\right)$，标准化\n\n$$P(|\\bar X|\\geq C)=P(|3\\bar X|\\geq 3C)=2[1-\\Phi(3C)]=0.05.$$\n\n故 $\\Phi(3C)=0.975$，$3C=1.96$，$C=\\dfrac{1.96}{3}\\approx 0.653$。\n\n若 $\\bar X=0.1$，$|0.1|<0.653$，不落入拒绝域，故不拒绝 $H_0$，即可以认为 $\\mu=0$（在 $\\alpha=0.05$ 下没有足够证据否定 $\\mu=0$）。\n\n（2）拒绝域 $W=\\{|\\bar X|>1.15\\}$。第二类错误概率 $\\beta=P(\\text{不拒绝 }H_0\\mid H_1\\text{ 为真})=P(|\\bar X|\\leq 1.15\\mid\\mu\\neq 0)$。题目未指定 $\\mu$ 的具体备择值，通常需给定 $\\mu$ 的具体值。若题目隐含求在某个 $\\mu$ 处的 $\\beta$，需说明。\n\n假设题目意在求某特定 $\\mu$ 处的 $\\beta$（回忆版可能遗漏了具体值）。一般此类题会给出如 $\\mu=1$ 等具体值。若按常见考法，假设求 $\\mu=1$ 处：\n\n$$\\beta=P(|\\bar X|\\leq 1.15\\mid\\mu=1)=P(-1.15\\leq\\bar X\\leq 1.15\\mid\\mu=1)$$\n\n$$=P\\!\\left(\\dfrac{-1.15-1}{1/3}\\leq Z\\leq\\dfrac{1.15-1}{1/3}\\right)=P(-6.45\\leq Z\\leq 0.45)=\\Phi(0.45)-\\Phi(-6.45)\\approx 0.6736-0=0.6736.$$\n\n注：回忆版未给出具体备择 $\\mu$ 值，实际答题时需根据题目给出的 $\\mu$ 值计算。若题目确实未给出，则 $\\beta$ 是 $\\mu$ 的函数 $\\beta(\\mu)=\\Phi(3(1.15-\\mu))-\\Phi(3(-1.15-\\mu))$。","traps":["标准误用错：$\\bar X$ 的标准差为 $\\dfrac{\\sigma}{\\sqrt n}=\\dfrac{1}{3}$，而非 $\\sigma=1$，标准化时应为 $3(\\bar X-\\mu)$；","分位数对应错误：$\\alpha=0.05$ 双侧检验对应 $z_{0.975}=1.96$，考生易误用 $1.645$；","$C$ 的计算：$C=\\dfrac{z_{\\alpha/2}\\sigma}{\\sqrt n}=\\dfrac{1.96}{3}\\approx 0.653$，考生易忘记除以 $\\sqrt n$；","\"不拒绝 $H_0$\"与\"接受 $H_0$\"的表述：假设检验中只能说\"不拒绝 $H_0$\"或\"没有足够证据拒绝 $H_0$\"，不能说\"证明 $\\mu=0$\"或\"接受 $H_0$\"；","第二类错误的前提：$\\beta=P(\\text{不拒绝 }H_0\\mid H_1\\text{ 为真})$，必须指定 $H_1$ 中 $\\mu$ 的具体值，否则 $\\beta$ 是函数而非常数；","第二类错误概率计算中标准化方向：$P(|\\bar X|\\leq 1.15\\mid\\mu=\\mu_1)=P\\!\\left(\\dfrac{-1.15-\\mu_1}{\\sigma/\\sqrt n}\\leq Z\\leq\\dfrac{1.15-\\mu_1}{\\sigma/\\sqrt n}\\right)$，上下限都要减 $\\mu_1$。"],"ext":["考纲定位：假设检验是数理统计核心板块，西北大学几乎每年必考，通常考察正态总体均值的检验（$\\sigma$ 已知用 $Z$ 检验，$\\sigma$ 未知用 $t$ 检验），并结合两类错误概率计算；","前置知识点：正态分布的标准化、分位数、抽样分布 $\\bar X\\sim N(\\mu,\\sigma^2/n)$；","后置串联：$t$ 检验（$\\sigma$ 未知）、方差的 $\\chi^2$ 检验、两总体均值差的检验、$p$ 值法、检验的功效函数（power function）；","命题延伸方向：$\\sigma$ 未知时的 $t$ 检验、单侧检验的拒绝域、给定 $\\beta$ 反求样本量 $n$、功效函数 $\\pi(\\mu)=1-\\beta(\\mu)$ 的绘制与分析、$p$ 值的计算与比较。"],"kps":["假设检验原理与拒绝域","两类错误与功效"],"pts":15},{"year":2026,"no":6,"type":"计算","stem":"盒子里有黑白两种颜色的球，做以下实验：有放回地连续摸球，直到摸到白球为止，记录摸球次数，重复实验 100 次，得到以下结果：\n摸球次数：1, 2, 3, 4；频数：43, 31, 15, 11\n问盒子里白球和黑球数量是否相等？","sol":"有放回摸球直到摸到白球为止，摸球次数 $X$ 服从几何分布：$P(X=k)=(1-p)^{k-1}p$，$k=1,2,\\ldots$，其中 $p$ 为每次摸到白球的概率。\n\n若白球黑球数量相等，则 $p=\\dfrac{1}{2}$。检验 $H_0:p=\\dfrac{1}{2}$（即几何分布参数 $p=\\dfrac{1}{2}$）vs $H_1:p\\neq\\dfrac{1}{2}$。\n\n$H_0$ 下，$X\\sim\\mathrm{Geometric}(p=\\tfrac{1}{2})$：\n\n- $P(X=1)=\\dfrac{1}{2}=0.5$，期望频数 $E_1=100\\times0.5=50$\n- $P(X=2)=\\dfrac{1}{2}\\cdot\\dfrac{1}{2}=\\dfrac{1}{4}=0.25$，$E_2=25$\n- $P(X=3)=\\left(\\dfrac{1}{2}\\right)^2\\cdot\\dfrac{1}{2}=\\dfrac{1}{8}=0.125$，$E_3=12.5$\n- $P(X=4)=\\left(\\dfrac{1}{2}\\right)^3\\cdot\\dfrac{1}{2}=\\dfrac{1}{16}=0.0625$，$E_4=6.25$\n- $P(X\\geq 5)=1-\\left(\\dfrac{1}{2}+\\dfrac{1}{4}+\\dfrac{1}{8}+\\dfrac{1}{16}\\right)=\\dfrac{1}{16}=0.0625$，$E_5=6.25$\n\n注意：实际观测中摸球次数最大为 4，没有 $\\geq 5$ 的观测。但理论上 $X$ 可以取 $\\geq 5$。为了卡方检验的有效性，需将期望频数小于 5 的组合并。$E_4=6.25>5$，$E_5=6.25>5$，但实际观测中 $X\\geq 5$ 的频数为 $0$。\n\n将 $X=4$ 和 $X\\geq 5$ 合并为\"$X\\geq 4$\"：\n- 观测频数：$11+0=11$\n- 期望频数：$6.25+6.25=12.5$\n\n或者按题目给出的 4 组直接计算（假设实验只记录到第 4 次，第 4 次包含\"$\\geq 4$\"）：\n\nPearson 卡方统计量：\n\n$$\\chi^2=\\sum_i\\dfrac{(O_i-E_i)^2}{E_i}=\\dfrac{(43-50)^2}{50}+\\dfrac{(31-25)^2}{25}+\\dfrac{(15-12.5)^2}{12.5}+\\dfrac{(11-6.25)^2}{6.25}$$\n\n$$=\\dfrac{49}{50}+\\dfrac{36}{25}+\\dfrac{6.25}{12.5}+\\dfrac{22.5625}{6.25}=0.98+1.44+0.5+3.61=6.53.$$\n\n自由度 $=$ 组数 $-$ 估计参数个数 $-1=4-0-1=3$（$p=\\dfrac{1}{2}$ 是 $H_0$ 指定的，不需估计）。$\\chi^2_{0.95}(3)=7.815$。由于 $6.53<7.815$，不拒绝 $H_0$，即在 $\\alpha=0.05$ 下可以认为白球和黑球数量相等。\n\n注：若合并 $X\\geq 4$ 组，则自由度 $=3-0-1=2$，$\\chi^2=0.98+1.44+0.5+\\dfrac{(11-12.5)^2}{12.5}=2.92+0.18=3.10<\\chi^2_{0.95}(2)=5.991$，同样不拒绝 $H_0$。","traps":["未识别几何分布：有放回摸球直到首次成功（摸到白球），摸球次数服从几何分布，考生易误认为二项分布或其他；","几何分布概率公式记错：$P(X=k)=(1-p)^{k-1}p$，$k=1,2,\\ldots$，考生易写成 $(1-p)^k p$ 或 $p(1-p)^k$；","$p=\\dfrac{1}{2}$ 时各概率计算错误：$P(X=1)=\\dfrac{1}{2},\\ P(X=2)=\\dfrac{1}{4},\\ P(X=3)=\\dfrac{1}{8},\\ P(X=4)=\\dfrac{1}{16}$；","期望频数计算：$E_i=n\\times P(X=i)$，$n=100$；","卡方统计量公式：$\\chi^2=\\sum\\dfrac{(O_i-E_i)^2}{E_i}$，考生易误用 $\\dfrac{(O_i-E_i)^2}{O_i}$；","自由度确定：分布完全已知（$p$ 由 $H_0$ 指定）时 $\\mathrm{df}=k-1$；若 $p$ 需由样本估计，则 $\\mathrm{df}=k-2$；","期望频数小于 5 的组需合并：本题 $E_4=6.25>5$ 可不合并，但若有组 $E_i<5$ 必须合并；","结论表述：不拒绝 $H_0\\neq$ 证明 $H_0$ 成立，应说\"在 $\\alpha=0.05$ 下没有足够证据表明白球黑球数量不等\"。"],"ext":["考纲定位：卡方拟合优度检验是假设检验板块的重要应用考点，西北大学偶有考察，通常结合离散分布（几何、二项、泊松）给出频数表进行检验；","前置知识点：几何分布的定义与概率、Pearson 卡方统计量、卡方分布分位数；","后置串联：列联表的独立性检验（卡方检验）、正态性检验（Shapiro-Wilk、Kolmogorov-Smirnov）、似然比检验（G 统计量）；","命题延伸方向：泊松分布的拟合优度检验（参数 $\\lambda$ 需估计，自由度减 2）、二项分布拟合检验、列联表独立性检验、Fisher 精确检验。"],"kps":["卡方拟合优度与列联表","假设检验原理与拒绝域","全概率与贝叶斯","抽样分布与三大分布构造","常见离散分布","古典概型与计数"],"pts":15},{"year":2026,"no":1,"type":"证明","stem":"设 $0<P(A)<1$，证明事件 $A$ 和 $B$ 独立的充要条件是 $P(B\\mid A)=P(B\\mid\\bar A)$。","sol":"**必要性（$\\Rightarrow$）**：若 $A$ 与 $B$ 独立，则 $P(AB)=P(A)P(B)$。\n\n$$P(B\\mid A)=\\dfrac{P(AB)}{P(A)}=\\dfrac{P(A)P(B)}{P(A)}=P(B).$$\n\n又 $P(\\bar A B)=P(B)-P(AB)=P(B)-P(A)P(B)=P(B)(1-P(A))=P(B)P(\\bar A)$，即 $\\bar A$ 与 $B$ 独立。\n\n$$P(B\\mid\\bar A)=\\dfrac{P(\\bar A B)}{P(\\bar A)}=\\dfrac{P(B)P(\\bar A)}{P(\\bar A)}=P(B).$$\n\n故 $P(B\\mid A)=P(B\\mid\\bar A)=P(B)$。\n\n**充分性（$\\Leftarrow$）**：若 $P(B\\mid A)=P(B\\mid\\bar A)$，设其值为 $p$。\n\n$$P(B\\mid A)=\\dfrac{P(AB)}{P(A)}=p\\Rightarrow P(AB)=p\\,P(A).$$\n\n$$P(B\\mid\\bar A)=\\dfrac{P(\\bar A B)}{P(\\bar A)}=p\\Rightarrow P(\\bar A B)=p\\,P(\\bar A).$$\n\n$$P(B)=P(AB)+P(\\bar A B)=p\\,P(A)+p\\,P(\\bar A)=p[P(A)+P(\\bar A)]=p.$$\n\n故 $P(AB)=P(B)P(A)$，即 $A$ 与 $B$ 独立。","traps":["必要性证明中只证 $P(B\\mid A)=P(B)$，未证 $P(B\\mid\\bar A)=P(B)$：需同时说明 $\\bar A$ 与 $B$ 也独立；","充分性证明中 $P(B)$ 的分解：$P(B)=P(AB)+P(\\bar A B)$，利用 $A$ 与 $\\bar A$ 构成划分；","条件 $0<P(A)<1$ 的作用：保证 $P(A)>0$ 且 $P(\\bar A)>0$，从而 $P(B\\mid A)$ 和 $P(B\\mid\\bar A)$ 都有定义，考生易忽略说明；","充要条件证明需双向都证，不能只证一个方向；","独立的定义是 $P(AB)=P(A)P(B)$，最终必须回到这个定义。"],"ext":["考纲定位：事件独立性是概率论基础概念，西北大学常以证明题或辨析题考察独立性的等价刻画；","前置知识点：条件概率定义、对立事件、概率的有限可加性；","后置串联：多个事件的独立性（两两独立 vs 相互独立）、独立事件的性质（若 $A,B$ 独立则 $\\bar A,B$ 独立、$A,\\bar B$ 独立、$\\bar A,\\bar B$ 独立）、条件独立；","命题延伸方向：证明 $A,B$ 独立 $\\iff P(A\\mid B)=P(A\\mid\\bar B)$、证明三事件相互独立的等价条件、独立与互不相容的辨析。"],"kps":["事件关系与概率性质","条件概率与乘法公式","事件独立性"],"pts":15},{"year":2026,"no":2,"type":"证明","stem":"设 $X$ 服从二项分布 $b(n,p)$，$n$ 已知，$p$ 未知，证明不存在形如 $T(X_1)$ 的无偏估计量估计 $1/p$。","sol":"反证法。假设存在统计量 $T(X_1)$（$X_1\\sim b(n,p)$）是 $1/p$ 的无偏估计，即对所有 $p\\in(0,1)$，有\n\n$$E_p[T(X_1)]=\\dfrac{1}{p}.$$\n\n$X_1$ 的可能取值为 $0,1,\\ldots,n$，设 $T(k)=a_k$（$k=0,1,\\ldots,n$）为常数。则\n\n$$E_p[T(X_1)]=\\sum_{k=0}^{n}a_k\\,\\binom{n}{k}\\,p^k(1-p)^{n-k}.$$\n\n这是一个关于 $p$ 的 $n$ 次多项式（因为 $(1-p)^{n-k}$ 展开后最高次为 $p^n$）。\n\n而 $1/p$ 在 $p\\in(0,1)$ 上不是多项式（在 $p=0$ 处有极点，无法表示为有限次多项式）。\n\n一个 $n$ 次多项式不可能在区间 $(0,1)$ 上恒等于 $1/p$（非多项式函数），矛盾。\n\n故不存在形如 $T(X_1)$ 的无偏估计量估计 $1/p$。\n\n更严谨地，利用多项式恒等定理：若 $\\sum a_k\\binom{n}{k}p^k(1-p)^{n-k}=1/p$ 对所有 $p\\in(0,1)$ 成立，两边乘 $p$ 得 $p\\cdot\\sum\\cdots=1$，左边是 $n+1$ 次多项式，右边是常数 $1$。多项式在无穷多点相等则恒等，但左边次数 $\\geq 1$（除非系数全为 $0$，但此时左边 $=0\\neq 1$），矛盾。","traps":["未使用反证法：本题最自然的证法是反证法，假设存在然后推出矛盾；","$T(X_1)$ 的取值范围：$X_1\\sim b(n,p)$ 只能取 $0,1,\\ldots,n$，故 $T(X_1)$ 只有 $n+1$ 个可能取值 $a_0,\\ldots,a_n$，考生易忽略这一点而考虑连续函数；","期望是 $p$ 的多项式：$E[T(X_1)]=\\sum a_k\\binom{n}{k}p^k(1-p)^{n-k}$ 是 $p$ 的 $n$ 次多项式，这是关键观察；","$1/p$ 不是多项式：$1/p$ 在 $p=0$ 处发散，任何有限次多项式都无法在 $(0,1)$ 上恒等于 $1/p$；","多项式恒等定理的应用：两个多项式在无穷多个点上相等则恒等，$(0,1)$ 有无穷多点；","证明不严谨：只说\"$1/p$ 不是多项式\"不够，需说明 $E[T(X_1)]$ 是多项式且多项式不可能恒等于非多项式。"],"ext":["考纲定位：无偏估计的存在性问题是参数估计评价标准的深化考点，西北大学偶有证明题考察，本题体现了\"并非所有参数都有无偏估计\"的重要思想；","前置知识点：无偏估计定义、二项分布、多项式性质；","后置串联：Cramér-Rao 下界与有效估计、充分完备统计量与 MVUE（Lehmann-Scheffé）、有偏估计与均方误差准则、可估参数（estimable parameter）的概念；","命题延伸方向：证明 $1/p$ 在 $X\\sim b(1,p)$（伯努利）下不存在无偏估计、证明 $p^2$ 在 $X\\sim b(1,p)$ 下不存在无偏估计（单个伯努利样本）、利用完备充分统计量判断可估性。"],"kps":["无偏性","常见离散分布","估计量评价标准"],"pts":15},{"year":2025,"no":1,"type":"证明","stem":"$A$、$B$、$C$ 两两独立，$A$ 与 $B-C$ 独立，证明 $A$、$B$、$C$ 相互独立。","sol":"已知 $A$、$B$、$C$ 两两独立，即：\n\n$$P(AB)=P(A)P(B),\\quad P(AC)=P(A)P(C),\\quad P(BC)=P(B)P(C).$$\n\n要证相互独立，还需证 $P(ABC)=P(A)P(B)P(C)$。\n\n已知 $A$ 与 $B-C$ 独立，即 $P(A\\cap(B-C))=P(A)P(B-C)$。$B-C=B\\cap\\bar{C}$，故 $A\\cap(B-C)=A\\cap B\\cap\\bar{C}=AB-ABC$：\n\n$$P(A\\cap(B-C))=P(AB)-P(ABC)=P(A)P(B)-P(ABC).$$\n\n另一方面，\n\n$$P(B-C)=P(B)-P(BC)=P(B)-P(B)P(C)=P(B)(1-P(C))=P(B)P(\\bar{C}).$$\n\n$$P(A)P(B-C)=P(A)P(B)P(\\bar{C}).$$\n\n由独立性：\n\n$$P(A)P(B)-P(ABC)=P(A)P(B)P(\\bar{C})=P(A)P(B)(1-P(C))=P(A)P(B)-P(A)P(B)P(C).$$\n\n两边消去 $P(A)P(B)$，得 $P(ABC)=P(A)P(B)P(C)$。\n\n结合两两独立，$A$、$B$、$C$ 相互独立。","traps":["差事件 $B-C$ 的含义：$B-C=B\\cap\\bar{C}$，考生易误写为 $B-C=B\\backslash C$ 但概率运算出错；","$P(A\\cap(B-C))$ 的展开：$A\\cap(B-C)=AB-ABC$，概率为 $P(AB)-P(ABC)$，需注意 $ABC\\subset AB$；","$P(B-C)$ 的计算：利用 $BC\\subset B$，$P(B-C)=P(B)-P(BC)$，再代入两两独立 $P(BC)=P(B)P(C)$；","相互独立的定义：三事件相互独立需同时满足两两独立（3 个等式）+ $P(ABC)=P(A)P(B)P(C)$（1 个等式），共 4 个等式，考生易遗漏；","证明逻辑：已知两两独立，只需补证 $P(ABC)=P(A)P(B)P(C)$，目标明确。"],"ext":["考纲定位：多事件独立性是概率论基础重要概念，西北大学偏好以证明题考察两两独立与相互独立的关系；","前置知识点：事件的差运算、概率的减法公式、两两独立的定义；","后置串联：$n$ 个事件的独立性定义、独立事件的性质、条件独立；","命题延伸方向：给定部分独立条件证明相互独立、构造反例说明两两独立不蕴含相互独立、独立与互不相容的辨析。"],"kps":["事件独立性","事件关系与概率性质"],"pts":15},{"year":2025,"no":2,"type":"证明","stem":"$X\\sim N(1,\\sigma^2)$，证明 $\\hat{\\sigma}^2=\\dfrac{1}{n}\\displaystyle\\sum_{i=1}^{n}(X_i-1)^2$ 是 $\\sigma^2$ 的相合估计。","sol":"方法一：利用切比雪夫不等式。\n\n$X_i\\sim N(1,\\sigma^2)$，则 $\\dfrac{X_i-1}{\\sigma}\\sim N(0,1)$，故 $\\dfrac{(X_i-1)^2}{\\sigma^2}\\sim\\chi^2(1)$。\n\n$$\\dfrac{1}{\\sigma^2}\\sum_{i=1}^{n}(X_i-1)^2\\sim\\chi^2(n).$$\n\n$$\\hat{\\sigma}^2=\\dfrac{1}{n}\\sum_{i=1}^{n}(X_i-1)^2=\\dfrac{\\sigma^2}{n}\\cdot\\left[\\dfrac{1}{\\sigma^2}\\sum_{i=1}^{n}(X_i-1)^2\\right].$$\n\n$$E(\\hat{\\sigma}^2)=\\dfrac{\\sigma^2}{n}\\cdot n=\\sigma^2\\quad(\\text{无偏}).$$\n\n$$\\mathrm{Var}(\\hat{\\sigma}^2)=\\dfrac{\\sigma^4}{n^2}\\cdot 2n=\\dfrac{2\\sigma^4}{n}\\quad(\\chi^2(n)\\text{ 的方差为 }2n).$$\n\n由切比雪夫不等式，对任意 $\\varepsilon>0$：\n\n$$P(|\\hat{\\sigma}^2-\\sigma^2|\\geq\\varepsilon)\\leq\\dfrac{\\mathrm{Var}(\\hat{\\sigma}^2)}{\\varepsilon^2}=\\dfrac{2\\sigma^4}{n\\varepsilon^2}\\to 0\\quad(n\\to\\infty).$$\n\n故 $\\hat{\\sigma}^2$ 依概率收敛于 $\\sigma^2$，即 $\\hat{\\sigma}^2$ 是 $\\sigma^2$ 的相合估计。\n\n方法二：利用辛钦大数定律。$(X_i-1)^2$ i.i.d.，$E[(X_i-1)^2]=\\sigma^2$，由辛钦大数定律，$\\dfrac{1}{n}\\displaystyle\\sum_{i=1}^{n}(X_i-1)^2\\xrightarrow{P}\\sigma^2$（依概率），故相合。","traps":["相合估计的定义：$\\hat{\\theta}_n\\xrightarrow{P}\\theta$（依概率），即对任意 $\\varepsilon>0$，$P(|\\hat{\\theta}_n-\\theta|\\geq\\varepsilon)\\to 0$；","卡方分布的方差：$\\chi^2(n)$ 的期望为 $n$，方差为 $2n$，考生易记错方差为 $n$ 或其他；","$\\hat{\\sigma}^2$ 的方差计算：$\\mathrm{Var}(\\hat{\\sigma}^2)=\\mathrm{Var}\\!\\left(\\dfrac{\\sigma^2}{n}\\cdot\\chi^2(n)\\right)=\\dfrac{\\sigma^4}{n^2}\\cdot 2n=\\dfrac{2\\sigma^4}{n}$；","切比雪夫不等式的应用：$P(|X-E(X)|\\geq\\varepsilon)\\leq\\dfrac{\\mathrm{Var}(X)}{\\varepsilon^2}$，需先验证无偏性 $E(\\hat{\\sigma}^2)=\\sigma^2$；","均值已知为 $1$：本题 $\\mu=1$ 已知，故用 $(X_i-1)^2$ 而非 $(X_i-\\bar{X})^2$，后者自由度为 $n-1$；","辛钦大数定律的条件：i.i.d. + 期望存在，$(X_i-1)^2$ 满足。"],"ext":["考纲定位：相合性是点估计三大评价标准之一，西北大学常以证明题考察，通常结合切比雪夫不等式或大数定律；","前置知识点：切比雪夫不等式、卡方分布的数字特征、无偏性；","后置串联：无偏 + 方差 $\\to 0\\implies$ 相合、渐近正态性、估计量的大样本性质；","命题延伸方向：证明样本方差 $S^2$ 是 $\\sigma^2$ 的相合估计、证明 $\\bar{X}$ 是 $\\mu$ 的相合估计、证明 MLE 的相合性（在正则条件下）。"],"kps":["切比雪夫不等式","相合性","大数定律","抽样分布与三大分布构造"],"pts":15},{"year":2025,"no":1,"type":"计算","stem":"$P(X;\\sigma,\\mu)=\\dfrac{1}{\\sigma}e^{-(X-\\mu)/\\sigma}$，$X>\\mu$，$\\sigma>0$，求 $\\sigma,\\mu$ 的矩估计与极大似然估计。","sol":"总体密度 $f(x;\\mu,\\sigma)=\\dfrac{1}{\\sigma}e^{-(x-\\mu)/\\sigma}$，$x>\\mu$，$\\sigma>0$。这是位置参数为 $\\mu$、尺度参数为 $\\sigma$ 的指数分布，即 $X-\\mu\\sim\\mathrm{Exp}(1/\\sigma)$。\n\n**矩估计：**\n\n$$E(X)=\\mu+\\sigma\\quad(\\text{因 }E(X-\\mu)=\\sigma).$$\n\n$$E(X^2)=\\mathrm{Var}(X)+[E(X)]^2=\\sigma^2+(\\mu+\\sigma)^2=\\mu^2+2\\mu\\sigma+2\\sigma^2.$$\n\n令：\n\n$$\\mu+\\sigma=\\bar{X}\\quad\\cdots(1)$$\n\n$$\\mu^2+2\\mu\\sigma+2\\sigma^2=\\dfrac{1}{n}\\sum_{i=1}^{n}X_i^2\\quad\\cdots(2)$$\n\n由 (1)：$\\mu=\\bar{X}-\\sigma$，代入 (2)：\n\n$$(\\bar{X}-\\sigma)^2+2(\\bar{X}-\\sigma)\\sigma+2\\sigma^2=\\dfrac{1}{n}\\sum_{i=1}^{n}X_i^2.$$\n\n$$\\bar{X}^2-2\\bar{X}\\sigma+\\sigma^2+2\\bar{X}\\sigma-2\\sigma^2+2\\sigma^2=\\bar{X}^2+\\sigma^2=\\dfrac{1}{n}\\sum_{i=1}^{n}X_i^2.$$\n\n$$\\sigma^2=\\dfrac{1}{n}\\sum_{i=1}^{n}X_i^2-\\bar{X}^2=\\dfrac{1}{n}\\sum_{i=1}^{n}(X_i-\\bar{X})^2=S_n^2\\quad(\\text{样本二阶中心矩}).$$\n\n故\n\n$$\\hat{\\sigma}_M=\\sqrt{\\dfrac{1}{n}\\sum_{i=1}^{n}(X_i-\\bar{X})^2},\\qquad \\hat{\\mu}_M=\\bar{X}-\\sqrt{\\dfrac{1}{n}\\sum_{i=1}^{n}(X_i-\\bar{X})^2}.$$\n\n**极大似然估计：**\n\n似然函数\n\n$$L(\\mu,\\sigma)=\\prod_{i=1}^{n}\\dfrac{1}{\\sigma}e^{-(x_i-\\mu)/\\sigma}=\\sigma^{-n}\\exp\\!\\left[-\\dfrac{1}{\\sigma}\\sum_{i=1}^{n}(x_i-\\mu)\\right],$$\n\n要求 $x_i>\\mu$ 对所有 $i$，即 $\\mu<\\min\\{x_i\\}$。\n\n$$\\ln L=-n\\ln\\sigma-\\dfrac{1}{\\sigma}\\sum_{i=1}^{n}(x_i-\\mu)=-n\\ln\\sigma-\\dfrac{1}{\\sigma}\\sum_{i=1}^{n}x_i+\\dfrac{n\\mu}{\\sigma}.$$\n\n对 $\\mu$ 求偏导：$\\dfrac{\\partial(\\ln L)}{\\partial\\mu}=\\dfrac{n}{\\sigma}>0$，故 $\\ln L$ 关于 $\\mu$ 单调递增，在 $\\mu$ 的取值范围 $\\mu\\leq x_{(1)}$（最小值）内，$\\mu$ 越大 $L$ 越大，故 $\\hat{\\mu}_{\\mathrm{MLE}}=X_{(1)}=\\min\\{X_i\\}$。\n\n对 $\\sigma$ 求偏导（$\\mu$ 固定时）：$\\dfrac{\\partial(\\ln L)}{\\partial\\sigma}=-\\dfrac{n}{\\sigma}+\\dfrac{1}{\\sigma^2}\\displaystyle\\sum_{i=1}^{n}(x_i-\\mu)=0$，解得 $\\sigma=\\dfrac{1}{n}\\displaystyle\\sum_{i=1}^{n}(x_i-\\mu)$。\n\n代入 $\\hat{\\mu}=X_{(1)}$，得\n\n$$\\hat{\\sigma}_{\\mathrm{MLE}}=\\dfrac{1}{n}\\sum_{i=1}^{n}(X_i-X_{(1)})=\\bar{X}-X_{(1)}.$$","traps":["分布识别错误：$f(x)=\\dfrac{1}{\\sigma}e^{-(x-\\mu)/\\sigma},\\ x>\\mu$ 是双参数指数分布，$X-\\mu\\sim\\mathrm{Exp}(1/\\sigma)$，均值为 $\\mu+\\sigma$，方差为 $\\sigma^2$；","矩估计中 $E(X^2)$ 计算：$E(X^2)=\\mathrm{Var}(X)+[E(X)]^2=\\sigma^2+(\\mu+\\sigma)^2$，考生易直接积分算错；","矩估计方程求解：利用 $E(X^2)-[E(X)]^2=\\mathrm{Var}(X)=\\sigma^2$ 可直接得 $\\sigma^2=$ 样本二阶中心矩，无需硬解方程组；","MLE 中 $\\mu$ 的估计：似然函数关于 $\\mu$ 单调递增（$\\partial\\ln L/\\partial\\mu=n/\\sigma>0$），故 $\\mu$ 的 MLE 为样本最小值 $X_{(1)}$，考生易对 $\\mu$ 求导令其为 $0$ 而得到矛盾；","MLE 中 $\\sigma$ 的估计：代入 $\\hat{\\mu}=X_{(1)}$ 后 $\\hat{\\sigma}=\\bar{X}-X_{(1)}$，考生易忘记代入而写成 $\\hat{\\sigma}=\\dfrac{1}{n}\\displaystyle\\sum_{i=1}^{n}(X_i-\\mu)$；","约束条件 $x_i>\\mu$：似然函数的定义域要求 $\\mu<\\min x_i$，这是 $\\hat{\\mu}=X_{(1)}$ 的关键。"],"ext":["考纲定位：双参数分布的矩估计与 MLE 是参数估计的难点，西北大学偶有考察，本题的位置-尺度指数分布是经典考法；","前置知识点：指数分布的数字特征、似然函数构造、偏导数求极值；","后置串联：MLE 的不变性、估计量的评价（无偏性、相合性）、充分统计量、位置-尺度族分布；","命题延伸方向：Weibull 分布双参数估计、Gamma 分布双参数估计、均匀分布 $U(\\alpha,\\beta)$ 双参数估计（MLE 为最小最大值）、似然方程无解时的边界 MLE。"],"kps":["极大似然估计","矩估计","连续型密度与常见分布"],"pts":15},{"year":2025,"no":2,"type":"计算","stem":"$(X,Y)$ 服从 $D:|x|+|y|\\leq 1$ 上的均匀分布。（1）$X$ 与 $Y$ 是否独立？（2）$U=\\begin{cases}1,&X+Y\\geq 0\\\\0,&X+Y<0\\end{cases}$，$V=\\begin{cases}1,&X-Y\\geq 0\\\\0,&X-Y<0\\end{cases}$，$U$ 与 $V$ 是否独立？","sol":"区域 $D:|x|+|y|\\leq 1$ 是一个以 $(\\pm 1,0),(0,\\pm 1)$ 为顶点的菱形（正方形旋转 $45°$），面积 $S_D=2$（对角线长 $2$ 和 $2$，面积 $=2\\times 2/2=2$）。联合密度 $f(x,y)=\\dfrac{1}{2}$，$(x,y)\\in D$；其他为 $0$。\n\n（1）**$X$ 与 $Y$ 是否独立？**\n\n求边际密度：$f_X(x)=\\displaystyle\\int_{-\\infty}^{\\infty}f(x,y)\\,\\mathrm{d}y$。\n\n对固定 $x\\in(-1,1)$，$y$ 的范围为 $|y|\\leq 1-|x|$，即 $y\\in(-(1-|x|),\\,1-|x|)$。\n\n$$f_X(x)=\\int_{-(1-|x|)}^{1-|x|}\\dfrac{1}{2}\\,\\mathrm{d}y=\\dfrac{1}{2}\\cdot 2(1-|x|)=1-|x|,\\quad -1<x<1.$$\n\n同理 $f_Y(y)=1-|y|,\\ -1<y<1$。\n\n$$f_X(x)\\cdot f_Y(y)=(1-|x|)(1-|y|)\\neq\\dfrac{1}{2}=f(x,y)\\quad(\\text{在 }D\\text{ 内}).$$\n\n例如取 $x=0,y=0$：$f_X(0)f_Y(0)=1\\times 1=1\\neq 1/2$。故 $X$ 与 $Y$ 不独立。\n\n也可直接判断：区域 $D$ 不是矩形（各变量取值范围不独立），故不独立。\n\n（2）**$U$ 与 $V$ 是否独立？**\n\n$U,V$ 均为 $0$-$1$ 变量。需验证 $P(U=i,V=j)=P(U=i)P(V=j)$ 对所有 $i,j\\in\\{0,1\\}$。\n\n利用对称性分析区域：\n- $U=1$ 对应 $X+Y\\geq 0$（菱形中直线 $x+y=0$ 上方的三角形，面积为菱形的一半 $=1$）；\n- $V=1$ 对应 $X-Y\\geq 0$（直线 $x-y=0$ 右方的三角形，面积 $=1$）；\n- 两条直线 $x+y=0$ 和 $x-y=0$ 将菱形分成 $4$ 个全等的三角形，每个面积 $=1/2$。\n\n四个区域：\n- $U=1,V=1$：$X+Y\\geq 0$ 且 $X-Y\\geq 0\\to$ 右侧三角形，面积 $=1/2$，$P=1/4$；\n- $U=1,V=0$：$X+Y\\geq 0$ 且 $X-Y<0\\to$ 上侧三角形，面积 $=1/2$，$P=1/4$；\n- $U=0,V=1$：$X+Y<0$ 且 $X-Y\\geq 0\\to$ 下侧三角形，面积 $=1/2$，$P=1/4$；\n- $U=0,V=0$：$X+Y<0$ 且 $X-Y<0\\to$ 左侧三角形，面积 $=1/2$，$P=1/4$。\n\n边际：$P(U=1)=1/4+1/4=1/2$，$P(U=0)=1/2$；$P(V=1)=1/4+1/4=1/2$，$P(V=0)=1/2$。\n\n验证：$P(U=1,V=1)=1/4=P(U=1)P(V=1)=\\dfrac{1}{2}\\times\\dfrac{1}{2}=\\dfrac{1}{4}$，其余三组同理均成立。故 $U$ 与 $V$ 独立。","traps":["菱形面积计算错误：$|x|+|y|\\leq 1$ 的面积为 $2$（不是 $1$ 或 $4$），可通过对角线法或积分计算；","边际密度积分限错误：对固定 $x$，$y$ 的范围是 $-(1-|x|)$ 到 $1-|x|$，长度为 $2(1-|x|)$；","独立性判断方法：连续型用 $f(x,y)=f_X(x)f_Y(y)$ 验证，或观察区域是否为矩形（非矩形则一定不独立）；","$U,V$ 的联合分布区域划分：$x+y=0$ 和 $x-y=0$ 两条直线将菱形分为 $4$ 个全等三角形，每个面积 $1/2$，概率 $1/4$；","离散变量独立性验证：需验证全部 $4$ 个联合概率等于边际乘积，不能只验证一个；","结论对比：$X,Y$ 不独立但 $U,V$ 独立，这是本题的核心考点——不独立的随机变量经过变换后可以独立。"],"ext":["考纲定位：二维均匀分布的独立性判断是多维随机变量的高频考点，西北大学偏好考察非矩形区域上的均匀分布，并通过离散化变换考察独立性的变化；","前置知识点：二维均匀分布、边际密度、区域面积计算；","后置串联：条件分布、随机变量变换的分布、协方差与相关系数（$X,Y$ 不相关但不独立）；","命题延伸方向：求 $X,Y$ 的相关系数（本题中 $\\mathrm{Cov}(X,Y)=0$，不相关但不独立）、求条件密度 $f_{Y|X}(y|x)$、$U,V$ 的联合分布表、其他区域（三角形、圆形）上的均匀分布独立性。"],"kps":["联合分布与边际分布","随机变量独立性判定","连续型密度与常见分布","二维区域型分布","事件独立性"],"pts":15},{"year":2025,"no":3,"type":"计算","stem":"$X\\sim N(\\mu_1,\\sigma_1^2)$，$Y\\sim N(\\mu_2,\\sigma_2^2)$，$X$ 与 $Y$ 独立，$\\sigma_2^2=4\\sigma_1^2$（未知），求 $H_0:\\mu_1=\\mu_2$，$H_1:\\mu_1\\neq\\mu_2$ 的拒绝域。","sol":"设 $X_1,\\ldots,X_n$ i.i.d. $N(\\mu_1,\\sigma_1^2)$，$Y_1,\\ldots,Y_m$ i.i.d. $N(\\mu_2,\\sigma_2^2)$，两样本独立，$\\sigma_2^2=4\\sigma_1^2$，$\\sigma_1^2$ 未知。\n\n$$\\bar{X}\\sim N\\!\\left(\\mu_1,\\dfrac{\\sigma_1^2}{n}\\right),\\qquad \\bar{Y}\\sim N\\!\\left(\\mu_2,\\dfrac{\\sigma_2^2}{m}\\right)=N\\!\\left(\\mu_2,\\dfrac{4\\sigma_1^2}{m}\\right).$$\n\n$$\\bar{X}-\\bar{Y}\\sim N\\!\\left(\\mu_1-\\mu_2,\\dfrac{\\sigma_1^2}{n}+\\dfrac{4\\sigma_1^2}{m}\\right)=N\\!\\left(\\mu_1-\\mu_2,\\sigma_1^2\\left(\\dfrac{1}{n}+\\dfrac{4}{m}\\right)\\right).$$\n\n$H_0$ 下 $\\mu_1-\\mu_2=0$，故\n\n$$\\dfrac{\\bar{X}-\\bar{Y}}{\\sigma_1\\sqrt{\\dfrac{1}{n}+\\dfrac{4}{m}}}\\sim N(0,1).$$\n\n但 $\\sigma_1$ 未知，需用样本方差估计。由于 $\\sigma_2^2=4\\sigma_1^2$，可以合并两个样本的信息估计 $\\sigma_1^2$：\n\n$$S_1^2=\\dfrac{1}{n-1}\\sum_{i=1}^{n}(X_i-\\bar{X})^2,\\qquad \\dfrac{(n-1)S_1^2}{\\sigma_1^2}\\sim\\chi^2(n-1);$$\n\n$$S_2^2=\\dfrac{1}{m-1}\\sum_{j=1}^{m}(Y_j-\\bar{Y})^2,\\qquad \\dfrac{(m-1)S_2^2}{\\sigma_2^2}=\\dfrac{(m-1)S_2^2}{4\\sigma_1^2}\\sim\\chi^2(m-1).$$\n\n合并估计：令 $S_p^2=\\dfrac{(n-1)S_1^2+(m-1)S_2^2/4}{n+m-2}$，则 $\\dfrac{(n+m-2)S_p^2}{\\sigma_1^2}\\sim\\chi^2(n+m-2)$。\n\n检验统计量：\n\n$$T=\\dfrac{\\bar{X}-\\bar{Y}}{S_p\\sqrt{\\dfrac{1}{n}+\\dfrac{4}{m}}}\\sim t(n+m-2)\\quad(H_0\\text{ 下}).$$\n\n拒绝域（双侧 $\\alpha$）：$W=\\{|T|\\geq t_{1-\\alpha/2}(n+m-2)\\}$。\n\n若两样本量相等 $n=m$，则简化：\n\n$$\\bar{X}-\\bar{Y}\\sim N\\!\\left(\\mu_1-\\mu_2,\\dfrac{5\\sigma_1^2}{n}\\right),$$\n\n$$S_p^2=\\dfrac{(n-1)S_1^2+(n-1)S_2^2/4}{2n-2}=\\dfrac{S_1^2+S_2^2/4}{2},$$\n\n$$T=\\dfrac{\\bar{X}-\\bar{Y}}{S_p\\sqrt{5/n}}\\sim t(2n-2).$$","traps":["方差比例关系的利用：$\\sigma_2^2=4\\sigma_1^2$ 是关键条件，不能直接用普通两样本 $t$ 检验（该检验要求 $\\sigma_1^2=\\sigma_2^2$）；","$\\bar{X}-\\bar{Y}$ 的方差：$\\mathrm{Var}(\\bar{X}-\\bar{Y})=\\dfrac{\\sigma_1^2}{n}+\\dfrac{\\sigma_2^2}{m}=\\dfrac{\\sigma_1^2}{n}+\\dfrac{4\\sigma_1^2}{m}=\\sigma_1^2\\left(\\dfrac{1}{n}+\\dfrac{4}{m}\\right)$，考生易写成 $\\sigma_1^2\\left(\\dfrac{1}{n}+\\dfrac{1}{m}\\right)$；","合并方差的构造：$S_2^2$ 需除以 $4$ 后才能与 $S_1^2$ 合并估计 $\\sigma_1^2$，即 $\\dfrac{(m-1)S_2^2}{4\\sigma_1^2}\\sim\\chi^2(m-1)$；","自由度：合并后自由度为 $(n-1)+(m-1)=n+m-2$；","检验统计量的分布：$H_0$ 下 $T\\sim t(n+m-2)$，不是 $N(0,1)$（因为 $\\sigma_1$ 未知，用 $S_p$ 代替）；","拒绝域形式：双侧检验拒绝域为 $|T|\\geq t_{1-\\alpha/2}(n+m-2)$。"],"ext":["考纲定位：两正态总体均值差的检验是假设检验板块重要考点，西北大学偏好考察方差不等（或成比例）时的检验，需构造合适的检验统计量；","前置知识点：两样本均值差的分布、卡方分布的可加性、$t$ 分布的构造；","后置串联：Behrens-Fisher 问题（方差均未知且不等时的近似检验）、配对 $t$ 检验、方差比的 $F$ 检验；","命题延伸方向：$\\sigma_2^2=k\\sigma_1^2$（一般比例）的检验、方差已知时的 $Z$ 检验、单侧检验的拒绝域、检验的 $p$ 值计算。"],"kps":["假设检验原理与拒绝域","双样本检验","总体与样本、统计量","数字特征与矩","抽样分布与三大分布构造"],"pts":15},{"year":2025,"no":4,"type":"计算","stem":"研究消费者对品牌是否有偏好，抽取了 $1000$ 人的样本。品牌 $1$-$5$ 的消费者数分别为 $210,183,220,212,175$。检验说明消费者对品牌是否有偏好。","sol":"检验消费者对 $5$ 个品牌是否有偏好，即检验各品牌被选择的概率是否相等。$H_0:p_1=p_2=p_3=p_4=p_5=1/5$（无偏好）；$H_1$：至少有一个 $p_i\\neq 1/5$（有偏好）。\n\n$H_0$ 下各品牌期望频数 $E_i=n\\times(1/5)=1000/5=200$。\n\nPearson 卡方统计量：\n\n$$\\chi^2=\\sum_{i=1}^{5}\\dfrac{(O_i-E_i)^2}{E_i}=\\dfrac{(210-200)^2}{200}+\\dfrac{(183-200)^2}{200}+\\dfrac{(220-200)^2}{200}+\\dfrac{(212-200)^2}{200}+\\dfrac{(175-200)^2}{200}.$$\n\n$$=\\dfrac{100}{200}+\\dfrac{289}{200}+\\dfrac{400}{200}+\\dfrac{144}{200}+\\dfrac{625}{200}=0.5+1.445+2+0.72+3.125=7.79.$$\n\n自由度 $\\mathrm{df}=k-1=5-1=4$（分布完全已知，无需估计参数）。$\\chi^2_{0.95}(4)=9.488$。\n\n由于 $7.79<9.488$，不拒绝 $H_0$，即在 $\\alpha=0.05$ 下没有足够证据表明消费者对品牌有偏好，可以认为消费者对各品牌无显著偏好。\n\n$p$ 值：$P(\\chi^2(4)>7.79)\\approx 0.10$（介于 $0.05$ 和 $0.10$ 之间），$p>0.05$，不拒绝 $H_0$。","traps":["原假设设定：$H_0$ 为\"无偏好\"即各品牌概率相等 $p_i=1/5$，$H_1$ 为\"有偏好\"；","期望频数计算：$E_i=n\\times p_i=1000\\times 1/5=200$，所有组相等；","卡方统计量公式：$\\chi^2=\\displaystyle\\sum\\dfrac{(O_i-E_i)^2}{E_i}$，分母是 $E_i$ 不是 $O_i$；","自由度：$k-1=4$，因为 $H_0$ 完全指定了分布（无未知参数需估计）；若有 $r$ 个参数需估计，则 $\\mathrm{df}=k-r-1$；","期望频数条件：所有 $E_i=200\\geq 5$，满足卡方近似条件，无需合并组；","结论表述：不拒绝 $H_0\\neq$ 证明无偏好，应说\"在 $\\alpha=0.05$ 下没有足够证据表明有偏好\"。"],"ext":["考纲定位：卡方拟合优度检验是假设检验应用板块高频考点，西北大学常以实际场景（品牌偏好、骰子均匀、血型分布）考察，本题是最典型的考法；","前置知识点：多项分布、Pearson 卡方统计量、卡方分布分位数；","后置串联：列联表独立性检验、正态性检验、似然比检验（$G^2$ 统计量）；","命题延伸方向：给定理论比例（如 $9{:}3{:}3{:}1$ 的孟德尔遗传比例）的拟合检验、含未知参数的拟合检验（如泊松分布需估计 $\\lambda$，自由度减 $2$）、列联表的独立性与齐性检验。"],"kps":["卡方拟合优度与列联表","连续型密度与常见分布","总体与样本、统计量","抽样分布与三大分布构造"],"pts":15},{"year":2025,"no":5,"type":"计算","stem":"将 $n$ 个球（$1$~$n$ 号）随机放入（$1$~$n$ 号）盒子中，放入对应号码盒子称为一个配对，记配对数为 $X$，则 $E(X)$、$D(X)$ 为多少？","sol":"引入指示变量 $X_i=\\begin{cases}1,&\\text{第 }i\\text{ 号球放入第 }i\\text{ 号盒子}\\\\0,&\\text{其他}\\end{cases}$，$i=1,\\ldots,n$。则 $X=X_1+X_2+\\cdots+X_n$。\n\n**$E(X)$：**\n\n$P(X_i=1)=1/n$（第 $i$ 号球放入 $n$ 个盒子等可能，恰好放入第 $i$ 号的概率为 $1/n$）。$E(X_i)=1/n$。\n\n$$E(X)=\\sum_{i=1}^{n}E(X_i)=n\\times\\dfrac{1}{n}=1.$$\n\n**$D(X)$：**\n\n$$\\mathrm{Var}(X)=\\sum_{i=1}^{n}\\mathrm{Var}(X_i)+2\\sum_{i<j}\\mathrm{Cov}(X_i,X_j).$$\n\n$$\\mathrm{Var}(X_i)=E(X_i^2)-[E(X_i)]^2=\\dfrac{1}{n}-\\dfrac{1}{n^2}=\\dfrac{n-1}{n^2}.$$\n\n$$\\sum_{i=1}^{n}\\mathrm{Var}(X_i)=n\\times\\dfrac{n-1}{n^2}=\\dfrac{n-1}{n}.$$\n\n$$\\mathrm{Cov}(X_i,X_j)=E(X_iX_j)-E(X_i)E(X_j).$$\n\n$X_iX_j=1$ 当且仅当第 $i$ 号球和第 $j$ 号球都配对，概率为 $P(X_i=1,X_j=1)=\\dfrac{1}{n(n-1)}$（第 $i$ 号球配对概率 $1/n$，第 $j$ 号球在第 $i$ 号配对条件下配对概率 $1/(n-1)$）。\n\n$$E(X_iX_j)=\\dfrac{1}{n(n-1)},\\qquad E(X_i)E(X_j)=\\dfrac{1}{n^2}.$$\n\n$$\\mathrm{Cov}(X_i,X_j)=\\dfrac{1}{n(n-1)}-\\dfrac{1}{n^2}=\\dfrac{n-(n-1)}{n^2(n-1)}=\\dfrac{1}{n^2(n-1)}.$$\n\n$$\\sum_{i<j}\\mathrm{Cov}(X_i,X_j)=\\binom{n}{2}\\times\\dfrac{1}{n^2(n-1)}=\\dfrac{n(n-1)}{2}\\times\\dfrac{1}{n^2(n-1)}=\\dfrac{1}{2n}.$$\n\n$$\\mathrm{Var}(X)=\\dfrac{n-1}{n}+2\\times\\dfrac{1}{2n}=\\dfrac{n-1}{n}+\\dfrac{1}{n}=1.$$\n\n故 $E(X)=1$，$D(X)=1$。","traps":["指示变量的引入：将配对数 $X$ 分解为 $n$ 个 $0$-$1$ 变量之和是关键，考生易尝试直接求 $X$ 的分布（错排数）而复杂化；","$P(X_i=1)=1/n$：每个球放入对应盒子的概率为 $1/n$，与其他球无关（边缘概率）；","$P(X_i=1,X_j=1)=1/[n(n-1)]$：两个球同时配对的概率，利用条件概率 $P(X_j=1\\mid X_i=1)=1/(n-1)$；","协方差计算：$\\mathrm{Cov}(X_i,X_j)=E(X_iX_j)-E(X_i)E(X_j)=\\dfrac{1}{n(n-1)}-\\dfrac{1}{n^2}=\\dfrac{1}{n^2(n-1)}$，考生易算成 $0$ 或其他；","方差公式：$\\mathrm{Var}\\!\\left(\\sum X_i\\right)=\\sum\\mathrm{Var}(X_i)+2\\displaystyle\\sum_{i<j}\\mathrm{Cov}(X_i,X_j)$，不能忽略协方差项（$X_i$ 之间不独立）；","最终结果：$E(X)=D(X)=1$，与 $n$ 无关，这是配对问题的经典结论。"],"ext":["考纲定位：指示变量法求期望与方差是数字特征板块的重要方法，西北大学偏好考察配对问题（匹配问题），这是经典的概率论名题；","前置知识点：指示变量、期望与方差的线性性质、协方差的定义与计算；","后置串联：配对数 $X$ 的渐近分布（$n\\to\\infty$ 时 $X\\to\\mathrm{Poisson}(1)$）、错排问题、更一般的匹配问题（$n$ 个球 $m$ 个盒子）；","命题延伸方向：求至少一个配对的概率 $P(X\\geq 1)=1-D_n/n!$（错排数）、求 $X$ 的分布列、$n$ 对夫妇围坐求相邻夫妇对数的期望、优惠券收集问题。"],"kps":["数字特征与矩","古典概型与计数"],"pts":15},{"year":2025,"no":1,"type":"名词解释","stem":"样本均值、样本中位数","sol":"**样本均值** $\\bar{X}=\\dfrac{1}{n}\\displaystyle\\sum_{i=1}^{n}X_i$，是样本数据的算术平均，利用了全部数据信息，是总体均值 $\\mu$ 的无偏估计、相合估计、有效估计（正态下）。对极端值敏感，抗干扰性差。\n\n**样本中位数** $m_e$：将样本排序后位于中间位置的数值。$n$ 为奇数时 $m_e=X_{((n+1)/2)}$；$n$ 为偶数时 $m_e=\\dfrac{X_{(n/2)}+X_{(n/2+1)}}{2}$。只利用了中间位置的数据，对极端值不敏感（稳健性强），是总体中位数的相合估计，但通常不是无偏估计，效率低于均值（正态下方差约为 $\\dfrac{\\pi\\sigma^2}{2n}>\\dfrac{\\sigma^2}{n}$）。\n\n**区别**：① 信息利用：均值用全部数据，中位数只用中间位置；② 稳健性：中位数抗极端值，均值敏感；③ 效率：正态下均值效率更高；④ 适用分布：偏态分布或有异常值时中位数更具代表性，对称分布时二者一致。\n\n**联系**：都是描述数据集中趋势的统计量；对称分布下二者渐近相等；都是总体位置参数的估计量。","traps":["中位数定义中 $n$ 为偶数时取中间两个的平均，考生易只取一个；","只写定义不写区别联系，辨析题需对比；","混淆\"样本中位数\"与\"总体中位数\"。"],"ext":[],"kps":["总体与样本、统计量"],"pts":5},{"year":2025,"no":2,"type":"名词解释","stem":"互不相容与对立","sol":"**互不相容（互斥）**：事件 $A$ 与 $B$ 不能同时发生，即 $AB=\\varnothing$。此时 $P(A\\cup B)=P(A)+P(B)$。\n\n**对立事件**：$A$ 与 $B$ 互不相容且 $A\\cup B=\\Omega$（即 $B=\\bar{A}$），此时 $P(A)+P(B)=1$。\n\n**区别**：① 对立要求 $A\\cup B=\\Omega$（并集为必然事件），互不相容只要求 $AB=\\varnothing$；② 对立一定互不相容，互不相容不一定对立；③ 对立事件的概率和为 $1$，互不相容事件的概率和不一定为 $1$。\n\n**联系**：对立是互不相容的特殊情形；都满足 $P(AB)=0$。","traps":["误认为互不相容就是对立，忽略并集为 $\\Omega$ 的条件；","互不相容事件概率相加公式 $P(A\\cup B)=P(A)+P(B)$，对立事件 $P(A)+P(\\bar{A})=1$。"],"ext":[],"kps":["事件关系与概率性质"],"pts":5},{"year":2025,"no":3,"type":"名词解释","stem":"$\\alpha$ 与 $\\beta$ 错误","sol":"**第一类错误（$\\alpha$ 错误/弃真）**：$H_0$ 为真时拒绝 $H_0$，概率 $P(\\text{拒绝 }H_0\\mid H_0\\text{ 真})=\\alpha$，即显著性水平。\n\n**第二类错误（$\\beta$ 错误/取伪）**：$H_0$ 为假时不拒绝 $H_0$，概率 $P(\\text{不拒绝 }H_0\\mid H_0\\text{ 假})=\\beta$。$\\beta$ 依赖于 $H_1$ 中参数的具体值，是参数的函数。\n\n**区别**：① 含义不同：弃真 vs 取伪；② $\\alpha$ 可事先控制（设定显著性水平），$\\beta$ 通常需在给定参数值下计算；③ $\\alpha$ 越大 $\\beta$ 越小（样本量固定时），二者此消彼长。\n\n**联系**：都是假设检验中的决策错误；同时减小 $\\alpha$ 和 $\\beta$ 的唯一方法是增大样本量；检验的功效（power）$=1-\\beta$。","traps":["混淆两类错误的含义：弃真是\"原假设为真却拒绝\"，取伪是\"原假设为假却不拒绝\"；","$\\beta$ 不是常数，依赖于真实参数值；","$\\alpha$ 和 $\\beta$ 之和不一定为 $1$。"],"ext":[],"kps":["两类错误与功效"],"pts":5},{"year":2025,"no":1,"type":"填空","stem":"$X\\sim E(1)$，$Y\\sim E(1)$，$X$ 与 $Y$ 独立，则 $X/Y$ 的分布是____，参数是____。","sol":"$X\\sim E(1)$，则 $2X\\sim\\chi^2(2)$（因 $\\mathrm{Exp}(\\lambda)$ 中 $2\\lambda X\\sim\\chi^2(2)$，$\\lambda=1$ 时 $2X\\sim\\chi^2(2)$）。同理 $2Y\\sim\\chi^2(2)$。$X$ 与 $Y$ 独立，故 $2X$ 与 $2Y$ 独立。\n\n$$\\dfrac{X}{Y}=\\dfrac{2X/2}{2Y/2}\\sim F(2,2).$$\n\n分布类型：$F$ 分布；参数：自由度 $(2,2)$。","traps":["指数分布与卡方分布的关系：$\\mathrm{Exp}(\\lambda)$ 中 $2\\lambda X\\sim\\chi^2(2)$，$\\lambda=1$ 时 $2X\\sim\\chi^2(2)$；","$F$ 分布的构造：$F=\\dfrac{\\chi^2(n_1)/n_1}{\\chi^2(n_2)/n_2}$，本题中 $\\dfrac{2X/2}{2Y/2}=X/Y\\sim F(2,2)$；","自由度写反：分子自由度 $2$，分母自由度 $2$。"],"ext":["考纲定位：随机变量商的分布与 $F$ 分布的构造是抽样分布考点，西北大学偶有填空考察；","命题延伸方向：$X\\sim\\mathrm{Exp}(\\lambda_1),\\ Y\\sim\\mathrm{Exp}(\\lambda_2)$ 时 $X/Y$ 的分布、正态样本方差比的 $F$ 分布。"],"kps":["多维函数的分布","连续型密度与常见分布","抽样分布与三大分布构造"],"pts":4},{"year":2025,"no":2,"type":"填空","stem":"$P(A)=1/4$，$P(A\\mid B)=P(A)$，$P(B\\mid A)=P(B)$，则 $P(\\bar{A}\\cap\\bar{B})=$____。","sol":"$P(A\\mid B)=P(A)$ 说明 $A$ 与 $B$ 独立（条件概率等于无条件概率）。$P(B\\mid A)=P(B)$ 同样说明独立。故 $A$ 与 $B$ 独立，从而 $\\bar{A}$ 与 $\\bar{B}$ 独立。\n\n$$P(\\bar{A}\\cap\\bar{B})=P(\\bar{A})P(\\bar{B})=\\left(1-\\dfrac{1}{4}\\right)(1-P(B)).$$\n\n但题目未给出 $P(B)$！需要检查是否有其他条件。$P(A\\mid B)=P(A)$ 和 $P(B\\mid A)=P(B)$ 都只说明独立，无法确定 $P(B)$。\n\n回忆版可能遗漏了 $P(B)$ 的值。若假设 $P(B)=1/4$（对称），则 $P(\\bar{A}\\cap\\bar{B})=\\dfrac{3}{4}\\times\\dfrac{3}{4}=\\dfrac{9}{16}$。\n\n若题目原意是 $P(A)=P(B)=1/4$，则答案为 $9/16$。\n\n注：回忆版题目可能不完整，实际答题时需根据完整题目中 $P(B)$ 的值计算。若 $P(B)$ 确实未给出，则 $P(\\bar{A}\\cap\\bar{B})=\\dfrac{3}{4}(1-P(B))$，无法得到数值。","traps":["独立性判定：$P(A\\mid B)=P(A)$ 是独立的等价条件；","对偶律：$\\bar{A}\\cap\\bar{B}=A\\cup B$ 的对立事件，$P(\\bar{A}\\cap\\bar{B})=1-P(A\\cup B)=1-P(A)-P(B)+P(AB)$，独立时 $P(AB)=P(A)P(B)$；","题目可能遗漏 $P(B)$ 的值，需注意。"],"ext":["考纲定位：独立性与对偶律结合是填空题高频考点；","命题延伸方向：独立事件的交并补概率计算、条件独立。"],"kps":["事件独立性","事件关系与概率性质"],"pts":4},{"year":2024,"no":1,"type":"填空","stem":"$P(A)=P(B)=P(C)=\\dfrac{1}{4}$，$P(AB)=0$，$P(AC)=P(BC)=\\dfrac{1}{16}$，求 $A,B,C$ 全不发生的概率。","sol":"全不发生即 $\\bar{A}\\cap\\bar{B}\\cap\\bar{C}=\\overline{A\\cup B\\cup C}$，为 $A\\cup B\\cup C$ 的对立事件。\n\n$$P(\\bar{A}\\cap\\bar{B}\\cap\\bar{C})=1-P(A\\cup B\\cup C).$$\n\n三事件加法公式：\n\n$$P(A\\cup B\\cup C)=P(A)+P(B)+P(C)-P(AB)-P(AC)-P(BC)+P(ABC).$$\n\n由 $P(AB)=0$ 且 $ABC\\subset AB$，得 $P(ABC)=0$。代入：\n\n$$P(A\\cup B\\cup C)=\\dfrac{1}{4}+\\dfrac{1}{4}+\\dfrac{1}{4}-0-\\dfrac{1}{16}-\\dfrac{1}{16}+0=\\dfrac{3}{4}-\\dfrac{1}{8}=\\dfrac{5}{8}.$$\n\n$$P(\\text{全不发生})=1-\\dfrac{5}{8}=\\dfrac{3}{8}.$$","traps":["三事件加法公式记错：需加回 $P(ABC)$，考生易遗漏；","$P(ABC)=0$ 的推导：$ABC\\subset AB$，$P(AB)=0$，故 $P(ABC)=0$；","对偶律应用：全不发生 = 至少一个发生的对立事件；","分数运算：$\\dfrac{3}{4}-\\dfrac{1}{8}=\\dfrac{5}{8}$，$1-\\dfrac{5}{8}=\\dfrac{3}{8}$。"],"ext":["考纲定位：加法公式与对偶律是概率论基础必考内容，常以填空题出现；","命题延伸方向：$n$ 个事件的加法公式（容斥原理）、已知部分概率求条件概率。"],"kps":["事件关系与概率性质"],"pts":5},{"year":2024,"no":2,"type":"填空","stem":"$p(x)=\\begin{cases}ax+bx^2,&0<x<1\\\\0,&\\text{其他}\\end{cases}$，$E(X)=0.5$，求 $D(X)$。","sol":"归一化：\n\n$$\\int_0^1 (ax+bx^2)\\,\\mathrm{d}x=\\dfrac{a}{2}+\\dfrac{b}{3}=1 \\quad \\cdots(1)$$\n\n$$E(X)=\\int_0^1 x(ax+bx^2)\\,\\mathrm{d}x=\\dfrac{a}{3}+\\dfrac{b}{4}=0.5 \\quad \\cdots(2)$$\n\n由 (1)：$a=2-\\dfrac{2b}{3}$，代入 (2)：\n\n$$\\dfrac{2-\\frac{2b}{3}}{3}+\\dfrac{b}{4}=0.5\\ \\Rightarrow\\ \\dfrac{2}{3}-\\dfrac{2b}{9}+\\dfrac{b}{4}=\\dfrac{1}{2}\\ \\Rightarrow\\ \\dfrac{-8b+9b}{36}=\\dfrac{1}{2}-\\dfrac{2}{3}=-\\dfrac{1}{6}\\ \\Rightarrow\\ b=-6.$$\n\n$$a=2-\\dfrac{2(-6)}{3}=2+4=6.$$\n\n故 $p(x)=6x-6x^2=6x(1-x),\\ 0<x<1$（$\\mathrm{Beta}(2,2)$ 分布）。\n\n$$E(X^2)=\\int_0^1 x^2(6x-6x^2)\\,\\mathrm{d}x=\\dfrac{6}{4}-\\dfrac{6}{5}=\\dfrac{3}{2}-\\dfrac{6}{5}=\\dfrac{3}{10}=0.3.$$\n\n$$D(X)=E(X^2)-[E(X)]^2=0.3-0.25=0.05=\\dfrac{1}{20}.$$","traps":["归一化条件与期望条件联立求解，考生易只列一个方程；","$\\mathrm{Beta}(2,2)$ 分布的方差为 $\\dfrac{1}{20}$，可直接验证；","$E(X^2)$ 积分计算：$\\int_0^1 6x^3\\,\\mathrm{d}x-\\int_0^1 6x^4\\,\\mathrm{d}x=\\dfrac{6}{4}-\\dfrac{6}{5}=\\dfrac{3}{10}$。"],"ext":["考纲定位：密度函数中含未知参数，利用归一化和数字特征反求参数，是填空题常见考法；","命题延伸方向：求中位数、求特定概率、识别为 $\\mathrm{Beta}$ 分布后直接用公式。"],"kps":["数字特征与矩","连续型密度与常见分布"],"pts":5},{"year":2024,"no":3,"type":"填空","stem":"$X,Y$ 独立同分布 $N(0,1)$，求 $P(XY>0)$。","sol":"$XY>0$ 当且仅当 $(X>0,Y>0)$ 或 $(X<0,Y<0)$。$X,Y$ 独立同分布 $N(0,1)$，$P(X>0)=P(X<0)=\\dfrac{1}{2}$。\n\n$$P(XY>0)=P(X>0,Y>0)+P(X<0,Y<0)=P(X>0)P(Y>0)+P(X<0)P(Y<0)=\\dfrac{1}{4}+\\dfrac{1}{4}=\\dfrac{1}{2}.$$","traps":["$XY>0$ 包含两种情况：同正或同负，考生易只算一种；","利用独立性 $P(X>0,Y>0)=P(X>0)P(Y>0)$；","标准正态关于 0 对称，$P(X>0)=\\dfrac{1}{2}$。"],"ext":["命题延伸方向：$P(X+Y>0)$、$P(X-Y>0)$、$X/Y$ 的符号概率。"],"kps":["事件独立性","联合分布与边际分布"],"pts":5},{"year":2024,"no":4,"type":"填空","stem":"$X\\sim N(0,1)$，$Y=e^X$，求 $f_Y(y)$。","sol":"$y=e^x$ 严格单调递增，$x=\\ln y$，$\\dfrac{\\mathrm{d}x}{\\mathrm{d}y}=\\dfrac{1}{y}$，$y>0$。\n\n$$f_Y(y)=f_X(\\ln y)\\left|\\dfrac{\\mathrm{d}x}{\\mathrm{d}y}\\right|=\\dfrac{1}{\\sqrt{2\\pi}}e^{-(\\ln y)^2/2}\\cdot\\dfrac{1}{y},\\quad y>0.$$\n\n即 $Y$ 服从对数正态分布 $LN(0,1)$。","traps":["公式法中 $\\dfrac{\\mathrm{d}x}{\\mathrm{d}y}=\\dfrac{1}{y}$，考生易写成 $y$；","$y$ 的取值范围 $y>0$，$y\\leq0$ 时 $f_Y(y)=0$；","对数正态分布不是正态分布。"],"ext":["考纲定位：随机变量函数的分布是高频考点，指数变换（对数正态）是经典考法；","命题延伸方向：$Y=e^{\\mu+\\sigma X}$ 的对数正态分布、求 $Y$ 的期望（$e^{\\mu+\\sigma^2/2}$）。"],"kps":["连续型密度与常见分布","随机变量函数的分布"],"pts":5},{"year":2024,"no":5,"type":"填空","stem":"$X_1,X_2,\\ldots,X_n\\sim N(\\mu,\\sigma^2)$，$T=\\dfrac{1}{n}\\sum X_i^2$，求 $E(T)$。","sol":"$$E(X_i^2)=\\mathrm{Var}(X_i)+[E(X_i)]^2=\\sigma^2+\\mu^2.$$\n\n$$E(T)=\\dfrac{1}{n}\\sum_{i=1}^{n}E(X_i^2)=\\dfrac{1}{n}\\cdot n(\\sigma^2+\\mu^2)=\\sigma^2+\\mu^2.$$","traps":["$E(X^2)=\\mathrm{Var}(X)+[E(X)]^2$，考生易只写 $\\sigma^2$ 而漏掉 $\\mu^2$；","$T$ 不是样本方差（样本方差用 $\\bar{X}$ 中心化），直接是 $X_i^2$ 的平均。"],"ext":["命题延伸方向：求 $\\mathrm{Var}(T)$、与样本方差 $S^2$ 对比。"],"kps":["连续型密度与常见分布","数字特征与矩"],"pts":5},{"year":2024,"no":6,"type":"填空","stem":"$X_1,X_2,X_3,X_4\\sim N(0,4)$，$T=a(X_1-2X_2)^2+b(3X_3-4X_4)^2$ 服从卡方分布，求 $a,b$。","sol":"$X_i\\sim N(0,4)$，$\\mathrm{Var}(X_i)=4$。\n\n$$X_1-2X_2\\sim N(0,\\mathrm{Var}(X_1)+4\\mathrm{Var}(X_2))=N(0,4+16)=N(0,20).$$\n\n标准化：$\\dfrac{X_1-2X_2}{\\sqrt{20}}\\sim N(0,1)$，故 $\\dfrac{(X_1-2X_2)^2}{20}\\sim\\chi^2(1)$。因此 $a=\\dfrac{1}{20}$。\n\n$$3X_3-4X_4\\sim N(0,9\\mathrm{Var}(X_3)+16\\mathrm{Var}(X_4))=N(0,36+64)=N(0,100).$$\n\n标准化：$\\dfrac{3X_3-4X_4}{10}\\sim N(0,1)$，故 $\\dfrac{(3X_3-4X_4)^2}{100}\\sim\\chi^2(1)$。因此 $b=\\dfrac{1}{100}$。\n\n$$T\\sim\\chi^2(2).$$","traps":["线性组合的方差：$\\mathrm{Var}(aX+bY)=a^2\\mathrm{Var}(X)+b^2\\mathrm{Var}(Y)$，考生易写成 $a\\mathrm{Var}(X)+b\\mathrm{Var}(Y)$；","$X_1-2X_2$ 的方差：$\\mathrm{Var}(X_1)+(-2)^2\\mathrm{Var}(X_2)=4+4\\times4=20$；","$3X_3-4X_4$ 的方差：$9\\times4+16\\times4=36+64=100$；","卡方构造：需标准化为 $N(0,1)$ 后平方，系数为方差的倒数。"],"ext":["考纲定位：正态样本线性组合的卡方分布构造是抽样分布高频考点，西北大学几乎每年填空考察；","命题延伸方向：求自由度、构造 $t$ 分布或 $F$ 分布。"],"kps":["连续型密度与常见分布","抽样分布与三大分布构造"],"pts":5},{"year":2024,"no":1,"type":"解答","stem":"有 3 个灯泡，每个损坏的概率为 0.1，在第一个坏的情况下系统损坏概率为 0.25，在第二个坏的情况下系统损坏概率为 0.6，在第三个坏的情况下系统损坏概率为 0.95，求系统损坏的概率。","sol":"设 $A_k=$\"恰好有 $k$ 个灯泡损坏\"，$k=0,1,2,3$。每个灯泡损坏概率 $p=0.1$，独立，故 $A_k\\sim b(3,0.1)$。\n\n$$P(A_0)=0.9^3=0.729$$\n\n$$P(A_1)=\\binom{3}{1}\\times0.1\\times0.9^2=3\\times0.1\\times0.81=0.243$$\n\n$$P(A_2)=\\binom{3}{2}\\times0.1^2\\times0.9=3\\times0.01\\times0.9=0.027$$\n\n$$P(A_3)=0.1^3=0.001$$\n\n设 $B=$\"系统损坏\"。题目中\"第一个坏\"\"第二个坏\"\"第三个坏\"应理解为\"恰好坏 1 个\"\"恰好坏 2 个\"\"恰好坏 3 个\"（回忆版表述可能简化）。$P(B\\mid A_1)=0.25$，$P(B\\mid A_2)=0.6$，$P(B\\mid A_3)=0.95$，$P(B\\mid A_0)=0$（没坏则系统不坏）。\n\n全概率公式：\n\n$$P(B)=\\sum_{k=0}^{3}P(A_k)P(B\\mid A_k)=0.729\\times0+0.243\\times0.25+0.027\\times0.6+0.001\\times0.95=0.0779.$$","traps":["\"第一个坏/第二个坏/第三个坏\"的理解：应为\"恰好坏 1/2/3 个\"，而非\"第几个灯泡坏\"；","二项分布概率计算：$\\binom{3}{k}0.1^k\\,0.9^{3-k}$；","$P(B\\mid A_0)=0$：没有灯泡损坏时系统不会损坏；","全概率公式需覆盖所有可能的损坏数量。"],"ext":["考纲定位：全概率公式是概率论基础必考考点，常结合二项分布给出条件概率；","命题延伸方向：贝叶斯公式反求\"系统损坏时恰好坏 $k$ 个的概率\"。"],"kps":["全概率与贝叶斯","条件概率与乘法公式","常见离散分布"],"pts":15},{"year":2024,"no":2,"type":"解答","stem":"$f(x)=\\begin{cases}(1+xy)/4,&|x|<1,|y|<1\\\\0,&\\text{其他}\\end{cases}$，问 $X,Y$ 是否独立，$X^2,Y^2$ 是否独立？","sol":"**$X,Y$ 是否独立？**\n\n$$f_X(x)=\\int_{-1}^{1}\\dfrac{1+xy}{4}\\,\\mathrm{d}y=\\dfrac{1}{4}\\left[y+\\dfrac{xy^2}{2}\\right]_{-1}^{1}=\\dfrac{1}{2},\\quad |x|<1.$$\n\n同理 $f_Y(y)=\\dfrac{1}{2},\\ |y|<1$。$f_X(x)f_Y(y)=\\dfrac{1}{4}\\neq\\dfrac{1+xy}{4}=f(x,y)$（当 $xy\\neq0$ 时）。故 $X$ 与 $Y$ 不独立。\n\n**$X^2,Y^2$ 是否独立？**\n\n方法：求 $(X^2,Y^2)$ 的联合分布。对 $u\\in(0,1),\\ v\\in(0,1)$：\n\n$$F_{X^2,Y^2}(u,v)=P(X^2\\leq u,\\ Y^2\\leq v)=P(|X|\\leq\\sqrt{u},\\ |Y|\\leq\\sqrt{v})$$\n\n$$=\\int_{-\\sqrt{u}}^{\\sqrt{u}}\\int_{-\\sqrt{v}}^{\\sqrt{v}}\\dfrac{1+xy}{4}\\,\\mathrm{d}y\\,\\mathrm{d}x=\\int_{-\\sqrt{u}}^{\\sqrt{u}}\\dfrac{1}{4}\\left[y+\\dfrac{xy^2}{2}\\right]_{-\\sqrt{v}}^{\\sqrt{v}}\\,\\mathrm{d}x$$\n\n$$=\\int_{-\\sqrt{u}}^{\\sqrt{u}}\\dfrac{1}{4}(2\\sqrt{v})\\,\\mathrm{d}x\\quad\\left(\\dfrac{xy^2}{2}\\text{ 项在对称区间抵消}\\right)=\\dfrac{\\sqrt{v}}{2}\\cdot 2\\sqrt{u}=\\sqrt{uv}.$$\n\n边际：$F_{X^2}(u)=F_{X^2,Y^2}(u,1)=\\sqrt{u},\\ 0<u<1$。$F_{Y^2}(v)=\\sqrt{v},\\ 0<v<1$。\n\n$$F_{X^2}(u)F_{Y^2}(v)=\\sqrt{u}\\cdot\\sqrt{v}=\\sqrt{uv}=F_{X^2,Y^2}(u,v).$$\n\n故 $X^2$ 与 $Y^2$ 独立。","traps":["边际密度计算中 $xy$ 项在对称区间积分抵消，$f_X(x)=\\dfrac{1}{2}$ 是均匀分布；","$X,Y$ 不独立但 $X^2,Y^2$ 独立，这是本题核心考点——不独立的变量经变换后可独立；","联合分布函数法验证独立性：$F_{X^2,Y^2}=F_{X^2}F_{Y^2}$；","也可通过密度法：$f_{X^2,Y^2}(u,v)=\\dfrac{1}{4\\sqrt{uv}}$，$f_{X^2}(u)=\\dfrac{1}{2\\sqrt{u}}$，$f_{Y^2}(v)=\\dfrac{1}{2\\sqrt{v}}$，乘积相等。"],"ext":["考纲定位：独立性判断是多维随机变量核心考点，西北大学偏好考察\"原变量不独立但变换后独立\"的反直觉情形；","命题延伸方向：求 $X,Y$ 的相关系数（本题 $\\mathrm{Cov}(X,Y)=0$，不相关但不独立）、$X+Y$ 与 $X-Y$ 的独立性。"],"kps":["随机变量独立性判定","事件独立性","连续型密度与常见分布","联合分布与边际分布"],"pts":15},{"year":2024,"no":3,"type":"解答","stem":"$f(x)=\\begin{cases}2e^{-(x+2y)},&x>0,y>0\\\\0,&\\text{其他}\\end{cases}$，求 $f_{X\\mid Y}(x\\mid 1)$，$(X,Y)$ 的概率分布，$P(X<1,\\ Y>2)$。","sol":"联合密度 $f(x,y)=2e^{-(x+2y)},\\ x>0,\\ y>0$。\n\n**边际密度：**\n\n$$f_X(x)=\\int_0^\\infty 2e^{-(x+2y)}\\,\\mathrm{d}y=2e^{-x}\\int_0^\\infty e^{-2y}\\,\\mathrm{d}y=e^{-x},\\quad x>0.$$\n\n即 $X\\sim\\mathrm{Exp}(1)$。\n\n$$f_Y(y)=\\int_0^\\infty 2e^{-(x+2y)}\\,\\mathrm{d}x=2e^{-2y},\\quad y>0.$$\n\n即 $Y\\sim\\mathrm{Exp}(2)$。$f(x,y)=f_X(x)f_Y(y)$，故 $X$ 与 $Y$ 独立。\n\n**条件密度 $f_{X\\mid Y}(x\\mid 1)$：**\n\n因独立，$f_{X\\mid Y}(x\\mid y)=f_X(x)=e^{-x},\\ x>0$。故 $f_{X\\mid Y}(x\\mid 1)=e^{-x},\\ x>0$。\n\n**$(X,Y)$ 的概率分布：**\n\n$X\\sim\\mathrm{Exp}(1)$，$Y\\sim\\mathrm{Exp}(2)$，且 $X$ 与 $Y$ 独立。联合分布即给定的 $f(x,y)=2e^{-x-2y},\\ x>0,y>0$。\n\n**$P(X<1,\\ Y>2)$：**\n\n因独立，$P(X<1,Y>2)=P(X<1)P(Y>2)$。\n\n$$P(X<1)=\\int_0^1 e^{-x}\\,\\mathrm{d}x=1-e^{-1}.$$\n\n$$P(Y>2)=\\int_2^\\infty 2e^{-2y}\\,\\mathrm{d}y=e^{-4}.$$\n\n$$P(X<1,Y>2)=(1-e^{-1})e^{-4}=e^{-4}-e^{-5}.$$","traps":["边际密度积分：$f_X(x)$ 对 $y$ 积分从 0 到 $\\infty$，$f_Y(y)$ 对 $x$ 积分从 0 到 $\\infty$；","独立性判断：$f(x,y)=f_X(x)f_Y(y)$，本题可分离变量；","条件密度：独立时条件密度等于边际密度；","$P(Y>2)=e^{-2\\times2}=e^{-4}$（指数分布 $P(Y>y)=e^{-\\lambda y}$）。"],"ext":["考纲定位：二维指数型联合密度的边际、条件、独立性判断是常规计算题；","命题延伸方向：求 $Z=X+Y$ 的密度、求协方差。"],"kps":["条件分布与条件密度","事件独立性","连续型密度与常见分布","联合分布与边际分布"],"pts":15},{"year":2024,"no":4,"type":"解答","stem":"$X_1,\\ldots,X_9$ 是来自总体 $N(0,\\sigma^2)$ 的样本，$Y_1=\\dfrac{1}{6}(X_1+\\cdots+X_6)$，$Y_2=\\dfrac{1}{3}(X_7+X_8+X_9)$，$S^2=\\dfrac{1}{2}\\sum_{i=7}^{9}(X_i-Y_2)^2$，$T=\\dfrac{\\sqrt{2}(Y_1-Y_2)}{S}$ 服从什么分布？","sol":"$$Y_1=\\dfrac{1}{6}\\sum_{i=1}^{6}X_i\\sim N(0,\\sigma^2/6).$$\n\n$$Y_2=\\dfrac{1}{3}\\sum_{i=7}^{9}X_i\\sim N(0,\\sigma^2/3).$$\n\n$Y_1$ 与 $Y_2$ 独立（使用不同的样本）。\n\n$$Y_1-Y_2\\sim N(0,\\sigma^2/6+\\sigma^2/3)=N(0,\\sigma^2/2).$$\n\n标准化：$\\dfrac{\\sqrt{2}(Y_1-Y_2)}{\\sigma}\\sim N(0,1)$。\n\n$S^2=\\dfrac{1}{2}\\sum_{i=7}^{9}(X_i-Y_2)^2$，这是后 3 个样本的样本方差（自由度 2）。$\\dfrac{(3-1)S^2}{\\sigma^2}=\\dfrac{2S^2}{\\sigma^2}\\sim\\chi^2(2)$。\n\n$Y_1$（前 6 个样本的函数）与 $S^2$（后 3 个样本的函数）独立。$Y_2$ 与 $S^2$ 独立（正态样本均值与样本方差独立），且 $Y_2$ 已包含在 $Y_1-Y_2$ 中，但 $Y_1$ 与 $(Y_2,S^2)$ 独立。关键：$Y_1-Y_2$ 与 $S^2$ 是否独立？$Y_1$ 独立于 $(Y_2,S^2)$，$Y_2$ 与 $S^2$ 独立，故 $Y_1-Y_2$ 与 $S^2$ 独立。\n\n$t$ 分布构造：\n\n$$T=\\dfrac{\\sqrt{2}(Y_1-Y_2)/\\sigma}{\\sqrt{S^2/\\sigma^2}}=\\dfrac{\\sqrt{2}(Y_1-Y_2)}{S}\\sim t(2).$$\n\n（因为分子 $N(0,1)$，分母 $\\sqrt{\\chi^2(2)/2}$，独立。）","traps":["$Y_1-Y_2$ 的方差：$\\sigma^2/6+\\sigma^2/3=\\sigma^2/2$，标准化系数为 $\\sqrt{2}/\\sigma$；","$S^2$ 的自由度：后 3 个样本，自由度 $n-1=2$；","$\\dfrac{2S^2}{\\sigma^2}\\sim\\chi^2(2)$，故 $\\sqrt{S^2/\\sigma^2}=\\sqrt{\\chi^2(2)/2}$；","独立性验证：$Y_1$ 与 $(Y_2,S^2)$ 独立（不同样本），$Y_2$ 与 $S^2$ 独立（同一样本的均值与方差独立）；","$t$ 分布自由度为 2（$S^2$ 的自由度）。"],"ext":["考纲定位：抽样分布中 $t$ 统计量的构造是西北大学高频考点，常将样本拆分为两部分分别构造均值和方差；","命题延伸方向：构造 $F$ 统计量、求 $T$ 的期望和方差。"],"kps":["抽样分布与三大分布构造","总体与样本、统计量","事件独立性","数字特征与矩"],"pts":15},{"year":2024,"no":5,"type":"解答","stem":"$f(x;\\theta)=\\begin{cases}\\dfrac{1}{\\theta}x^{(1-\\theta)/\\theta},&0<x<1\\\\0,&\\text{其他}\\end{cases}$，求 $\\theta$ 的矩估计和极大似然估计。","sol":"$$f(x;\\theta)=\\dfrac{1}{\\theta}x^{(1-\\theta)/\\theta}=\\dfrac{1}{\\theta}x^{1/\\theta-1},\\quad 0<x<1.$$\n\n这是 $\\mathrm{Beta}(1/\\theta,1)$ 分布（$\\mathrm{Beta}(\\alpha,1)=\\alpha x^{\\alpha-1}$，此处 $\\alpha=1/\\theta$）。\n\n**矩估计：**\n\n$$E(X)=\\int_0^1 x\\cdot\\dfrac{1}{\\theta}x^{1/\\theta-1}\\,\\mathrm{d}x=\\dfrac{1}{\\theta}\\int_0^1 x^{1/\\theta}\\,\\mathrm{d}x=\\dfrac{1}{1+\\theta}.$$\n\n令 $E(X)=\\bar{X}$：$\\dfrac{1}{1+\\theta}=\\bar{X}\\ \\Rightarrow\\ 1+\\theta=\\dfrac{1}{\\bar{X}}\\ \\Rightarrow\\ \\hat{\\theta}_M=\\dfrac{1}{\\bar{X}}-1=\\dfrac{1-\\bar{X}}{\\bar{X}}$。\n\n**极大似然估计：**\n\n$$L(\\theta)=\\prod_{i=1}^{n}\\dfrac{1}{\\theta}x_i^{1/\\theta-1}=\\theta^{-n}\\left(\\prod_{i=1}^{n}x_i\\right)^{1/\\theta-1}.$$\n\n$$\\ln L=-n\\ln\\theta+\\left(\\dfrac{1}{\\theta}-1\\right)\\sum_{i=1}^{n}\\ln x_i.$$\n\n$$\\dfrac{\\mathrm{d}(\\ln L)}{\\mathrm{d}\\theta}=-\\dfrac{n}{\\theta}-\\dfrac{1}{\\theta^2}\\sum_{i=1}^{n}\\ln x_i=0\\ \\Rightarrow\\ -n\\theta-\\sum_{i=1}^{n}\\ln x_i=0.$$\n\n验证：$\\dfrac{\\mathrm{d}^2(\\ln L)}{\\mathrm{d}\\theta^2}=\\dfrac{n}{\\theta^2}+\\dfrac{2\\sum\\ln x_i}{\\theta^3}$，代入 $\\hat{\\theta}=-\\dfrac{1}{n}\\sum\\ln x_i$，因 $\\sum\\ln x_i<0$，二阶导 $<0$，为最大值。\n\n$$\\hat{\\theta}_{\\mathrm{MLE}}=-\\dfrac{1}{n}\\sum_{i=1}^{n}\\ln X_i.$$","traps":["指数化简：$\\dfrac{1-\\theta}{\\theta}=\\dfrac{1}{\\theta}-1$；","$E(X)$ 积分：$\\int_0^1\\dfrac{1}{\\theta}x^{1/\\theta}\\,\\mathrm{d}x=\\dfrac{1}{1+\\theta}$，考生易算错指数；","矩估计求解：$\\theta=\\dfrac{1}{\\bar{X}}-1$；","MLE 求导：$\\dfrac{\\mathrm{d}}{\\mathrm{d}\\theta}\\!\\left[\\left(\\dfrac{1}{\\theta}-1\\right)\\sum\\ln x_i\\right]=-\\dfrac{1}{\\theta^2}\\sum\\ln x_i$；","MLE 结果：$\\hat{\\theta}=-\\dfrac{1}{n}\\sum\\ln X_i$，因 $\\ln X_i<0$，结果为正。"],"ext":["考纲定位：单参数幂函数型密度的矩估计与 MLE 是西北大学每年必考题型，密度形式多变但方法统一；","命题延伸方向：求估计量的无偏性、相合性，与 $\\mathrm{Beta}$ 分布性质结合。"],"kps":["极大似然估计","矩估计","连续型密度与常见分布"],"pts":15},{"year":2024,"no":6,"type":"解答","stem":"$X_1,\\ldots,X_{16}$ iid $N(\\mu,4)$，$H_0:\\mu=6$ vs $H_1:\\mu\\neq6$，拒绝域 $W=\\{|\\bar{X}-6|\\geq c\\}$，求 $c$ 使得显著性水平为 0.05，求在 $\\mu=6.5$ 处犯第二类错误的概率。","sol":"$n=16$，$\\sigma^2=4$，$\\sigma=2$，$\\dfrac{\\sigma}{\\sqrt{n}}=\\dfrac{2}{4}=0.5$。$H_0$ 下 $\\bar{X}\\sim N(6,4/16)=N(6,0.25)$。\n\n**求 $c$：**\n\n$$\\alpha=P(|\\bar{X}-6|\\geq c\\mid\\mu=6)=P\\!\\left(\\left|\\dfrac{\\bar{X}-6}{0.5}\\right|\\geq\\dfrac{c}{0.5}\\right)=2[1-\\Phi(2c)]=0.05.$$\n\n$\\Phi(2c)=0.975$，$2c=1.96$，$c=0.98$。\n\n**$\\mu=6.5$ 处第二类错误概率：**\n\n$$\\beta=P(|\\bar{X}-6|<0.98\\mid\\mu=6.5)=P(6-0.98<\\bar{X}<6+0.98\\mid\\mu=6.5)=P(5.02<\\bar{X}<6.98\\mid\\mu=6.5).$$\n\n标准化：$Z_1=\\dfrac{5.02-6.5}{0.5}=-2.96$，$Z_2=\\dfrac{6.98-6.5}{0.5}=0.96$。\n\n$$\\beta=P(-2.96<Z<0.96)=\\Phi(0.96)-\\Phi(-2.96)=0.8315-0.0015=0.830.$$","traps":["标准误 $\\dfrac{\\sigma}{\\sqrt{n}}=\\dfrac{2}{4}=0.5$，考生易误用 $\\sigma=2$；","$c=z_{\\alpha/2}\\cdot\\dfrac{\\sigma}{\\sqrt{n}}=1.96\\times0.5=0.98$；","第二类错误中标准化需减真实均值 $\\mu=6.5$，而非 $\\mu_0=6$；","上下限都要标准化：$\\dfrac{5.02-6.5}{0.5}$ 和 $\\dfrac{6.98-6.5}{0.5}$。"],"ext":["考纲定位：$Z$ 检验+第二类错误计算是假设检验板块常规综合题，西北大学几乎每年考察；","命题延伸方向：$\\sigma$ 未知时的 $t$ 检验、给定 $\\beta$ 反求样本量、功效函数。"],"kps":["假设检验原理与拒绝域","两类错误与功效"],"pts":15},{"year":2024,"no":1,"type":"证明","stem":"$p(x)=\\dfrac{1}{\\lambda(1+x^2)}$，$-\\infty<x<+\\infty$，证 $E[\\min(1,|X|)^2]=\\dfrac{2}{\\lambda}$。","sol":"$p(x)=\\dfrac{1}{\\lambda(1+x^2)}$ 是柯西分布（标准柯西的尺度参数为 1，密度为 $\\dfrac{1}{\\pi(1+x^2)}$，此处 $\\lambda=\\pi$ 时为标准柯西）。注意归一化：$\\int_{-\\infty}^{\\infty}\\dfrac{1}{\\lambda(1+x^2)}\\,\\mathrm{d}x=\\dfrac{\\pi}{\\lambda}=1$，故 $\\lambda=\\pi$。但题目保留 $\\lambda$，按给定密度计算。\n\n令 $g(X)=\\min(1,|X|)^2$。当 $|X|\\leq1$ 时，$\\min(1,|X|)=|X|$，$g(X)=X^2$；当 $|X|>1$ 时，$\\min(1,|X|)=1$，$g(X)=1$。\n\n$$E[g(X)]=\\int_{-\\infty}^{\\infty}g(x)p(x)\\,\\mathrm{d}x=\\int_{-1}^{1}x^2\\cdot\\dfrac{1}{\\lambda(1+x^2)}\\,\\mathrm{d}x+\\int_{|x|>1}1\\cdot\\dfrac{1}{\\lambda(1+x^2)}\\,\\mathrm{d}x$$\n\n$$=\\dfrac{1}{\\lambda}\\left[\\int_{-1}^{1}\\dfrac{x^2}{1+x^2}\\,\\mathrm{d}x+\\int_{|x|>1}\\dfrac{1}{1+x^2}\\,\\mathrm{d}x\\right].$$\n\n计算第一部分：\n\n$$\\int_{-1}^{1}\\dfrac{x^2}{1+x^2}\\,\\mathrm{d}x=\\int_{-1}^{1}\\left[1-\\dfrac{1}{1+x^2}\\right]\\,\\mathrm{d}x=[x-\\arctan x]_{-1}^{1}=\\left(1-\\dfrac{\\pi}{4}\\right)-\\left(-1+\\dfrac{\\pi}{4}\\right)=2-\\dfrac{\\pi}{2}.$$\n\n第二部分：\n\n$$\\int_{|x|>1}\\dfrac{1}{1+x^2}\\,\\mathrm{d}x=2\\int_1^\\infty\\dfrac{1}{1+x^2}\\,\\mathrm{d}x=2[\\arctan x]_1^\\infty=2\\left(\\dfrac{\\pi}{2}-\\dfrac{\\pi}{4}\\right)=\\dfrac{\\pi}{2}.$$\n\n合计：\n\n$$\\dfrac{1}{\\lambda}\\left[\\left(2-\\dfrac{\\pi}{2}\\right)+\\dfrac{\\pi}{2}\\right]=\\dfrac{1}{\\lambda}\\cdot2=\\dfrac{2}{\\lambda}.$$","traps":["$\\min(1,|X|)^2$ 的分段：$|X|\\leq1$ 时为 $X^2$，$|X|>1$ 时为 1；","积分拆分：$\\int_{-1}^{1}+\\int_{|x|>1}$；","$\\dfrac{x^2}{1+x^2}=1-\\dfrac{1}{1+x^2}$ 的化简；","$\\arctan$ 的特殊值：$\\arctan(1)=\\dfrac{\\pi}{4}$，$\\arctan(\\infty)=\\dfrac{\\pi}{2}$；","两部分中 $\\dfrac{\\pi}{2}$ 项抵消，最终得 $\\dfrac{2}{\\lambda}$。"],"ext":["考纲定位：柯西分布（期望不存在）与截断函数的期望是证明题的难点考点，体现对\"期望存在条件\"的理解；","命题延伸方向：证明 $E|X|$ 不存在（柯西分布的一阶矩不存在）、求 $E[\\min(1,X^2)]$。"],"kps":["随机变量函数的分布","多维函数的分布","连续型密度与常见分布","数字特征与矩"],"pts":15},{"year":2024,"no":2,"type":"证明","stem":"$X\\sim U(0,\\theta)$，$X_1,X_2,\\ldots,X_n$ 是来自 $X$ 的简单随机样本，证 $\\hat{\\theta}=(n+1)\\min\\{X_1,\\ldots,X_n\\}$ 是无偏估计，再求 $D(\\hat{\\theta})$。","sol":"$X_{(1)}=\\min\\{X_1,\\ldots,X_n\\}$。$X\\sim U(0,\\theta)$，$F(x)=\\dfrac{x}{\\theta},\\ 0<x<\\theta$。$X_{(1)}$ 的密度：\n\n$$f_{X_{(1)}}(x)=n[1-F(x)]^{n-1}f(x)=\\dfrac{n}{\\theta}\\left(1-\\dfrac{x}{\\theta}\\right)^{n-1},\\quad 0<x<\\theta.$$\n\n**$E(X_{(1)})$：**\n\n$$E(X_{(1)})=\\int_0^\\theta x\\cdot\\dfrac{n}{\\theta}\\left(1-\\dfrac{x}{\\theta}\\right)^{n-1}\\,\\mathrm{d}x.$$\n\n令 $t=\\dfrac{x}{\\theta}$，$x=\\theta t$，$\\mathrm{d}x=\\theta\\,\\mathrm{d}t$：\n\n$$=n\\theta\\int_0^1 t(1-t)^{n-1}\\,\\mathrm{d}t=n\\theta\\cdot B(2,n)=\\dfrac{n\\theta}{n(n+1)}=\\dfrac{\\theta}{n+1}.$$\n\n（或用分部积分：$\\int_0^1 t(1-t)^{n-1}\\,\\mathrm{d}t=\\dfrac{1}{n(n+1)}$。）\n\n故 $E[\\hat{\\theta}]=E[(n+1)X_{(1)}]=(n+1)\\cdot\\dfrac{\\theta}{n+1}=\\theta$，无偏。\n\n**$D(\\hat{\\theta})$：**\n\n$$E(X_{(1)}^2)=\\int_0^\\theta x^2\\cdot\\dfrac{n}{\\theta}\\left(1-\\dfrac{x}{\\theta}\\right)^{n-1}\\,\\mathrm{d}x=n\\theta^2\\int_0^1 t^2(1-t)^{n-1}\\,\\mathrm{d}t=n\\theta^2\\cdot B(3,n)=\\dfrac{2n\\theta^2}{(n+1)(n+2)}.$$\n\n$$\\mathrm{Var}(X_{(1)})=E(X_{(1)}^2)-[E(X_{(1)})]^2=\\dfrac{2\\theta^2}{(n+1)(n+2)}-\\dfrac{\\theta^2}{(n+1)^2}=\\dfrac{n\\theta^2}{(n+1)^2(n+2)}.$$\n\n$$\\mathrm{Var}(\\hat{\\theta})=\\mathrm{Var}((n+1)X_{(1)})=(n+1)^2\\cdot\\mathrm{Var}(X_{(1)})=\\dfrac{n\\theta^2}{n+2}.$$","traps":["最小次序统计量的密度：$f_{X_{(1)}}(x)=n[1-F(x)]^{n-1}f(x)$，考生易与最大次序统计量混淆；","$E(X_{(1)})=\\dfrac{\\theta}{n+1}$，对比 $E(X_{(n)})=\\dfrac{n\\theta}{n+1}$；","$\\mathrm{Beta}$ 函数积分：$\\int_0^1 t^{a-1}(1-t)^{b-1}\\,\\mathrm{d}t=B(a,b)=\\dfrac{\\Gamma(a)\\Gamma(b)}{\\Gamma(a+b)}$；","$\\mathrm{Var}(\\hat{\\theta})=\\dfrac{n\\theta^2}{n+2}$，考生易在计算 $E(X_{(1)}^2)$ 时出错。"],"ext":["考纲定位：均匀分布次序统计量的无偏估计与方差是西北大学高频证明题，最大/最小次序统计量的估计量构造是经典考法；","命题延伸方向：证明 $\\hat{\\theta}=X_{(n)}$ 是有偏的、构造 $X_{(n)}$ 的无偏修正 $\\dfrac{n+1}{n}\\cdot X_{(n)}$、比较两个无偏估计的效率。"],"kps":["次序统计量","无偏性","总体与样本、统计量","连续型密度与常见分布","多维函数的分布","数字特征与矩"],"pts":15},{"year":2023,"no":1,"type":"名词解释","stem":"简述三个事件相互独立的定义。","sol":"设 $A, B, C$ 为三个事件，若同时满足 $P(AB)=P(A)P(B)$、$P(AC)=P(A)P(C)$、$P(BC)=P(B)P(C)$、$P(ABC)=P(A)P(B)P(C)$，则称 $A, B, C$ 相互独立。两两独立仅要求前 3 个等式，相互独立还需第 4 个等式。相互独立蕴含两两独立，反之不成立。","traps":["遗漏第 4 个等式 $P(ABC)=P(A)P(B)P(C)$；","混淆相互独立与两两独立。"],"ext":[],"kps":["事件独立性"],"pts":5},{"year":2023,"no":2,"type":"名词解释","stem":"简述二维随机变量 $(X, Y)$ 联合分布函数的定义与性质。","sol":"$F(x,y)=P(X\\leq x,\\ Y\\leq y)$，对任意实数 $x,y$。性质：① 关于 $x$ 和 $y$ 分别单调不减；② 关于 $x$ 和 $y$ 分别右连续；③ $F(-\\infty,y)=F(x,-\\infty)=F(-\\infty,-\\infty)=0$，$F(+\\infty,+\\infty)=1$；④ 对任意 $x_1<x_2,\\ y_1<y_2$，$P(x_1<X\\leq x_2,\\ y_1<Y\\leq y_2)=F(x_2,y_2)-F(x_2,y_1)-F(x_1,y_2)+F(x_1,y_1)\\geq 0$。","traps":["遗漏第 4 条性质（非负性）；","联合分布函数与边际分布函数的关系 $F_X(x)=F(x,+\\infty)$。"],"ext":[],"kps":["联合分布与边际分布","分布函数与分布列"],"pts":5},{"year":2023,"no":3,"type":"名词解释","stem":"简述充分统计量的定义。","sol":"设 $X_1,\\ldots,X_n$ 是来自总体 $f(x;\\theta)$ 的样本，$T=T(X_1,\\ldots,X_n)$ 为统计量。若在给定 $T=t$ 的条件下，样本的条件分布 $f(x_1,\\ldots,x_n\\mid T=t)$ 与 $\\theta$ 无关，则称 $T$ 为 $\\theta$ 的充分统计量。直观含义：$T$ 包含了样本中关于 $\\theta$ 的全部信息，知道 $T$ 后样本其余部分不再提供 $\\theta$ 的额外信息。因子分解定理：$T$ 充分 $\\Longleftrightarrow$ 似然函数 $L(\\theta)=g(T;\\theta)\\cdot h(x_1,\\ldots,x_n)$，其中 $h$ 与 $\\theta$ 无关。","traps":["定义中条件分布与 $\\theta$ 无关是核心；","充分统计量不唯一（一对一变换仍充分）。"],"ext":[],"kps":["充分统计量","总体与样本、统计量"],"pts":5},{"year":2023,"no":4,"type":"名词解释","stem":"简述简单随机样本的定义。","sol":"设总体 $X$ 的分布函数为 $F(x)$，若 $X_1,\\ldots,X_n$ 相互独立且每个 $X_i$ 都与 $X$ 同分布（即 $F_{X_i}(x)=F(x)$），则称 $X_1,\\ldots,X_n$ 为来自总体 $X$ 的简单随机样本，简称样本，$n$ 为样本量。性质：独立同分布（i.i.d.），联合分布函数为 $\\prod F(x_i)$，联合密度为 $\\prod f(x_i)$。","traps":["\"独立\"和\"同分布\"两个条件缺一不可；","简单随机样本 vs 复杂抽样（分层、整群等）。"],"ext":[],"kps":["总体与样本、统计量","事件独立性"],"pts":5},{"year":2023,"no":1,"type":"填空","stem":"$P(A)=0.5$，$P(B)=0.6$，$P(B\\mid A)=0.8$，$P(AB)=$____，$P(A\\cup B)=$____。","sol":"$$P(AB)=P(B\\mid A)P(A)=0.8\\times 0.5=0.4.$$\n\n$$P(A\\cup B)=0.5+0.6-0.4=0.7.$$\n\n**考点：** 条件概率、加法公式。","traps":["$P(AB)=P(B\\mid A)P(A)$ 而非 $P(A\\mid B)P(B)$。"],"ext":[],"kps":["事件关系与概率性质","条件概率与乘法公式"],"pts":4},{"year":2023,"no":2,"type":"填空","stem":"$X\\sim P(\\lambda)$，且 $E(X^2+2X-4)=0$，则 $P(X\\geq 1)=$____。","sol":"$$E(X^2)=\\mathrm{Var}(X)+[E(X)]^2=\\lambda+\\lambda^2.$$\n\n$$E(X^2+2X-4)=\\lambda+\\lambda^2+2\\lambda-4=\\lambda^2+3\\lambda-4=0\\;\\Longrightarrow\\;(\\lambda+4)(\\lambda-1)=0\\;\\Longrightarrow\\;\\lambda=1.$$\n\n$$P(X\\geq 1)=1-P(X=0)=1-e^{-1}.$$\n\n**考点：** 泊松分布的数字特征、解方程。","traps":["$E(X^2)=\\lambda+\\lambda^2$，考生易只写 $\\lambda$。"],"ext":[],"kps":["常见离散分布"],"pts":4},{"year":2023,"no":3,"type":"填空","stem":"$f(x,y)=\\{x+y,\\ 0\\leq x,y\\leq 1;\\ 0,\\ \\text{其他}\\}$，$E(X)=$____。","sol":"$$f_X(x)=\\int_0^1 (x+y)\\,\\mathrm{d}y=x+\\dfrac{1}{2},\\quad 0\\leq x\\leq 1.$$\n\n$$E(X)=\\int_0^1 x\\left(x+\\dfrac{1}{2}\\right)\\mathrm{d}x=\\dfrac{1}{3}+\\dfrac{1}{4}=\\dfrac{7}{12}.$$\n\n**考点：** 二维联合密度求边际、期望。","traps":["边际密度积分 $f_X(x)=\\int_0^1(x+y)\\,\\mathrm{d}y=x+\\dfrac{1}{2}$。"],"ext":[],"kps":["数字特征与矩","联合分布与边际分布"],"pts":4},{"year":2023,"no":4,"type":"填空","stem":"$X,Y$ 独立同分布：$X=-1,1$，$P=1-p,p$；$Y$ 同。则 $Z=(X+Y)/2+1$，服从____分布。","sol":"$X+Y$ 的可能取值：$-2$（概率 $(1-p)^2$）、$0$（概率 $2p(1-p)$）、$2$（概率 $p^2$）。$Z=(X+Y)/2+1$ 的取值：$0$（概率 $(1-p)^2$）、$1$（概率 $2p(1-p)$）、$2$（概率 $p^2$）。即 $Z$ 服从取值 $0,1,2$，概率分别为 $(1-p)^2,\\ 2p(1-p),\\ p^2$ 的分布，等价于 $Z\\sim b(2,p)$（二项分布，$n=2$）。\n\n**考点：** 离散型随机变量函数的分布、二项分布。","traps":["$Z$ 的取值为 $0,1,2$ 而非 $-1,0,1$。"],"ext":[],"kps":["随机变量函数的分布","事件独立性","常见离散分布"],"pts":4},{"year":2023,"no":5,"type":"填空","stem":"$X\\sim N(2,\\sigma^2)$，$\\sigma>0$，且 $P(2<X<4)=0.3$，则 $P(X<0)=$____。","sol":"$X\\sim N(2,\\sigma^2)$，关于 $\\mu=2$ 对称。$P(2<X<4)=P(0<X<2)=0.3$（对称性，$4$ 和 $0$ 关于 $2$ 对称）。$P(X<2)=0.5$，故\n\n$$P(X<0)=P(X<2)-P(0\\leq X<2)=0.5-0.3=0.2.$$\n\n**考点：** 正态分布的对称性。","traps":["利用对称性 $P(2<X<4)=P(0<X<2)$。"],"ext":[],"kps":["连续型密度与常见分布"],"pts":4},{"year":2023,"no":6,"type":"填空","stem":"$X\\sim N(0,2^2)$，$K=a(3X_1-X_2)^2+b(4X_3-X_4)^2$，$X_1$ 和 $X_2$ 独立，$a=$____，$b=$____，$K\\sim\\chi^2$，自由度为____。","sol":"$\\mathrm{Var}(X_i)=4$。\n\n$$3X_1-X_2\\sim N(0,9\\times 4+1\\times 4)=N(0,40),$$\n\n标准化 $(3X_1-X_2)^2/40\\sim\\chi^2(1)$，故 $a=1/40$。\n\n$$4X_3-X_4\\sim N(0,16\\times 4+1\\times 4)=N(0,68),$$\n\n$(4X_3-X_4)^2/68\\sim\\chi^2(1)$，故 $b=1/68$。自由度 $=1+1=2$。\n\n**考点：** 正态线性组合的卡方构造。","traps":["方差计算 $9\\times 4+4=40$，$16\\times 4+4=68$。"],"ext":[],"kps":["连续型密度与常见分布","总体与样本、统计量","抽样分布与三大分布构造"],"pts":4},{"year":2023,"no":7,"type":"填空","stem":"$X_1,\\ldots,X_n$ 是来自总体的样本，$EX=\\mu$，$\\mathrm{Var}(X)=\\sigma^2$，$c=$____，$c\\sum_{i=1}^{n-1}(X_{i+1}-X_i)^2$ 是 $\\sigma^2$ 的无偏估计。","sol":"$$E[(X_{i+1}-X_i)^2]=\\mathrm{Var}(X_{i+1}-X_i)+[E(X_{i+1}-X_i)]^2=2\\sigma^2+0=2\\sigma^2.$$\n\n$$E[c\\sum_{i=1}^{n-1}\\cdots]=c(n-1)\\cdot 2\\sigma^2=\\sigma^2\\;\\Longrightarrow\\;c=\\dfrac{1}{2(n-1)}.$$\n\n**考点：** 无偏估计、差分的方差。","traps":["$E[(X_{i+1}-X_i)^2]=2\\sigma^2$（因独立，$\\mathrm{Var}$ 差 $=2\\sigma^2$，期望差 $=0$）。"],"ext":[],"kps":["数字特征与矩","总体与样本、统计量","无偏性"],"pts":4},{"year":2023,"no":1,"type":"计算","stem":"四枚均匀正品硬币（一面数字，一面国徽），2 枚次品硬币（两面均为国徽面），已知任取一枚抛掷三次均为国徽面，求是正品的概率。","sol":"设 $A=$\"取到正品\"，$B=$\"取到次品\"，$C=$\"抛掷三次均为国徽\"。$P(A)=4/6=2/3$，$P(B)=2/6=1/3$。\n\n$$P(C\\mid A)=\\left(\\dfrac{1}{2}\\right)^3=\\dfrac{1}{8}\\quad(\\text{正品每次国徽概率 }1/2).$$\n\n$P(C\\mid B)=1$（次品两面都是国徽，每次必为国徽）。\n\n$$P(C)=P(A)P(C\\mid A)+P(B)P(C\\mid B)=\\dfrac{2}{3}\\cdot\\dfrac{1}{8}+\\dfrac{1}{3}\\cdot 1=\\dfrac{1}{12}+\\dfrac{1}{3}=\\dfrac{5}{12}.$$\n\n$$P(A\\mid C)=\\dfrac{P(A)P(C\\mid A)}{P(C)}=\\dfrac{\\dfrac{2}{3}\\times\\dfrac{1}{8}}{\\dfrac{5}{12}}=\\dfrac{\\dfrac{1}{12}}{\\dfrac{5}{12}}=\\dfrac{1}{5}=0.2.$$","traps":["正品每次国徽概率为 $1/2$，三次独立为 $(1/2)^3$；","次品两面国徽，每次必为国徽，$P(C\\mid B)=1$；","先验概率 $P(A)=4/6,\\ P(B)=2/6$。"],"ext":["考纲定位：贝叶斯公式是每年必考计算题，硬币/产品场景是经典；","命题延伸方向：抛掷 $n$ 次均为国徽的后验概率、后验概率随 $n$ 变化的趋势。"],"kps":["全概率与贝叶斯"],"pts":20},{"year":2023,"no":2,"type":"计算","stem":"事件 $A,B$，$P(A)=1/4$，$P(B\\mid A)=1/3$，$P(A\\mid B)=1/2$，令 $X=\\{1,A\\text{发生};\\ 0,A\\text{不发生}\\}$，$Y=\\{1,B\\text{发生};\\ 0,B\\text{不发生}\\}$。（1）$(X,Y)$ 联合分布；（2）$X+Y$ 的分布列；（3）$X,Y$ 的相关系数。","sol":"$$P(AB)=P(B\\mid A)P(A)=\\dfrac{1}{3}\\cdot\\dfrac{1}{4}=\\dfrac{1}{12}.$$\n\n$$P(B)=\\dfrac{P(AB)}{P(A\\mid B)}=\\dfrac{\\dfrac{1}{12}}{\\dfrac{1}{2}}=\\dfrac{1}{6}.$$\n\n$$P(A\\bar{B})=P(A)-P(AB)=\\dfrac{1}{4}-\\dfrac{1}{12}=\\dfrac{1}{6}.$$\n\n$$P(\\bar{A}B)=P(B)-P(AB)=\\dfrac{1}{6}-\\dfrac{1}{12}=\\dfrac{1}{12}.$$\n\n$$P(\\bar{A}\\bar{B})=1-\\dfrac{1}{12}-\\dfrac{1}{6}-\\dfrac{1}{12}=1-\\dfrac{1}{12}-\\dfrac{2}{12}-\\dfrac{1}{12}=\\dfrac{8}{12}=\\dfrac{2}{3}.$$\n\n（1）联合分布：\n\n$$P(X=1,Y=1)=P(AB)=\\dfrac{1}{12}$$\n\n$$P(X=1,Y=0)=P(A\\bar{B})=\\dfrac{1}{6}$$\n\n$$P(X=0,Y=1)=P(\\bar{A}B)=\\dfrac{1}{12}$$\n\n$$P(X=0,Y=0)=P(\\bar{A}\\bar{B})=\\dfrac{2}{3}$$\n\n（2）$X+Y$ 的取值：$0,1,2$。\n\n$$P(X+Y=0)=P(0,0)=\\dfrac{2}{3}$$\n\n$$P(X+Y=1)=P(1,0)+P(0,1)=\\dfrac{1}{6}+\\dfrac{1}{12}=\\dfrac{1}{4}$$\n\n$$P(X+Y=2)=P(1,1)=\\dfrac{1}{12}$$\n\n（3）相关系数：$E(X)=P(A)=1/4$，$E(Y)=P(B)=1/6$。\n\n$$E(XY)=P(X=1,Y=1)=\\dfrac{1}{12}.$$\n\n$$\\mathrm{Cov}(X,Y)=E(XY)-E(X)E(Y)=\\dfrac{1}{12}-\\dfrac{1}{4}\\cdot\\dfrac{1}{6}=\\dfrac{1}{12}-\\dfrac{1}{24}=\\dfrac{1}{24}.$$\n\n$$\\mathrm{Var}(X)=P(A)(1-P(A))=\\dfrac{1}{4}\\cdot\\dfrac{3}{4}=\\dfrac{3}{16}.$$\n\n$$\\mathrm{Var}(Y)=P(B)(1-P(B))=\\dfrac{1}{6}\\cdot\\dfrac{5}{6}=\\dfrac{5}{36}.$$\n\n$$\\rho=\\dfrac{\\mathrm{Cov}}{\\sqrt{\\mathrm{Var}_X}\\cdot\\sqrt{\\mathrm{Var}_Y}}=\\dfrac{\\dfrac{1}{24}}{\\sqrt{\\dfrac{3}{16}\\times\\dfrac{5}{36}}}=\\dfrac{\\dfrac{1}{24}}{\\sqrt{\\dfrac{15}{576}}}=\\dfrac{\\dfrac{1}{24}}{\\dfrac{\\sqrt{15}}{24}}=\\dfrac{1}{\\sqrt{15}}=\\dfrac{\\sqrt{15}}{15}\\approx 0.258.$$","traps":["$P(B)$ 需由 $P(A\\mid B)=P(AB)/P(B)$ 反求；","联合分布四个概率之和为 1，需验证；","0-1 变量的 $E(XY)=P(X=1,Y=1)$；","相关系数计算中 $\\mathrm{Var}(X)=p(1-p)$。"],"ext":["考纲定位：0-1 变量的联合分布与相关系数是数字特征板块常规综合题；","命题延伸方向：判断 $X,Y$ 是否独立（本题不独立，因 $P(1,1)=1/12\\neq 1/4\\times 1/6=1/24$）。"],"kps":["数字特征与矩","联合分布与边际分布","多维函数的分布","协方差与相关系数","分布函数与分布列"],"pts":20},{"year":2023,"no":3,"type":"计算","stem":"$f(x,y)=\\{ce^{-y},\\ 0<x<y;\\ 0,\\ \\text{其他}\\}$。（1）求 $c$；（2）$Y$ 的边际密度函数；（3）$P(Y>1\\mid X+Y\\leq 2)$。","sol":"（1）归一化：\n\n$$\\int_0^{\\infty}\\int_0^y c\\,e^{-y}\\,\\mathrm{d}x\\,\\mathrm{d}y=\\int_0^{\\infty} c\\,y\\,e^{-y}\\,\\mathrm{d}y=c\\cdot\\Gamma(2)=c\\cdot 1=1\\;\\Longrightarrow\\;c=1.$$\n\n（2）\n\n$$f_Y(y)=\\int_0^y e^{-y}\\,\\mathrm{d}x=y\\,e^{-y},\\quad y>0.$$\n\n即 $Y\\sim \\mathrm{Gamma}(2,1)$。\n\n（3）$P(Y>1\\mid X+Y\\leq 2)=\\dfrac{P(Y>1,\\ X+Y\\leq 2)}{P(X+Y\\leq 2)}$。\n\n分母 $P(X+Y\\leq 2)=\\displaystyle\\iint_{x+y\\leq 2,\\ 0<x<y} e^{-y}\\,\\mathrm{d}x\\mathrm{d}y$。区域：$0<x<y,\\ x+y\\leq 2\\Rightarrow x<y$ 且 $y\\leq 2-x\\Rightarrow x<2-x\\Rightarrow x<1$，$y\\in(x,\\ 2-x)$。\n\n$$=\\int_0^1\\int_x^{2-x} e^{-y}\\,\\mathrm{d}y\\,\\mathrm{d}x=\\int_0^1 \\left[-e^{-y}\\right]_x^{2-x}\\,\\mathrm{d}x=\\int_0^1 (e^{-x}-e^{-(2-x)})\\,\\mathrm{d}x$$\n\n$$=\\left[-e^{-x}-e^{-2}e^x\\right]_0^1=(-e^{-1}-e^{-1})-(-1-e^{-2})=-2e^{-1}+1+e^{-2}=(1-e^{-1})^2.$$\n\n分子 $P(Y>1,\\ X+Y\\leq 2)$：区域 $0<x<y,\\ y>1,\\ x+y\\leq 2$。$y\\in(1,2)$，$x\\in(0,\\min(y, 2-y))$。当 $y<2-y$ 即 $y<1$ 时 $x<y$，但 $y>1$，故 $y\\in(1,2)$ 时 $2-y<y$，$x\\in(0,2-y)$。\n\n$$=\\int_1^2\\int_0^{2-y} e^{-y}\\,\\mathrm{d}x\\,\\mathrm{d}y=\\int_1^2 (2-y)e^{-y}\\,\\mathrm{d}y$$\n\n$$=\\left[-(2-y)e^{-y}-e^{-y}\\right]_1^2\\quad(\\text{分部积分})=(0-e^{-2})-(-e^{-1}-e^{-1})=-e^{-2}+2e^{-1}.$$\n\n$$\\text{条件概率}=\\dfrac{2e^{-1}-e^{-2}}{1-2e^{-1}+e^{-2}}=\\dfrac{e^{-1}(2-e^{-1})}{(1-e^{-1})^2}.$$","traps":["归一化积分区域 $0<x<y$，对 $x$ 积分得 $y$，再对 $y$ 积分 $\\int y e^{-y}\\,\\mathrm{d}y=1$；","边际密度 $f_Y(y)=y e^{-y}$（$\\mathrm{Gamma}(2,1)$）；","条件概率的区域划分是难点：$X+Y\\leq 2$ 与 $0<x<y$ 的交集；","分子中 $y>1$ 进一步限制区域，$x$ 的上限为 $2-y$（因 $y>1$ 时 $2-y<y$）。"],"ext":["考纲定位：三角形区域上的联合密度是多维随机变量计算题的难点，西北大学偏好考察非矩形区域；","命题延伸方向：求 $X$ 的边际密度、求条件密度 $f_{X\\mid Y}(x\\mid y)$、求 $Z=X+Y$ 的密度。"],"kps":["联合分布与边际分布","条件概率与乘法公式","连续型密度与常见分布"],"pts":20},{"year":2023,"no":4,"type":"计算","stem":"$f(x)=\\{x^{-(\\theta+2)},\\ x>0;\\ 0,\\ \\text{其他}\\}$，求 $\\theta$ 的矩估计和最大似然估计。","sol":"注意：$f(x)=x^{-(\\theta+2)},\\ x>0$。归一化要求 $\\int_0^{\\infty} x^{-(\\theta+2)}\\,\\mathrm{d}x$ 收敛，但在 $x\\to 0$ 时 $x^{-(\\theta+2)}$ 积分要求 $-(\\theta+2)>-1$ 即 $\\theta<-1$，在 $x\\to\\infty$ 时要求 $-(\\theta+2)<-1$ 即 $\\theta>-1$，矛盾。回忆版可能遗漏了 $x>1$ 的下限（Pareto 分布通常 $x>1$）。若按 $x>1$：\n\n$$\\int_1^{\\infty} x^{-(\\theta+2)}\\,\\mathrm{d}x=\\left[\\dfrac{x^{-(\\theta+1)}}{-(\\theta+1)}\\right]_1^{\\infty}=\\dfrac{1}{\\theta+1},$$\n\n要求 $\\theta>-1$。归一化后密度应为 $(\\theta+1)x^{-(\\theta+2)},\\ x>1$。\n\n但题目给出 $f(x)=x^{-(\\theta+2)}$ 未带系数，可能题目本身 $f(x)$ 已含归一化系数（即 $\\theta+1=1\\Rightarrow\\theta=0$，不合理）。更可能是回忆版遗漏了系数或下限。\n\n**按常见考法 $f(x)=(\\theta+1)x^{-(\\theta+2)},\\ x>1$（Pareto 分布）**：\n\n矩估计：\n\n$$E(X)=\\int_1^{\\infty} x(\\theta+1)x^{-(\\theta+2)}\\,\\mathrm{d}x=(\\theta+1)\\int_1^{\\infty} x^{-(\\theta+1)}\\,\\mathrm{d}x=\\dfrac{\\theta+1}{\\theta}=1+\\dfrac{1}{\\theta}\\quad(\\theta>0).$$\n\n令 $E(X)=\\bar{X}$：\n\n$$1+\\dfrac{1}{\\theta}=\\bar{X}\\;\\Longrightarrow\\;\\theta=\\dfrac{1}{\\bar{X}-1}.$$\n\nMLE：$L=(\\theta+1)^n\\left(\\prod x_i\\right)^{-(\\theta+2)}$，$\\ln L=n\\ln(\\theta+1)-(\\theta+2)\\sum\\ln x_i$。\n\n$$\\dfrac{\\mathrm{d}(\\ln L)}{\\mathrm{d}\\theta}=\\dfrac{n}{\\theta+1}-\\sum\\ln x_i=0\\;\\Longrightarrow\\;\\theta+1=\\dfrac{n}{\\sum\\ln x_i}\\;\\Longrightarrow\\;\\hat{\\theta}=\\dfrac{n}{\\sum\\ln x_i}-1.$$\n\n**注**：若题目确实为 $x>0$ 且无系数，则该密度无法归一化，题目有误。实际考试中应以原题为准。","traps":["密度的归一化条件与参数范围；","Pareto 分布的下限通常为 1（或某个 $x_m$）；","矩估计中 $E(X)=(\\theta+1)/\\theta$；","MLE 求导 $n/(\\theta+1)-\\sum\\ln x_i=0$。"],"ext":["考纲定位：幂函数型密度（Pareto/Beta）的点估计是每年必考题型；","命题延伸方向：求估计量的无偏性、与指数分布通过对数变换联系。"],"kps":["极大似然估计","矩估计","连续型密度与常见分布"],"pts":20},{"year":2023,"no":5,"type":"计算","stem":"长度服从 $N(\\mu,\\sigma^2)$，$n=9$，$\\bar{x}=75$，$s^2=137.5$，$s=11.7$。（1）$\\sigma^2$ 的 $0.95$ 置信区间（结果四舍五入保留整数）；（2）$\\alpha=0.05$ 的条件下是否可以认为平均长度为 $73\\,\\mathrm{cm}$？（参考分位数：$t_{0.975}(9)=2.262$，$t_{0.975}(8)=2.306$，$u_{0.95}=1.65$，$u_{0.975}=1.96$，$\\chi^2_{0.975}(9)=15.507$，$\\chi^2_{0.05}(9)=2.733$，$\\chi^2_{0.975}(8)=17.534$，$\\chi^2_{0.05}(8)=2.18$）","sol":"$n=9$，自由度 $\\mathrm{df}=n-1=8$。\n\n（1）$\\sigma^2$ 的 $0.95$ 置信区间：\n\n$$\\left[\\dfrac{(n-1)s^2}{\\chi^2_{0.975}(8)},\\ \\dfrac{(n-1)s^2}{\\chi^2_{0.025}(8)}\\right].$$\n\n题目给出 $\\chi^2_{0.975}(8)=17.534$，$\\chi^2_{0.05}(8)=2.18$（注意：$0.95$ 置信区间需要 $\\chi^2_{0.025}(8)$，题目给的是 $\\chi^2_{0.05}(8)=2.18$，可能题目用的是不对称标注或回忆版有误。按标准应使用 $\\chi^2_{0.025}(8)\\approx 2.180$（实际 $\\chi^2_{0.025}(8)=2.180$），题目给的 $2.18$ 实际是 $\\chi^2_{0.025}(8)$。）\n\n代入：下限 $=8\\times 137.5/17.534=1100/17.534\\approx 62.7\\to 63$；上限 $=8\\times 137.5/2.18=1100/2.18\\approx 504.6\\to 505$。$\\sigma^2$ 的 $0.95$ 置信区间为 $(63,\\ 505)$（四舍五入保留整数）。\n\n（2）检验 $H_0:\\mu=73$ vs $H_1:\\mu\\neq 73$，$\\alpha=0.05$，$\\sigma^2$ 未知，用 $t$ 检验。\n\n$$T=\\dfrac{\\bar{x}-\\mu_0}{s/\\sqrt{n}}=\\dfrac{75-73}{11.7/3}=\\dfrac{2}{3.9}=0.513.$$\n\n拒绝域 $|T|\\geq t_{0.975}(8)=2.306$。$0.513<2.306$，不拒绝 $H_0$，可以认为平均长度为 $73\\,\\mathrm{cm}$。","traps":["自由度为 $n-1=8$，不是 $9$；","方差置
