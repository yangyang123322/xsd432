<style>﻿/* 432 手机版 · 样式（单文件内联用） */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f6f8; --panel:#fff; --ink:#15181e; --ink2:#454d5b; --ink3:#8a92a3;
  --line:#e4e7ed; --accent:#0e7c66; --warn:#b8342a; --tpl:#eef2f5; --chip:#f0f2f5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1015; --panel:#151a21; --ink:#e9ecf2; --ink2:#a9b2c1; --ink3:#6b7484;
    --line:#242b35; --accent:#3ecfad; --warn:#e57368; --tpl:#1a2028; --chip:#1d242d;
  }
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;word-break:break-word}
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 14px 9px}
.h1{font-size:17px;font-weight:700;letter-spacing:.3px;display:flex;align-items:baseline;gap:8px}
.h1 .sub{font-size:11.5px;font-weight:400;color:var(--ink3)}
.search{margin-top:8px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font-size:14px;outline:none}
.search:focus{border-color:var(--accent)}
.bar{margin-top:7px;font-size:12px;color:var(--ink3);display:flex;justify-content:space-between;gap:10px}
.bar b{color:var(--accent)}
main{padding:4px 0 calc(74px + env(safe-area-inset-bottom))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 12px;overflow:hidden}
details.card>summary{padding:12px 14px;cursor:pointer;list-style:none;display:flex;gap:9px;align-items:baseline}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";margin-left:auto;color:var(--ink3);font-size:12px;transition:transform .15s}
details.card[open]>summary::after{transform:rotate(180deg)}
.snum{font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.5px;flex:none}
.stitle{font-weight:650;font-size:15px;line-height:1.4}
.ssub{display:block;font-size:12px;font-weight:400;color:var(--ink3);margin-top:2px}
.body{padding:0 14px 14px}
.lab{font-size:10.5px;letter-spacing:1.4px;color:var(--ink3);margin:12px 0 3px;text-transform:uppercase}
.sig{background:var(--tpl);border-radius:9px;padding:9px 11px;font-size:14px;color:var(--ink2)}
ol.steps{margin:2px 0;padding-left:20px}
ol.steps li{margin:7px 0;font-size:14.5px}
.tpl{background:var(--tpl);border-radius:9px;padding:4px 8px;overflow-x:auto}
.trap{border-left:3px solid var(--warn);padding:1px 0 1px 10px;margin:9px 0;font-size:14px;color:var(--ink2)}
.chips{margin-top:4px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);
  font-size:12px;color:var(--ink2);margin:4px 5px 0 0;line-height:1.5}
button.chip{cursor:pointer;font-family:inherit}
button.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.learn{margin-top:14px;width:100%;padding:10px;border-radius:10px;border:1px dashed var(--line);
  background:transparent;color:var(--ink2);font-size:14px;font-family:inherit}
.learn.on{border-style:solid;border-color:var(--accent);color:var(--accent);font-weight:600}
.mathb{overflow-x:auto;margin:6px 0;padding:5px 0}
.mathb .katex{font-size:.95em}
.katex-display{margin:.3em 0!important;text-align:left!important}
.katex{font-size:1.03em}
.kv{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px;align-items:flex-start}
.kv:last-child{border-bottom:0}
.kv b{flex:none;width:74px;color:var(--ink3);font-weight:600;font-size:11.5px;padding-top:4px;line-height:1.45}
.kv span{flex:1;min-width:0}
.pairo{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.pairo .k{flex:none;color:var(--ink3);font-size:12px;padding-top:2px}
.yearbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 12px 4px;display:flex;gap:6px;overflow-x:auto}
.yearbar::-webkit-scrollbar{display:none}
.yearbar .chip{flex:none;white-space:nowrap;margin-top:0}
.qmeta{font-size:11.5px;color:var(--ink3)}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:40px 20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--panel);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:0;background:transparent;color:var(--ink3);font-family:inherit;
  padding:9px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button i{font-style:normal;font-size:17px;line-height:1}
.tabbar button.on{color:var(--accent);font-weight:700}
.hl{background:rgba(250,204,21,.28);border-radius:3px}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:13px}
.tblwrap{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:9px}
.tb{border-collapse:collapse;font-size:13.5px;min-width:100%}
.tb th,.tb td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 9px;vertical-align:top}
.tb th{background:var(--chip);font-weight:600;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.tb tr:last-child td{border-bottom:0}
.tb th:last-child,.tb td:last-child{border-right:0}
blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--line);color:var(--ink2);font-size:14px}
ul,ol{padding-left:20px}
a{color:var(--accent)}
strong{color:var(--ink)}

/* ---------- 进度同步 ---------- */
.srow { display: flex; gap: 8px; align-items: center; }
.srow .search { flex: 1; margin-top: 8px; }
.syncbtn { flex: none; margin-top: 8px; width: 40px; height: 38px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 15px; line-height: 1; }
#syncWrap { display: none; position: fixed; inset: 0; z-index: 90; background: rgba(10,13,18,.55);
  align-items: center; justify-content: center; padding: 16px; }
#syncWrap.on { display: flex; }
#syncWrap .sync-box { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 16px; font-size: 13.5px; line-height: 1.6; color: var(--ink);
  box-shadow: 0 18px 48px rgba(0,0,0,.35); }
#syncWrap .sync-h { font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
#syncWrap #syncClose { color: var(--ink3); font-size: 22px; line-height: 1; padding: 0 4px; }
#syncWrap .sync-p { color: var(--ink3); font-size: 12.5px; margin: 6px 0 10px; }
#syncWrap textarea { width: 100%; height: 88px; resize: vertical; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 8px 10px;
  font-size: 11.5px; line-height: 1.5; font-family: ui-monospace, Consolas, monospace; }
#syncWrap .sync-btns { display: flex; gap: 8px; margin-top: 10px; }
#syncWrap .sync-btns button { flex: 1; padding: 9px 8px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--chip); color: var(--ink); font-size: 13px; font-family: inherit; white-space: nowrap; }
#syncWrap .sync-btns button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
#syncWrap .sync-msg { font-size: 12.5px; color: var(--accent); margin-top: 8px; min-height: 17px; }
/* ---------- RESPONSIVE-WIDE：宽屏（平板/电脑）把手机排版拉直 ---------- */
@media (min-width: 780px) {
  html, body { font-size: 16px; }
  .top { padding: 14px 0 12px; }
  .top > .h1, .top > .srow { max-width: 880px; margin: 0 auto; }
  .h1 { font-size: 20px; }
  main { max-width: 880px; margin: 0 auto; padding-bottom: 96px; }
  .card { margin: 12px 0; border-radius: 14px; }
  details.card > summary { padding: 14px 18px; }
  details.card .body { padding: 0 18px 16px; }
  .yearbar { max-width: 880px; margin: 10px auto 0; }
  .bar { max-width: 880px; margin: 8px auto 0; }
  #view, .empty { max-width: 880px; }
  .tabbar { left: 50%; transform: translateX(-50%); width: 620px; border-radius: 16px 16px 0 0;
    border-left: 1px solid var(--line); border-right: 1px solid var(--line); bottom: 0; }
  .tabbar button { font-size: 13px; }
  .tabbar button i { font-size: 15px; }
  #syncWrap .sync-box { max-width: 520px; }
}
@media (min-width: 1200px) {
  .top > .h1, .top > .srow, main, .yearbar, .bar, #view { max-width: 1040px; }
  .tabbar { width: 720px; }
}
/* ---- 辨析四段式 ---- */
.bx { margin: 2px 0 10px; line-height: 1.6; }
.bx > div { margin: 3px 0; }
ul.bxl { margin: 2px 0 10px; padding-left: 18px; }
ul.bxl li { margin: 4px 0; line-height: 1.6; }

/* ---------- 辨析三段答题体 ---------- */
.tx3 p{margin:0 0 10px;font-size:15px;line-height:1.8}
.tx3 p:last-child{margin-bottom:0}
.tx3 p b{display:inline-block;min-width:32px;color:var(--accent);font-weight:600;margin-right:6px}

.tx3 p.lk{background:var(--acc-soft, rgba(31,122,92,.08));border-radius:10px;padding:8px 10px;margin-top:6px}
</style>
<style>/* ext.css —— 复习计数 / 掌握状态 / 文字高亮 / 断点续读 */
.xbar{margin-top:6px;padding:5px 8px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--ink-3)}
.xbar .xcount{font-weight:700;color:var(--accent);font-size:13px}
.xbar .xstate{padding:1px 7px;border-radius:9px;background:var(--chip,#eef2f5);color:var(--ink-2);font-size:11px}
.xbar .xstate.m1{background:#e9f2ee;color:#1f7a5c}
.xbar .xstate.m2{background:#1f7a5c;color:#fff}
.xbar button{border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:7px;padding:2px 8px;font-size:11.5px;cursor:pointer;line-height:1.5}
.xbar button:hover{border-color:var(--accent);color:var(--accent)}
.xbar button.xm.on{background:#1f7a5c;border-color:#1f7a5c;color:#fff}

.xsum{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:7px 10px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel,#fbfcfd);font-size:12.5px;color:var(--ink-2)}
.xsum b{color:var(--accent)}
.xsum .xf{margin-left:auto;display:flex;gap:6px}
.xsum .xf button{border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer}
.xsum .xf button.on{background:#1f7a5c;border-color:#1f7a5c;color:#fff}

mark.xhl{background:#ffe58a;color:inherit;padding:0 1px;border-radius:2px;cursor:pointer}
[data-theme="dark"] mark.xhl{background:#7a6a1f;color:#fff}
mark.xhl:hover{outline:1px solid #d4a017}
body.xhide-mastered [data-xid].is-m2{display:none}
body.xhide-undone [data-xid].is-untouched{display:none}

#xhlbar{position:fixed;z-index:9999;display:none;gap:6px;padding:5px 6px;background:#fff;border:1px solid #d7dce3;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.14)}
#xhlbar button{border:0;background:#f2f6f4;color:#1d2733;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}
#xhlbar button:hover{background:#e3efe9}
#xhlbar .xdel{background:#fdf0ef;color:#c0392b}
#xerr{position:fixed;left:8px;bottom:8px;z-index:99999;max-width:70vw;background:#fff3cd;color:#7a5b00;border:1px solid #e0c36a;border-radius:8px;padding:6px 9px;font:12px/1.4 monospace;white-space:pre-wrap;display:none}

/* ---- 到期筛选 ---- */
body.xdue [data-xid]:not(.is-due){ display:none !important; }

/* ---- 三档评分按钮 ---- */
.xbar .xg{ border:1px solid var(--line,#dfe4ec); background:#fff; color:#3b4452; border-radius:6px; padding:1px 7px; margin-left:4px; font-size:11.5px; cursor:pointer; }
.xbar .xg:hover{ background:#f4f6f9; }
.xbar .xg.again{ border-color:#e6b8b3; color:#b03a2e; }
.xbar .xg.fuzzy{ border-color:#e3d3a8; color:#8a6d1f; }
.xbar .xg.known{ border-color:#b6d3bf; color:#1f6f52; }
.xbar .xdue{ margin-left:6px; font-size:11.5px; color:#c0392b; }

/* ---- 挖空 ---- */
.xcl{ background:#eef3ff; border-bottom:1px dashed #91a7c8; border-radius:3px; padding:0 5px; cursor:pointer; color:#5a6b8c; }
.xcl.on{ background:#fff6d6; border-bottom-color:#c9a227; color:#222; }
.xpkg{ background:#f5f6f8; border-radius:4px; padding:1px 5px; color:#8a93a2; cursor:pointer; }

/* ---- 汇总条里的开关 ---- */
.xsum .xt.on{ background:#1f7a5c; color:#fff; border-color:#1f7a5c; }
.xsum b.xd{ color:#c0392b; }

/* ---- 窄屏收紧 ---- */
@media (max-width: 560px){
  .xsum{ font-size:11px; gap:4px; }
  .xsum .xf{ gap:4px; }
  .xsum .xf button{ padding:1px 6px; font-size:11px; white-space:nowrap; }
  .xbar{ font-size:11px; gap:4px; }
  .xbar .xg{ padding:0 6px; font-size:11px; white-space:nowrap; }
  .xbar .xdue{ font-size:11px; }
}
</style>

  <div class="h1">西大应用统计 <span class="sub" id="sub">432</span></div>

</header>

</nav>

<script>window.DATA_M={"meta":{"site":"432 统计 · 西大真题结构化题库","school":"西北大学 应用统计（432）","built":"2026-11-07 21:43","nq":111,"nkp":40,"npojue":34,"nqStruct":118,"nMissStem":3,"nMissSol":6,"nconcept":87,"nladder":93,"nformula":32,"nquiz":60,"nitem":164},"pojue":[{"id":"j01","no":1,"name":"全概率与贝叶斯","short":"划分原因，正算全概率、倒算贝叶斯","kps":["全概率与贝叶斯"],"signal":"题干出现「任取一件，求它是次品的概率」「已知取到次品，求它来自哪条线」；或分层抽检、两步试验、先验+后验。","steps":["① 定划分：把导致结果的原因写成互不相容的完备事件组 $B_1,\\dots,B_n$（产线/袋/箱/患病与否）。","② 写三件套：先验 $P(B_i)$、似然 $P(A\\mid B_i)$、结果 $A$。","③ 正问用全概率：$P(A)=\\sum_i P(B_i)P(A\\mid B_i)$。","④ 倒问用贝叶斯：$P(B_i\\mid A)=\\dfrac{P(B_i)P(A\\mid B_i)}{P(A)}$，分母就是第③步的结果。","⑤ 收尾验算：各后验概率之和必须为 1。"],"template":"$P(B_i\\mid A)=\\dfrac{P(B_i)P(A\\mid B_i)}{\\sum_j P(B_j)P(A\\mid B_j)}$","traps":["把 $P(A\\mid B_i)$ 与 $P(B_i\\mid A)$ 写反——这是本题型第一大失分点。","划分没有穷尽（漏掉一类），或各 $B_i$ 有交集。","分母忘记相加，直接用单个 $P(B_i)P(A\\mid B_i)$ 当概率。"],"next":["j15","j02","j31"],"qids":["2026-计算-1","2026-计算-6","2024-解答-1","2023-计算-1","2022-计算-5","2020-计算-1"],"n":6,"pts":100,"years":[2020,2022,2023,2024,2026]},{"id":"j02","no":2,"name":"二维连续型四连问","short":"归一化 → 边际 → 条件 → 独立/概率","kps":["联合分布与边际分布","条件分布与条件密度","随机变量独立性判定","二维区域型分布"],"signal":"给出 $f(x,y)$（常带待定常数 $c$）与一块区域，连续问四件事：求 $c$、求边际、求条件密度、判独立或求某个概率。","steps":["① 画区域：先把 $f>0$ 的区域画出来，所有积分上下限都由它决定。","② 归一化定 $c$：$\\iint_D f\\,\\mathrm dx\\mathrm dy=1$。","③ 边际：$f_X(x)=\\int f(x,y)\\,\\mathrm dy$，注意 $x$ 的取值分段，$y$ 的上限常是 $x$ 的函数。","④ 条件：$f_{Y\\mid X}(y\\mid x)=\\dfrac{f(x,y)}{f_X(x)}$（$f_X(x)>0$）。","⑤ 判独立：$f(x,y)\\equiv f_X(x)f_Y(y)$（在公共支撑上恒等），或「区域不是矩形 ⇒ 不独立」。","⑥ 求概率：$P((X,Y)\\in G)=\\iint_G f$，先画 $G$ 与支撑的交。"],"template":"$f_{Y\\mid X}(y\\mid x)=\\dfrac{f(x,y)}{f_X(x)},\\qquad f(x,y)=f_Xf_Y\\iff$ 独立","traps":["边际积分限照抄题目，没按区域分段（$0<x<y<1$ 这类最容易错）。","用「$f_Xf_Y=f$ 在某一点成立」判独立——必须在整个支撑上恒等。","区域为三角形/圆形时仍按矩形写限。"],"next":["j07","j08","j18","j32"],"qids":["2026-填空-2","2026-填空-5","2026-计算-3","2025-计算-2","2024-填空-3","2024-解答-2","2024-解答-3","2023-名词解释-2","2023-填空-3","2023-计算-2","2023-计算-3","2022-计算-2","2021-计算-2","2021-计算-3","2020-计算-2","2019-计算-3"],"n":16,"pts":207,"years":[2019,2020,2021,2022,2023,2024,2025,2026]},{"id":"j03","no":3,"name":"矩估计","short":"几个参数列几个方程，令样本矩=总体矩","kps":["矩估计"],"signal":"「求 $\\theta$ 的矩估计量」，或密度里带 1~2 个未知参数且没有「似然」字样。","steps":["① 数参数：$k$ 个未知参数就列 $k$ 个方程。","② 算总体矩：$E X$（必要时再加 $E X^2$ 或 $DX$），写成参数的函数。","③ 令其等于样本矩：$E X=\\bar X$，$E X^2=\\dfrac1n\\sum X_i^2$。","④ 解方程组，把参数解成 $\\bar X$（及二阶矩）的表达式，加帽。"],"template":"$E X=\\bar X,\\quad E X^2=\\dfrac1n\\sum_{i=1}^n X_i^2$","traps":["用 $S^2$ 替 $E X^2$ 时忘了 $E X^2=DX+(EX)^2$。","参数两个却只列一个方程，或把 $E X^2$ 直接写成 $\\overline{X^2}$ 与 $(\\bar X)^2$ 混用。","解出的估计量忘了写「帽」或没说明它是统计量（不含未知参数）。"],"next":["j04","j12","j21"],"qids":["2026-计算-4","2025-计算-1","2024-解答-5","2023-计算-4","2021-填空-6","2021-计算-6","2019-计算-5"],"n":7,"pts":105,"years":[2019,2021,2023,2024,2025,2026]},{"id":"j04","no":4,"name":"极大似然估计","short":"写 L → 取对数 → 求导定驻点 → 查边界","kps":["极大似然估计"],"signal":"题干出现「最大似然」「极大似然」「MLE」，或要求「最可能使样本出现的参数」。","steps":["① 写似然：$L(\\theta)=\\prod_{i=1}^n f(x_i;\\theta)$（离散用 $\\prod P(X=x_i)$）。","② 取对数：$\\ell=\\ln L$，把乘积变和。","③ 求导定驻点：$\\dfrac{\\mathrm d\\ell}{\\mathrm d\\theta}=0$ 解出 $\\hat\\theta$；多参数解方程组并验二阶条件。","④ 查边界：支撑依赖参数（如 $0<x<\\theta$）时，$\\ell$ 对 $\\theta$ 单调，最大值在边界，答案形如 $X_{(n)}$ 或 $X_{(1)}$。","⑤ 写结论：$\\hat\\theta=\\dots$，并说明它是统计量。"],"template":"$\\hat\\theta_{\\mathrm{MLE}}=\\arg\\max_\\theta \\prod_i f(x_i;\\theta)$；支撑含参时取极值次序统计量","traps":["支撑含参却仍去求导——导数为 0 无解，答案在边界。","对数求导后忘记把 $\\theta$ 的约束（$\\theta>0$、$\\theta>x_{(n)}$ 等）写进结论。","多参数时只对一个参数求偏导，另一个漏掉。"],"next":["j12","j11","j21"],"qids":["2026-计算-4","2025-计算-1","2024-解答-5","2023-计算-4","2022-计算-3","2021-填空-6","2021-计算-6","2020-计算-4","2019-计算-5"],"n":9,"pts":140,"years":[2019,2020,2021,2022,2023,2024,2025,2026]},{"id":"j05","no":5,"name":"正态总体区间估计","short":"认参数选枢轴量，套分位数，倒出区间","kps":["区间估计"],"signal":"「求 $\\mu$ 的置信度为 $1-\\alpha$ 的置信区间」「区间长度不超过 $L$，至少需多少样本」。","steps":["① 认参数：$\\mu$（$\\sigma$ 已知/未知）、$\\sigma^2$、$\\mu_1-\\mu_2$、$\\sigma_1^2/\\sigma_2^2$。","② 选枢轴量：$Z=\\dfrac{\\bar X-\\mu}{\\sigma/\\sqrt n}$、$t=\\dfrac{\\bar X-\\mu}{S/\\sqrt n}$、$\\chi^2=\\dfrac{(n-1)S^2}{\\sigma^2}$、$F=\\dfrac{S_1^2/\\sigma_1^2}{S_2^2/\\sigma_2^2}$。","③ 写概率式 $P(\\text{分位数}<\\text{枢轴量}<\\text{分位数})=1-\\alpha$。","④ 反解出参数，注意 $\\chi^2$、$F$ 的区间端点要取倒数换位。","⑤ 样本量题：令半宽 $\\le L$ 解 $n$，向上取整。"],"template":"$\\bar X\\pm t_{\\alpha/2}(n-1)\\dfrac{S}{\\sqrt n},\\qquad \\left[\\dfrac{(n-1)S^2}{\\chi^2_{\\alpha/2}},\\dfrac{(n-1)S^2}{\\chi^2_{1-\\alpha/2}}\\right]$","traps":["$\\sigma$ 未知却用 $u_{\\alpha/2}$（应改 $t_{\\alpha/2}(n-1)$）。","$\\sigma^2$ 的区间端点写反：分母大的一端对应区间小的一端。","样本量算得 35.2 却答 35（必须向上取整为 36）。"],"next":["j06","j24","j10","j34"],"qids":["2026-填空-5","2023-计算-5","2022-计算-1","2020-计算-5","2019-计算-6"],"n":5,"pts":79,"years":[2019,2020,2022,2023,2026]},{"id":"j06","no":6,"name":"假设检验五步","short":"设假设 → 选统计量 → 定拒绝域 → 算值 → 下结论","kps":["假设检验原理与拒绝域","单样本均值/方差检验"],"signal":"「在显著性水平 $\\alpha$ 下检验……」；判断题给「拒绝/接受」结论要求说明理由。","steps":["① 设 $H_0$ 与 $H_1$（把要证/有把握的放 $H_1$，等号必在 $H_0$）。","② 选统计量并写出其在 $H_0$ 下的分布（$Z$、$t$、$\\chi^2$、$F$）。","③ 由 $\\alpha$ 与单双侧定拒绝域（画分布图标注尾部）。","④ 代入数据算统计量值，与分位数比较。","⑤ 下结论：拒绝 $H_0$ 就说「有充分理由认为……」，不拒绝只能说「没有充分理由」。","⑥ 若给 $p$ 值：$p<\\alpha$ 拒绝。"],"template":"拒绝域由 $H_1$ 的方向决定：$H_1:\\mu\\ne\\mu_0$ 双侧 $|Z|>u_{\\alpha/2}$；$H_1:\\mu>\\mu_0$ 右侧 $Z>u_\\alpha$","traps":["把 $H_0$ 与 $H_1$ 写反，拒绝域方向随之全错。","「接受 $H_0$」的措辞——统计上只能说「不拒绝」。","方差未知仍用 $Z$ 检验。"],"next":["j23","j26","j25"],"qids":["2026-计算-5","2026-计算-6","2025-计算-3","2024-解答-6","2020-计算-5","2019-计算-6"],"n":6,"pts":100,"years":[2019,2020,2024,2025,2026]},{"id":"j07","no":7,"name":"随机变量函数的分布","short":"先分布函数后求导；单调才可用公式法","kps":["随机变量函数的分布"],"signal":"「求 $Y=g(X)$ 的密度/分布」，$g$ 单调（$e^X$、$X^2$ 在分段上、$\\ln X$）。","steps":["① 先判 $g$ 是否单调：单调走公式法，不单调（$X^2$、$|X|$）必须走分布函数法。","② 分布函数法：$F_Y(y)=P(g(X)\\le y)$，把事件化成 $X$ 的区间，用 $F_X$ 表示。","③ 对 $y$ 求导得 $f_Y(y)$，并写清 $y$ 的取值范围。","④ 公式法（单调）：$f_Y(y)=f_X(h(y))\\,|h'(y)|$，$h=g^{-1}$。"],"template":"$f_Y(y)=f_X(g^{-1}(y))\\left|\\dfrac{\\mathrm d}{\\mathrm dy}g^{-1}(y)\\right|$","traps":["$X^2$、$|X|$ 直接用公式法漏掉一支。","求出 $f_Y$ 忘记写 $y$ 的范围（分段），或漏掉绝对值导致负密度。","离散型函数分布：先把 $Y$ 的取值去重再合并概率。"],"next":["j08","j02","j09"],"qids":["2026-填空-2","2024-填空-4","2024-证明-1","2023-填空-4","2022-计算-4","2021-计算-4","2019-计算-3","2019-计算-5"],"n":8,"pts":98,"years":[2019,2021,2022,2023,2024,2026]},{"id":"j08","no":8,"name":"max·min 分布","short":"$F_{\\max}=F^n$，$F_{\\min}=1-(1-F)^n$","kps":["多维函数的分布","次序统计量"],"signal":"「$M=\\max\\{X_1,\\dots,X_n\\}$」「$N=\\min\\{X_i\\}$」的分布/期望，样本独立同分布。","steps":["① 最大：$F_M(m)=[F(m)]^n$，密度 $n[F(m)]^{n-1}f(m)$。","② 最小：$F_N(n)=1-[1-F(n)]^n$，密度 $n[1-F(n)]^{n-1}f(n)$。","③ 求期望：$E M=\\int_0^\\infty P(M>t)\\,\\mathrm dt$（非负）或直接积分。","④ 极差 $R=M-N$：联合密度或 $P(R\\le r)$ 用区域积分。"],"template":"$f_{X_{(n)}}(x)=n[F(x)]^{n-1}f(x),\\quad f_{X_{(1)}}(x)=n[1-F(x)]^{n-1}f(x)$","traps":["把最大与最小的密度公式写反（$F$ 与 $1-F$ 互换）。","指数分布求 min 时忘记 min 仍服从指数（参数相加），硬积分离散化。","均匀分布 $U(0,\\theta)$ 的最大值期望是 $\\dfrac{n}{n+1}\\theta$，不是 $\\theta$。"],"next":["j11","j12","j09"],"qids":["2026-填空-4","2026-计算-2","2026-计算-3","2025-填空-1","2024-证明-1","2024-证明-2","2023-计算-2","2020-计算-2","2020-计算-3","2019-计算-3"],"n":10,"pts":148,"years":[2019,2020,2023,2024,2025,2026]},{"id":"j09","no":9,"name":"数字特征","short":"先分解成标准分布，再用线性性与独立性","kps":["数字特征与矩","协方差与相关系数"],"signal":"求 $E$、$D$、$\\mathrm{Cov}$、$\\rho$，或「$E(XY)$」「$D(X-Y)$」。","steps":["① 拆：把复杂变量写成已知分布变量的线性组合（指示变量是常用技巧）。","② 期望用线性性：$E(aX+bY)=aEX+bEY$，无需独立。","③ 方差用 $D(aX+bY)=a^2DX+b^2DY+2ab\\,\\mathrm{Cov}(X,Y)$。","④ 协方差用双线性：$\\mathrm{Cov}(X,Y)=E(XY)-EX\\,EY$，独立时 $E(XY)=EX\\,EY$。","⑤ 相关系数：$\\rho=\\dfrac{\\mathrm{Cov}(X,Y)}{\\sqrt{DX}\\sqrt{DY}}\\in[-1,1]$。"],"template":"$D(X\\pm Y)=DX+DY\\pm2\\mathrm{Cov}(X,Y)$","traps":["默认 $D(X-Y)=DX-DY$（应为加）。","不独立却用 $E(XY)=EX\\,EY$。","相关系数为 0 就说独立（只有二维正态才等价）。"],"next":["j18","j19","j02","j33"],"qids":["2026-填空-3","2026-辨析-2","2026-计算-2","2025-计算-3","2025-计算-5","2024-填空-2","2024-填空-5","2024-解答-4","2024-证明-1","2024-证明-2","2023-填空-3","2023-填空-7","2023-计算-2","2023-计算-5","2022-名词解释-5","2022-计算-6","2021-填空-3","2021-名词解释-4","2021-计算-4","2021-计算-5", at\\theta$ 是 $\\theta$ 的无偏估计」「求 $c$ 使 $c\\hat\\theta$ 无偏」。","steps":["① 求 $E\\hat\\theta$：先求估计量内部的期望（$E\\bar X$、$E X_{(n)}$、$E S^2$）。","② 与 $\\theta$ 比较：相等即无偏；差一个常数因子就用 $c=\\dfrac{\\theta}{E\\hat\\theta}$ 修正。","③ 求方差：$D\\hat\\theta$，需要 $E\\hat\\theta^2$ 时用 $E\\hat\\theta^2=\\int x^2 f$。","④ 写结论：$\\tilde\\theta=c\\hat\\theta$ 无偏且 $D\\tilde\\theta=c^2D\\hat\\theta$。"],"template":"$\\hat\\theta$ 无偏 $\\iff E\\hat\\theta=\\theta$；修正 $\\tilde\\theta=\\dfrac{\\theta}{E\\hat\\theta}\\hat\\theta$","traps":["只在 $n=1$ 验证就下结论。","把「渐近无偏」当成无偏。","求 $E X_{(n)}$ 时漏掉密度里的 $n$。"],"next":["j21","j22","j11","j33"],"qids":["2026-辨析-2","2026-证明-2","2024-证明-2","2023-填空-7","2022-名词解释-4","2021-填空-5","2021-填空-6","2021-名词解释-5","2021-计算-5","2021-计算-6","2020-填空-6","2020-计算-6"],"n":12,"pts":115,"years":[2020,2021,2022,2023,2024,2026]},{"id":"j13","no":13,"name":"常见分布计算","short":"认出分布名 → 直接调期望方差 → 算概率","kps":["常见离散分布","连续型密度与常见分布"],"signal":"题干点名二项/泊松/几何/超几何/均匀/指数/正态，问概率、期望、方差或反求参数。","steps":["① 认分布并写记号：$X\\sim B(n,p)$、$P(\\lambda)$、$E(\\lambda)$、$N(\\mu,\\sigma^2)$。","② 直接写 $EX$、$DX$（不用积分）。","③ 概率：离散求和、连续用 $\\Phi$ 标准化或积分。","④ 反求参数：联立 $EX$、$DX$ 解方程（如二项给 $EX$、$DX$ 求 $n,p$）。","⑤ 无记忆性、可加性只在对应分布用（指数/几何无记忆，泊松/正态/伽马可加）。"],"template":"$B(n,p):EX=np,DX=np(1-p)$；$E(\\lambda):EX=\\tfrac1\\lambda,DX=\\tfrac1{\\lambda^2}$；$N(\\mu,\\sigma^2)$ 标准化 $\\dfrac{X-\\mu}{\\sigma}$","traps":["泊松的 $EX=DX=\\lambda$ 与指数 $EX=\\tfrac1\\lambda$ 混淆。","正态概率忘记对称性 $P(X<\\mu)=0.5$，多绕一步积分。","超几何与二项混用（不放回 vs 放回）。"],"next":["j09","j29","j07"],"qids":["2026-填空-2","2026-填空-3","2026-填空-4","2026-计算-1","2026-计算-2","2026-计算-3","2026-计算-4","2026-计算-6","2026-证明-2","2025-计算-1","2025-计算-2","2025-计算-4","2025-填空-1","2024-填空-2","2024-填空-4","2024-填空-5","2024-填空-6","2024-解答-1","2024-解答-2","2024-解答-3","2024-解答-5","2024-证明-1","2024-证明-2","2023-填空-2","2023-填空-4","2023-填空-5","2023-填空-6","2023-计算-3","2023-计算-4","2022-填空-2","2022-填空-3","2022-计算-2","2021-填空-2","2021-填空-3","2021-填空-4","2021-填空-6","2021-计算-4","2020-填空-2","2020-填空-3","2020-填空-4","2020-计算-1", ：数总样本点与有利样本点，常用排列组合、配对问题。","③ 几何：$P=\\dfrac{m(G)}{m(\\Omega)}$，画图定区域。","④ 「至少一个」优先 $1-P(\\text{一个都没有})$。","⑤ 复杂计数用「先选后排」拆两步。"],"template":"$P(A)=\\dfrac{\\#A}{\\#\\Omega}$ 或 $\\dfrac{m(A)}{m(\\Omega)}$","traps":["样本点不等可能却直接数（如「先分组再分配」）。","几何概型把「等待时间」写错区间。","配对问题漏乘全排列。"],"next":["j14","j15","j01"],"qids":["2026-计算-1","2026-计算-6","2025-计算-5"],"n":3,"pts":45,"years":[2025,2026]},{"id":"j17","no":17,"name":"二维离散型","short":"列表 → 边际 → 条件 → 独立/相关系数","kps":["联合分布与边际分布","条件分布与条件密度","协方差与相关系数"],"signal":"给联合分布列（表格）或 $P(X=i,Y=j)$ 的公式，求边际、条件、独立、$\\mathrm{Cov}$。","steps":["① 把表补齐（行列和 = 1）。","② 边际：行和 / 列和。","③ 条件：$P(X=i\\mid Y=j)=\\dfrac{p_{ij}}{p_{\\cdot j}}$。","④ 独立：逐格验 $p_{ij}=p_{i\\cdot}p_{\\cdot j}$（一格不等即可否定）。","⑤ $\\mathrm{Cov}$：$E(XY)=\\sum\\sum ij\\,p_{ij}$，再用 $E(XY)-EX\\,EY$。"],"template":"$p_{i\\cdot}=\\sum_j p_{ij},\\quad \\mathrm{Cov}(X,Y)=E(XY)-EX\\,EY$","traps":["边际与条件混（分母是行和还是列和）。","只验一格相等就判独立。","$E(XY)$ 用成 $EX\\cdot EY$（未独立时错）。"],"next":["j09","j02","j18"],"qids":["2026-填空-3","2026-填空-5","2026-计算-3","2025-计算-2","2024-填空-3","2024-解答-2","2024-解答-3","2023-名词解释-2","2023-填空-3","2023-计算-2","2023-计算-3","2022-计算-2","2021-计算-2","2021-计算-3","2020-计算-2","2019-计算-3"],"n":16,"pts":207,"years":[2019,2020,2021,2022,2023,2024,2025,2026]},{"id":"j18","no":18,"name":"条件期望与全期望","short":"$E X=E[E(X\\mid Y)]$，按层分解","kps":["条件分布与条件密度","数字特征与矩"],"signal":"「求 $E(X\\mid Y=y)$」「用全期望公式求 $EX$」，或分层/分阶段试验。","steps":["① 写条件分布：离散用 $P(X\\mid Y=y)$，连续用 $f_{X\\mid Y}$。","② 求 $E(X\\mid Y=y)$（是一个关于 $y$ 的函数）。","③ 全期望：$EX=E[E(X\\mid Y)]$，对 $Y$ 的分布再取一次期望。","④ 全方差：$DX=E[D(X\\mid Y)]+D[E(X\\mid Y)]$。","⑤ 分层试验：先按第一次结果分类，再对每类算条件期望。"],"template":"$EX=E[E(X\\mid Y)],\\quad DX=E[D(X\\mid Y)]+D[E(X\\mid Y)]$","traps":["把 $E(X\\mid Y)$ 当成常数（它是随机变量）。","第二次取期望时用错 $Y$ 的分布（用成条件分布）。","全方差公式只写第一项。"],"next":["j09","j02","j19"],"qids":["2026-填空-3","2026-辨析-2","2026-计算-2","2025-计算-3","2025-计算-5","2024-填空-2","2024-填空-5","2024-解答-3","2024-解答-4","2024-证明-1","2024-证明-2","2023-填空-3","2023-填空-7","2023-计算-2","2023-计算-5","2022-名词解释-5","2022-计算-6","2021-填空-3","2021-名词解释-4","2021-计算-3","2021-计算-4","2021-计算-5","2020-填空-2","2020-填空-3","2020-填空-4","2020-计算-6"],"n":26,"pts":283,"years":[2020,2021,2022,2023,2024,2025,2026]},{"id":"j19","no":19,"name":"期望不等式","short":"切比雪夫 / 柯西-施瓦茨 / Jensen","kps":["切比雪夫不等式","数字特征与矩"],"signal":"「估计 $P(|X-EX|\\ge\\varepsilon)$ 的上界」「证明某不等式」。","steps":["① 切比雪夫：$P(|X-EX|\\ge\\varepsilon)\\le\\dfrac{DX}{\\varepsilon^2}$，反向用 $P(|X-EX|<\\varepsilon)\\ge1-\\dfrac{DX}{\\varepsilon^2}$。","② 柯西-施瓦茨：$[E(XY)]^2\\le EX^2\\,EY^2$，$|\\rho|\\le1$ 由此来。","③ Jensen：$E\\varphi(X)\\ge\\varphi(EX)$（$\\varphi$ 凸）。","④ 若给分布，比较「真实值」与「界」，说明界不紧。"],"template":"$P(|X-EX|\\ge\\varepsilon)\\le\\dfrac{DX}{\\varepsilon^2}$","traps":["把 $\\ge$ 与 $>$ 的边界搞错（连续型无差别，离散型有差别）。","忘记 $DX$ 要先算出来。","用马尔可夫不等式时误用一阶矩。"],"next":["j22","j29","j09"],"qids":["2026-填空-3","2026-辨析-2","2026-计算-2","2025-证明-2","2025-计算-3","2025-计算-5","2024-填空-2","2024-填空-5","2024-解答-4","2024-证明-1","2024-证明-2","2023-填空-3","2023-填空-7","2023-计算-2","2023-计算-5","2022-名词解释-5","2022-计算-6","2021-填空-3","2021-名词解释-2","2021-名词解释-4","2021-计算-4","2021-计算-5","2020-填空-2","2020-填空-3","2020-填空-4","2020-计算-6"],"n":26,"pts":273,"years":[2020,2021,2022,2023,2024,2025,2026]},{"id":"j20","no":20,"name":"充分统计量","short":"因子分解：$f=\\prod g(T,\\theta)h(x)$","kps":["充分统计量"],"signal":"「证明 $T$ 是充分统计量」「求充分统计量」。","steps":["① 写联合密度 $\\prod_{i=1}^n f(x_i;\\theta)$。","② 因式分解成 $g(T(x),\\theta)\\,h(x)$，$h$ 不含 $\\theta$。","③ 指出 $T$ 即充分统计量（如 $\\sum X_i$、$X_{(n)}$、$\\bar X$）。","④ 一维指数族可直接读自然充分统计量。"],"template":"$\\prod_i f(x_i;\\theta)=g\\big(T(x),\\theta\\big)h(x)$","traps":["分解出的 $g$ 里还残留单个 $x_i$（说明 $T$ 取错）。","只对 $n=1$ 做分解。","把「充分」与「无偏」混为一谈。"],"next":["j21","j03","j04"],"qids":["2023-名词解释-3"],"n":1,"pts":5,"years":[2023]},{"id":"j21","no":21,"name":"有效性与 C-R 下界","short":"算 Fisher 信息，比较方差与下界","kps":["有效性与 C-R 下界"],"signal":"「证明 $\\hat\\theta$ 是有效估计」「求 C-R 下界」「比较两个无偏估计的优劣」。","steps":["① 算对数似然的导数 $\\dfrac{\\partial\\ln f}{\\partial\\theta}$。","② Fisher 信息 $I(\\theta)=nE\\left[\\left(\\dfrac{\\partial\\ln f}{\\partial\\theta}\\right)^2\\right]=-nE\\dfrac{\\partial^2\\ln f}{\\partial\\theta^2}$。","③ C-R 下界 $=\\dfrac1{I(\\theta)}$。","④ 若 $D\\hat\\theta$ 等于下界，则有效（且必为 UMVUE）。","⑤ 比较两个无偏估计：方差小者优。"],"template":"$I(\\theta)=-nE\\dfrac{\\partial^2\\ln f}{\\partial\\theta^2},\\qquad \\mathrm{CRLB}=\\dfrac1{I(\\theta)}$","traps":["$I(\\theta)$ 忘记乘 $n$。","把有偏估计直接与下界比（C-R 只对无偏成立）。","二阶导符号搞错（$-E$ 才是正的）。"],"next":["j12","j22","j20"],"qids":["2026-辨析-2","2022-名词解释-3"],"n":2,"pts":11,"years":[2022,2026]},{"id":"j22","no":22,"name":"相合性证明","short":"切比雪夫夹逼，或依概率收敛的四则运算","kps":["相合性"],"signal":"「证明 $\\hat\\theta$ 是 $\\theta$ 的相合（一致）估计」。","steps":["① 写目标：$\\forall\\varepsilon>0$，$P(|\\hat\\theta-\\theta|\\ge\\varepsilon)\\to0$。","② 路线 A（切比雪夫）：只要 $E\\hat\\theta\\to\\theta$ 且 $D\\hat\\theta\\to0$，则相合。","③ 路线 B（LLN）：$\\hat\\theta$ 是样本矩的连续函数，由辛钦大数定律直接得。","④ 路线 C（分布函数）：求出 $F_{\\hat\\theta}$，证其趋于退化分布。","⑤ 写清「由切比雪夫不等式」这一步，别跳。"],"template":"$P(|\\hat\\theta-\\theta|\\ge\\varepsilon)\\le\\dfrac{E(\\hat\\theta-\\theta)^2}{\\varepsilon^2}\\to0$","traps":["只证 $E\\hat\\theta\\to\\theta$ 就说相合（还要方差趋于 0 或分布收敛）。","把相合与无偏混淆。","第二类错误的概率表达式写反。"],"next":["j12","j19","j21"],"qids":["2025-证明-2"],"n":1,"pts":15,"years":[2025]},{"id":"j23","no":23,"name":"两类错误与功效","short":"弃真是 α，取伪是 β，功效 1-β","kps":["两类错误与功效"],"signal":"「求犯第二类错误的概率」「求功效函数」「$\\alpha$ 与 $\\beta$ 的关系」。","steps":["① 画两条分布（$H_0$ 真 / $H_1$ 真），标出拒绝域。","② 第一类：$\\alpha=P(\\text{拒绝}\\mid H_0)$，由拒绝域与 $H_0$ 分布算。","③ 第二类：$\\beta=P(\\text{不拒绝}\\mid H_1)$，用 $H_1$ 下的真实参数分布算。","④ 功效 $=1-\\beta$。","⑤ $n$ 固定时 $\\alpha\\downarrow\\Rightarrow\\beta\\uparrow$；要同时降只能加 $n$。"],"template":"$\\alpha=P_{\\theta_0}(W),\\quad \\beta=P_{\\theta_1}(\\bar W),\\quad \\text{功效}=1-\\beta$","traps":["用 $H_0$ 的分布算 $\\beta$（必须用 $H_1$ 下的真实值）。","把 $\\beta$ 当成功效。","说「$\\alpha$ 越小越好」而不提 $\\beta$ 的代价。"],"next":["j06","j24","j26"],"qids":["2026-计算-5","2025-名词解释-3","2024-解答-6","2021-名词解释-6"],"n":4,"pts":40,"years":[2021,2024,2025,2026]},{"id":"j24","no":24,"name":"样本量确定","short":"由半宽/功效反解 n，向上取整","kps":["区间估计","假设检验原理与拒绝域"],"signal":"「区间长度不超过 $L$，至少需多少样本」「使功效达到 $1-\\beta$」。","steps":["① 写区间半宽：$u_{\\alpha/2}\\dfrac{\\sigma}{\\sqrt n}$（或 $t$ 版）。","② 令半宽 $\\le L$，解 $n\\ge\\left(\\dfrac{u_{\\alpha/2}\\sigma}{L}\\right)^2$。","③ 向上取整。","④ 功效版：联立 $\\alpha$、$\\beta$ 两个分位数方程解 $n$。"],"template":"$n\\ge\\dfrac{u_{\\alpha/2}^2\\sigma^2}{L^2}$","traps":["四舍五入而不是向上取整。","题目给的是区间长度 $L$（半宽是 $L/2$），直接套错。","忘记 $\\sigma$ 未知时要先估 $S$。"],"next":["j05","j23","j06","j34"],"qids":["2026-填空-5","2026-计算-5","2026-计算-6","2025-计算-3","2024-解答-6","2023-计算-5","2022-计算-1","2020-计算-5","2019-计算-6"],"n":9,"pts":139,"years":[2019,2020,2022,2023,2024,2025,2026]},{"id":"j25","no":25,"name":"卡方拟合优度","short":"分组 → 算期望频数 → $\\sum(O-E)^2/E$","kps":["卡方拟合优度与列联表"],"signal":"「检验数据是否服从某分布」「检验偏好是否均匀」。","steps":["① 分组并统计观测频数 $O_i$。","② 由 $H_0$ 的分布算期望频数 $E_i=np_i$（参数未知时先估，再减自由度）。","③ 合并 $E_i<5$ 的组。","④ 算 $\\chi^2=\\sum\\dfrac{(O_i-E_i)^2}{E_i}$，自由度 $k-1-m$（$m$ 为估计的参数个数）。","⑤ 比较 $\\chi^2_\\alpha(k-1-m)$，大则拒绝。"],"template":"$\\chi^2=\\sum\\dfrac{(O_i-E_i)^2}{E_i}\\sim\\chi^2(k-1-m)$","traps":["自由度忘记减去估计的参数个数。","期望频数用观测总数乘错概率（概率和须为 1）。","$E_i<5$ 不合并直接算。"],"next":["j30","j06","j26"],"qids":["2026-计算-6","2025-计算-4","2020-填空-5"],"n":3,"pts":35,"years":[2020,2025,2026]},{"id":"j26","no":26,"name":"双样本检验","short":"均值差用 $t$/$Z$，方差比用 $F$","kps":["双样本检验"],"signal":"「比较两台机器/两种工艺」；两个正态总体，检验均值或方差是否相等。","steps":["① 判参数：均值差 $\\mu_1-\\mu_2$（方差已知 → $Z$，未知相等 → $t$ 合并方差）或方差比 $\\sigma_1^2/\\sigma_2^2$（$F$）。","② 写统计量：$t=\\dfrac{\\bar X_1-\\bar X_2}{S_w\\sqrt{1/n_1+1/n_2}}$，$S_w^2=\\dfrac{(n_1-1)S_1^2+(n_2-1)S_2^2}{n_1+n_2-2}$。","③ 自由度 $n_1+n_2-2$。","④ 定拒绝域、比较、下结论。","⑤ 先检验方差相等再用 $t$（顺序题常见）。"],"template":"$t=\\dfrac{\\bar X_1-\\bar X_2}{S_w\\sqrt{1/n_1+1/n_2}}\\sim t(n_1+n_2-2)$","traps":["合并方差 $S_w^2$ 的权重写错（按自由度加权）。","方差未知不等仍用合并 $t$。","$F$ 检验的拒绝域两侧方向写反。"],"next":["j06","j10","j23"],"qids":["2025-计算-3"],"n":1,"pts":15,"years":[2025]},{"id":"j27","no":27,"name":"方差分析","short":"平方和分解，$F=\\dfrac{MS_A}{MS_E}$","kps":["方差分析"],"signal":"「检验多个水平均值是否相同」，给单因子试验数据表。","steps":["① 算组均值与总均值。","② 分解：$SST=SSA+SSE$，$SSA=\\sum n_i(\\bar X_i-\\bar X)^2$，$SSE=\\sum\\sum(X_{ij}-\\bar X_i)^2$。","③ 自由度：$r-1$、$n-r$、$n-1$。","④ $F=\\dfrac{SSA/(r-1)}{SSE/(n-r)}\\sim F(r-1,n-r)$。","⑤ 填方差分析表，比较 $F_\\alpha$。"],"template":"$F=\\dfrac{MS_A}{MS_E}=\\dfrac{SSA/(r-1)}{SSE/(n-r)}$","traps":["自由度用错（$SSE$ 是 $n-r$ 不是 $n-1$）。","$SSA$ 忘记乘各组样本量。","把「不拒绝」说成「各均值全相等」。"],"next":["j28","j06","j26"],"qids":[],"n":0,"pts":0,"years":[]},{"id":"j28","no":28,"name":"一元线性回归","short":"最小二乘 → 回归方程 → 显著性检验","kps":["一元线性回归"],"signal":"「求回归方程」「检验回归是否显著」，给 $(x_i,y_i)$ 数据。","steps":["① 算 $\\bar x,\\bar y$，$l_{xx}=\\sum(x_i-\\bar x)^2$，$l_{xy}=\\sum(x_i-\\bar x)(y_i-\\bar y)$。","② $\\hat b=\\dfrac{l_{xy}}{l_{xx}}$，$\\hat a=\\bar y-\\hat b\\bar x$。","③ 平方和：$SST=l_{yy}$，$SSR=\\hat b\\,l_{xy}$，$SSE=SST-SSR$。","④ $\\hat\\sigma^2=\\dfrac{SSE}{n-2}$，$F=\\dfrac{SSR/1}{SSE/(n-2)}$ 检验 $b=0$。","⑤ 预测：$\\hat y_0=\\hat a+\\hat b x_0$，区间估计用 $t(n-2)$。"],"template":"$\\hat b=\\dfrac{l_{xy}}{l_{xx}},\\quad \\hat a=\\bar y-\\hat b\\bar x$","traps":["$l_{xy}$ 与 $l_{xx}$ 写反。","$SSE$ 的自由度 $n-2$ 写成 $n-1$。","预测区间与均值响应区间混用。"],"next":["j10","j27","j06"],"qids":["2020-计算-6"],"n":1,"pts":20,"years":[2020]},{"id":"j29","no":29,"name":"中心极限定理近似","short":"标准化后用 $\\Phi$，注意连续性修正","kps":["中心极限定理"],"signal":"「$n$ 很大，求 $\\sum X_i$ 落在某区间的概率」「用正态近似计算二项概率」。","steps":["① 确认独立同分布、$n$ 较大（$n\\ge30$ 或 $np,nq\\ge5$）。","② 标准化：$\\dfrac{\\sum X_i-n\\mu}{\\sqrt n\\sigma}\\approx N(0,1)$。","③ 二项用 $\\dfrac{k-np}{\\sqrt{np(1-p)}}$，离散求和时做连续性修正 $\\pm0.5$。","④ 查 $\\Phi$ 表，用 $\\Phi(-z)=1-\\Phi(z)$。"],"template":"$\\dfrac{\\sum X_i-n\\mu}{\\sqrt n\\,\\sigma}\\xrightarrow{d}N(0,1)$","traps":["方差用 $\\sigma$ 而非 $\\sqrt n\\sigma$ 的缩放。","离散情形漏掉连续性修正（题目不严格要求时可省，但要说明）。","把 CLT 与 LLN 的结论混（一个给概率近似，一个给收敛）。"],"next":["j13","j19","j06"],"qids":[],"n":0,"pts":0,"years":[]},{"id":"j30","no":30,"name":"列联表独立性检验","short":"$\\chi^2=\\sum\\dfrac{(O-E)^2}{E}$，自由度 $(r-1)(c-1)$","kps":["卡方拟合优度与列联表"],"signal":"给 $r\\times c$ 频数表，问「两个属性是否相关/独立」。","steps":["① 由行和、列和算期望频数 $E_{ij}=\\dfrac{n_i n_j}{n}$。","② 算 $\\chi^2=\\sum\\sum\\dfrac{(O_{ij}-E_{ij})^2}{E_{ij}}$。","③ 自由度 $(r-1)(c-1)$。","④ 与 $\\chi^2_\\alpha$ 比较，大则拒绝独立（即认为相关）。"],"template":"$E_{ij}=\\dfrac{n_{i\\cdot}n_{\\cdot j}}{n},\\quad df=(r-1)(c-1)$","traps":["自由度用成 $rc-1$。","期望频数用观测值代（忘记用行列和）。","结论方向说反：拒绝 $H_0$ 才是「不独立」。"],"next":["j25","j06","j26"],"qids":["2026-计算-6","2025-计算-4","2020-填空-5"],"n":3,"pts":35,"years":[2020,2025,2026]},{"id":"j31","no":31,"name":"跨模块综合","short":"拆成小问，每问挂一个招","kps":[],"signal":"一道题连着问 3~4 件不同的事（求 $c$ → 边际 → 期望 → 检验/区间）。","steps":["① 读题先标小问，每问判断属于哪一招。","② 按「先易后难」顺序做，前面的结果常是后面的输入。","③ 每问写清引用的是哪一个结论（定义式/枢轴量/公式）。","④ 最后一问常是「判断/说明」，要求回到定义，不能只报数值。","⑤ 检查量纲与范围（概率 ∈[0,1]、方差 ≥0、相关系数 ∈[-1,1]）。"],"template":"小问分解表：小问 → 招 → 关键式","traps":["跳问硬算，前面的 $c$ 没定就往下做。","最后一问只给数值不作判断。","跨模块时把两个分布的参数混用。"],"next":["j02","j04","j06"],"qids":[],"n":0,"pts":0,"years":[]},{"id":"j32","no":32,"name":"二维概率 P(g(X,Y)>c) 的三种解法","short":"三问定路线 → 定限四件套 → 方向自检","kps":["二维区域型分布","条件分布与条件密度","多维函数的分布","联合分布与边际分布"],"signal":"给出 f(x,y) 与一条曲线 / 斜边边界（如 x+y>1、|x-y|<1），只问一个概率；或问完概率还要 E(g(X,Y))；或 f(x,y) 对某个变量不含（对 y 是常数）。典型：f(x,y)=3x, 0<y<x<1，求 P(X+Y>1)。","steps":["① 30 秒三问：$X,Y$ 独立吗（$f$ 能否拆成 $f_Xf_Y$、定义域是否矩形）；要“一个概率”还是要“$Z$ 的密度/期望”；区域是三角/圆/矩形哪一种。","② 选路线：只问一个概率 → 重积分；要 $f_Z(z)$ 或后面要 $E(Z),D(Z)$ → 卷积 $f_Z=\\int f(x,z-x)\\,dx$；$f(x,y)$ 对某变量是常数 → 条件分布法（$Y\\mid X=x$ 是均匀，一行出结果）；非线性换元（$Z=Y/X$、$Z=XY$）→ 雅可比。","③ 定限四件套：画区域标顶点 → 把 $y=g(x)$ 代进非零条件拆三条关于 $x$ 的不等式 → 找随参数变化的分界点 → 写分段，每段重新取交。","④ 方向自检（10 秒，必做）：$P(>)+P(\\le)=1$；结果要落在区域占比的合理区间。这一步能拦下“$\\frac58$ 写成 $\\frac38$”与“拒绝域写在另一侧”两类错。","⑤ 卷面五行：设 $Z=\\cdots$ → 区域 $D:\\cdots$ → $P=\\iint_D f\\,d\\sigma$ → 结果 → 框。"],"template":"$P(X+Y>c)=\\int_{a}^{b}\\!\\int_{g(x)}^{h(x)}f(x,y)\\,dy\\,dx$；卷积版 $f_Z(z)=\\int f(x,z-x)\\,dx$，上下限由 $0<z-x<x<1$ 这类不等式组解出（$z<1$ 与 $z\\ge1$ 限不同）。","traps":["把 $\\int f_X(x)\\,[1-F_Y(c-x)]\\,dx$ 当通式——它只在 $X,Y$ 独立时成立，本题不独立必须用条件分布 $P(Y>c-x\\mid X=x)$。","漏分段：卷积里 $0<z<1$ 是 $\\int_{z/2}^{z}$，$1\\le z<2$ 变成 $\\int_{z/2}^{1}$；条件分布里 $x\\le\\frac12$ 那段概率为 0。","方向写反：算成 $\\frac38$（补集）以为对，或写“$P(X+Y>1)$”却积了 $x+y<1$ 的区域。"],"next":["j02","j07","j18"],"qids":[],"n":0,"pts":0,"years":[]},{"id":"j33","no":33,"name":"期望·方差·求和：三层运算地基","short":"认身份 → 一座桥 → 两条恒等式 → 六步收口","kps":["数字特征与矩","无偏性","估计量评价标准","抽样分布与三大分布构造"],"signal":"$E$、$D$、$\\sum$、$X_i$、$\\bar X$ 同时出现；或题说「证明 $T$ 是 $\\theta$ 的无偏估计」；或要求 $E(X^2)$、$D(\\bar X)$。典型：$X_1,\\dots,X_n$ 来自 $N(\\mu,\\sigma^2)$，$S^2=\\frac{1}{n-1}\\sum_{i=1}^{n}(X_i-\\bar X)^2$，证 $S^2$ 是 $\\sigma^2$ 的无偏估计。","steps":["① 认身份（10 秒）：$X_i$、$\\bar X$ 是**随机变量**（有方差，不能当常数提）；$n,\\mu,\\sigma^2$ 才是常数。提之前问一句「它有方差吗」。","② 先找现成定理：见 $\\frac{(n-1)S^2}{\\sigma^2}$、$\\frac{\\bar X-\\mu}{S/\\sqrt n}$、$\\frac{nS^2}{\\sigma_0^2}$ 的形状 → 第一行写「由抽样分布定理 $\\sim\\chi^2/t/F$」，再用 $E\\chi^2_k=k$ 收口。这一步决定 8 分还是 4 分。","③ 没定理才硬推：令 $Y_i=X_i-\\mu$ 平移，把 $\\bar X$ 换成 $\\mu$，式子立刻干净。","④ 展开平方只靠两条：$\\sum X_i=n\\bar X$、$\\sum(X_i-\\bar X)^2=\\sum X_i^2-n\\bar X^2$；配套 $\\sum(X_i-\\bar X)=0$。","⑤ 逐个取 $E$：见 $X^2$ 用 $E(X^2)=DX+(EX)^2$；见 $\\bar X^2$ 用 $E(\\bar X^2)=D\\bar X+(E\\bar X)^2$；$E\\sum=\\sum E$ 永远可用。","⑥ 卷面八行（无偏性，χ² 路线）：由抽样分布定理 $\\frac{(n-1)S^2}{\\sigma^2}\\sim\\chi^2(n-1)$ → $E\\left[\\frac{(n-1)S^2}{\\sigma^2}\\right]=n-1$ → 线性提出 $\\frac{(n-1)}{\\sigma^2}E(S^2)=n-1$ → 得 $E(S^2)=\\sigma^2$，故无偏。"],"template":"$$\\begin{gathered} E(X^2)=DX+(EX)^2,\\qquad D(aX+b)=a^2DX,\\quad D(X\\pm Y)=DX+DY\\pm2\\mathrm{Cov} \\\\ \\sum_{i=1}^{n}X_i=n\\bar X,\\qquad \\sum_{i=1}^{n}(X_i-\\bar X)=0 \\\\ \\sum_{i=1}^{n}(X_i-\\bar X)^2=\\sum_{i=1}^{n}X_i^2-n\\bar X^2 \\\\ E\\bar X=\\mu,\\quad D\\bar X=\\frac{\\sigma^2}{n},\\quad \\frac{(n-1)S^2}{\\sigma^2}\\sim\\chi^2(n-1) \\end{gathered}$$\n\n$E(X^2)=DX+(EX)^2$ 是 E 与 D 之间**唯一的桥**；横向推交叉项要$X,Y$ 独立。","traps":["把 $\\bar X$ 当常数提出去：写成 $E(\\bar X^2)=(E\\bar X)^2$ 就是踩了——$\\bar X$ 有方差。","$\\sum(X_i-\\bar X)^2$ 与 $\\left[\\sum(X_i-\\bar X)\\right]^2$ 混用：前者 $=(n-1)S^2$，后者 $=0$。","$D\\left(\\sum X_i\\right)$ 直接写成 $\\sum DX_i$：只有独立同分布才成立，且结果为 $n\\sigma^2$；先写「独立」两字再拆。","证无偏时硬推恒等式、不引抽样分布定理——15 分题只拿 4 分的老路。"],"next":["j12","j09","j21"],"qids":[],"n":0,"pts":0,"years":[]},{"id":"j34","no":34,"name":"区间估计的样本量反解","short":"求 n 不用 t → z 反解 → 向上取整 → 草稿里 t 迭代复核","kps":["区间估计","抽样分布与三大分布构造","估计量评价标准"],"signal":"给置信度 + 「估计误差（半宽）不超过 $\\delta$」或「区间长度不超过 $L$」，问至少抽多少样本／经费最省样本量。典型：$\\sigma$ 未知，$n=10$ 时 $\\bar x=20.5,\\ s=0.9$，问误差不超过 $0.5$ 需多少样本。","steps":["① 先认问法：**求区间**（$n$ 已知）走 $t$；**求样本量**（$n$ 未知）走 $z$。理由一句话：$t$ 的自由度 $=n-1$，$n$ 还没定，分位数根本不可查。","② 写半宽式：$z_{\\alpha/2}\\dfrac{\\sigma}{\\sqrt n}\\le\\delta$；$\\sigma$ 未知时用样本 $s$ 代（大样本近似）。","③ 平方解出：$n\\ge\\left(\\dfrac{z_{\\alpha/2}\\,s}{\\delta}\\right)^2$。双侧 95% 用 $z_{0.025}=1.96$，双侧 90% 用 $1.645$。","④ 取整：**一律向上**。$12.45\\to 13$，取 12 就是精度不达标。","⑤ 严格复核（写草稿、不上卷）：以解出的 $n$ 得 $df=n-1$，用 $t_{\\alpha/2}(df)$ 重算，迭代到 $n$ 不再变。本题 $13\\to16\\to15$，严格解 15；参考答案按教材约定给 13。","⑥ 卷面三行：写「因 $n$ 待定，$t$ 分位数不可查，按 $z$ 反解」→ 代入得 $n\\ge12.45$ → 向上取整 $n\\ge13$。那句理由本身就是采分点。"],"template":"$$\\delta=z_{\\alpha/2}\\frac{\\sigma}{\\sqrt n}\\ \\Longrightarrow\\ n\\ge\\left(\\frac{z_{\\alpha/2}\\,\\hat\\sigma}{\\delta}\\right)^2$$\n\n$\\delta$ 是**半宽**；题给「区间长度 $\\le L$」时先取 $\\delta=L/2$。检验版的样本量是另一条公式 $n\\ge\\dfrac{(z_\\alpha+z_\\beta)^2\\sigma^2}{\\delta^2}$（见 j24），别混。","traps":["求 $n$ 时查 $t$ 表：自由度未定——上一套卷 13 题就丢在这里。","$12.45$ 取成 $12$：样本量只能向上取整，向下等于没达到精度要求。","把「区间长度 $\\le1$」当半宽 $=1$，忘了除 2。","双侧 95% 用 $z_{0.05}=1.645$：双侧要 $1.96$，$1.645$ 是单侧。"],"next":["j05","j24","j06"],"qids":[],"n":0,"pts":0,"years":[]}],"formulas":[{"title":"表 1　常见分布一览","head":["分布","记号","分布律 / 密度","$EX$","$DX$","关键特征"],"rows":[["0-1","$B(1,p)$","$P(X=1)=p$","$p$","$p(1-p)$","二项特例"],["二项","$B(n,p)$","$\\binom nk p^k(1-p)^{n-k}$","$np$","$np(1-p)$","可加（同 $p$）"],["泊松","$P(\\lambda)$","$\\dfrac{\\lambda^k}{k!}\\mathrm e^{-\\lambda}$","$\\lambda$","$\\lambda$","可加；二项的极限"],["几何","$Ge(p)$","$(1-p)^{k-1}p$","$\\dfrac1p$","$\\dfrac{1-p}{p^{2}}$","无记忆"],["超几何","$H(N,M,n)$","$\\dfrac{\\binom Mk\\binom{N-M}{n-k}}{\\binom Nn}$","$\\dfrac{n +n_2-2)$","$(\\bar X_1-\\bar X_2)\\pm t_{\\alpha/2}S_w\\sqrt{\\frac1{n_1}+\\frac1{n_2}}$"],["$\\frac{\\sigma_1^{2}}{\\sigma_2^{2}}$","两正态","$F=\\frac{S_1^{2}/\\sigma_1^{2}}{S_2^{2}/\\sigma_2^{2}}$","$\\left[\\frac{S_1^{2}}{S_2^{2}}\\frac{1}{F_{\\alpha/2}},\\frac{S_1^{2}}{S_2^{2}}\\frac{1}{F_{1-\\alpha/2}}\\right]$"],["$p$","大样本","$Z=\\frac{\\hat p-p}{\\sqrt{\\hat p(1-\\hat p)/n}}$","$\\hat p\\pm u_{\\alpha/2}\\sqrt{\\frac{\\hat p(1-\\hat p)}{n}}$"]]},{"title":"表 4　假设检验速查","head":["$H_0$","条件","统计量","分布","双侧拒绝域"],"rows":[["$\\mu=\\mu_0$","$\\sigma$ 已知","$Z=\\frac{\\bar X-\\mu_0}{\\sigma/\\sqrt n}$","$N(0,1)$","$\\lvert Z\\rvert>u_{\\alpha/2}$"],["$\\mu=\\mu_0$","$\\sigma$ 未知","$t=\\frac{\\bar X-\\mu_0}{S/\\sqrt n}$","$t(n-1)$","$\\lvert t\\rvert>t_{\\alpha/2}(n-1)$"],["$\\sigma^{2}=\\sigma_0^{2}$","—","$\\chi^{2}=\\frac{(n-1)S^{2}}{\\sigma_0^{2}}$","$\\chi^{2}(n-1)$","$>\\chi^{2}_{\\alpha/2}$ 或 $<\\chi^{2}_{1-\\alpha/2}$"],["$\\mu_1=\\mu_2$","方差已知","$Z=\\frac{\\bar X_1-\\bar X_2}{\\sqrt{\\sigma_1^{2}/n_1+\\sigma_2^{2}/n_2}}$","$N(0,1)$","$\\lvert Z\\rvert>u_{\\alpha/2}$"],["$\\mu_1=\\mu_2$","方差未知相等","$t=\\frac{\\bar X_1-\\bar X_2}{S_w\\sqrt{1/n_1+1/n_2}}$","$t(n_1+n_2-2)$","$\\lvert t\\rvert>t_{\\alpha/2}$"],["$\\sigma_1^{2}=\\sigma_2^{2}$","—","$F=\\frac{S_1^{2}}{S_2^{2}}$","$F(n_1-1,n_2-1)$","$>F_{\\alpha/2}$ 或 $<F_{1-\\alpha/2}$"],["$p=p_0$","大样本","$Z=\\frac{\\hat p-p_0}{\\sqrt{p_0(1-p_0)/n}}$","$N(0,1)$","$\\lvert Z\\rvert>u_{\\alpha/2}$"],["分布拟合","—","$\\chi^{2}=\\sum\\frac{(O-E)^{2}}{E}$","$\\chi^{2}(k-1-m)$","$>\\chi^{2}_\\alpha$"],["独立性","—","同上","$\\chi^{2}((r-1)(c-1))$","$>\\chi^{2}_\\alpha$"]]},{"title":"表 5　方差分析表（单因子）","head":["来源","平方和","自由度","均方","$F$"],"rows":[["因素","$SSA=\\sum n_i(\\bar x_{i\\cdot}-\\bar x_{\\cdot\\cdot})^{2}$","$r-1$","$MSA$","$MSA/MSE$"],["误差","$SSE=SST-SSA$","$n-r$","$MSE$","—"],["总和","$SST=\\sum\\sum(x_{ij}-\\bar x_{\\cdot\\cdot})^{2}$","$n-1$","—","—"]]}],"concepts":[{"no":1,"star":3,"title":"概率为 0 的事件 vs 不可能事件","ch":1,"sections":[{"name":"一句话","body":"概率为 0 的事件**不**等于不可能事件；概率为 1 的事件**不**等于必然事件。"},{"name":"定义卡","body":"- 不可能事件：$A=\\varnothing$，样本空间中不含任何样本点，$P(A)=0$。\n- 概率为 0 的事件：$P(A)=0$，但 $A$ 可能非空。"},{"name":"对比表","body":"| 维度 | 不可能事件 | 概率为 0 的事件 |\n|---|---|---|\n| 集合 | $A=\\varnothing$ | 可以是 $A\\neq\\varnothing$ |\n| 概率 | $P(A)=0$ | $P(A)=0$ |\n| 蕴含关系 | 一定是概率为 0 | 不一定不可能 |"},{"name":"例子","body":"设 $X\\sim N(0,1)$，取 $A=\\{X=0\\}$。则 $P(A)=0$，但 $A$ 并非空事件——样本点 $X=0$ 是可能出现的。"},{"name":"得分点","body":"> 若 $A=\\varnothing$，则必有 $P(A)=0$；但反之不成立。当样本空间含无穷多个等可能样本点时，概率为 0 的事件完全可以发生（如连续型随机变量取任一确定值的概率为 0，但该取值可发生）。同理 $P(A)=1$ 只说明 $A$ 与其补集差一个零概率事件，不能断言 $A=\\Omega$。因此\"概率为 1\"与\"必然事件\"是两个不同概念，只有在古典概型（有限等可能）下二者才等价。"},{"name":"钩子","body":"概率是\"度量\"，不是\"可能性\"；零测集可以非空。"}],"one":"概率为 0 的事件**不**等于不可能事件；概率为 1 的事件**不**等于必然事件。","hook":"概率是\"度量\"，不是\"可能性\"；零测集可以非空。","bx":{"a":"不可能事件：$A=\\varnothing$，样本空间里一个样本点都不含，故必有 $P(A)=0$。","b":"概率为 0 的事件：$P(A)=0$，但 $A$ 可以非空，事件本身是可能发生的。","diff":["集合：前者必为 $\\varnothing$；后者允许 $A\\neq\\varnothing$。","蕴含是单向的：不可能 $\\Rightarrow$ 概率 0，概率 0 $\\nRightarrow$ 不可能。"],"link":"二者只差「集合是否为空」。只有在古典概型（有限等可能）下零概率才等价于空集，因为此时空集是唯一的零概率集合。","ex":"$X\\sim N(0,1)$，取 $A=\\{X=0\\}$：$P(A)=0$，但 $X=0$ 完全可能发生。"},"bx2":{"def":"不可能事件是 $A=\\varnothing$，不含任何样本点，由可列可加性必有 $P(A)=0$；概率为 $0$ 的事件是满足 $P(A)=0$ 的事件，其集合允许非空，在试验中仍可能真的发生。","diff":"二者的差别在于集合与概率的对应是否可逆，由 $A=\\varnothing$ 推 $P(A)=0$ 恒成立，反之在连续型场合不成立，单点集非空却零概率；只有在有限等可能的古典概型中，零概率才反过来迫使集合为空。","link":"两者的联系是一条单向蕴含，$A=\\varnothing\\Rightarrow P(A)=0$，反向不成立；零概率与空集重合的充要条件是样本空间有限且各样本点等可能，此时古典概型下二者等价。"}},{"no":2,"star":3,"title":"互不相容 vs 对立事件","ch":1,"sections":[{"name":"一句话","body":"互不相容管\"不重叠\"，对掌管\"不重叠且不漏\"。"},{"name":"定义卡","body":"- 互不相容（互斥）：$AB=\\varnothing$。\n- 对立事件：$B=\\bar A$，等价于 $AB=\\varnothing$ 且 $A\\cup B=\\Omega$。"},{"name":"对比表","body":"| 维度 | 互不相容 | 对立 |\n|---|---|---|\n| 条件 | $AB=\\varnothing$ | $AB=\\varnothing$ 且 $A\\cup B=\\Omega$ |\n| 强弱 | 弱 | 强（蕴含互不相容） |\n| 概率后果 | $P(A\\cup B)=P(A)+P(B)$ | 另有 $P(A)+P(B)=1$ |"},{"name":"例子","body":"掷骰子，$A=\\{1\\}$、$B=\\{2\\}$ 互不相容但不对立；$A=\\{$奇数$\\}$、$B=\\{$偶数$\\}$ 既互不相容又对立。"},{"name":"得分点","body":"> 设 $A,B$ 为同一试验下的事件。若 $AB=\\varnothing$，称 $A$ 与 $B$ 互不相容，此时 $P(A\\cup B)=P(A)+P(B)$；若同时满足 $A\\cup B=\\Omega$，则称 $A$ 与 $B$ 对立，记 $B=\\bar A$，此时还有 $P(A)+P(B)=1$。故对立一定互不相容，互不相容不一定对立；判定\"是否对立\"必须再验证 $A\\cup B=\\Omega$（或 $A\\cup B$ 与 $\\Omega$ 只差零概率事件）。"},{"name":"钩子","body":"互斥 + 穷尽 = 对立。"}],"one":"互不相容管\"不重叠\"，对掌管\"不重叠且不漏\"。","hook":"互斥 + 穷尽 = 对立。","bx":{"a":"互不相容（互斥）：$AB=\\varnothing$，两事件不能同时发生。","b":"对立：$AB=\\varnothing$ 且 $A\\cup B=\\Omega$，记 $B=\\bar A$。","diff":["条件：只要交集空 / 还要并集满；","强弱：对立强，蕴含互不相容；","概率后果：$P(A\\cup B)=P(A)+P(B)$ / 另有 $P(A)+P(B)=1$。"],"link":"对立 = 互不相容 + 穷尽。故对立必互不相容，互不相容不一定对立；判对立时必须补验 $A\\cup B=\\Omega$。","ex":"掷骰子：$A=\\{1\\},B=\\{2\\}$ 互不相容但不对立；$A=\\{$奇数$\\},B=\\{$偶数$\\}$ 既互不相容又对立，且 $P(A)+P(B)=1$。"},"bx2":{"def":"互不相容（互斥）指 $AB=\\varnothing$，即两个事件不可能同时发生，但它不要求二者之外没有别的可能；对立指 $AB=\\varnothing$ 且 $A\\cup B=\\Omega$，此时称 $B$ 是 $A$ 的对立事件，记作 $B=\\bar A$，二者必有一个发生。","diff":"两者的条件强弱不同，互不相容只要求交集为空，对立还要求并集充满样本空间，因此对立强于互不相容，反之不成立；概率上互不相容给出 $P(A\\cup B)=P(A)+P(B)$，对立则进一步有 $P(A)+P(B)=1$。","link":"对立等于互不相容再加穷尽，$B=\\bar A$ 当且仅当 $AB=\\varnothing$ 且 $A\\cup B=\\Omega$；故判对立须补验并集条件，而当 $A\\cup B=\\Omega$ 恰好成立时两种说法重合。"}},{"no":3,"star":3,"title":"独立 vs 互不相容","ch":1,"sections":[{"name":"一句话","body":"独立是\"互不影响\"，互不相容是\"不能同时发生\"——**两个正概率事件若互不相容，一定不独立**。"},{"name":"定义卡","body":"- 独立：$P(AB)=P(A)P(B)$。\n- 互不相容：$AB=\\varnothing$，即 $P(AB)=0$。"},{"name":"对比表","body":"| 维度 | 独立 | 互不相容 |\n|---|---|---|\n| 定义式 | $P(AB)=P(A)P(B)$ | $P(AB)=0$ |\n| 样本点 | 可以同时发生 | 绝不能同时发生 |\n| 关系 | $P(A)P(B)>0$ 时两者互斥（不能同时成立） | 同左 |"},{"name":"例子","body":"掷两枚硬币，$A=$\"第一枚正面\"、$B=$\"第二枚正面\"：独立且可同时发生。$A=$\"第一枚正面\"、$B=$\"第一枚反面\"：互不相容，且 $P(AB)=0\\neq P(A)P(B)=\\frac14$，故不独立。"},{"name":"得分点","body":"> 独立刻画两事件发生与否互无影响，判据是 $P(AB)=P(A)P(B)$；互不相容刻画两事件不能同时发生，判据是 $AB=\\varnothing$。当 $P(A)>0,P(B)>0$ 时，若 $A,B$ 互不相容则 $P(AB)=0\\neq P(A)P(B)$，故必不独立；反之若独立则必相容。只有当一个事件概率为 0 时，二者才可能同时成立。联系：独立时 $P(A|B)=P(A)$；互不相容时 $P(A|B)=0$。"},{"name":"钩子","body":"独立 = 乘法拆得开；互斥 = 加法合得上。"}],"one":"独立是\"互不影响\"，互不相容是\"不能同时发生\"——**两个正概率事件若互不相容，一定不独立**。","hook":"独立 = 乘法拆得开；互斥 = 加法合得上。","bx":{"a":"独立：$P(AB)=P(A)P(B)$，即 $P(A\\mid B)=P(A)$，一个发生不改变另一个的概率。","b":"互不相容：$AB=\\varnothing$，即 $P(AB)=0$，两事件绝不同时发生。","diff":["判据：乘法式相等 / 交集为空；","样本点：可以同时发生 / 绝不能同时发生；","两个正概率事件不能同时具有这两种性质。"],"link":"若 $P(A)>0,P(B)>0$ 且互不相容，则 $P(AB)=0\\neq P(A)P(B)$，故必不独立；独立与互斥只在一个事件概率为 0 时才可能并存。","ex":"抛两枚硬币：$A=$第一枚正、$B=$第二枚正，独立且可同时发生；$A=$第一枚正、$B=$第一枚反，互不相容，且 $0\\neq\\frac14$，不独立。"},"bx2":{"def":"独立指 $P(AB)=P(A)P(B)$，等价于 $P(A\\mid B)=P(A)$（当 $P(B)>0$），即一个事件的发生不改变另一个事件发生的概率；互不相容指 $AB=\\varnothing$，即 $P(AB)=0$，两事件绝不会在一次试验中同时出现。","diff":"判据的性质完全不同，独立是概率等式，与样本点是否重叠无关；互不相容是集合关系，只说明交集为空；对两个正概率事件，互不相容使 $P(AB)=0$，与独立所要求的乘积相等相冲突。","link":"若 $P(A)>0$、$P(B)>0$ 且互不相容，则 $P(AB)=0\\neq P(A)P(B)$，故二者必不独立；只有其中一个事件概率为 $0$ 时，独立与互不相容才能并存，此时乘积与交集概率同为 $0$。"}},{"no":4,"star":2,"title":"两两独立 vs 相互独立","ch":1,"sections":[{"name":"一句话","body":"两两独立只保证\"任取两个独立\"，相互独立还要求\"三个一起独立\"。"},{"name":"定义卡","body":"- 两两独立：对任意 $i<j$，$P(A_iA_j)=P(A_i)P(A_j)$。\n- 相互独立：任意 $k\\ge 2$ 及任意 $i_1<\\cdots<i_k$，都有 $P(A_{i_1}\\cdots A_{i_k})=\\prod P(A_{i_j})$。"},{"name":"对比表","body":"| 维度 | 两两独立 | 相互独立 |\n|---|---|---|\n| 要求 | 只查二元组 | 查全部子集（含三元及以上） |\n| 强弱 | 弱 | 强 |\n| 反例 | 存在 | — |\n\n**【例子（必背反例）】** 抛两枚均匀硬币，令\n$A=\\{$第一枚正$\\}$，$B=\\{$第二枚正$\\}$，$C=\\{$两枚同面$\\}$。\n则 $P(A)=P(B)=P(C)=\\frac12$，且 $P(AB)=P(AC)=P(BC)=\\frac14$，故两两独立；但 $P(ABC)=0\\neq \\frac18$，故不相互独立。"},{"name":"得分点","body":"> 两两独立仅要求任意两个事件满足 $P(A_iA_j)=P(A_i)P(A_j)$；相互独立要求任意 $k$ 个事件的交的概率等于各自概率之积。相互独立一定两两独立，反之不成立（标准反例：两枚硬币的\"第一枚正面\"\"第二枚正面\"\"两枚同面\"）。因此三事件以上做乘法运算前，必须确认题目给的是\"相互独立\"。"},{"name":"钩子","body":"两两独立看\"对\"，相互独立看\"全\"。"}],"one":"两两独立只保证\"任取两个独立\"，相互独立还要求\"三个一起独立\"。","hook":"两两独立看\"对\"，相互独立看\"全\"。","bx":{"a":"两两独立：对任意 $i<j$ 有 $P(A_iA_j)=P(A_i)P(A_j)$，只查二元组。","b":"相互独立：任意 $k\\ge2$ 个事件都有 $P(A_{i_1}\\cdots A_{i_k})=\\prod P(A_{i_j})$，要查全部子集。","diff":["检查范围：只查两两 / 还要查三元及以上；","强弱：相互独立强于两两独立。"],"link":"相互独立 $\\Rightarrow$ 两两独立，反之不成立；差别只在「三个一起」这一条上，而多元运算（如 $D(\\sum X_i)$）要求的是相互独立。","ex":"抛两枚硬币，$A=$第一正、$B=$第二正、$C=$两面相同：$P(AB)=P(AC)=P(BC)=\\frac14$ 两两独立，但 $P(ABC)=0\\neq\\frac18$，不相互独立。"},"bx2":{"def":"两两独立指对任意 $i<j$ 都有 $P(A_iA_j)=P(A_i)P(A_j)$，即只检查二元组；相互独立指任意 $k\\ge2$ 个事件的交概率都等于各自概率之积，$P(A_{i_1}\\cdots A_{i_k})=\\prod_j P(A_{i_j})$，要检查全部子集，即所有阶的乘积等式同时成立。","diff":"区别在检查范围与强弱，两两独立只约束二元组，相互独立还约束三元及更高阶的交，条件更多更严；相互独立必蕴含两两独立，而两两独立在 $n\\ge3$ 时可能遗漏高阶等式而失效。","link":"相互独立蕴含两两独立，反之在 $n\\ge3$ 时不成立，差别只在三个及以上事件同时发生的那条乘法等式上；$n$ 重独立重复试验要求的是相互独立，仅两两独立不够。"}},{"no":5,"star":3,"title":"频率 vs 概率","ch":1,"sections":[{"name":"一句话","body":"频率是试验得到的随机值，概率是事件的固有常数；频率稳定于概率。"},{"name":"定义卡","body":"- 频率：$f_n(A)=\\dfrac{n(A)}{n}$，其中 $n(A)$ 为 $n$ 次试验中 $A$ 出现的次数。\n- 概率：满足三条公理的集函数 $P(\\cdot)$。"},{"name":"对比表","body":"| 维度 | 频率 | 概率 |\n|---|---|---|\n| 性质 | 随机、依赖试验 | 确定、客观 |\n| 取值 | 随 $n$ 波动 | 固定 |\n| 理论 | 伯努利大数定律：$f_n(A)\\xrightarrow{P}P(A)$ | — |"},{"name":"得分点","body":"> 频率是 $n$ 次重复试验中事件发生次数与试验次数之比，是随机变量，随试验次数与结果波动；概率是刻画事件发生可能性大小的客观常数，满足非负性、规范性、可列可加性。由伯努利大数定律，当 $n\\to\\infty$ 时 $f_n(A)$ 依概率收敛于 $P(A)$，即频率稳定于概率，故可用大样本频率作为概率的估计（频率方法）。"},{"name":"钩子","body":"频率是\"测出来的\"，概率是\"定死的\"。"}],"one":"频率是试验得到的随机值，概率是事件的固有常数；频率稳定于概率。","hook":"频率是\"测出来的\"，概率是\"定死的\"。","bx":{"a":"频率 $f_n(A)=n(A)/n$：$n$ 次试验中 $A$ 出现的比例，随试验而变。","b":"概率 $P(A)$：满足三条公理的集函数，是事件的固有常数。","diff":["随机 vs 确定；随 $n$ 波动 vs 固定不变；","频率可观测、是统计量；概率通常未知。"],"link":"伯努利大数定律给出 $f_n(A)\\xrightarrow{P}P(A)$，即频率稳定于概率，这既是「概率的频率解释」，也是用频率估计概率的依据。","ex":"抛硬币 1000 次得 $f=0.512$、10000 次得 $0.498$：频率围着 $\\frac12$ 摆动，概率始终是 $\\frac12$。"},"bx2":{"def":"频率 $f_n(A)=n(A)/n$ 是 $n$ 次重复试验中事件 $A$ 出现的次数所占的比例，随试验结果而变，是一个统计量；概率 $P(A)$ 是定义在事件域上、满足非负性、规范性与可列可加性的集函数，是事件的固有常数。","diff":"频率依赖于具体的试验序列，同一事件在不同批次中取值不同，只有稳定性没有确定性；概率由公理唯一确定，与试验无关。此外频率可以直接观测，概率通常未知，只能由频率估计。","link":"伯努利大数定律给出，在 $n$ 重独立重复试验中，对任意 $\\varepsilon>0$ 有 $\\lim_{n\\to\\infty}P(|f_n(A)-P(A)|<\\varepsilon)=1$，即频率依概率收敛于概率，这是用频率估计概率的理论依据。"}},{"no":6,"star":2,"title":"古典概型 vs 几何概型","ch":1,"sections":[{"name":"一句话","body":"都是等可能，区别只在样本空间是有限还是不可数无限。"},{"name":"定义卡","body":"- 古典概型：$\\Omega$ 有限、样本点等可能，$P(A)=\\dfrac{k}{n}$。\n- 几何概型：$\\Omega$ 为某可度量的区域、落在度量相同子区域等可能，$P(A)=\\dfrac{m(A)}{m(\\Omega)}$。"},{"name":"对比表","body":"| 维度 | 古典概型 | 几何概型 |\n|---|---|---|\n| 样本点 | 有限 | 无限不可数 |\n| 计数方式 | 排列组合 | 长度/面积/体积 |\n| 零概率事件 | 只有不可能事件 | 可有非空零概率事件 |"},{"name":"得分点","body":"> 二者均为\"等可能\"模型。古典概型要求样本空间有限且每个样本点等可能，概率由计数（排列组合）给出；几何概型把\"等可能\"推广到连续区域，概率由度量之比给出。注意几何概型中出现 $P(A)=0$ 而 $A\\neq\\varnothing$（如区域边界），这是与古典概型的本质差异。"},{"name":"钩子","body":"有限数点，无限量长。"}],"one":"都是等可能，区别只在样本空间是有限还是不可数无限。","hook":"有限数点，无限量长。","bx":{"a":"古典概型：$\\Omega$ 有限且样本点等可能，$P(A)=k/n$（数个数）。","b":"几何概型：$\\Omega$ 是可度量区域、按度量等可能，$P(A)=m(A)/m(\\Omega)$（量长度面积体积）。","diff":["样本点：有限 / 不可数无限；","计算工具：排列组合 / 测度之比；","零概率事件：只有不可能事件 / 可以有非空的零概率事件。"],"link":"两者都建立在「等可能」上，几何概型是把等可能从有限个样本点推广到连续区域；因此几何概型里 $P(A)=0$ 不再意味着 $A=\\varnothing$。","ex":"掷骰子得偶数：$\\frac36$（古典）；在 $[0,2]$ 上均匀取点落进 $[0,1]$：$\\frac{1}{2}$（几何）。"},"bx2":{"def":"古典概型要求样本空间有限且各样本点等可能，概率按有利样本点数与总样本点数之比 $P(A)=\\frac{k}{n}$ 计算；几何概型要求样本空间是某可度量区域、随机点按度量等可能，概率按 $P(A)=m(A)/m(\\Omega)$ 计算。","diff":"两者的样本空间性质不同，古典概型的样本点有限可数，计数靠排列组合；几何概型的样本点不可数，计数换成测度之比；由此零概率事件的含义也不同，几何概型中可以有非空的零概率事件。","link":"几何概型是古典概型把等可能由有限个样本点推广到连续区域的结果，两者共用同一条等可能原则；正因为样本点不可数，几何概型中 $P(A)=0$ 不再等价于 $A=\\varnothing$。"}},{"no":7,"star":2,"title":"条件概率 vs 无条件概率（含乘法公式的适用条件）","ch":1,"sections":[{"name":"一句话","body":"条件概率把样本空间从 $\\Omega$ 换成 $B$。"},{"name":"定义卡","body":"- 无条件概率：$P(A)$，在 $\\Omega$ 上度量。\n- 条件概率：$P(A|B)=\\dfrac{P(AB)}{P(B)}$，**必须 $P(B)>0$**。"},{"name":"对比表","body":"| 维度 | 无条件概率 | 条件概率 |\n|---|---|---|\n| 样本空间 | $\\Omega$ | 缩为 $B$ |\n| 前提 | 无 | $P(B)>0$ |\n| 联系 | 独立时 $P(A|B)=P(A)$ | 乘法公式 $P(AB)=P(B)P(A|B)$ |"},{"name":"得分点","body":"> 条件概率是\"在已知 $B$ 发生的条件下\"重新度量 $A$ 的概率，定义为 $P(A|B)=P(AB)/P(B)$（要求 $P(B)>0$），其样本空间由 $\\Omega$ 缩减为 $B$。条件概率本身满足三条公理，故概率的一切性质（加法、减法、乘法）对条件概率均成立。联系：$P(A|B)=P(A)$ 当且仅当 $A,B$ 独立（$P(B)>0$ 时）。"},{"name":"钩子","body":"条件概率 = 在 $B$ 上重新归一化。"}],"one":"条件概率把样本空间从 $\\Omega$ 换成 $B$。","hook":"条件概率 = 在 $B$ 上重新归一化。","bx":{"a":"无条件概率 $P(A)$：在 $\\Omega$ 上直接度量 $A$。","b":"条件概率 $P(A\\mid B)=\\dfrac{P(AB)}{P(B)}$，要求 $P(B)>0$，样本空间缩为 $B$。","diff":["度量空间：$\\Omega$ / $B$；","前提：无 / 必须 $P(B)>0$；","数值一般不同。"],"link":"条件概率仍是概率，三条公理与全部运算性质照用；$P(A\\mid B)=P(A)$ 恰好是 $A,B$ 独立的定义（$P(B)>0$ 时）。","ex":"掷骰子：$P(\\text{点}=2)=\\frac16$；已知是偶数，$P(\\text{点}=2\\mid\\text{偶})=\\frac{1/6}{1/2}=\\frac13$。"},"bx2":{"def":"无条件概率 $P(A)$ 是在原样本空间 $\\Omega$ 上对事件 $A$ 赋值；条件概率 $P(A\\mid B)=P(AB)/P(B)$ 是在已知 $B$ 发生的条件下对 $A$ 赋值，前提为 $P(B)>0$，相当于把样本空间缩小为 $B$ 并在 $B$ 内重新归一化。","diff":"两者的度量空间不同，一个在 $\\Omega$ 上、一个在 $B$ 上，因此同一事件的数值一般不等；条件概率另有存在前提，$P(B)=0$ 时定义式无意义；但条件概率仍是概率，三条公理与全部运算性质照旧成立。","link":"无条件概率是条件概率当 $B=\\Omega$ 的特例；反过来 $P(A\\mid B)=P(A)$ 恰是 $A$ 与 $B$ 独立的定义，此时乘法公式退化为 $P(AB)=P(A)P(B)$，即条件化不改变概率等价于独立。"}},{"no":8,"star":3,"title":"全概率公式 vs 贝叶斯公式","ch":1,"sections":[{"name":"一句话","body":"全概率是\"由因求果\"，贝叶斯是\"由果溯因\"。"},{"name":"定义卡","body":"设 $B_1,\\dots,B_n$ 为 $\\Omega$ 的一个分割（互不相容且并集为 $\\Omega$，$P(B_i)>0$）：\n- 全概率：$P(A)=\\sum_{i=1}^{n}P(B_i)P(A|B_i)$。\n- 贝叶斯：$P(B_i|A)=\\dfrac{P(B_i)P(A|B_i)}{\\sum_{j=1}^{n}P(B_j)P(A|B_j)}$，要求 $P(A)>0$。"},{"name":"对比表","body":"| 维度 | 全概率公式 | 贝叶斯公式 |\n|---|---|---|\n| 目标 | 求 $P(A)$ | 求 $P(B_i|A)$ |\n| 方向 | 原因 → 结果 | 结果 → 原因 |\n| 共同前提 | $B_i$ 构成分割、$P(B_i)>0$ | 另需 $P(A)>0$ |"},{"name":"得分点","body":"> 全概率公式把复杂事件 $A$ 按完备事件组 $B_1,\\dots,B_n$ 分解为若干互不相容部分求和，用于\"由原因推结果\"；贝叶斯公式是全概率公式与条件概率定义结合的逆概率形式，用于已知结果 $A$ 发生后反推各原因 $B_i$ 的后验概率，分母正是全概率公式。二者前提高度一致：$B_i$ 必须构成 $\\Omega$ 的分割，否则公式不成立。"},{"name":"钩子","body":"全概率往下拆，贝叶斯往上追。"}],"one":"全概率是\"由因求果\"，贝叶斯是\"由果溯因\"。","hook":"全概率往下拆，贝叶斯往上追。","bx":{"a":"全概率公式：$P(A)=\\sum_i P(B_i)P(A\\mid B_i)$，由因求果。","b":"贝叶斯公式：$P(B_i\\mid A)=\\dfrac{P(B_i)P(A\\mid B_i)}{\\sum_j P(B_j)P(A\\mid B_j)}$，由果溯因。","diff":["目标：求 $P(A)$ / 求后验 $P(B_i\\mid A)$；","方向：原因 $\\to$ 结果 / 结果 $\\to$ 原因；","贝叶斯另需 $P(A)>0$。"],"link":"贝叶斯的分母就是全概率公式，两者共用同一个分割 $B_1,\\dots,B_n$；分割不成立则两个公式同时失效。","ex":"甲厂供 60%、次品率 1%，乙厂供 40%、次品率 2%：$P(\\text{次})=0.014$；$P(\\text{甲}\\mid\\text{次})=\\frac{0.006}{0.014}=0.4286$。"},"bx2":{"def":"全概率公式借助完备事件组 $B_1,\\dots,B_n$（两两互不相容且并为 $\\Omega$），把 $P(A)$ 写成各原因下条件概率的加权和 $\\sum_i P(B_i)P(A\\mid B_i)$；贝叶斯公式在同一分割下、当 $P(A)>0$ 时反求后验概率 $P(B_i\\mid A)=P(B_i)P(A\\mid B_i)/P(A)$。","diff":"两者的求解方向相反，全概率由原因推结果，求的是一个无条件概率，只需各 $P(B_i)$ 与 $P(A\\mid B_i)$；贝叶斯由结果溯原因，求的是后验概率，还要以 $P(A)>0$ 为前提并作归一化。","link":"贝叶斯公式的分母正是全概率公式给出的 $P(A)=\\sum_j P(B_j)P(A\\mid B_j)$，故贝叶斯可视为全概率的逆用；两者共用同一个完备事件组，分割一旦不成立则两个公式同时失效。"}},{"no":9,"star":1,"title":"事件域（σ 域）与概率的公理化","ch":1,"sections":[{"name":"一句话","body":"概率不是定义在所有子集上，而是定义在 σ 域上。"},{"name":"得分点","body":"> 设 $\\Omega$ 为样本空间，$\\mathcal F$ 为 $\\Omega$ 的某些子集构成的集类。若 (1) $\\Omega\\in\\mathcal F$；(2) $A\\in\\mathcal F\\Rightarrow\\bar A\\in\\mathcal F$；(3) $A_i\\in\\mathcal F\\Rightarrow\\bigcup_i A_i\\in\\mathcal F$，则称 $\\mathcal F$ 为事件域（σ 域），其中元素称为事件。概率 $P$ 是定义在 $\\mathcal F$ 上的集函数，满足：非负性 $P(A)\\ge0$；规范性 $P(\\Omega)=1$；可列可加性——对两两互不相容的 $A_1,A_2,\\dots$，有 $P\\!\\left(\\bigcup_i A_i\\right)=\\sum_i P(A_i)$。"},{"name":"钩子","body":"样本空间 → 事件域 → 概率，三层结构。"}],"one":"概率不是定义在所有子集上，而是定义在 σ 域上。","hook":"样本空间 → 事件域 → 概率，三层结构。","bx":{"a":"事件域 $\\mathcal F$：含 $\\Omega$、对取补和可列并封闭的子集类，其中元素才称为事件。","b":"概率 $P$：定义在 $\\mathcal F$ 上、满足非负性、$P(\\Omega)=1$、可列可加性的集函数。","diff":["$\\mathcal F$ 决定「哪些子集可以被讨论」；$P$ 是在这个框架上赋值。","数学身份：$\\mathcal F$ 是集类（子集构成的集合），$P$ 是定义在该集类上的集函数。"],"link":"必须先有 $\\Omega$ 与 $\\mathcal F$，才能定义 $P$；三元组 $(\\Omega,\\mathcal F,P)$ 称为概率空间，概率不能定义在全部子集上（存在不可测集）。","ex":"$\\Omega=[0,1]$ 时取 $\\mathcal F$ 为 Borel 集类、$P$ 为长度：区间有长度，但并非每个子集都能赋长度。"},"bx2":{"def":"事件域 $\\mathcal F$ 是样本空间 $\\Omega$ 的某些子集构成的集类，要求含 $\\Omega$、对取补与可列并封闭，其中每个元素才称为事件；概率 $P$ 是定义在 $\\mathcal F$ 上、满足非负性、$P(\\Omega)=1$ 与可列可加性的集函数。","diff":"两者的数学身份不同，$\\mathcal F$ 是集类，回答哪些子集可以被讨论、能否作为事件；$P$ 是定义在该集类上的集函数，回答每个事件对应多大的数，前者是定义域，后者是赋值规则。","link":"必须先有 $\\Omega$ 与 $\\mathcal F$ 才能定义 $P$，三元组 $(\\Omega,\\mathcal F,P)$ 称为概率空间；概率不能定义在全部子集上，因为区间 $[0,1]$ 上存在不可测集，这正是引入事件域的原因。"}},{"no":10,"star":2,"title":"概率的加法、减法、乘法公式的适用条件","ch":1,"sections":[{"name":"一句话","body":"三个公式的条件各不相同，混淆条件是最常见的失分点。\n\n| 公式 | 表达式 | 适用条件 |\n|---|---|---|\n| 加法（一般） | $P(A\\cup B)=P(A)+P(B)-P(AB)$ | 恒成立 |\n| 加法（互斥） | $P(A\\cup B)=P(A)+P(B)$ | $AB=\\varnothing$ |\n| 减法 | $P(A-B)=P(A)-P(AB)$；$P(\\bar A)=1-P(A)$ | 恒成立 |\n| 乘法（一般） | $P(AB)=P(B)P(A|B)$ | $P(B)>0$ |\n| 乘法（独立） | $P(AB)=P(A)P(B)$ | $A,B$ 独立 |"},{"name":"得分点","body":"> 加法公式 $P(A\\cup B)=P(A)+P(B)-P(AB)$ 对任意两事件成立，只有在 $A,B$ 互不相容时 $P(AB)=0$ 才能退化为直接相加；减法公式 $P(A-B)=P(A)-P(AB)$ 恒成立，是化简\"事件差\"的基本工具；乘法公式 $P(AB)=P(B)P(A|B)$ 要求 $P(B)>0$，只有在独立性成立时才可写成 $P(A)P(B)$。三者不可混用，尤其\"互不相容\"不能当作\"独立\"使用。"},{"name":"钩子","body":"加法恒成立，独立才拆积。"}],"one":"三个公式的条件各不相同，混淆条件是最常见的失分点。\n\n| 公式 | 表达式 | 适用条件 |\n|---|---|---|\n| 加法（一般） | $P(A\\cup B)=P(A)+P(B)-P(AB)$ | 恒成立 |\n| 加法（互斥） | $P(A\\cup B)=P(A)+P(B)$ | $AB=\\varnothing$ |\n| 减法 | $P(A-B)=P(A)-P(AB)$；$P(\\bar A)=1-P(A)$ | 恒成立 |\n| 乘法（一般） | $P(AB)=P(B)P(A|B)$ | $P(B)>0$ |\n| 乘法（独立） | $P(AB)=P(A)P(B)$ | $A,B$ 独立 |","hook":"加法恒成立，独立才拆积。","bx":{"a":"加法公式：$P(A\\cup B)=P(A)+P(B)-P(AB)$，对任意两事件恒成立。","b":"乘法公式：$P(AB)=P(B)P(A\\mid B)$，需 $P(B)>0$；只有独立时才写成 $P(A)P(B)$。","diff":["加法恒成立，$AB=\\varnothing$ 才可省去 $-P(AB)$；","乘法需条件概率存在，独立才可省去条件；","减法 $P(A-B)=P(A)-P(AB)$ 无条件成立。"],"link":"互不相容提供「加法免交集」，独立提供「乘法免条件」——一个是集合条件、一个是概率条件，二者不可互换（互不相容恰恰导致不独立）。","ex":"$P(A)=0.5,P(B)=0.4,P(AB)=0.2$：$P(A\\cup B)=0.7$，$P(A-B)=0.3$，$P(A\\mid B)=0.5$。"},"bx2":{"def":"加法公式 $P(A\\cup B)=P(A)+P(B)-P(AB)$ 与减法公式 $P(A-B)=P(A)-P(AB)$ 对任意两事件恒成立，用于把并、差的概率拆成和与交；乘法公式 $P(AB)=P(B)P(A\\mid B)$ 则在 $P(B)>0$ 时成立，三者中只有它带前提，而这个前提是必须核对的。","diff":"三者的适用条件逐级收紧，加法与减法无条件成立，去掉 $-P(AB)$ 只在 $AB=\\varnothing$ 时允许；乘法必须 $P(B)>0$，去掉条件只在 $A,B$ 独立时允许；条件来自集合关系还是概率性质，是易混之处。","link":"互不相容提供加法免交集，独立提供乘法免条件，前者是集合条件、后者是概率条件，二者不可互换：两个正概率事件互不相容时 $P(AB)=0$，恰恰导致不独立。"}},{"no":11,"star":3,"title":"分布函数 vs 分布列 vs 密度函数","ch":2,"sections":[{"name":"一句话","body":"分布函数对离散、连续都通用；分布列只对离散，密度只对连续。"},{"name":"定义卡","body":"- 分布函数：$F(x)=P(X\\le x)$，$x\\in\\mathbb R$（通用）。\n- 分布列：$p_i=P(X=x_i)$，$\\sum p_i=1$（仅离散型）。\n- 密度函数：$f(x)\\ge0$，$\\int_{-\\infty}^{x}f(t)\\,\\mathrm dt=F(x)$（仅连续型）。"},{"name":"对比表","body":"| 维度 | $F(x)$ | $p_i$ | $f(x)$ |\n|---|---|---|---|\n| 适用范围 | 全部 | 离散 | 连续 |\n| 取值 | $[0,1]$ | $[0,1]$ | 可 $>1$ |\n| 与概率 | 直接给 $P(X\\le x)$ | 直接给点概率 | 需积分才得概率 |"},{"name":"得分点","body":"> 分布函数 $F(x)=P(X\\le x)$ 对一切随机变量都有定义，且必满足单调不减、右连续、$F(-\\infty)=0$、$F(+\\infty)=1$。离散型的分布函数由分布列累加得到，呈阶梯状；连续型的分布函数由密度积分得到，是连续函数。密度函数 $f(x)$ 本身不是概率，可以取大于 1 的值，只有积分 $\\int_a^b f$ 才是概率；离散型不存在密度函数。三者关系：$p_i=F(x_i)-F(x_i-0)$，$f(x)=F'(x)$（可导处）。"},{"name":"钩子","body":"$F$ 是万能接口，$p$ 与 $f$ 各管一半。"}],"one":"分布函数对离散、连续都通用；分布列只对离散，密度只对连续。","hook":"$F$ 是万能接口，$p$ 与 $f$ 各管一半。","bx":{"a":"分布函数 $F(x)=P(X\\le x)$：对一切随机变量都有定义，单调不减、右连续。","b":"分布列 $p_i=P(X=x_i)$ 只对离散型；密度 $f$ 只对连续型，且 $F(x)=\\int_{-\\infty}^{x}f$。","diff":["适用范围：全部 / 离散 / 连续；","取值：$p_i\\le1$，而 $f$ 可以大于 1；","密度本身不是概率，要积分才是概率。"],"link":"$p_i=F(x_i)-F(x_i-0)$，$f(x)=F'(x)$（可导处）；$F$ 是统一接口，$p$ 与 $f$ 各管一半。","ex":"$X\\sim U(0,0.5)$ 的密度 $f=2>1$，但 $P(0<X<0.25)=0.5$——密度大不等于概率大。"},"bx2":{"def":"分布函数 $F(x)=P(X\\le x)$ 对一切随机变量都有定义，是单调不减的右连续函数；分布列 $p_i=P(X=x_i)$ 只对离散型有定义；密度函数 $f$ 只对连续型存在，并由 $F(x)=\\int_{-\\infty}^{x}f(t)\\mathrm dt$ 与 $F$ 相联系。","diff":"三者的适用范围与取值性质不同，$F$ 对离散与连续都通用，取值必在 $[0,1]$ 内；$p_i$ 是概率，非负且求和为 $1$；$f$ 不是概率，可以大于 $1$，必须积分 $\\int_a^b f$ 才给出概率，本身没有上界约束。","link":"三者由微积分互相换算，可导处 $f(x)=F'(x)$，离散点处 $p_i=F(x_i)-F(x_i-0)$；$F$ 是统一接口，分布列与密度分别是它在离散、连续两种场合的局部表达。"}},{"no":12,"star":2,"title":"离散型 vs 连续型随机变量","ch":2,"sections":[{"name":"一句话","body":"看取值是否可列，而不是看\"是否连续变化\"。"},{"name":"对比表","body":"| 维度 | 离散型 | 连续型 |\n|---|---|---|\n| 取值 | 有限或可列 | 某区间（不可列） |\n| 描述 | 分布列 | 密度函数 |\n| 点概率 | $P(X=a)$ 可 $>0$ | 恒有 $P(X=a)=0$ |\n| 期望 | $\\sum x_ip_i$ | $\\int xf(x)\\mathrm dx$ |"},{"name":"得分点","body":"> 若随机变量取值至多可列，称为离散型，由分布列完整刻画；若存在非负可积函数 $f$ 使 $F(x)=\\int_{-\\infty}^{x}f(t)\\mathrm dt$，称为连续型，由密度函数刻画。连续型的任一单点概率为 0，故 $P(a<X<b)=P(a\\le X<b)=P(a<X\\le b)=P(a\\le X\\le b)$；离散型则端点是否取到会改变概率。注意并非\"不连续即连续型\"，存在既非离散也非连续的随机变量。"},{"name":"钩子","body":"可列 → 分布列；有密度 → 连续。"}],"one":"看取值是否可列，而不是看\"是否连续变化\"。","hook":"可列 → 分布列；有密度 → 连续。","bx":{"a":"离散型：取值有限或可列，由分布列刻画，$P(X=a)$ 可以大于 0。","b":"连续型：存在非负可积 $f$ 使 $F(x)=\\int_{-\\infty}^{x}f$，任一单点概率为 0。","diff":["取值：可列 / 不可列；","运算：求和 / 积分；","端点：离散型端点取不取会改变概率，连续型不改变。"],"link":"判据是「取值是否可列」或「是否存在密度」，不是「图像连不连续」；也存在既非离散又非连续的随机变量。","ex":"掷骰子 $P(X=3)=\\frac16$；$X\\sim U(0,1)$ 时 $P(X=0.5)=0$，但 $P(0.4<X<0.6)=0.2$。"},"bx2":{"def":"离散型随机变量的取值有限或可列，由分布列 $p_i=P(X=x_i)$ 完全刻画，单点概率可以大于 $0$；连续型随机变量存在非负可积的密度 $f$，使 $F(x)=\\int_{-\\infty}^{x}f$，任一单点的概率都为 $0$。","diff":"两者的判据是取值是否可列、是否存在密度，与分布函数图像是否连续无关；离散型用求和算概率与期望，连续型用积分；端点是否计入对连续型不改变概率，对离散型则会改变。","link":"任何随机变量都有分布函数，离散型与连续型只是 $F$ 的两种特殊形态，前者 $F$ 为阶梯函数，后者 $F$ 绝对连续；两类之外还有混合型，故不能认为非此即彼。"}},{"no":13,"star":3,"title":"数学期望 vs 方差","ch":2,"sections":[{"name":"一句话","body":"期望是\"位置\"，方差是\"离散程度\"，量纲还要平方。"},{"name":"定义卡","body":"- $E(X)=\\sum x_ip_i$ 或 $\\int xf(x)\\mathrm dx$。\n- $D(X)=E(X-EX)^2=E(X^2)-(EX)^2$。"},{"name":"对比表","body":"| 维度 | 期望 | 方差 |\n|---|---|---|\n| 刻画 | 中心位置 | 分散程度 |\n| 量纲 | 与 $X$ 相同 | 与 $X^2$ 相同 |\n| 线性性 | $E(aX+b)=aEX+b$ | $D(aX+b)=a^2DX$ |"},{"name":"得分点","body":"> 数学期望反映随机变量取值的平均水平，具有线性性 $E(aX+bY)=aEX+bEY$（无需独立性）；方差刻画取值相对均值的分散程度，定义为 $D(X)=E(X-EX)^2$，计算常用 $D(X)=E(X^2)-(EX)^2$，且 $D(aX+b)=a^2D(X)$。二者量纲不同，故比较不同量纲的离散程度需用标准差 $\\sigma=\\sqrt{D(X)}$ 或变异系数 $C_v=\\sigma/EX$。联系：$D(X)=E(X^2)-(EX)^2$，且 $DX=0\\iff X$ 几乎处处为常数。"},{"name":"钩子","body":"期望回答\"平均多少\"，方差回答\"偏多远\"。"}],"one":"期望是\"位置\"，方差是\"离散程度\"，量纲还要平方。","hook":"期望回答\"平均多少\"，方差回答\"偏多远\"。","bx":{"a":"期望 $E(X)=\\sum x_ip_i$ 或 $\\int xf(x)\\mathrm dx$：刻画取值的中心位置。","b":"方差 $D(X)=E(X-EX)^2=E(X^2)-(EX)^2$：刻画取值相对中心的分散程度。","diff":["量纲：与 $X$ 相同 / 与 $X^2$ 相同；","线性性：$E(aX+b)=aEX+b$ / $D(aX+b)=a^2DX$；","不同量纲比较离散程度要用标准差或变异系数。"],"link":"$D(X)=E(X^2)-(EX)^2$ 是二者的桥（$E(X^2)=DX+(EX)^2$）；$DX=0\\iff X$ 几乎处处为常数。","ex":"$X\\sim B(1,0.3)$：$EX=0.3$，$E(X^2)=0.3$，故 $DX=0.3-0.09=0.21$。"},"bx2":{"def":"数学期望 $E(X)=\\sum_i x_ip_i$ 或 $\\int_{-\\infty}^{+\\infty}xf(x)\\mathrm dx$ 是以概率为权的加权平均，刻画取值的中心位置；方差 $D(X)=E(X-EX)^2=E(X^2)-(EX)^2$ 度量取值偏离中心的平均平方程度，反映分布的离散程度。","diff":"两者的量纲与变换规律不同，期望与 $X$ 同量纲且具线性性 $E(aX+b)=aEX+b$，方差与 $X^2$ 同量纲且 $D(aX+b)=a^2DX$；期望可为负、方差非负，比较不同量纲的离散程度要用标准差或变异系数。","link":"二者由 $D(X)=E(X^2)-(EX)^2$ 相联系，即 $E(X^2)=DX+(EX)^2$；并且 $DX=0$ 当且仅当 $X$ 几乎处处等于常数 $EX$，此时分布退化，方差越小分布越集中，故二者共同刻画分布的位置与散布。"}},{"no":14,"star":3,"title":"期望存在 vs 期望绝对收敛","ch":2,"sections":[{"name":"一句话","body":"期望存在要求 $\\sum|x_i|p_i$（或 $\\int|x|f$）收敛，不是原级数收敛。"},{"name":"得分点","body":"> 离散情形要求 $\\sum_i|x_i|p_i<\\infty$；连续情形要求 $\\int_{-\\infty}^{\\infty}|x|f(x)\\mathrm dx<\\infty$。强调绝对值是因为原级数可能条件收敛，此时若按不同顺序求和会得到不同结果，期望将不唯一。经典反例：柯西分布密度 $f(x)=\\dfrac{1}{\\pi(1+x^2)}$，其 $E|X|=\\infty$，故期望不存在（虽然 $\\int xf(x)\\mathrm dx$ 按主值理解可为 0，但不能称为期望）。考试中凡\"期望是否存在\"必须验证绝对收敛。"},{"name":"钩子","body":"期望存在 = 绝对可积。"}],"one":"期望存在要求 $\\sum|x_i|p_i$（或 $\\int|x|f$）收敛，不是原级数收敛。","hook":"期望存在 = 绝对可积。","bx":{"a":"期望存在：要求绝对可积，即 $\\sum|x_i|p_i<\\infty$ 或 $\\int_{-\\infty}^{\\infty}|x|f(x)\\mathrm dx<\\infty$。","b":"级数（积分）本身收敛：允许仅有条件收敛。","diff":["条件收敛时重排求和会得到不同数值，期望不唯一，故不能算存在；","绝对收敛 $\\Rightarrow$ 收敛，反之不然。"],"link":"「期望存在」的严格含义就是绝对可积；这也是期望可以做线性运算、可以重排的前提。","ex":"柯西分布 $f(x)=\\frac{1}{\\pi(1+x^2)}$：$E|X|=\\infty$，故 $EX$ 不存在（主值 0 不算期望）。"},"bx2":{"def":"期望存在等价于绝对可积，即 $E|X|=\\sum_i|x_i|p_i<\\infty$ 或 $\\int_{-\\infty}^{+\\infty}|x|f(x)\\mathrm dx<\\infty$；而级数或瑕积分本身收敛，只说明按某种求和次序可算出有限值，允许条件收敛，数值可能随次序改变。","diff":"两者的区别在收敛的强度，绝对收敛必收敛，收敛却未必绝对收敛；条件收敛时重排求和会得到不同数值，$E(X)$ 不唯一，因此不能算作期望存在，柯西分布就是典型。","link":"按测度论的定义，$E(X)$ 存在就是 $E|X|<\\infty$，只有绝对可积才能保证线性运算与重排求和合法，因此绝对收敛不是附加要求，而是期望定义的组成部分。"}},{"no":15,"star":2,"title":"二项分布 vs 两点（伯努利）分布","ch":2,"sections":[{"name":"一句话","body":"两点分布是 $n=1$ 的二项分布。"},{"name":"得分点","body":"> 两点分布 $B(1,p)$ 只做一次试验，取 0 或 1；二项分布 $B(n,p)$ 是 $n$ 重伯努利试验中\"成功\"次数，取值 $0,1,\\dots,n$，$P(X=k)=\\binom{n}{k}p^k(1-p)^{n-k}$。二者关系为 $B(n,p)$ 是 $n$ 个独立同分布 $B(1,p)$ 之和。期望与方差：两点 $EX=p,\\ DX=p(1-p)$；二项 $EX=np,\\ DX=np(1-p)$。注意二项分布要求各次试验**独立且同分布**，若试验间不独立（如无放回抽样）应用超几何分布。"},{"name":"钩子","body":"一次叫两点，$n$ 次叫二项。"}],"one":"两点分布是 $n=1$ 的二项分布。","hook":"一次叫两点，$n$ 次叫二项。","bx":{"a":"两点分布 $B(1,p)$：只做一次伯努利试验，取值 0 或 1。","b":"二项分布 $B(n,p)$：$n$ 重独立重复试验中成功的次数，取值 $0,1,\\dots,n$。","diff":["取值范围：两个点 / $n+1$ 个点；","$EX$：$p$ / $np$；$DX$：$p(1-p)$ / $np(1-p)$。"],"link":"二项是 $n$ 个独立同分布 $B(1,p)$ 之和，故两点分布就是 $n=1$ 的二项分布。","ex":"抛 1 次硬币的正面数 $\\sim B(1,0.5)$；抛 10 次的正面数 $\\sim B(10,0.5)$，$EX=5$，$DX=2.5$。"},"bx2":{"def":"两点分布 $B(1,p)$ 只做一次伯努利试验，取值只有 $0$ 与 $1$，$P(X=1)=p$；二项分布 $B(n,p)$ 是 $n$ 重独立重复试验中成功次数的分布，取值 $0,1,\\dots,n$，$P(X=k)=\\binom{n}{k}p^k(1-p)^{n-k}$，其中 $p$ 为单次试验的成功概率。","diff":"两者的取值范围与数字特征不同，两点分布只有两个可能值，$EX=p$、$DX=p(1-p)$；二项分布有 $n+1$ 个可能值，$EX=np$、$DX=np(1-p)$，且随 $n$ 增大分布趋于对称，可用正态近似。","link":"二项分布是 $n$ 个独立同分布 $B(1,p)$ 之和，由两点分布的可加性得到，故两点分布正是 $n=1$ 的二项分布；这一特例也解释了 $EX=np$ 与 $DX=np(1-p)$ 在 $n=1$ 时退化为 $p$ 与 $p(1-p)$。"}},{"no":16,"star":3,"title":"二项分布 vs 泊松分布（含泊松定理的近似条件）","ch":2,"sections":[{"name":"一句话","body":"二项是\"次数有限\"，泊松是\"稀有事件的极限\"。"},{"name":"对比表","body":"| 维度 | $B(n,p)$ | $P(\\lambda)$ |\n|---|---|---|\n| 取值 | $0,\\dots,n$（有上界） | $0,1,2,\\dots$（无上界） |\n| 参数 | $n,p$ | $\\lambda$ |\n| 期望方差 | $np,\\ np(1-p)$ | $\\lambda,\\ \\lambda$ |\n| 来源 | $n$ 重伯努利 | 泊松流、稀有事件计数 |"},{"name":"得分点","body":"> 二项分布描述 $n$ 次独立重复试验中成功次数，参数为试验次数 $n$ 与单次成功概率 $p$，期望 $np$、方差 $np(1-p)$，方差小于期望；泊松分布描述单位时间（或区域）内稀有事件发生次数，参数 $\\lambda$ 既是期望又是方差。由泊松定理，当 $n$ 很大、$p$ 很小且 $np\\to\\lambda$ 时，$\\binom{n}{k}p^k(1-p)^{n-k}\\to\\dfrac{\\lambda^k}{k!}\\mathrm e^{-\\lambda}$，故可用泊松近似二项，实用判据为 $n\\ge20,\\ p\\le0.05$（或 $np\\le5$）。注意泊松分布方差等于期望、二项分布方差恒小于期望，这是区分的实用特征。"},{"name":"钩子","body":"二项有上限，泊松无上限；泊松方差 = 期望。"}],"one":"二项是\"次数有限\"，泊松是\"稀有事件的极限\"。","hook":"二项有上限，泊松无上限；泊松方差 = 期望。","bx":{"a":"$B(n,p)$：计数有上界 $n$，$EX=np$，$DX=np(1-p)$，方差小于期望。","b":"$P(\\lambda)$：计数无上界，$EX=DX=\\lambda$，方差等于期望。","diff":["支撑集：$0..n$ / $0,1,2,\\dots$；","参数：$n,p$ / 单个 $\\lambda$；","方差与期望的关系不同。"],"link":"泊松定理：$n$ 大、$p$ 小、$np\\to\\lambda$ 时 $B(n,p)\\to P(\\lambda)$，实用判据 $n\\ge20,p\\le0.05$。","ex":"$n=1000,p=0.002$ 时 $B$ 近似 $P(2)$：$P(X=0)\\approx e^{-2}=0.135$。"},"bx2":{"def":"二项分布 $B(n,p)$ 是 $n$ 重伯努利试验中成功次数的分布，其概率为 $P(X=k)=C_n^k p^k q^{n-k}$；泊松分布 $P(\\lambda)$ 则描述单位时间内稀有事件的发生次数。","diff":"二项的取值以 $n$ 为上界，方差 $npq$ 小于期望 $np$，故相对离散随均值增大而缩小；泊松取值无上界，期望与方差同为 $\\lambda$，两者始终相等，且参数只有一个。","link":"泊松定理：$n$ 大、$p$ 小、$np\\to\\lambda$ 时二项分布趋向泊松分布，实用判据 $n\\ge20$、$p\\le0.05$，取 $\\lambda=np$ 近似。"}},{"no":17,"star":2,"title":"二项分布 vs 超几何分布","ch":2,"sections":[{"name":"一句话","body":"有放回是二项，无放回是超几何。"},{"name":"得分点","body":"> 二项分布对应有放回抽样（各次独立、成功概率不变）；超几何分布 $H(N,M,n)$ 对应无放回抽样，$P(X=k)=\\dfrac{\\binom{M}{k}\\binom{N-M}{n-k}}{\\binom{N}{n}}$，各次不独立，成功概率随抽样变化。当总体量 $N$ 远大于样本量 $n$（一般 $n/N\\le0.1$）时，超几何可用二项近似。期望：二者都是 $np$（超几何中 $p=M/N$）；方差：超几何为 $np(1-p)\\cdot\\dfrac{N-n}{N-1}$，比二项多一个有限总体校正因子 $\\dfrac{N-n}{N-1}<1$。"},{"name":"钩子","body":"放回独立，不放回衰减——校正因子。"}],"one":"有放回是二项，无放回是超几何。","hook":"放回独立，不放回衰减——校正因子。","bx":{"a":"二项：有放回抽样，各次独立，成功概率恒为 $p$。","b":"超几何 $H(N,M,n)$：无放回抽样，各次不独立，$P(X=k)=\\dfrac{\\binom{M}{k}\\binom{N-M}{n-k}}{\\binom{N}{n}}$。","diff":["抽样方式：放回 / 不放回；","$DX$：$np(1-p)$ / $np(1-p)\\cdot\\dfrac{N-n}{N-1}$（多一个有限总体校正）。"],"link":"两者期望都是 $np$（$p=M/N$）；当 $n/N\\le0.1$（总体远大于样本）时校正因子趋于 1，超几何可用二项近似。","ex":"100 件产品含 10 件次品，无放回抽 5 件：$EX=5\\times0.1=0.5$，方差 $0.45\\times\\frac{95}{99}\\approx0.432<0.45$。"},"bx2":{"def":"二项分布 $B(n,p)$ 来自有放回抽样，各次试验独立，成功概率恒为 $p$；超几何分布 $H(N,M,n)$ 来自无放回抽样，$P(X=k)=\\dfrac{C_M^k C_{N-M}^{n-k}}{C_N^n}$，各次不独立。","diff":"二项的试验条件不变，每次成功概率都是 $p$，方差为 $npq$；超几何的总体随抽取而减少，成功概率逐次改变，方差为 $npq\\dfrac{N-n}{N-1}$，多出一个小于 1 的有限总体校正因子。","link":"两者期望同为 $np$（$p=M/N$）；当 $n/N\\le0.1$ 时校正因子接近 1，超几何可用二项近似，$N\\to\\infty$ 且 $M/N\\to p$ 时超几何收敛于 $B(n,p)$。"}},{"no":18,"star":3,"title":"指数分布无记忆性 vs 几何分布无记忆性","ch":2,"sections":[{"name":"一句话","body":"连续型里只有指数分布无记忆，离散型里只有几何分布无记忆。"},{"name":"定义卡","body":"- 指数：$P(X>s+t\\mid X>s)=P(X>t)$，$t,s>0$。\n- 几何：$P(X>k+m\\mid X>k)=P(X>m)$，$k,m\\in\\mathbb N$。"},{"name":"对比表","body":"| 维度 | 指数分布 $Exp(\\lambda)$ | 几何分布 $Ge(p)$ |\n|---|---|---|\n| 支撑 | $[0,+\\infty)$ | $\\{1,2,\\dots\\}$ |\n| 参数含义 | 失效率 | 单次成功概率 |\n| 无记忆性 | $P(X>s+t|X>s)=P(X>t)$ | $P(X>k+m|X>k)=P(X>m)$ |\n| 期望 | $1/\\lambda$ | $1/p$ |"},{"name":"得分点","body":"> 几何分布与指数分布分别是离散、连续场合下唯一具有无记忆性的分布：几何分布满足 $P(X>k+m\\mid X>k)=P(X>m)$，指数分布满足 $P(X>s+t\\mid X>s)=P(X>t)$（均设 $P(X>s)>0$）。直观含义是\"已经等待了多久，不影响还需等待多久\"，故二者常用于描述元件寿命、排队等待时间。证明要点：利用 $P(X>s)=\\mathrm e^{-\\lambda s}$ 代入条件概率定义即可。反例：均匀分布不具无记忆性，$P(X>s+t\\mid X>s)$ 随 $s$ 变化。"},{"name":"钩子","body":"无记忆 = 过去被\"忘记\"。"}],"one":"连续型里只有指数分布无记忆，离散型里只有几何分布无记忆。","hook":"无记忆 = 过去被\"忘记\"。","bx":{"a":"指数分布：$P(X>s+t\\mid X>s)=P(X>t)$，是连续型中唯一无记忆的分布。","b":"几何分布：$P(X>k+m\\mid X>k)=P(X>m)$，是离散型中唯一无记忆的分布。","diff":["支撑：$[0,+\\infty)$ / $\\{1,2,\\dots\\}$；","参数含义：失效率 $\\lambda$ / 单次成功概率 $p$；","期望：$1/\\lambda$ / $1/p$。"],"link":"二者是同一性质在连续与离散场合的对应版本，都表示「已经等待了多久，不影响还要等待多久」；指数分布可视作几何分布的连续化。","ex":"元件寿命 $Exp(\\lambda)$，已用 3 年，再撑 2 年的概率仍是 $P(X>2)=e^{-2\\lambda}$，与已用 3 年无关。"},"bx2":{"def":"指数分布 $Exp(\\lambda)$ 的密度为 $f(x)=\\lambda e^{-\\lambda x}\\ (x\\ge0)$，用于刻画寿命与等待时间；几何分布 $G(p)$ 是伯努利试验中首次成功所需试验次数的分布。","diff":"指数取值于连续区间 $[0,+\\infty)$，失效率恒为 $\\lambda$，期望为 $1/\\lambda$；几何取值于正整数，成功概率恒为 $p$，期望为 $1/p$，其取值可数而指数不可数。","link":"两者分别是连续型与离散型中唯一具有无记忆性的分布，$P(X>s+t\\mid X>s)=P(X>t)$ 与 $P(X>k+m\\mid X>k)=P(X>m)$ 同形；几何按 $1/n$ 细分并令 $p=\\lambda/n$ 即得指数分布。"}},{"no":19,"star":2,"title":"均匀分布 vs 指数分布","ch":2,"sections":[{"name":"一句话","body":"均匀是\"等可能取值\"，指数是\"等概率等待\"。"},{"name":"得分点","body":"> 均匀分布 $U(a,b)$ 表示在区间内任一点等可能取到，密度为 $\\dfrac{1}{b-a}$（区间内），期望 $\\dfrac{a+b}{2}$、方差 $\\dfrac{(b-a)^2}{12}$，无记忆性不成立；指数分布 $Exp(\\lambda)$ 密度为 $\\lambda\\mathrm e^{-\\lambda x}(x\\ge0)$，期望 $1/\\lambda$、方差 $1/\\lambda^2$，具无记忆性。二者都是连续型常用分布，但前者刻画\"位置\"（取值在区间内均匀铺开），后者刻画\"等待时间\"（越短的概率越大）。"},{"name":"钩子","body":"均匀看位置，指数看等待。"}],"one":"均匀是\"等可能取值\"，指数是\"等概率等待\"。","hook":"均匀看位置，指数看等待。","bx":{"a":"均匀分布 $U(a,b)$：区间内任一点等可能，密度 $\\dfrac{1}{b-a}$，$EX=\\dfrac{a+b}{2}$，$DX=\\dfrac{(b-a)^2}{12}$。","b":"指数分布 $Exp(\\lambda)$：密度 $\\lambda e^{-\\lambda x}\\,(x\\ge0)$，$EX=\\dfrac{1}{\\lambda}$，$DX=\\dfrac{1}{\\lambda^2}$。","diff":["刻画对象：取值位置（铺在区间上）/ 等待时间（越短越可能）；","无记忆性：无 / 有；","密度形状：矩形 / 单调下降。"],"link":"两者都是连续型的基本分布，常一起出现：均匀分布是「等可能」的连续版，指数分布是「等速率到达」的连续版；指数分布可由泊松过程导出。","ex":"$X\\sim U(0,10)$：$EX=5$，$DX=\\frac{100}{12}=8.33$；$Y\\sim Exp(0.5)$：$EY=2$，$DY=4$，且 $P(Y>4\\mid Y>2)=P(Y>2)=e^{-1}$。"},"bx2":{"def":"均匀分布 $U(a,b)$ 的密度在 $(a,b)$ 上恒为 $\\dfrac{1}{b-a}$，区间内各点等可能；指数分布 $Exp(\\lambda)$ 的密度为 $\\lambda e^{-\\lambda x}\\ (x\\ge0)$，取值越大越不可能。","diff":"均匀分布的支撑有界，密度是矩形，期望为中点 $\\dfrac{a+b}{2}$、方差为 $\\dfrac{(b-a)^2}{12}$；指数分布支撑无上界，密度单调下降，期望与标准差同为 $1/\\lambda$，且具有无记忆性。","link":"二者是连续型的基本分布但无包含关系；在参数为 $\\lambda$ 的泊松过程中，相邻事件的时间间隔服从 $Exp(\\lambda)$，而给定事件已发生的条件下其时刻在区间上服从均匀分布。"}},{"no":20,"star":2,"title":"正态分布 vs 标准正态分布","ch":2,"sections":[{"name":"一句话","body":"标准化是把任意正态搬到 $N(0,1)$，概率不变。"},{"name":"得分点","body":"> 若 $X\\sim N(\\mu,\\sigma^2)$，则 $Z=\\dfrac{X-\\mu}{\\sigma}\\sim N(0,1)$，且 $F_X(x)=\\Phi\\!\\left(\\dfrac{x-\\mu}{\\sigma}\\right)$。标准正态密度 $\\varphi(x)=\\dfrac{1}{\\sqrt{2\\pi}}\\mathrm e^{-x^2/2}$，分布函数记 $\\Phi(x)$，满足 $\\Phi(-x)=1-\\Phi(x)$。正态分布的对称性表现为 $P(X<\\mu-a)=P(X>\\mu+a)$，且 $P(|X-\\mu|<k\\sigma)=2\\Phi(k)-1$（$3\\sigma$ 原则：$k=3$ 时约为 $0.9973$）。注意：正态分布由 $\\mu,\\sigma^2$ 完全确定，线性变换后仍为正态：$aX+b\\sim N(a\\mu+b,a^2\\sigma^2)$。"},{"name":"钩子","body":"减均值除标准差，一切正态变标准。"}],"one":"标准化是把任意正态搬到 $N(0,1)$，概率不变。","hook":"减均值除标准差，一切正态变标准。","bx":{"a":"正态 $N(\\mu,\\sigma^2)$：密度关于 $\\mu$ 对称，参数是位置与尺度。","b":"标准正态 $N(0,1)$：$\\mu=0,\\sigma=1$，密度 $\\varphi(x)$、分布函数 $\\Phi(x)$ 已制表。","diff":["参数：两个任意 / 固定为 0 与 1；","查表：需先标准化 / 直接查表。"],"link":"标准化 $Z=\\dfrac{X-\\mu}{\\sigma}\\sim N(0,1)$，且 $F_X(x)=\\Phi\\!\\left(\\dfrac{x-\\mu}{\\sigma}\\right)$，故一切正态概率都能化成标准正态查表；对称性 $\\Phi(-x)=1-\\Phi(x)$ 由此而来。","ex":"$X\\sim N(70,100)$：$P(X\\le 85)=\\Phi(1.5)=0.9332$；$P(60<X<80)=\\Phi(1)-\\Phi(-1)=0.6826$。"},"bx2":{"def":"正态分布 $N(\\mu,\\sigma^2)$ 的密度关于 $x=\\mu$ 对称，形状由 $\\sigma$ 决定；标准正态分布 $N(0,1)$ 是 $\\mu=0,\\sigma=1$ 的特例，密度与分布函数分别记为 $\\varphi(x)$、$\\Phi(x)$。","diff":"正态有两个自由参数，概率值须先标准化才能查表；标准正态参数固定，$\\Phi$ 已制表且满足 $\\Phi(-x)=1-\\Phi(x)$，任意正态的概率都靠这个变换化为它。","link":"标准化 $Z=\\dfrac{X-\\mu}{\\sigma}\\sim N(0,1)$，且 $F_X(x)=\\Phi\\left(\\dfrac{x-\\mu}{\\sigma}\\right)$；反之 $X=\\mu+\\sigma Z$，正态族正是标准正态的线性变换全体。"}},{"no":21,"star":1,"title":"正态分布 vs 对数正态分布","ch":2,"sections":[{"name":"一句话","body":"$X$ 正态则 $\\mathrm e^X$ 对数正态；反过来也对，但不是同一个分布。"},{"name":"得分点","body":"> 若 $X\\sim N(\\mu,\\sigma^2)$，则 $Y=\\mathrm e^{X}$ 服从对数正态分布，$Y$ 取正值、右偏；若 $Y$ 对数正态，则 $\\ln Y\\sim N(\\mu,\\sigma^2)$。二者区别：正态取值可正可负、对称；对数正态只取正值、右偏。注意 $E(\\mathrm e^X)=\\mathrm e^{\\mu+\\sigma^2/2}$，故 $EY\\neq \\mathrm e^{EX}$，这是常见失分点。应用中描述收入、股价、某些寿命数据时用对数正态，直接对原数据取对数后可用正态方法处理。"},{"name":"钩子","body":"取对数才正态 → 对数正态。"}],"one":"$X$ 正态则 $\\mathrm e^X$ 对数正态；反过来也对，但不是同一个分布。","hook":"取对数才正态 → 对数正态。","bx":{"a":"正态 $N(\\mu,\\sigma^2)$：取值可正可负、关于 $\\mu$ 对称。","b":"对数正态：$\\ln Y\\sim N(\\mu,\\sigma^2)$，即 $Y=e^{X}$，只取正值、右偏。","diff":["取值范围：$\\mathbb R$ / $(0,+\\infty)$；","形态：对称 / 右偏长尾；","$EY=e^{\\mu+\\sigma^2/2}\\neq e^{EX}$。"],"link":"二者通过「取对数」互相转化：$X$ 正态则 $e^X$ 对数正态；$Y$ 对数正态则 $\\ln Y$ 正态。注意变换后期望不等价（$E(e^X)\\neq e^{EX}$）。","ex":"$X\\sim N(0,1)$，$Y=e^X$：$EY=e^{0.5}=1.6487$，而 $e^{EX}=1$——差在方差项上。"},"bx2":{"def":"正态分布 $N(\\mu,\\sigma^2)$ 取值于全直线，密度关于 $\\mu$ 对称；若 $\\ln Y\\sim N(\\mu,\\sigma^2)$，即 $Y=e^{X}$ 且 $X$ 正态，则称 $Y$ 服从对数正态分布。","diff":"正态取值可正可负，密度对称，均值 $EX=\\mu$ 与中位数重合；对数正态只取正值、密度右偏，$EY=e^{\\mu+\\sigma^2/2}$ 大于中位数 $e^{\\mu}$，右尾更厚。","link":"变换 $y=e^{x}$ 单调，故 $X$ 正态与 $\\ln Y$ 正态互相等价，分位数满足 $y_p=e^{x_p}$；但期望不保持，$E(e^{X})=e^{\\mu+\\sigma^2/2}$ 不等于 $e^{EX}$。"}},{"no":22,"star":2,"title":"分位数 vs 中位数 vs 上侧分位数","ch":2,"sections":[{"name":"一句话","body":"分位数是\"累积到 $p$ 的位置\"，中位数是 $p=\\frac12$ 的特例。"},{"name":"得分点","body":"> 设 $0<p<1$，若 $P(X\\le x_p)\\ge p$ 且 $P(X\\ge x_p)\\ge 1-p$，称 $x_p$ 为 $X$ 的 $p$ 分位数（连续型即 $F(x_p)=p$）。$p=1/2$ 时为中位数，它使 $P(X\\le m)\\ge\\frac12$ 且 $P(X\\ge m)\\ge\\frac12$，不受极端值影响，故在偏态数据中比均值稳健。统计推断中常用上侧分位数：$P(X>u_\\alpha)=\\alpha$，例如 $u_{0.025}=1.96$、$u_{0.05}=1.645$；$t$ 分布与 $\\chi^2$ 分布的查表值均以上侧分位数给出。注意对称分布有 $u_\\alpha=-u_{1-\\alpha}$，非对称分布（如 $\\chi^2$、$F$）不能这样换。"},{"name":"钩子","body":"分位数切概率，上分位数切尾巴。"}],"one":"分位数是\"累积到 $p$ 的位置\"，中位数是 $p=\\frac12$ 的特例。","hook":"分位数切概率，上分位数切尾巴。","bx":{"a":"分位数 $x_p$：满足 $F(x_p)=p$（连续型），把概率切成 $p$ 与 $1-p$ 两部分。","b":"上侧分位数 $u_\\alpha$：满足 $P(X>u_\\alpha)=\\alpha$，切的是右尾。","diff":["切法：从左边累积 $p$ / 从右边留 $\\alpha$；","换算：上侧 $u_\\alpha$ = 下侧 $1-\\alpha$ 分位数；","中位数是 $p=\\frac12$ 的分位数，上侧 $\\alpha=0.5$ 时二者重合。"],"link":"三者同属「按概率定位」的一族：中位数是分位数的特例，上侧分位数是分位数的镜像（$u_\\alpha=x_{1-\\alpha}$）；查表时 $u_{0.025}=1.96$、$u_{0.05}=1.645$ 用的都是上侧。","ex":"$X\\sim N(0,1)$：中位数 $0$；$u_{0.025}=1.96$ 满足 $P(X>1.96)=0.025$；$x_{0.975}$ 也是 $1.96$。"},"bx2":{"def":"设 $F$ 为分布函数，满足 $F(x_p)=p$ 的 $x_p$ 称为 $p$ 分位数；$p=\\dfrac12$ 时称中位数；满足 $P(X>u_\\alpha)=\\alpha$ 的 $u_\\alpha$ 称为上侧 $\\alpha$ 分位数。","diff":"分位数自左向右累积概率定位，上侧分位数自右尾留下概率定位，方向相反；中位数只是 $p=\\dfrac12$ 的特例，不独立成类，连续型下三者都唯一确定。","link":"三者同属按概率定位的一族，恒有 $u_\\alpha=x_{1-\\alpha}$；分布关于 $c$ 对称时中位数为 $c$，且 $u_\\alpha$ 与 $x_\\alpha$ 关于 $c$ 对称，如 $u_{0.025}=x_{0.975}=1.96$。"}},{"no":23,"star":2,"title":"随机变量函数的分布：分布函数法 vs 公式法","ch":2,"sections":[{"name":"一句话","body":"分布函数法永远能用；公式法要求单调且可导。"},{"name":"对比表","body":"| 方法 | 适用 | 步骤 |\n|---|---|---|\n| 分布函数法 | 任意 $g$（含非单调） | $F_Y(y)=P(g(X)\\le y)$ → 求导 |\n| 公式法 | $g$ 严格单调、可导 | $f_Y(y)=f_X(h(y))|h'(y)|$，$h=g^{-1}$ |"},{"name":"得分点","body":"> 求 $Y=g(X)$ 的分布，通用方法是分布函数法：先由 $F_Y(y)=P(g(X)\\le y)$ 化为关于 $X$ 的事件，用 $F_X$ 表示，再对 $y$ 求导得密度；该法对非单调 $g$（如 $Y=X^2$）必须分区间讨论。当 $g$ 严格单调且可导时可用公式法 $f_Y(y)=f_X(g^{-1}(y))\\left|\\dfrac{\\mathrm d}{\\mathrm dy}g^{-1}(y)\\right|$，注意雅可比绝对值不可省。易错点：$Y=X^2$ 时 $f_Y(y)=\\dfrac{1}{2\\sqrt y}\\left[f_X(\\sqrt y)+f_X(-\\sqrt y)\\right]$（$y>0$），漏掉一项即错。"},{"name":"钩子","body":"先算 $F$ 再求导，单调才可以直接套。"}],"one":"分布函数法永远能用；公式法要求单调且可导。","hook":"先算 $F$ 再求导，单调才可以直接套。","bx":{"a":"分布函数法：由 $F_Y(y)=P(g(X)\\le y)$ 化为 $X$ 的事件，求出 $F_Y$ 再求导。","b":"公式法：$f_Y(y)=f_X(h(y))\\,|h'(y)|$，$h=g^{-1}$。","diff":["适用：任意 $g$（含非单调、分段）/ 仅 $g$ 严格单调且可导；","工作量：要解不等式 / 直接代公式；","公式法的绝对值不可省。"],"link":"公式法是分布函数法在单调情形下的推论，本质是换元积分；遇到 $Y=X^2$ 这类非单调变换，必须先分区间再用公式法，或直接用分布函数法。","ex":"$X\\sim U(0,1)$，$Y=X^2$：分布函数法得 $F_Y(y)=\\sqrt y$，$f_Y(y)=\\dfrac{1}{2\\sqrt y}$；若用公式法须分 $x>0,x<0$ 两段。"},"bx2":{"def":"求 $Y=g(X)$ 的分布时，先用 $F_Y(y)=P(g(X)\\le y)$ 把事件化为 $X$ 的取值集合、再对 $y$ 求导，称分布函数法；当 $g$ 严格单调可导、反函数为 $h$ 时用 $f_Y(y)=f_X(h(y))|h'(y)|$，称公式法。","diff":"分布函数法对任意 $g$ 适用，含非单调与分段情形，代价是解不等式并讨论 $y$ 的范围；公式法只对严格单调可导的 $g$ 成立，可一步代出，但绝对值不可省，否则出现负密度。","link":"公式法是分布函数法在单调情形下换元求导的结果：$F_Y(y)=P(X\\le h(y))$ 求导即得；$g$ 非单调时须把定义域分成若干单调段，逐段用公式法再把各段密度相加。"}},{"no":24,"star":1,"title":"偏度、峰度、变异系数","ch":2,"sections":[{"name":"得分点","body":"> 变异系数 $C_v=\\dfrac{\\sqrt{D(X)}}{E(X)}$ 是无量纲量，用于比较不同量纲或不同均值水平的离散程度。偏度 $\\beta_s=\\dfrac{E(X-EX)^3}{(DX)^{3/2}}$ 刻画分布的不对称方向：$\\beta_s>0$ 右偏（长尾在右），$\\beta_s=0$ 对称（如正态）；峰度 $\\beta_k=\\dfrac{E(X-EX)^4}{(DX)^2}$ 刻画尾部厚度，正态的峰度为 3，大于 3 称尖峰厚尾。注意：偏度、峰度都依赖 3、4 阶矩存在。"},{"name":"钩子","body":"变异比离散，偏度看歪向，峰度看尾巴。"}],"one":"","hook":"变异比离散，偏度看歪向，峰度看尾巴。","bx":{"a":"偏度 $\\beta_s=\\dfrac{E(X-EX)^3}{(DX)^{3/2}}$：刻画不对称方向，$>0$ 右偏、$=0$ 对称。","b":"峰度 $\\beta_k=\\dfrac{E(X-EX)^4}{(DX)^2}$：刻画尾部厚度，正态为 3，$>3$ 尖峰厚尾。","diff":["用的是 3 阶 / 4 阶中心矩；","解读：歪向哪边 / 尾巴多厚；","另有无量纲的变异系数 $C_v=\\dfrac{\\sqrt{DX}}{EX}$ 专比离散程度。"],"link":"三者都是「形状指标」：均值方差只说位置与分散，偏度峰度补充形状；都要求相应阶矩存在，且都是无量纲量（$C_v$ 用于跨量纲比较离散度）。","ex":"收入数据常见右偏：$\\beta_s\\approx1.5$；正态 $\\beta_k=3$，股票收益常 $\\beta_k>3$（厚尾）。"},"bx2":{"def":"偏度 $\\beta_s=\\dfrac{E(X-EX)^3}{(DX)^{3/2}}$ 度量分布的不对称方向与程度；峰度 $\\beta_k=\\dfrac{E(X-EX)^4}{(DX)^2}$ 度量尾部的厚重；变异系数 $C_v=\\dfrac{\\sqrt{DX}}{EX}$ 度量相对离散程度。","diff":"偏度用三阶中心矩，正态为 $0$，$\\beta_s>0$ 为右偏；峰度用四阶中心矩，正态为 $3$，$\\beta_k>3$ 为尖峰厚尾；变异系数只用一二阶矩，是无量纲比值，可跨量纲比较离散程度。","link":"三者都以矩为基础且无量纲，均值和方差只描述位置与绝对分散，形状信息由偏度峰度补充；三、四阶矩不存在的分布无偏度峰度，$C_v$ 则要求 $EX>0$。"}},{"no":25,"star":3,"title":"联合分布 vs 边际分布","ch":3,"sections":[{"name":"一句话","body":"联合能推出边际，边际推不出联合——同样的边际可以有完全不同的联合。"},{"name":"定义卡","body":"- 联合分布函数：$F(x,y)=P(X\\le x,Y\\le y)$。\n- 边际分布函数：$F_X(x)=F(x,+\\infty)$，$F_Y(y)=F(+\\infty,y)$。"},{"name":"对比表","body":"| 维度 | 联合分布 | 边际分布 |\n|---|---|---|\n| 变量 | 同时刻画 $(X,Y)$ | 只看其中一个 |\n| 信息量 | 大 | 小（是联合的\"投影\"） |\n| 推导方向 | → 边际（唯一） | ✗ 推不出联合 |"},{"name":"例子","body":"设 $(X,Y)$ 在单位正方形上均匀（独立）；另一情形令 $Y=X$（完全相关）。两种情形下 $X,Y$ 的边际都是 $U(0,1)$，但联合分布截然不同。"},{"name":"得分点","body":"> 联合分布完整描述 $(X,Y)$ 的取值规律，边际分布只描述单个分量的规律，可由联合分布对另一变量求和（积分）得到：离散 $p_X(x_i)=\\sum_j p_{ij}$，连续 $f_X(x)=\\int_{-\\infty}^{+\\infty}f(x,y)\\mathrm dy$。反之，仅知道两个边际分布一般无法确定联合分布（除非已知独立），因为联合分布还包含两分量之间的相依信息。只有当 $X,Y$ 独立时，才有 $f(x,y)=f_X(x)f_Y(y)$，此时边际可确定联合。"},{"name":"钩子","body":"联合是全景，边际是单张照片。"}],"one":"联合能推出边际，边际推不出联合——同样的边际可以有完全不同的联合。","hook":"联合是全景，边际是单张照片。","bx":{"a":"联合分布 $F(x,y)=P(X\\le x,Y\\le y)$：同时刻画两个分量的取值规律。","b":"边际分布 $F_X(x)=F(x,+\\infty)$：只看其中一个分量。","diff":["信息量：完整 / 是联合的投影；","推导方向：联合 $\\Rightarrow$ 边际（唯一）/ 边际 $\\nRightarrow$ 联合；","边际相同可以有完全不同的联合。"],"link":"边际由联合求和（积分）得到：$p_{X}(x_i)=\\sum_j p_{ij}$、$f_X(x)=\\int f(x,y)\\mathrm dy$；只有加上独立性 $f(x,y)=f_Xf_Y$，边际才能反推联合。","ex":"单位正方形上均匀分布，两种情形边际都是 $U(0,1)$：一种取 $Y$ 与 $X$ 独立，另一种取 $Y=X$（完全相关），联合截然不同。"},"bx2":{"def":"联合分布 $F(x,y)=P(X\\le x,Y\\le y)$ 给出 $(X,Y)$ 的完整概率规律；边际分布 $F_X(x)=F(x,+\\infty)$ 只给出单个分量的规律，连续型由 $f_X(x)=\\int f(x,y)\\mathrm{d}y$ 得到。","diff":"联合分布含全部信息，边际分布是它沿另一分量的投影，信息严格更少；由联合求边际只需求和或积分且结果唯一，由边际求联合不可能，同一对边际可对应无穷多个联合。","link":"边际由联合求和或积分得到，$p_X(x_i)=\\sum_j p_{ij}$；只有当 $X,Y$ 独立即 $f(x,y)=f_X(x)f_Y(y)$ 时，两个边际才唯一确定联合分布。"}},{"no":26,"star":3,"title":"随机变量独立 vs 不相关","ch":3,"sections":[{"name":"一句话","body":"独立一定不相关，不相关一般推不出独立（二维正态除外）。"},{"name":"定义卡","body":"- 独立：$F(x,y)=F_X(x)F_Y(y)$，或 $f(x,y)=f_X(x)f_Y(y)$，或 $P(X\\in A,Y\\in B)=P(X\\in A)P(Y\\in B)$。\n- 不相关：$\\rho_{XY}=0$，等价于 $\\mathrm{Cov}(X,Y)=0$，等价于 $E(XY)=EX\\cdot EY$。"},{"name":"对比表","body":"| 维度 | 独立 | 不相关 |\n|---|---|---|\n| 刻画 | 分布层面无关 | 线性关系层面无关（仅二阶矩） |\n| 判据 | 联合 = 边际之积 | $\\rho=0$ |\n| 蕴含 | 独立 ⟹ 不相关 | 不相关 ⇏ 独立 |\n| 例外 | — | 二维正态下二者等价 |"},{"name":"例子","body":"设 $X\\sim U(-1,1)$，$Y=X^2$。则 $E(XY)=E(X^3)=0=EX\\cdot EY$，故不相关；但 $Y$ 完全由 $X$ 决定，显然不独立。"},{"name":"得分点","body":"> 独立是分布层面的概念，要求联合分布等于边际分布之积，等价于对任意 $A,B$ 有 $P(X\\in A,Y\\in B)=P(X\\in A)P(Y\\in B)$；不相关只要求二阶矩意义下无线性关系，即 $\\mathrm{Cov}(X,Y)=0$。若 $X,Y$ 独立且期望存在，则 $\\mathrm{Cov}(X,Y)=0$，故独立必不相关；反之不成立，反例可取 $X\\sim U(-1,1),Y=X^2$。特别地，当 $(X,Y)$ 服从二维正态分布时，独立与不相关等价，这是唯一常用的充分条件。"},{"name":"钩子","body":"独立管全部，不相关只管线性。"}],"one":"独立一定不相关，不相关一般推不出独立（二维正态除外）。","hook":"独立管全部，不相关只管线性。","bx":{"a":"独立：$F(x,y)=F
