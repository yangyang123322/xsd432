信区间用 $\\chi^2$ 分布，上下限分别除以 $\\chi^2_{\\alpha/2}$ 和 $\\chi^2_{1-\\alpha/2}$（注意上下限反转）；","均值检验用 $t$ 分布（$\\sigma$ 未知），$T=(\\bar{x}-\\mu_0)/(s/\\sqrt{n})$；","$s/\\sqrt{n}=11.7/3=3.9$；","结论\"不拒绝 $H_0$\"而非\"接受 $H_0$\"。"],"ext":["考纲定位：正态总体的区间估计与假设检验是每年必考综合题，通常方差区间+均值检验组合；","命题延伸方向：$\\mu$ 的置信区间、$\\sigma$ 的置信区间（开平方）、单侧检验。"],"kps":["区间估计","抽样分布与三大分布构造","数字特征与矩"],"pts":20},{"year":2022,"no":1,"type":"名词解释","stem":"简述经验分布函数的定义。","sol":"设 $X_1,\\ldots,X_n$ 为样本，排序 $x_{(1)}\\leq\\cdots\\leq x_{(n)}$，经验分布函数 $F_n(x)=$（样本中 $\\leq x$ 的个数）$/n$，是阶梯函数。性质：单调不减、右连续、$0\\leq F_n\\leq 1$。当 $n\\to\\infty$ 时，$F_n(x)$ 一致收敛于总体分布函数 $F(x)$（格里汶科定理）。$F_n$ 是 $F$ 的相合估计。","traps":["分段定义中边界点的处理；","与分布函数 $F(x)$ 的区别（理论 vs 样本）。"],"ext":[],"kps":["经验分布函数","分布函数与分布列"],"pts":6},{"year":2022,"no":2,"type":"名词解释","stem":"简述概率的公理化定义。","sol":"设 $\\Omega$ 为样本空间，$\\mathscr{F}$ 为事件域（$\\sigma$-代数），定义在 $\\mathscr{F}$ 上的实值函数 $P(\\cdot)$ 若满足：① 非负性：对任意 $A\\in\\mathscr{F}$，$P(A)\\geq 0$；② 规范性：$P(\\Omega)=1$；③ 可列可加性：对两两互不相容的可列事件 $A_1,A_2,\\ldots$，$P(\\bigcup A_i)=\\sum P(A_i)$。则称 $P$ 为概率，$(\\Omega,\\mathscr{F},P)$ 为概率空间。","traps":["三条公理缺一不可；","可列可加性（不是有限可加性）是核心。"],"ext":[],"kps":["事件关系与概率性质"],"pts":6},{"year":2022,"no":3,"type":"名词解释","stem":"简述点估计有效性的定义。","sol":"设 $\\hat{\\theta}_1,\\ \\hat{\\theta}_2$ 都是 $\\theta$ 的无偏估计，若 $\\mathrm{Var}(\\hat{\\theta}_1)\\leq\\mathrm{Var}(\\hat{\\theta}_2)$ 对所有 $\\theta$ 成立，则称 $\\hat{\\theta}_1$ 比 $\\hat{\\theta}_2$ 有效。若 $\\hat{\\theta}$ 的方差达到 Cramér-Rao 下界（正则条件下 $\\mathrm{CRLB}=1/[nI(\\theta)]$），则称 $\\hat{\\theta}$ 为有效估计。有效估计一定是 MVUE。","traps":["有效性比较的前提是无偏性；","CRLB 公式中 Fisher 信息量的定义。"],"ext":[],"kps":["有效性与 C-R 下界"],"pts":6},{"year":2022,"no":4,"type":"名词解释","stem":"简述点估计无偏性的定义。","sol":"设 $\\hat{\\theta}=\\hat{\\theta}(X_1,\\ldots,X_n)$ 是 $\\theta$ 的估计量，若 $E(\\hat{\\theta})=\\theta$ 对所有 $\\theta\\in\\Theta$ 成立，则称 $\\hat{\\theta}$ 为 $\\theta$ 的无偏估计。偏差 $b(\\hat{\\theta})=E(\\hat{\\theta})-\\theta$，无偏即偏差为 $0$。无偏性是对估计量的有限样本性质要求，意味着大量重复抽样下估计量的平均值等于真值。","traps":["无偏性要求对所有 $\\theta$ 成立，不是某个特定 $\\theta$；","无偏估计不一定存在（如 $1/p$ 在二项分布下）。"],"ext":[],"kps":["无偏性"],"pts":6},{"year":2022,"no":5,"type":"名词解释","stem":"简述离散型随机变量的分布列、均值与分布函数。","sol":"离散型随机变量 $X$ 的可能取值为有限个或可列个 $x_i$，分布列 $P(X=x_i)=p_i$，满足 $p_i\\geq 0,\\ \\sum p_i=1$。均值（数学期望）$E(X)=\\sum x_i p_i$（要求绝对收敛 $\\sum |x_i|p_i<\\infty$）。分布函数 $F(x)=P(X\\leq x)=\\sum_{x_i\\leq x} p_i$，是阶梯函数，在 $x_i$ 处有跳跃 $p_i$。","traps":["期望存在要求绝对收敛；","分布函数是右连续的阶梯函数。"],"ext":[],"kps":["分布函数与分布列","数字特征与矩"],"pts":6},{"year":2022,"no":1,"type":"填空","stem":"给出 $P(A\\cup B)$，$P(A)$ 的值，不相容求 $P(B)$，独立求 $P(B)$。","sol":"设 $P(A\\cup B)=a,\\ P(A)=b$。\n\n- 不相容（$AB=\\varnothing$）：$P(A\\cup B)=P(A)+P(B)\\Rightarrow P(B)=a-b$。\n- 独立：$P(A\\cup B)=P(A)+P(B)-P(A)P(B)\\Rightarrow a=b+P(B)-b\\cdot P(B)\\Rightarrow P(B)(1-b)=a-b\\Rightarrow P(B)=\\dfrac{a-b}{1-b}$。\n\n**考点：** 加法公式在不相容和独立两种情形下的应用。","traps":["独立时 $P(AB)=P(A)P(B)\\neq 0$，不能用不相容公式。"],"ext":[],"kps":["事件关系与概率性质"],"pts":6},{"year":2022,"no":2,"type":"填空","stem":"给出一个 $x$ 的正态分布，求 $\\bar{X}$ 的分布及其参数，求 $\\sum X_i^2$ 的分布及其参数。","sol":"设 $X_1,\\ldots,X_n$ i.i.d. $N(\\mu,\\sigma^2)$。\n\n- $\\bar{X}\\sim N(\\mu,\\ \\sigma^2/n)$。\n- $\\sum (X_i-\\mu)^2/\\sigma^2\\sim\\chi^2(n)$；若 $\\mu$ 未知用 $\\bar{X}$ 代替，则 $\\sum (X_i-\\bar{X})^2/\\sigma^2\\sim\\chi^2(n-1)$。\n- 若题目问 $\\sum X_i^2$ 的分布：当 $\\mu=0$ 时 $\\sum X_i^2/\\sigma^2\\sim\\chi^2(n)$；当 $\\mu\\neq 0$ 时 $\\sum X_i^2/\\sigma^2\\sim\\chi^2(n,\\delta)$（非中心卡方，非中心参数 $\\delta=n\\mu^2/\\sigma^2$）。\n\n**考点：** 正态样本的抽样分布。","traps":["$\\mu$ 是否为 $0$ 影响 $\\sum X_i^2$ 的分布类型（中心 vs 非中心卡方）。"],"ext":[],"kps":["连续型密度与常见分布","抽样分布与三大分布构造","总体与样本、统计量"],"pts":6},{"year":2022,"no":3,"type":"填空","stem":"二项分布。","sol":"二项分布 $X\\sim b(n,p)$：\n\n$$P(X=k)=\\binom{n}{k}p^k(1-p)^{n-k},$$\n\n$E(X)=np$，$\\mathrm{Var}(X)=np(1-p)$。可考察：求概率、求期望方差、由 $E(X)$ 和 $\\mathrm{Var}(X)$ 反求 $n,p$、泊松近似或正态近似。\n\n**考点：** 二项分布的定义与数字特征。","traps":[],"ext":[],"kps":["常见离散分布"],"pts":6},{"year":2022,"no":1,"type":"计算","stem":"置信区间","sol":"正态总体均值 $\\mu$ 的置信区间（$\\sigma$ 已知用 $Z$，$\\sigma$ 未知用 $t$）、方差 $\\sigma^2$ 的置信区间（$\\chi^2$）。典型考法：给定样本均值、样本标准差、样本量、置信水平，求 $\\mu$ 或 $\\sigma^2$ 的置信区间。","traps":["$\\sigma$ 已知 vs 未知选择不同分布；自由度 $n-1$；分位数的选择（双侧用 $\\alpha/2$）。"],"ext":[],"kps":["区间估计"],"pts":15},{"year":2022,"no":2,"type":"计算","stem":"边缘密度函数、分布函数、独立性判断","sol":"给定二维联合密度 $f(x,y)$，求 $f_X(x), f_Y(y)$，联合分布函数 $F(x,y)$，判断 $X,Y$ 是否独立（$f(x,y)=f_X(x)f_Y(y)$？）。","traps":["积分限的确定（尤其非矩形区域）；独立性验证需对所有 $x,y$ 成立。"],"ext":[],"kps":["分布函数与分布列","连续型密度与常见分布","事件独立性","联合分布与边际分布"],"pts":15},{"year":2022,"no":3,"type":"计算","stem":"极大似然估计","sol":"给定含未知参数的密度或分布列，构造似然函数、取对数、求导、解似然方程，得到 MLE。可能涉及单参数或双参数。","traps":["似然函数连乘的指数处理；对数似然求导；似然方程无解时的边界 MLE（如均匀分布）。"],"ext":[],"kps":["极大似然估计"],"pts":15},{"year":2022,"no":4,"type":"计算","stem":"根据 $X,Y$ 的关系，写出 $Y$ 的概率密度","sol":"已知 $X$ 的分布和 $Y=g(X)$ 的函数关系，求 $Y$ 的密度。用分布函数法或单调函数公式法。可能涉及二维变换（已知 $(X,Y)$ 的联合分布，求 $Z=g(X,Y)$ 的密度）。","traps":["非单调函数需分区间；雅可比行列式的计算；积分限的确定。"],"ext":[],"kps":["随机变量函数的分布"],"pts":15},{"year":2022,"no":5,"type":"计算","stem":"概率问题","sol":"典型考法包括全概率公式、贝叶斯公式、古典概型、几何概型、条件概率。可能结合摸球、产品抽检、射击等场景。","traps":["全概率公式中划分的完备性；贝叶斯公式中分母的计算；条件概率的方向。"],"ext":[],"kps":["全概率与贝叶斯"],"pts":15},{"year":2022,"no":6,"type":"计算","stem":"求期望","sol":"典型考法包括一维/二维随机变量的期望、随机变量函数的期望、指示变量法求期望（如配对问题、空盒问题）、利用期望的线性性质。","traps":["$E[g(X)]=\\int g(x)f(x)\\,\\mathrm{d}x$ 而非 $g(E(X))$；二维期望的二重积分；指示变量的引入。 ## 2022 年整卷命题总评 **说明**：2022 年回忆版题目严重不完整（填空题 2 题缺失、计算题仅保留考点主题），以下总评基于可辨识的考点结构。 **知识点覆盖率**：可辨识考点覆盖概率论基础（概率运算、离散变量、随机变量函数、期望）约 40%，数理统计（经验分布函数、点估计评价、置信区间、MLE、抽样分布）约 60%。 **题型结构**：名词解释 5 题 30 分（偏重概念），填空题 5 题 30 分，计算题 6 题 90 分。名词解释占比 20%，高于其他年份，体现 2022 年对基础概念的重视。 **命题偏好**：","名词解释集中于数理统计基础概念（经验分布函数、无偏性、有效性）和概率论基础（公理化、离散变量）；","计算题考点与其他年份高度一致：置信区间、二维联合密度、MLE、随机变量函数分布、概率计算、期望——这六大考点是西北大学 432 的稳定核心；","填空题考察概率运算在不相容/独立下的对比、正态样本抽样分布，是常规考法。 **备考启示**：尽管回忆版不完整，但考点结构与 2023—2026 年高度一致，说明西北大学 432 命题风格稳定，六大计算考点（置信区间、二维密度、MLE、变量函数分布、概率、期望）是必备考内容。 ---"],"ext":[],"kps":["数字特征与矩"],"pts":15},{"year":2021,"no":1,"type":"填空","stem":"$A,B$ 独立，$P(B)=0.5$，$P(A-B)=0.3$，则 $P(B-A)=$____。","sol":"$A-B=A\\cap\\bar B$，独立时 $P(A-B)=P(A)P(\\bar B)=P(A)(1-0.5)=0.5P(A)=0.3$，故 $P(A)=0.6$。$P(B-A)=P(B)P(\\bar A)=0.5\\times(1-0.6)=0.2$。\n\n**考点**：独立事件的差事件概率。","traps":[],"ext":[],"kps":["事件独立性","事件关系与概率性质"],"pts":5},{"year":2021,"no":2,"type":"填空","stem":"$X\\sim N(1,\\sigma^2)$，$P(0<X<1)=0.2$，则 $P(X>0)=$____。","sol":"$X\\sim N(1,\\sigma^2)$ 关于 $\\mu=1$ 对称。$P(0<X<1)=P(1<X<2)=0.2$（$0$ 和 $2$ 关于 $1$ 对称）。$P(X>1)=0.5$，故 $P(X>0)=P(0<X<1)+P(X\\geq 1)=0.2+0.5=0.7$。\n\n**考点**：正态分布的对称性。","traps":[],"ext":[],"kps":["连续型密度与常见分布"],"pts":5},{"year":2021,"no":3,"type":"填空","stem":"$X\\sim P(\\lambda)$，$Y=2X+3$，则 $E(Y)=$____，$\\mathrm{Var}(Y)=$____。","sol":"$E(X)=\\lambda$，$\\mathrm{Var}(X)=\\lambda$。$E(Y)=2E(X)+3=2\\lambda+3$。$\\mathrm{Var}(Y)=4\\mathrm{Var}(X)=4\\lambda$。\n\n**考点**：泊松分布的数字特征、线性变换的期望方差。","traps":[],"ext":[],"kps":["常见离散分布","数字特征与矩"],"pts":5},{"year":2021,"no":4,"type":"填空","stem":"泊松分布的特征方程____。","sol":"泊松分布 $X\\sim P(\\lambda)$ 的特征函数 $\\varphi_X(t)=E(e^{itX})=\\exp[\\lambda(e^{it}-1)]$。（回忆版\"特征方程\"应为\"特征函数\"。）\n\n**考点**：特征函数的定义与计算。","traps":[],"ext":[],"kps":["特征函数","常见离散分布"],"pts":5},{"year":2021,"no":5,"type":"填空","stem":"评价估计量的标准____、____、____。","sol":"无偏性、有效性、相合性（一致性）。\n\n**考点**：点估计的三大评价标准。","traps":[],"ext":[],"kps":["估计量评价标准"],"pts":5},{"year":2021,"no":6,"type":"填空","stem":"$X_1,\\ldots,X_n$ 为总体 $X$ 的样本，$X\\sim U(\\theta,\\theta+1)$，则矩估计量是____，最大似然估计量是____。","sol":"$$E(X)=\\dfrac{\\theta+(\\theta+1)}{2}=\\theta+\\dfrac{1}{2}.$$\n\n令 $E(X)=\\bar X$，则 $\\hat\\theta_M=\\bar X-\\dfrac{1}{2}$。\n\nMLE：似然 $L=1$（当 $\\theta\\leq x_i\\leq\\theta+1$ 对所有 $i$，即 $\\theta\\leq x_{(1)}$ 且 $\\theta\\geq x_{(n)}-1$），$L$ 在 $\\theta\\in[x_{(n)}-1,\\,x_{(1)}]$ 上恒为 $1$，故 MLE 不唯一，区间 $[X_{(n)}-1,\\,X_{(1)}]$ 内任意值都是 MLE。通常取 $\\hat\\theta_{\\mathrm{MLE}}=X_{(1)}$（或 $X_{(n)}-1$，或区间内任意值）。\n\n**考点**：均匀分布的矩估计与 MLE（MLE 不唯一的情形）。","traps":[],"ext":[],"kps":["极大似然估计","连续型密度与常见分布","估计量评价标准","矩估计","总体与样本、统计量"],"pts":5},{"year":2021,"no":1,"type":"名词解释","stem":"条件概率","sol":"$P(A\\mid B)=\\dfrac{P(AB)}{P(B)}$（$P(B)>0$），表示在 $B$ 发生条件下 $A$ 发生的概率。性质：非负、规范、可列可加。乘法公式 $P(AB)=P(A\\mid B)P(B)$。","traps":[],"ext":[],"kps":["条件概率与乘法公式"],"pts":5},{"year":2021,"no":2,"type":"名词解释","stem":"切比雪夫不等式","sol":"对任意 $\\varepsilon>0$，$P(|X-E(X)|\\geq\\varepsilon)\\leq\\dfrac{\\mathrm{Var}(X)}{\\varepsilon^2}$。意义：不需要知道分布具体形式，仅用期望和方差即可估计概率上界。是证明相合性的重要工具。","traps":[],"ext":[],"kps":["切比雪夫不等式"],"pts":5},{"year":2021,"no":3,"type":"名词解释","stem":"统计量","sol":"样本 $X_1,\\ldots,X_n$ 的函数 $T=T(X_1,\\ldots,X_n)$，不含任何未知参数。统计量是随机变量，其分布称为抽样分布。常见统计量：样本均值、样本方差、次序统计量等。","traps":[],"ext":[],"kps":["总体与样本、统计量"],"pts":5},{"year":2021,"no":4,"type":"名词解释","stem":"样本方差","sol":"$S^2=\\dfrac{1}{n-1}\\sum_{i=1}^n(X_i-\\bar X)^2$，是总体方差 $\\sigma^2$ 的无偏估计。除以 $n-1$（自由度）而非 $n$，是为了修正偏差。注意与样本二阶中心矩 $S_n^2=\\dfrac{1}{n}\\sum_{i=1}^n(X_i-\\bar X)^2$ 的区别。","traps":[],"ext":[],"kps":["总体与样本、统计量","数字特征与矩"],"pts":5},{"year":2021,"no":5,"type":"名词解释","stem":"估计量","sol":"用来估计未知参数 $\\theta$ 的统计量 $\\hat\\theta=\\hat\\theta(X_1,\\ldots,X_n)$。估计量是随机变量（依赖样本），其具体取值称为估计值。评价标准：无偏性、有效性、相合性。","traps":[],"ext":[],"kps":["估计量评价标准"],"pts":5},{"year":2021,"no":6,"type":"名词解释","stem":"第一类错误","sol":"原假设 $H_0$ 为真时拒绝 $H_0$ 的错误，又称弃真错误。其概率 $P(\\text{拒绝 }H_0\\mid H_0\\text{ 真})=\\alpha$，即显著性水平。与第二类错误（取伪，$\\beta$）此消彼长，同时减小需增大样本量。","traps":[],"ext":[],"kps":["两类错误与功效"],"pts":5},{"year":2021,"no":1,"type":"计算","stem":"$P(\\bar A)=0.5$，$P(B)=0.4$，$P(A\\bar B)=0.3$，求 $P(B\\mid A\\cup\\bar B)$。","sol":"$$P(A)=1-P(\\bar A)=0.5.$$\n\n$$P(A\\bar B)=P(A)-P(AB)=0.3 \\;\\Rightarrow\\; P(AB)=0.5-0.3=0.2.$$\n\n$$P(A\\cup\\bar B)=P(A)+P(\\bar B)-P(A\\bar B)=0.5+(1-0.4)-0.3=0.5+0.6-0.3=0.8.$$\n\n$$P\\bigl(B\\cap(A\\cup\\bar B)\\bigr)=P(BA\\cup B\\bar B)=P(AB\\cup\\varnothing)=P(AB)=0.2.$$\n\n$$P(B\\mid A\\cup\\bar B)=\\dfrac{P(B\\cap(A\\cup\\bar B))}{P(A\\cup\\bar B)}=\\dfrac{0.2}{0.8}=0.25.$$","traps":["$P(A\\bar B)=P(A)-P(AB)$，反求 $P(AB)$；","$B\\cap(A\\cup\\bar B)=AB$（因为 $B\\cap\\bar B=\\varnothing$）；","$P(A\\cup\\bar B)$ 用加法公式。"],"ext":["考纲定位：条件概率与事件运算是填空题/计算题基础考点；","命题延伸方向：贝叶斯公式、全概率公式的综合应用。"],"kps":["事件关系与概率性质","条件概率与乘法公式"],"pts":15},{"year":2021,"no":2,"type":"计算","stem":"已知 $f(x,y)=\\begin{cases}ke^{-(5x+6y)}, & x>0,\\ y>0;\\\\ 0, & \\text{其他}.\\end{cases}$（1）求 $k$；（2）求联合分布函数 $F(x,y)$。","sol":"（1）归一化：\n\n$$\\int_0^\\infty\\int_0^\\infty k\\,e^{-5x-6y}\\,dx\\,dy=k\\cdot\\dfrac{1}{5}\\cdot\\dfrac{1}{6}=\\dfrac{k}{30}=1 \\;\\Rightarrow\\; k=30.$$\n\n（2）\n\n$$F(x,y)=P(X\\leq x,Y\\leq y)=\\int_0^x\\int_0^y 30e^{-5u-6v}\\,dv\\,du$$\n\n$$=30\\int_0^x e^{-5u}\\,du\\cdot\\int_0^y e^{-6v}\\,dv=30\\cdot\\dfrac{1-e^{-5x}}{5}\\cdot\\dfrac{1-e^{-6y}}{6}$$\n\n$$=(1-e^{-5x})(1-e^{-6y}),\\quad x>0,\\ y>0.$$\n\n其他区域 $F(x,y)=0$（$x\\leq 0$ 或 $y\\leq 0$）。\n\n可见 $f(x,y)=5e^{-5x}\\cdot 6e^{-6y}$，$X\\sim \\mathrm{Exp}(5)$，$Y\\sim \\mathrm{Exp}(6)$，独立。","traps":["归一化积分可分离：$\\int e^{-5x}\\,dx=\\dfrac{1}{5}$，$\\int e^{-6y}\\,dy=\\dfrac{1}{6}$；","联合分布函数是二重积分，注意积分限；","$F(x,y)$ 在 $x>0,\\ y>0$ 时为 $(1-e^{-5x})(1-e^{-6y})$。"],"ext":["考纲定位：二维指数型联合密度是常规计算题，可分离变量意味着独立；","命题延伸方向：求边际密度、判断独立性、求 $Z=X+Y$ 的密度。"],"kps":["联合分布与边际分布","分布函数与分布列"],"pts":15},{"year":2021,"no":3,"type":"计算","stem":"已知 $X\\sim U(0,1)$，$f_{Y\\mid X}(y\\mid x)=\\begin{cases}x, & 0<y<1/x;\\\\ 0, & \\text{其他}.\\end{cases}$（1）求 $f(x,y)$；（2）求 $P(X>Y)$。","sol":"（1）$f_X(x)=1$，$0<x<1$。\n\n$$f(x,y)=f_X(x)\\cdot f_{Y\\mid X}(y\\mid x)=1\\cdot x=x,\\quad 0<x<1,\\ 0<y<1/x.$$\n\n验证归一化：\n\n$$\\int_0^1\\int_0^{1/x} x\\,dy\\,dx=\\int_0^1 x\\cdot\\dfrac{1}{x}\\,dx=\\int_0^1 1\\,dx=1.\\quad\\checkmark$$\n\n（2）$P(X>Y)=\\iint_{x>y} f(x,y)\\,dx\\,dy$。区域：$0<x<1$，$0<y<\\min(x,1/x)$。因 $0<x<1$ 时 $1/x>1>x$，故 $\\min(x,1/x)=x$。\n\n$$P(X>Y)=\\int_0^1\\int_0^x x\\,dy\\,dx=\\int_0^1 x^2\\,dx=\\dfrac{1}{3}.$$","traps":["联合密度 $f(x,y)=f_X(x)f_{Y\\mid X}(y\\mid x)$，不是 $f_{Y\\mid X}$ 单独；","条件密度的归一化：$\\int_0^{1/x} x\\,dy=x\\cdot\\dfrac{1}{x}=1$，对每个 $x$ 都归一化；","$P(X>Y)$ 的积分区域：$y<x$，且 $0<x<1$，因 $1/x>x$ 在 $0<x<1$ 时恒成立；","积分 $\\int_0^1 x^2\\,dx=\\dfrac{1}{3}$。"],"ext":["考纲定位：条件密度与联合密度的转换是多维随机变量的重要考点，西北大学偏好考察给定条件密度求联合密度的题型；","命题延伸方向：求 $f_Y(y)$（边际密度）、求 $f_{X\\mid Y}(x\\mid y)$、判断独立性。"],"kps":["联合分布与边际分布","条件分布与条件密度"],"pts":15},{"year":2021,"no":4,"type":"计算","stem":"已知 $f(x,y)=\\begin{cases}\\dfrac{3}{2x^3y^2}, & x>1,\\ 1/x<y<x;\\\\ 0, & \\text{其他}.\\end{cases}$ 求 $E(Y)$，$E\\!\\left(\\dfrac{1}{XY}\\right)$。","sol":"先验证归一化：\n\n$$\\int_1^\\infty\\int_{1/x}^x \\dfrac{3}{2x^3y^2}\\,dy\\,dx=\\int_1^\\infty \\dfrac{3}{2x^3}\\cdot\\left[-\\dfrac{1}{y}\\right]_{1/x}^x dx=\\int_1^\\infty \\dfrac{3}{2x^3}\\left(x-\\dfrac{1}{x}\\right)dx$$\n\n$$=\\int_1^\\infty \\dfrac{3(x^2-1)}{2x^4}\\,dx=\\dfrac{3}{2}\\int_1^\\infty\\left(\\dfrac{1}{x^2}-\\dfrac{1}{x^4}\\right)dx=\\dfrac{3}{2}\\left(1-\\dfrac{1}{3}\\right)=1.\\quad\\checkmark$$\n\n$$E(Y)=\\int_1^\\infty\\int_{1/x}^x y\\cdot\\dfrac{3}{2x^3y^2}\\,dy\\,dx=\\int_1^\\infty \\dfrac{3}{2x^3}\\int_{1/x}^x \\dfrac{1}{y}\\,dy\\,dx$$\n\n$$=\\int_1^\\infty \\dfrac{3}{2x^3}\\bigl(\\ln x-\\ln(1/x)\\bigr)dx=\\int_1^\\infty \\dfrac{3}{2x^3}\\cdot 2\\ln x\\,dx=3\\int_1^\\infty \\dfrac{\\ln x}{x^3}\\,dx.$$\n\n分部积分：$u=\\ln x$，$dv=x^{-3}dx$，则 $du=\\dfrac{1}{x}dx$，$v=-\\dfrac{1}{2x^2}$。\n\n$$=3\\left[-\\dfrac{\\ln x}{2x^2}\\Big|_1^\\infty+\\int_1^\\infty \\dfrac{1}{2x^3}\\,dx\\right]=3\\left[0+\\dfrac{1}{4}\\right]=\\dfrac{3}{4}.$$\n\n$$E\\!\\left(\\dfrac{1}{XY}\\right)=\\int_1^\\infty\\int_{1/x}^x \\dfrac{1}{xy}\\cdot\\dfrac{3}{2x^3y^2}\\,dy\\,dx=\\int_1^\\infty \\dfrac{3}{2x^4}\\int_{1/x}^x y^{-3}\\,dy\\,dx$$\n\n$$=\\int_1^\\infty \\dfrac{3}{2x^4}\\cdot\\left[-\\dfrac{1}{2y^2}\\right]_{1/x}^x dx=\\int_1^\\infty \\dfrac{3}{2x^4}\\left(\\dfrac{x^2}{2}-\\dfrac{1}{2x^2}\\right)dx$$\n\n$$=\\dfrac{3}{4}\\int_1^\\infty\\left(\\dfrac{1}{x^2}-\\dfrac{1}{x^6}\\right)dx=\\dfrac{3}{4}\\left(1-\\dfrac{1}{5}\\right)=\\dfrac{3}{4}\\cdot\\dfrac{4}{5}=\\dfrac{3}{5}.$$","traps":["$E(Y)$ 的积分中 $y\\cdot f(x,y)=y\\cdot\\dfrac{3}{2x^3y^2}=\\dfrac{3}{2x^3y}$，对 $y$ 积分得 $\\ln x$ 的差；","$\\ln x-\\ln(1/x)=2\\ln x$；","分部积分 $\\int\\dfrac{\\ln x}{x^3}\\,dx=\\dfrac{1}{4}$；","$E\\!\\left(\\dfrac{1}{XY}\\right)$ 中 $\\dfrac{1}{xy}\\cdot\\dfrac{3}{2x^3y^2}=\\dfrac{3}{2x^4y^3}$，对 $y$ 积分；","积分区域 $1/x<y<x$，$x>1$。"],"ext":["考纲定位：二维随机变量函数的期望是数字特征板块的计算题，积分计算量大，区分度高；","命题延伸方向：求 $E(X)$、$\\mathrm{Cov}(X,Y)$、相关系数。"],"kps":["随机变量函数的分布","连续型密度与常见分布","数字特征与矩"],"pts":15},{"year":2021,"no":5,"type":"计算","stem":"已知 $E(X)=\\mu$，$\\mathrm{Var}(X)=\\sigma^2$，当 $c$ 为何值时，$\\bar X^2-c\\sum_{i=1}^{n-1}(X_{i+1}-X_i)^2$ 为 $\\mu^2$ 的无偏估计。","sol":"设 $T=\\bar X^2-c\\sum_{i=1}^{n-1}(X_{i+1}-X_i)^2$。要求 $E(T)=\\mu^2$。\n\n$$E(\\bar X^2)=\\mathrm{Var}(\\bar X)+[E(\\bar X)]^2=\\dfrac{\\sigma^2}{n}+\\mu^2.$$\n\n$$E\\bigl[(X_{i+1}-X_i)^2\\bigr]=\\mathrm{Var}(X_{i+1}-X_i)+[E(X_{i+1}-X_i)]^2=2\\sigma^2+0=2\\sigma^2$$\n\n（独立同分布）。\n\n$$E\\left[\\sum_{i=1}^{n-1}(X_{i+1}-X_i)^2\\right]=(n-1)\\cdot 2\\sigma^2=2(n-1)\\sigma^2.$$\n\n$$E(T)=\\dfrac{\\sigma^2}{n}+\\mu^2-c\\cdot 2(n-1)\\sigma^2=\\mu^2.$$\n\n$$\\dfrac{\\sigma^2}{n}-2c(n-1)\\sigma^2=0 \\;\\Rightarrow\\; c=\\dfrac{1}{2n(n-1)}.$$","traps":["$E(\\bar X^2)=\\mathrm{Var}(\\bar X)+[E(\\bar X)]^2=\\dfrac{\\sigma^2}{n}+\\mu^2$，考生易漏掉 $\\dfrac{\\sigma^2}{n}$；","$E\\bigl[(X_{i+1}-X_i)^2\\bigr]=2\\sigma^2$（因独立，方差差为 $2\\sigma^2$，期望差为 $0$）；","求和有 $n-1$ 项；","解方程 $c=\\dfrac{1}{2n(n-1)}$。"],"ext":["考纲定位：构造无偏估计是参数估计评价标准的应用考点，西北大学偏好考察含差分或样本均值平方的无偏估计构造；","命题延伸方向：构造 $\\sigma^2$ 的无偏估计、构造 $\\mu^2$ 的其他无偏估计、比较不同无偏估计的有效性。"],"kps":["无偏性","数字特征与矩","总体与样本、统计量"],"pts":15},{"year":2021,"no":6,"type":"计算","stem":"已知 $f(x;\\theta)=\\begin{cases}\\dfrac{\\theta^2}{x^3}e^{-\\theta/x}, & x>0;\\\\ 0, & \\text{其他}.\\end{cases}$（1）求矩估计量；（2）求最大似然估计量。","sol":"$f(x;\\theta)=\\theta^2 x^{-3}e^{-\\theta/x}$，$x>0$。这是逆 Gamma 分布（形状参数 $\\alpha=2$，尺度参数 $\\theta$）。\n\n（1）矩估计：\n\n$$E(X)=\\int_0^\\infty x\\cdot\\theta^2 x^{-3}e^{-\\theta/x}\\,dx=\\theta^2\\int_0^\\infty x^{-2}e^{-\\theta/x}\\,dx.$$\n\n令 $t=\\theta/x$，$x=\\theta/t$，$dx=-\\theta/t^2\\,dt$：\n\n$$=\\theta^2\\int_\\infty^0 \\dfrac{t^2}{\\theta^2}e^{-t}\\cdot\\left(-\\dfrac{\\theta}{t^2}\\right)dt=\\theta\\int_0^\\infty e^{-t}\\,dt=\\theta.$$\n\n（或直接利用逆 Gamma$(\\alpha,\\theta)$ 的均值为 $\\dfrac{\\theta}{\\alpha-1}=\\dfrac{\\theta}{2-1}=\\theta$。）\n\n令 $E(X)=\\bar X$，则 $\\hat\\theta_M=\\bar X$。\n\n（2）MLE：\n\n$$L(\\theta)=\\prod_{i=1}^n \\theta^2 x_i^{-3}e^{-\\theta/x_i}=\\theta^{2n}\\left(\\prod_{i=1}^n x_i\\right)^{-3}\\exp\\left(-\\theta\\sum_{i=1}^n\\dfrac{1}{x_i}\\right).$$\n\n$$\\ln L=2n\\ln\\theta-3\\sum_{i=1}^n\\ln x_i-\\theta\\sum_{i=1}^n\\dfrac{1}{x_i}.$$\n\n$$\\dfrac{\\mathrm{d}\\ln L}{\\mathrm{d}\\theta}=\\dfrac{2n}{\\theta}-\\sum_{i=1}^n\\dfrac{1}{x_i}=0 \\;\\Rightarrow\\; \\hat\\theta_{\\mathrm{MLE}}=\\dfrac{2n}{\\sum 1/X_i}=\\dfrac{2}{\\frac{1}{n}\\sum 1/X_i}$$\n\n（调和均值的 2 倍）。","traps":["$E(X)=\\theta$（逆 Gamma$(2,\\theta)$ 的均值），需通过变量代换积分或识别分布；","矩估计 $\\hat\\theta=\\bar X$（简单，但需先算出 $E(X)=\\theta$）；","MLE 中似然函数的指数部分为 $-\\theta\\sum 1/x_i$；","求导 $\\dfrac{2n}{\\theta}-\\sum\\dfrac{1}{x_i}=0 \\Rightarrow \\theta=\\dfrac{2n}{\\sum 1/x_i}$；","结果是调和均值的 2 倍，不是算术均值。"],"ext":["考纲定位：非标准分布（逆 Gamma、Pareto 等）的点估计是西北大学偏好的难点考点，需考生具备积分计算和分布识别能力；","命题延伸方向：求 $E(X^2)$ 和 $\\mathrm{Var}(X)$、判断估计量的无偏性和相合性、与 Gamma 分布通过倒数变换联系。"],"kps":["极大似然估计","矩估计","估计量评价标准"],"pts":15},{"year":2020,"no":1,"type":"填空","stem":"$P(A)=0.5$，$P(B)=0.6$，$P(B\\mid A)=0.8$，则 $P(AB)=$____，$P(A\\cup B)=$____。","sol":"$P(AB)=P(B\\mid A)P(A)=0.8\\times 0.5=0.4$；$P(A\\cup B)=0.5+0.6-0.4=0.7$。\n\n**考点**：条件概率、加法公式。（与 2023 年填空第 1 题完全相同，说明西北大学真题有重复考点。）","traps":[],"ext":[],"kps":["事件关系与概率性质","条件概率与乘法公式"],"pts":5},{"year":2020,"no":2,"type":"填空","stem":"$X\\sim B(n,p)$，且 $E(X)=2.4$，$D(X)=1.44$，则 $n=$____，$p=$____。","sol":"$E(X)=np=2.4$，$\\mathrm{Var}(X)=np(1-p)=1.44$。相除：$1-p=\\dfrac{1.44}{2.4}=0.6$，故 $p=0.4$。$n=\\dfrac{2.4}{0.4}=6$。\n\n**考点**：二项分布的数字特征、反求参数。","traps":[],"ext":[],"kps":["数字特征与矩","常见离散分布"],"pts":5},{"year":2020,"no":3,"type":"填空","stem":"$X\\sim P(\\lambda)$，且 $E[(X-1)(X-2)]=1$，则 $\\lambda=$____。","sol":"$$E[(X-1)(X-2)]=E(X^2-3X+2)=E(X^2)-3E(X)+2=(\\lambda+\\lambda^2)-3\\lambda+2=\\lambda^2-2\\lambda+2=1.$$\n\n故 $\\lambda^2-2\\lambda+1=0$，即 $(\\lambda-1)^2=0$，$\\lambda=1$。\n\n**考点**：泊松分布的二阶矩、解方程。","traps":[],"ext":[],"kps":["常见离散分布","数字特征与矩"],"pts":5},{"year":2020,"no":4,"type":"填空","stem":"已知 $X_1,\\ldots,X_n,X_{n+1}$ i.i.d. $N(\\mu,\\sigma^2)$，则 $X_{n+1}-\\dfrac{1}{n+1}\\sum_{i=1}^n X_i$ 服从____分布。","sol":"设 $\\bar X_n=\\dfrac{1}{n}\\sum_{i=1}^n X_i$。题目中 $\\dfrac{1}{n+1}\\sum_{i=1}^n X_i=\\dfrac{n}{n+1}\\bar X_n$。\n\n$$E\\left[X_{n+1}-\\dfrac{n}{n+1}\\bar X_n\\right]=\\mu-\\dfrac{n}{n+1}\\mu=\\dfrac{\\mu}{n+1}.$$\n\n$$\\mathrm{Var}=\\sigma^2+\\left(\\dfrac{n}{n+1}\\right)^2\\dfrac{\\sigma^2}{n}=\\sigma^2+\\dfrac{n\\sigma^2}{(n+1)^2}=\\sigma^2\\cdot\\dfrac{(n+1)^2+n}{(n+1)^2}=\\sigma^2\\cdot\\dfrac{n^2+3n+1}{(n+1)^2}.$$\n\n正态变量的线性组合仍为正态，故服从 $N\\!\\left(\\dfrac{\\mu}{n+1},\\ \\sigma^2\\dfrac{n^2+3n+1}{(n+1)^2}\\right)$。\n\n注：若题目意为 $X_{n+1}-\\bar X$（其中 $\\bar X=\\dfrac{1}{n}\\sum_{i=1}^n X_i$），则 $E=0$，$\\mathrm{Var}=\\sigma^2\\!\\left(1+\\dfrac{1}{n}\\right)=\\dfrac{\\sigma^2(n+1)}{n}$，服从 $N\\!\\left(0,\\ \\dfrac{\\sigma^2(n+1)}{n}\\right)$。回忆版系数 $\\dfrac{1}{n+1}$ 可能为笔误。\n\n**考点**：正态样本线性组合的分布。","traps":[],"ext":[],"kps":["连续型密度与常见分布","数字特征与矩","总体与样本、统计量"],"pts":5},{"year":2020,"no":5,"type":"填空","stem":"描述频数频率的图形和表格类型有很多，列举两个图形____、____。","sol":"直方图、条形图（或饼图、折线图、茎叶图等）。\n\n**考点**：描述统计中的数据可视化方法。","traps":[],"ext":[],"kps":["卡方拟合优度与列联表"],"pts":5},{"year":2020,"no":6,"type":"填空","stem":"评价点估计的方法有很多，列举两个标准____、____。","sol":"无偏性、有效性（或相合性）。\n\n**考点**：点估计的评价标准。（与 2021 年填空第 5 题考点重复。）","traps":[],"ext":[],"kps":["估计量评价标准"],"pts":5},{"year":2020,"no":1,"type":"计算","stem":"有甲、乙两个盒子，各装有 2 个蓝球、3 个黑球，先从甲盒中摸两球放到乙盒，再从乙盒摸两球，求摸出两个黑球的概率。","sol":"设从甲盒摸出的两球中黑球数为 $k$（$k=0,1,2$）。\n\n$$P(k=0)=\\dfrac{\\binom{2}{2}}{\\binom{5}{2}}=\\dfrac{1}{10}\\quad(\\text{摸出 2 蓝}).$$\n\n$$P(k=1)=\\dfrac{\\binom{2}{1}\\binom{3}{1}}{\\binom{5}{2}}=\\dfrac{6}{10}=\\dfrac{3}{5}\\quad(\\text{1 蓝 1 黑}).$$\n\n$$P(k=2)=\\dfrac{\\binom{3}{2}}{\\binom{5}{2}}=\\dfrac{3}{10}\\quad(\\text{2 黑}).$$\n\n放入乙盒后，乙盒有 7 个球，黑球数为 $3+k$。从乙盒摸两球都是黑球的概率：\n\n$$P(\\text{2 黑}\\mid k)=\\dfrac{\\binom{3+k}{2}}{\\binom{7}{2}}.$$\n\n$$k=0:\\ \\dfrac{\\binom{3}{2}}{21}=\\dfrac{3}{21}=\\dfrac{1}{7};\\qquad k=1:\\ \\dfrac{\\binom{4}{2}}{21}=\\dfrac{6}{21}=\\dfrac{2}{7};\\qquad k=2:\\ \\dfrac{\\binom{5}{2}}{21}=\\dfrac{10}{21}.$$\n\n全概率：\n\n$$P(\\text{2 黑})=\\sum_{k=0}^2 P(k)P(\\text{2 黑}\\mid k)=\\dfrac{1}{10}\\cdot\\dfrac{1}{7}+\\dfrac{3}{5}\\cdot\\dfrac{2}{7}+\\dfrac{3}{10}\\cdot\\dfrac{10}{21}$$\n\n$$=\\dfrac{1}{70}+\\dfrac{6}{35}+\\dfrac{30}{210}=\\dfrac{1}{70}+\\dfrac{12}{70}+\\dfrac{10}{70}=\\dfrac{23}{70}\\approx 0.329.$$","traps":["从甲盒摸两球的黑球数 $k$ 的分布（超几何）；","放入乙盒后乙盒总数变为 7，黑球数为 $3+k$；","全概率公式需覆盖 $k=0,1,2$ 三种情况；","分数通分计算。"],"ext":["考纲定位：多阶段抽样的全概率公式是概率论基础综合题，西北大学偏好\"摸球转移\"场景；","命题延伸方向：已知从乙盒摸出两黑球，求从甲盒摸出的也是两黑球的概率（贝叶斯）。"],"kps":["全概率与贝叶斯","常见离散分布"],"pts":20},{"year":2020,"no":2,"type":"计算","stem":"$f(x,y)=\\begin{cases}b\\,e^{-(x+y)}, & 0<x<1,\\ y>0;\\\\ 0, & \\text{其他}.\\end{cases}$ 求：（1）$b$ 的值；（2）$f_X(x)$ 和 $f_Y(y)$；（3）$U=\\max\\{X,Y\\}$，求 $U$ 的分布。","sol":"（1）归一化：\n\n$$\\int_0^1\\int_0^\\infty b\\,e^{-x-y}\\,dy\\,dx=b\\int_0^1 e^{-x}\\,dx\\cdot\\int_0^\\infty e^{-y}\\,dy=b(1-e^{-1})\\cdot 1=1.$$\n\n故 $b=\\dfrac{1}{1-e^{-1}}=\\dfrac{e}{e-1}$。\n\n（2）\n\n$$f_X(x)=\\int_0^\\infty b\\,e^{-x-y}\\,dy=b\\,e^{-x},\\quad 0<x<1.$$\n\n$$f_Y(y)=\\int_0^1 b\\,e^{-x-y}\\,dx=b\\,e^{-y}(1-e^{-1})=e^{-y},\\quad y>0$$\n\n（因 $b(1-e^{-1})=1$）。即 $Y\\sim \\mathrm{Exp}(1)$，$X$ 服从截断指数分布 $(0,1)$。\n\n$$f_X(x)f_Y(y)=b\\,e^{-x}\\cdot e^{-y}=b\\,e^{-x-y}=f(x,y),$$\n\n故 $X$ 与 $Y$ 独立。\n\n（3）$U=\\max\\{X,Y\\}$。因 $X,Y$ 独立，\n\n$$F_U(u)=P(U\\leq u)=P(X\\leq u,Y\\leq u)=F_X(u)F_Y(u).$$\n\n$F_Y(y)=1-e^{-y}$，$y>0$。$F_X(x)=\\int_0^x b\\,e^{-t}\\,dt=b(1-e^{-x})$，$0<x<1$；$F_X(x)=0$（$x\\leq 0$），$F_X(x)=1$（$x\\geq 1$）。\n\n分区间：\n\n- $u\\leq 0$：$F_U(u)=0$；\n- $0<u<1$：$F_U(u)=b(1-e^{-u})(1-e^{-u})=b(1-e^{-u})^2$；\n- $u\\geq 1$：$F_U(u)=1\\cdot(1-e^{-u})=1-e^{-u}$。\n\n密度 $f_U(u)=F'_U(u)$：\n\n- $0<u<1$：$f_U(u)=2b(1-e^{-u})e^{-u}$；\n- $u\\geq 1$：$f_U(u)=e^{-u}$；\n- 其他：$0$。","traps":["归一化积分 $\\int_0^1 e^{-x}\\,dx=1-e^{-1}$，不是 1；","$b=\\dfrac{1}{1-e^{-1}}$；","$f_Y(y)=e^{-y}$（因 $b(1-e^{-1})=1$ 化简）；","独立性判断：$f(x,y)=f_X(x)f_Y(y)$；","$\\max$ 的分布 $F_U=F_X F_Y$，需分区间（$X$ 只在 $(0,1)$ 有定义）；","$u\\geq 1$ 时 $F_X(u)=1$。"],"ext":["考纲定位：二维联合密度+边际+max 分布是多维随机变量综合题，西北大学偏好考察截断分布与指数分布的组合；","命题延伸方向：求 $\\min\\{X,Y\\}$ 的分布、求 $P(X<Y)$。"],"kps":["联合分布与边际分布","多维函数的分布"],"pts":20},{"year":2020,"no":3,"type":"计算","stem":"$X\\sim U(0,1)$，$Y\\sim \\mathrm{Exp}(1)$，且 $X,Y$ 独立，求 $Z=X+Y$ 的概率密度。","sol":"$f_X(x)=1$，$0<x<1$；$f_Y(y)=e^{-y}$，$y>0$。卷积公式：\n\n$$f_Z(z)=\\int_{-\\infty}^{\\infty} f_X(x)f_Y(z-x)\\,dx.$$\n\n需 $0<x<1$ 且 $z-x>0$ 即 $x<z$。\n\n- $z\\leq 0$：$f_Z(z)=0$；\n- $0<z<1$：$x\\in(0,z)$，\n\n$$f_Z(z)=\\int_0^z e^{-(z-x)}\\,dx=e^{-z}\\int_0^z e^x\\,dx=e^{-z}(e^z-1)=1-e^{-z}.$$\n\n- $z\\geq 1$：$x\\in(0,1)$，\n\n$$f_Z(z)=\\int_0^1 e^{-(z-x)}\\,dx=e^{-z}\\int_0^1 e^x\\,dx=e^{-z}(e-1).$$","traps":["卷积公式积分限的确定：$0<x<1$ 且 $x<z$；","分三段讨论 $z\\leq 0$，$0<z<1$，$z\\geq 1$；","$0<z<1$ 时积分上限为 $z$（不是 1）；","$z\\geq 1$ 时积分上限为 1。"],"ext":["考纲定位：卷积公式求独立变量和的分布是每年必考题型，均匀+指数的组合是经典考法；","命题延伸方向：求 $Z=X-Y$ 或 $Z=XY$ 的密度、求分布函数 $F_Z(z)$。"],"kps":["多维函数的分布"],"pts":20},{"year":2020,"no":4,"type":"计算","stem":"$f(x;\\theta)=(\\theta+1)x^{\\theta}$，$0<x<1$，其中 $\\theta>-1$，求 $\\theta$ 的最大似然估计。","sol":"$$L(\\theta)=\\prod_{i=1}^n (\\theta+1)x_i^{\\theta}=(\\theta+1)^n\\left(\\prod_{i=1}^n x_i\\right)^{\\theta}.$$\n\n$$\\ln L=n\\ln(\\theta+1)+\\theta\\sum_{i=1}^n\\ln x_i.$$\n\n$$\\dfrac{\\mathrm{d}\\ln L}{\\mathrm{d}\\theta}=\\dfrac{n}{\\theta+1}+\\sum_{i=1}^n\\ln x_i=0 \\;\\Rightarrow\\; \\theta+1=-\\dfrac{n}{\\sum\\ln x_i}.$$\n\n故 $\\hat\\theta_{\\mathrm{MLE}}=-\\dfrac{n}{\\sum\\ln X_i}-1$。\n\n验证：$\\dfrac{\\mathrm{d}^2\\ln L}{\\mathrm{d}\\theta^2}=-\\dfrac{n}{(\\theta+1)^2}<0$，为最大值。因 $0<x_i<1$，$\\ln x_i<0$，故 $\\hat\\theta>-1$，满足参数范围。","traps":["似然函数 $(\\theta+1)^n\\left(\\prod x_i\\right)^{\\theta}$；","对数似然求导 $\\dfrac{n}{\\theta+1}+\\sum\\ln x_i=0$；","结果 $\\hat\\theta=-\\dfrac{n}{\\sum\\ln x_i}-1$（注意减 1）；","参数范围 $\\theta>-1$ 的验证。"],"ext":["考纲定位：Beta$(\\theta+1,1)$ 分布的 MLE 是常规考点，与矩估计结合考察；","命题延伸方向：同时求矩估计（$E(X)=\\dfrac{\\theta+1}{\\theta+2}$，矩估计 $\\hat\\theta=\\dfrac{2\\bar X-1}{1-\\bar X}$）。"],"kps":["极大似然估计","连续型密度与常见分布"],"pts":20},{"year":2020,"no":5,"type":"计算","stem":"样本数据：$501,507,498,502,504,499,500,497,499$ 来自总体 $N(\\mu,\\sigma^2)$。求：（1）若已知 $\\sigma^2=4$，求 $\\mu$ 的 95% 置信区间；（2）若未知 $\\sigma^2$，假设 $\\mu=500$，在 $\\alpha=0.05$ 下能否成立。","sol":"$n=9$。\n\n$$\\bar x=\\dfrac{501+507+498+502+504+499+500+497+499}{9}=\\dfrac{4507}{9}\\approx 500.78.$$\n\n样本方差 $s^2=\\dfrac{1}{8}\\sum_{i=1}^9(x_i-\\bar x)^2$。计算：\n\n离差：$0.22,\\ 6.22,\\ -2.78,\\ 1.22,\\ 3.22,\\ -1.78,\\ -0.78,\\ -3.78,\\ -1.78$；\n\n平方和：$0.0484+38.6884+7.7284+1.4884+10.3684+3.1684+0.6084+14.2884+3.1684\\approx 79.556$；\n\n$s^2\\approx\\dfrac{79.556}{8}\\approx 9.9445$，$s\\approx 3.154$。\n\n（1）$\\sigma^2=4$ 已知，$\\sigma=2$，$\\dfrac{\\sigma}{\\sqrt{n}}=\\dfrac{2}{3}$。\n\n$$\\mu\\text{ 的 95\\% CI: }\\bar x\\pm z_{0.975}\\cdot\\dfrac{\\sigma}{\\sqrt{n}}=500.78\\pm 1.96\\times\\dfrac{2}{3}=500.78\\pm 1.307=(499.47,\\ 502.09).$$\n\n（2）$\\sigma^2$ 未知，检验 $H_0:\\mu=500$ vs $H_1:\\mu\\neq 500$，$\\alpha=0.05$。\n\n$$T=\\dfrac{\\bar x-500}{s/\\sqrt{n}}=\\dfrac{500.78-500}{3.154/3}=\\dfrac{0.78}{1.051}\\approx 0.742.$$\n\n拒绝域 $|T|\\geq t_{0.975}(8)=2.306$。$0.742<2.306$，不拒绝 $H_0$，可以认为 $\\mu=500$ 成立。","traps":["样本均值和样本方差的计算（9 个数据）；","$\\sigma$ 已知用 $Z$ 分布，$\\sigma$ 未知用 $t$ 分布；","自由度 $n-1=8$；","$t_{0.975}(8)=2.306$；","结论\"不拒绝 $H_0$\"。"],"ext":["考纲定位：正态总体的区间估计与假设检验是每年必考综合题，通常给出原始数据需先计算样本统计量；","命题延伸方向：$\\sigma^2$ 的置信区间、单侧检验、$p$ 值计算。"],"kps":["区间估计","单样本均值/方差检验","总体与样本、统计量"],"pts":20},{"year":2020,"no":6,"type":"计算","stem":"$y_i=\\beta_1 x_i+\\beta_0+\\varepsilon_i$，$\\varepsilon_i\\sim N(0,\\sigma^2)$ 是一元线性回归模型，$\\hat\\beta_0,\\hat\\beta_1$ 是 $\\beta_0,\\beta_1$ 的估计。试证明：（1）$\\hat\\beta_0,\\hat\\beta_1$ 是 $\\beta_0,\\beta_1$ 的无偏估计；（2）$\\mathrm{Var}(\\hat\\beta_1)=\\dfrac{\\sigma^2}{l_{xx}}$，$\\mathrm{Var}(\\hat\\beta_0)=\\left(\\dfrac{\\bar x^2}{l_{xx}}+\\dfrac{1}{n}\\right)\\sigma^2$。","sol":"最小二乘估计：\n\n$$\\hat\\beta_1=\\dfrac{l_{xy}}{l_{xx}}=\\dfrac{\\sum_{i=1}^n(x_i-\\bar x)(y_i-\\bar y)}{\\sum_{i=1}^n(x_i-\\bar x)^2},\\qquad \\hat\\beta_0=\\bar y-\\hat\\beta_1\\bar x.$$\n\n其中 $l_{xx}=\\sum_{i=1}^n(x_i-\\bar x)^2$。\n\n（1）无偏性：$y_i=\\beta_0+\\beta_1 x_i+\\varepsilon_i$，$E(y_i)=\\beta_0+\\beta_1 x_i$。$\\bar y=\\beta_0+\\beta_1\\bar x+\\bar\\varepsilon$，$E(\\bar y)=\\beta_0+\\beta_1\\bar x$。\n\n$$\\hat\\beta_1=\\dfrac{\\sum(x_i-\\bar x)y_i}{l_{xx}}\\quad\\left(\\text{因 }\\sum(x_i-\\bar x)\\bar y=\\bar y\\sum(x_i-\\bar x)=0\\right).$$\n\n$$E(\\hat\\beta_1)=\\dfrac{\\sum(x_i-\\bar x)E(y_i)}{l_{xx}}=\\dfrac{\\sum(x_i-\\bar x)(\\beta_0+\\beta_1 x_i)}{l_{xx}}=\\dfrac{\\beta_0\\sum(x_i-\\bar x)+\\beta_1\\sum(x_i-\\bar x)x_i}{l_{xx}}=\\dfrac{\\beta_1 l_{xx}}{l_{xx}}=\\beta_1.$$\n\n$$E(\\hat\\beta_0)=E(\\bar y-\\hat\\beta_1\\bar x)=E(\\bar y)-\\bar x E(\\hat\\beta_1)=(\\beta_0+\\beta_1\\bar x)-\\beta_1\\bar x=\\beta_0.$$\n\n（2）方差：\n\n$$\\mathrm{Var}(\\hat\\beta_1)=\\mathrm{Var}\\!\\left[\\dfrac{\\sum(x_i-\\bar x)y_i}{l_{xx}}\\right]=\\dfrac{\\sum(x_i-\\bar x)^2\\mathrm{Var}(y_i)}{l_{xx}^2}=\\dfrac{\\sigma^2 l_{xx}}{l_{xx}^2}=\\dfrac{\\sigma^2}{l_{xx}}.$$\n\n$$\\hat\\beta_0=\\bar y-\\hat\\beta_1\\bar x=\\dfrac{1}{n}\\sum y_i-\\bar x\\cdot\\dfrac{\\sum(x_i-\\bar x)y_i}{l_{xx}}=\\sum_{i=1}^n\\left[\\dfrac{1}{n}-\\dfrac{\\bar x(x_i-\\bar x)}{l_{xx}}\\right]y_i.$$\n\n$$\\mathrm{Var}(\\hat\\beta_0)=\\sum_{i=1}^n\\left[\\dfrac{1}{n}-\\dfrac{\\bar x(x_i-\\bar x)}{l_{xx}}\\right]^2\\sigma^2$$\n\n$$=\\sigma^2\\sum_{i=1}^n\\left[\\dfrac{1}{n^2}-\\dfrac{2\\bar x(x_i-\\bar x)}{n l_{xx}}+\\dfrac{\\bar x^2(x_i-\\bar x)^2}{l_{xx}^2}\\right]=\\sigma^2\\left[\\dfrac{n}{n^2}-0+\\dfrac{\\bar x^2 l_{xx}}{l_{xx}^2}\\right]=\\sigma^2\\left[\\dfrac{1}{n}+\\dfrac{\\bar x^2}{l_{xx}}\\right].$$","traps":["$\\hat\\beta_1$ 的表达式可化简为 $\\dfrac{\\sum(x_i-\\bar x)y_i}{l_{xx}}$（消去 $\\bar y$ 项）；","无偏性证明中 $\\sum(x_i-\\bar x)=0$ 和 $\\sum(x_i-\\bar x)x_i=l_{xx}$；","方差计算中 $y_i$ 独立，$\\mathrm{Var}\\!\\left(\\sum a_i y_i\\right)=\\sum a_i^2\\mathrm{Var}(y_i)$；","$\\hat\\beta_0$ 的方差推导中交叉项 $\\sum(x_i-\\bar x)=0$ 消去；","$l_{xx}=\\sum(x_i-\\bar x)^2$ 的定义。"],"ext":["考纲定位：一元线性回归的最小二乘估计性质是回归分析板块核心考点，2020 年是唯一考察回归分析证明题的年份，说明西北大学偶尔会涉及回归分析；","前置知识点：最小二乘法、期望与方差的线性性质；","后置串联：回归方程的显著性检验（$t$ 检验/$F$ 检验）、决定系数 $R^2$、预测区间；","命题延伸方向：证明 $\\mathrm{Cov}(\\hat\\beta_0,\\hat\\beta_1)=-\\dfrac{\\bar x\\sigma^2}{l_{xx}}$、推导 $\\sigma^2$ 的无偏估计 $\\mathrm{MSE}=\\dfrac{\\mathrm{SSE}}{n-2}$。"],"kps":["一元线性回归","无偏性","数字特征与矩"],"pts":20},{"year":2019,"no":1,"type":"填空","stem":"$P(A)=0.25$，$P(A\\mid B)=?$，$P(B\\mid A)=?$，求 $P(A\\cup B)$。（原图未显示 $P(A\\mid B)$、$P(B\\mid A)$ 的数值）","sol":"","traps":[],"ext":[],"kps":["事件关系与概率性质","条件概率与乘法公式"],"pts":5},{"year":2019,"no":2,"type":"填空","stem":"（原图空白）","sol":"","traps":[],"ext":[],"kps":[],"pts":5},{"year":2019,"no":3,"type":"填空","stem":"$X\\sim N(1,2)$，$Y\\sim N(0,3)$，$Z\\sim N(0,1)$，求 $P(0<2X+3Y-Z<6)$，用 $\\Phi$ 表示。","sol":"","traps":["$\\mathrm{Var}(2X)=4\\mathrm{Var}(X)=8$，$\\mathrm{Var}(3Y)=9\\mathrm{Var}(Y)=27$，$\\mathrm{Var}(-Z)=\\mathrm{Var}(Z)=1$。"],"ext":[],"kps":["连续型密度与常见分布"],"pts":5},{"year":2019,"no":4,"type":"填空","stem":"$x_1,x_2$ 独立，且服从 $N(\\mu,\\sigma^2)$，求 $\\bar{x}=(x_1+x_2)/2$ 的分布。","sol":"","traps":[],"ext":[],"kps":["总体与样本、统计量"],"pts":5},{"year":2019,"no":1,"type":"计算","stem":"甲命中目标的概率为 $1/3$，乙命中目标的概率为 $1/2$，丙命中目标的概率为 $2/3$，求未命中目标的概率。（甲乙丙三人射击）","sol":"\"未命中目标\"通常指三人都未命中（若目标被至少一人命中则命中）。\n\n$$P(\\text{甲未中})=1-\\frac{1}{3}=\\frac{2}{3}.$$\n\n$$P(\\text{乙未中})=1-\\frac{1}{2}=\\frac{1}{2}.$$\n\n$$P(\\text{丙未中})=1-\\frac{2}{3}=\\frac{1}{3}.$$\n\n三人独立，\n\n$$P(\\text{都未中})=\\frac{2}{3}\\times\\frac{1}{2}\\times\\frac{1}{3}=\\frac{1}{9}.$$\n\n若\"未命中目标\"指恰好一人未中或其他含义，需另算。按常规理解为\"三人都未命中目标\"。","traps":["\"未命中目标\"的理解：通常指目标未被击中，即三人都未命中；","三人射击独立，交事件概率为各概率乘积；","对立事件概率 $1-p$。"],"ext":["命题延伸方向：求目标被命中的概率（$1-1/9=8/9$）、求恰好 $k$ 人命中的概率。"],"kps":["事件关系与概率性质","事件独立性"],"pts":20},{"year":2019,"no":2,"type":"计算","stem":"$$f(x)=\\begin{cases}x,&0\\leq x<1;\\\\ a-x,&1\\leq x<2;\\\\ 0,&\\text{其他}.\\end{cases}$$\n\n① 求 $a$；② 求 $F(x)$。","sol":"① 归一化：\n\n$$\\int_0^1 x\\,\\mathrm{d}x+\\int_1^2 (a-x)\\,\\mathrm{d}x=\\frac{1}{2}+\\left[ax-\\frac{x^2}{2}\\right]_1^2=\\frac{1}{2}+(2a-2)-\\left(a-\\frac{1}{2}\\right)=\\frac{1}{2}+2a-2-a+\\frac{1}{2}=a-1=1.$$\n\n故 $a=2$。（这是三角形分布，顶点在 $x=1$，$f(1)=1$。）\n\n② $F(x)=\\int_{-\\infty}^x f(t)\\,\\mathrm{d}t$：\n- $x<0$: $F(x)=0$\n- $0\\leq x<1$: $F(x)=\\int_0^x t\\,\\mathrm{d}t=x^2/2$\n- $1\\leq x<2$: $F(x)=\\int_0^1 t\\,\\mathrm{d}t+\\int_1^x (2-t)\\,\\mathrm{d}t=\\frac{1}{2}+\\left[2t-\\frac{t^2}{2}\\right]_1^x=\\frac{1}{2}+(2x-x^2/2)-(2-1/2)=2x-\\frac{x^2}{2}-1$\n- $x\\geq 2$: $F(x)=1$\n\n验证：$F(1)=1/2$，$F(2)=4-2-1=1$。✓","traps":["归一化积分分两段，$a=2$；","分布函数分段积分，注意 $1\\leq x<2$ 时需先加前一段的积分 $1/2$；","$F(x)$ 连续且单调不减，$F(-\\infty)=0$, $F(+\\infty)=1$。"],"ext":["考纲定位：分段密度的归一化与分布函数是基础计算题；","命题延伸方向：求 $E(X)$, $\\mathrm{Var}(X)$，求 $P(0.5<X<1.5)$。"],"kps":["分布函数与分布列","连续型密度与常见分布"],"pts":20},{"year":2019,"no":3,"type":"计算","stem":"已知二维随机变量 $(X,Y)$ 的联合分布表（部分）：\n\n| x\\y | 2 | 3 | 4 |\n|-----|---|---|---|\n| 0   | ? | 1/8 | ? |\n| 1   | 1/8 | ? | ? |\n\n（回忆版还有一个 $1/6$，位置不明确）\n\n① 填表；② 求 $Z=X-Y$。","sol":"","traps":[],"ext":[],"kps":["随机变量函数的分布","多维函数的分布","联合分布与边际分布"],"pts":20},{"year":2019,"no":4,"type":"计算","stem":"（原截图未显示该题）","sol":"","traps":[],"ext":[],"kps":[],"pts":20},{"year":2019,"no":5,"type":"计算","stem":"$$f(x)=\\begin{cases}e^{-x},&x>0;\\\\ 0,&\\text{其他}.\\end{cases}$$\n\n求 $Y=X^2$ 的密度函数；\n\n$$f(x;\\theta)=\\begin{cases}(\\theta+1)x^\\theta,&0<x<1;\\\\ 0,&\\text{其他}.\\end{cases}$$\n\n求矩估计、极大似然估计。","sol":"**第一问：$Y=X^2$ 的密度**\n\n$X\\sim \\mathrm{Exp}(1)$，$y=x^2$ 在 $x>0$ 上严格单调递增，$x=\\sqrt{y}$，$\\mathrm{d}x/\\mathrm{d}y=1/(2\\sqrt{y})$，$y>0$。\n\n$$f_Y(y)=f_X(\\sqrt{y})\\cdot\\left|\\frac{\\mathrm{d}x}{\\mathrm{d}y}\\right|=\\frac{e^{-\\sqrt{y}}}{2\\sqrt{y}},\\quad y>0.$$\n\n**第二问：矩估计与 MLE**\n\n$f(x;\\theta)=(\\theta+1)x^\\theta,\\ 0<x<1,\\ \\theta>-1$（$\\mathrm{Beta}(\\theta+1,1)$）。\n\n$$E(X)=\\int_0^1 x(\\theta+1)x^\\theta\\,\\mathrm{d}x=\\frac{\\theta+1}{\\theta+2}.$$\n\n矩估计：令 $(\\theta+1)/(\\theta+2)=\\bar{X}$，则\n\n$$\\theta+1=\\bar{X}(\\theta+2)\\ \\Rightarrow\\ \\theta(1-\\bar{X})=2\\bar{X}-1\\ \\Rightarrow\\ \\hat{\\theta}_M=\\frac{2\\bar{X}-1}{1-\\bar{X}}.$$\n\nMLE：$L=(\\theta+1)^n\\left(\\prod x_i\\right)^\\theta$，\n\n$$\\ln L=n\\ln(\\theta+1)+\\theta\\sum \\ln x_i.$$\n\n$$\\frac{\\mathrm{d}\\ln L}{\\mathrm{d}\\theta}=\\frac{n}{\\theta+1}+\\sum \\ln x_i=0\\ \\Rightarrow\\ \\hat{\\theta}_{\\mathrm{MLE}}=-\\frac{n}{\\sum \\ln X_i}-1.$$","traps":["$Y=X^2$ 单调变换公式 $f_Y(y)=f_X(\\sqrt{y})/(2\\sqrt{y})$；","$y>0$ 的取值范围；","矩估计 $E(X)=(\\theta+1)/(\\theta+2)$；","MLE 结果 $\\hat{\\theta}=-n/\\sum \\ln x_i-1$。"],"ext":["考纲定位：随机变量函数的分布+点估计组合题，覆盖两个核心考点；","命题延伸方向：求 $Y=\\sqrt{X}$ 或 $Y=\\ln X$ 的密度、求估计量的无偏性。"],"kps":["极大似然估计","矩估计","随机变量函数的分布","连续型密度与常见分布"],"pts":20},{"year":2019,"no":6,"type":"计算","stem":"$x\\sim N(\\mu,\\sigma^2)$，$\\bar{x}=\\frac{1}{9}\\sum x_i=75$，$s=12.01$。\n\n① 求 $\\sigma=15$ 时，$0.95$ 置信水平的置信区间；\n② 当 $\\sigma$ 未知时，可否认为平均成绩为 70（$x$ 是成绩）。","sol":"$n=9$, $\\bar{x}=75$, $s=12.01$。\n\n① $\\sigma=15$ 已知，$\\sigma/\\sqrt{n}=15/3=5$。$\\mu$ 的 95% CI：\n\n$$\\bar{x}\\pm z_{0.975}\\cdot\\frac{\\sigma}{\\sqrt{n}}=75\\pm 1.96\\times 5=75\\pm 9.8=(65.2,\\ 84.8).$$\n\n② $\\sigma$ 未知，检验 $H_0:\\mu=70$ vs $H_1:\\mu\\neq 70$，$\\alpha=0.05$。\n\n$$T=\\frac{\\bar{x}-70}{s/\\sqrt{n}}=\\frac{75-70}{12.01/3}=\\frac{5}{4.003}\\approx 1.249.$$\n\n拒绝域 $|T|\\geq t_{0.975}(8)=2.306$。$1.249<2.306$，不拒绝 $H_0$，可以认为平均成绩为 70。","traps":["$\\sigma$ 已知用 Z，$\\sigma$ 未知用 t；","自由度 $n-1=8$；","$t_{0.975}(8)=2.306$；","$s/\\sqrt{n}=12.01/3\\approx 4.003$。"],"ext":["考纲定位：区间估计+假设检验组合题是每年必考题型，$\\sigma$ 已知/未知的区分是核心；","命题延伸方向：$\\sigma^2$ 的置信区间、单侧检验。"],"kps":["区间估计","单样本均值/方差检验"],"pts":20}]};</script>
<script>/* 432 手机版 · 运行时（单文件内联用，依赖 window.DATA_M 与 katex） */
(function () {
  var D = window.DATA_M;
  var $ = function (s) { return document.querySelector(s); };

  /* ---------- markdown + KaTeX（与桌面版 U.md 同规则） ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function math(tex, display) {
    try {
      return window.katex
        ? katex.renderToString(tex, { displayMode: !!display, throwOnError: false, strict: false, output: "html" })
        : esc((display ? "$$" : "$") + tex + (display ? "$$" : "$"));
    } catch (e) { return esc(tex); }
  }
  function fmt(s) {
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }
  function inline(s) {
    var out = "", i = 0, m;
    var re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g;
    while ((m = re.exec(s))) {
      out += fmt(s.slice(i, m.index));
      out += math(m[1] != null ? m[1] : m[2], m[1] != null);
      i = m.index + m[0].length;
    }
    out += fmt(s.slice(i));
    return out;
  }
  function table(lines) {
    var rows = lines.map(function (l) {
      return l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
    });
    var head = null, body = rows;
    if (rows.length > 1 && /^[\s:|-]+$/.test(rows[1].join(""))) { head = rows[0]; body = rows.slice(2); }
    var h = '<div class="tblwrap"><table class="tb">';
    if (head) h += "<thead><tr>" + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead>";
    h += "<tbody>" + body.map(function (r) {
      return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
    }).join("") + "</tbody></table></div>";
    return h;
  }
  function md(src) {
    if (!src) return "";
    src = String(src).replace(/\r\n/g, "\n").trim();
    var blocks = src.split(/\n\s*\n/), html = "";
    for (var bi = 0; bi < blocks.length; bi++) {
      var b = blocks[bi].trim(); if (!b) continue;
      var L = b.split("\n");
      if (/^\$\$[\s\S]*\$\$$/.test(b) && b.length > 4) {
        var inner = b.slice(2, -2);
        if (/\\begin\{gathered\}/.test(inner)) {
          inner = inner.replace(/\\begin\{gathered\}/, "").replace(/\\end\{gathered\}/, "");
          var rows = inner.split(/\\\\/), out = [];
          for (var ri = 0; ri < rows.length; ri++) {
            var parts = rows[ri].split(/,\s*\\(?:qquad|quad)/);
            for (var pi = 0; pi < parts.length; pi++) {
              var seg = parts[pi].trim().replace(/,$/, "");
              if (seg) out.push('<div class="mathb">' + math(seg, true) + "</div>");
            }
          }
          html += out.join("");
          continue;
        }
        html += '<div class="mathb">' + inline(b) + "</div>";
        continue;
      }
      if (L.every(function (x) { return /^\s*[-*]\s+/.test(x); })) {
        html += "<ul>" + L.map(function (x) { return "<li>" + inline(x.replace(/^\s*[-*]\s+/, "")) + "</li>"; }).join("") + "</ul>"; continue;
      }
      if (L.every(function (x) { return /^\s*\d+[.．]\s+/.test(x); })) {
        html += "<ol>" + L.map(function (x) { return "<li>" + inline(x.replace(/^\s*\d+[.．]\s+/, "")) + "</li>"; }).join("") + "</ol>"; continue;
      }
      if (L.every(function (x) { return x.trim().charAt(0) === "|"; })) { html += table(L); continue; }
      if (L.every(function (x) { return x.trim().charAt(0) === ">"; })) {
        html += "<blockquote>" + inline(L.map(function (x) { return x.replace(/^\s*>\s?/, ""); }).join(" ")) + "</blockquote>"; continue;
      }
      if (/^#{1,4}\s/.test(b)) {
        var n = Math.min(b.match(/^#+/)[0].length + 2, 6);
        html += "<h" + n + ">" + inline(b.replace(/^#+\s*/, "")) + "</h" + n + ">"; continue;
      }
      html += "<p>" + inline(b.replace(/\n/g, " ")) + "</p>";
    }
    return html;
  }
  function stripP(h) { return h.replace(/^<p>/, "").replace(/<\/p>$/, ""); }

  /* ---------- 状态 ---------- */
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { }
      if (window.__onProgress && !window.__silent) { try { window.__onProgress(k); } catch (e) { } }
    }
  };
  var learned = {}, quizDone = {};
  (LS.get("m_learned", []) || []).forEach(function (k) { learned[k] = 1; });
  (LS.get("m_quiz", []) || []).forEach(function (k) { quizDone[k] = 1; });
  function saveLearned() { LS.set("m_learned", Object.keys(learned)); }
  function saveQuiz() { LS.set("m_quiz", Object.keys(quizDone)); }

  var state = { tab: LS.get("m_tab", "pojue"), q: "", year: "all", open: {} };
  var TABS = [
    ["pojue", "招法", "✦"], ["formula", "公式", "∑"], ["concept", "辨析", "⇄"],
    ["quiz", "默写", "✎"], ["q", "真题", "☰"]
  ];

  function blob(o) { try { return JSON.stringify(o).toLowerCase(); } catch (e) { return ""; } }
  function hit(o) { return !state.q || blob(o).indexOf(state.q) >= 0; }
  function empty() { return '<div class="empty">没有匹配的内容 · 换个关键词试试</div>'; }

  /* ---------- 各页 ---------- */
  function pagePojue() {
    var list = D.pojue.filter(hit);
    var h = '<div class="bar" style="padding:0 14px"><span>共 ' + list.length + ' 招</span>'
      + '<span>已学会 <b id="cnt">' + Object.keys(learned).length + '</b> / ' + D.pojue.length + '</span></div>';
    list.forEach(function (j) {
      var isOn = !!learned[j.id];
      h += '<details class="card" data-id="' + j.id + '" data-xid="pj:' + j.id + '"' + (state.open[j.id] ? " open" : "") + '>'
        + '<summary><span class="snum">' + j.id.toUpperCase() + '</span>'
        + '<span class="stitle">' + esc(j.name) + '<span class="ssub">' + stripP(md(j.short)) + '</span></span></summary>'
        + '<div class="body">'
        + '<div class="lab">识别信号</div><div class="sig">' + md(j.signal) + '</div>'
        + '<div class="lab">固定动作</div><ol class="steps">'
        + j.steps.map(function (s) { return "<li>" + stripP(md(s)) + "</li>"; }).join("") + '</ol>'
        + '<div class="lab">模板</div><div class="tpl">' + md(j.template) + '</div>'
        + '<div class="lab">陷阱</div>'
        + (j.traps || []).map(function (t) { return '<div class="trap">' + stripP(md(t)) + "</div>"; }).join("")
        + ((j.next && j.next.length) ? '<div class="lab">转招</div><div class="chips">'
          + j.next.map(function (id) {
            var t = null;
            for (var i = 0; i < D.pojue.length; i++) if (D.pojue[i].id === id) t = D.pojue[i];
            return t ? '<button class="chip" data-jump="' + id + '">' + esc(t.name) + ' →</button>' : "";
          }).join("") + "</div>" : "")
        + '<button class="learn' + (isOn ? " on" : "") + '" data-learn="' + j.id + '">'
        + (isOn ? "✓ 已学会" : "标记已学会") + "</button>"
        + "</div></details>";
    });
    return list.length ? h : empty();
  }

  function pageFormula() {
    var h = "", any = 0;
    D.formulas.forEach(function (t) {
      var rows = t.rows.filter(function (r) { return !state.q || JSON.stringify(r).toLowerCase().indexOf(state.q) >= 0; });
      if (!rows.length) return;
      any++;
      h += '<div class="card"><div class="body" style="padding-top:12px">'
        + '<div class="stitle">' + esc(t.title) + '</div>';
      rows.forEach(function (r) {
        h += '<div style="margin-top:11px;padding-top:9px;border-top:1px solid var(--line)">'
          + '<div class="stitle" style="font-size:14px">' + md(r[0]) + "</div>";

  /* ---------------- 复习记录 ---------------- */

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  }
  function addDays(s, n) {
    var p = String(s).split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + n);
    return todayStr(d);
  }

  function rec(xid) {
    var r = REP[xid] || {};
    if (typeof r.n !== "number") r.n = 0;
    if (typeof r.m !== "number") r.m = 0;
    if (!r.t) r.t = 0;
    if (typeof r.ef !== "number") r.ef = 2.5;
    if (typeof r.iv !== "number") r.iv = 0;
    if (typeof r.lp !== "number") r.lp = 0;
    if (!r.due) r.due = todayStr();      // 从没复习过 → 今天到期
    return r;
  }
  function setRec(xid, o) { REP[xid] = o; persist(K_REP, REP); }
  function isDue(r) { return !r.due || r.due <= todayStr(); }

  // 三档评分：忘记 / 模糊 / 熟悉 → 不同间隔
  function gradeRec(xid, g) {
    var r = rec(xid), T = todayStr();
    r.n += 1; r.t = Date.now();
    if (g === "again") {                        // 忘记：当天再来，难度上调
      r.lp += 1; r.ef = Math.max(1.3, r.ef - 0.2);
      r.iv = 0; r.due = T; r.m = 0;
    } else if (g === "fuzzy") {                 // 模糊：短间隔 +20%
      r.ef = Math.max(1.3, r.ef - 0.05);
      r.iv = r.iv <= 0 ? 1 : Math.max(1, Math.round(r.iv * 1.2));
      r.due = addDays(T, r.iv); r.m = 1;
    } else {                                    // 熟悉：长间隔 ×EF
      r.ef = Math.min(3.0, r.ef + 0.1);
      r.iv = r.iv <= 0 ? 3 : (r.iv <= 3 ? 7 : Math.round(r.iv * r.ef));
      r.due = addDays(T, r.iv); r.m = 2;
    }
    setRec(xid, r);
    return r;
  }
  function fmtDate(t) {
    if (!t) return "未记";
    var d = new Date(t);

  /* ---------------- DOM 工具 ---------------- */
  function collectTextNodes(root) {
    var out = [], walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {

          if (p.tagName === "SCRIPT" || p.tagName === "STYLE") return NodeFilter.FILTER_REJECT;

  /* ---------------- 高亮 ---------------- */
  function applyHL(root, list) {

  var hlBar, pendingSel = null;

    hlBar.addEventListener("mousedown", function (e) { e.preventDefault(); });
    hlBar.addEventListener("click", function (e) {

  }

  }

  function doHighlight() {

    if (!sel) return;

  }

  var CB = {}, cbn = 0;

      });

  // 揭示

  /* ---------------- 汇总条 ---------------- */

  function sumHost() {

  /* ---------------- 断点续读 ---------------- */

    observe();
    setTimeout(function () { restorePos(); scan(); }, 120);
    setTimeout(function () { restorePos(); }, 700);
    document.addEventListener("DOMContentLoaded", scan);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.EXT = {
    rep: REP, hl: HL, pos: POS,
    state: function () { return { page: PAGE, rep: REP, hl: HL, pos: POS }; },
    clearPage: function () {
      Array.prototype.forEach.call(document.querySelectorAll("[data-xid]"), function (el) {
        var xid = el.getAttribute("data-xid"); delete REP[xid]; delete HL[xid];
      });
      delete POS[pageKey()];
      persist(K_REP, REP); persist(K_HL, HL); persist(K_POS, POS);
      location.reload();
    },
    scan: scan, savePos: savePos, restorePos: restorePos,
    setPage: function (k) { window.EXT_PAGE_KEY = k; },
    rescan: function () { scan(); },
    onRender: function (k) { if (k) window.EXT_PAGE_KEY = k; scan(); setTimeout(restorePos, 60); }
  };
})();
</script>
</body>
</html>
