<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>阶梯练 93 题 · 432 统计</title>
<link rel="stylesheet" href="assets/katex/katex.min.css">
<link rel="stylesheet" href="assets/app.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('ds432.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))</script>
<style>
  .lv{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;font-weight:600;letter-spacing:.4px}
  .lv.b{background:rgba(31,111,92,.12);color:var(--accent)}
  .lv.m{background:rgba(194,87,31,.12);color:var(--accent-2)}
  .lv.h{background:rgba(179,52,31,.12);color:var(--warn)}
  .li{border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;margin:8px 0;background:var(--panel)}
  .li .qq{font-family:var(--serif);font-size:14.5px}
  .li.done{border-color:rgba(31,111,92,.45)}
  .ladder-nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
  .mctl{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;vertical-align:middle}
  .mctl button{background:transparent;border:0;border-radius:0;padding:4px 9px;font-size:12px;line-height:1.5;cursor:pointer;color:var(--ink-3);font-family:inherit}
  .mctl button+button{border-left:1px solid var(--line)}
  .mctl button.on[data-m="1"]{background:rgba(31,111,92,.14);color:var(--accent);font-weight:600}
  .mctl button.on[data-m="0"]{background:rgba(179,52,31,.10);color:var(--warn);font-weight:600}
  .mstat{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin:0 0 12px}
  .mstat b{color:var(--ink)}
  .mstat .bar{width:110px;height:6px;display:inline-block;flex:0 0 110px;margin:0}
  .mstat .chip{cursor:pointer}
</style>
</head>
<body data-page="ladder.html">
<div class="shell">
  <aside class="side"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="sub">LADDER · 31 题型 × 3 难度 = 93 题</div>
        <h1>阶梯练</h1>
      </div>
      <div class="actions"><button class="btn" id="themeBtn" title="切换主题">☀</button></div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <p style="margin:0">每招三题：<b>基础</b>只求会套模板，<b>中档</b>要能独立走完固定动作，<b>拔高</b>要能处理边界与证明。93 题 = 题库 47 + 自编 46，来源《432题型递进练习_93题》。先做题，答案折叠着——做完再点开。</p>
    </div>

    <div class="mstat" id="mstat"></div>
    <div class="ladder-nav" id="nav"></div>
    <div id="list"></div>

    <footer class="foot">题目与答案均来自本机素材；答案区的【考点】行保留原文，便于对照破题诀。</footer>
  </main>
</div>

<script src="data/data.js"></script>
<script src="assets/katex/katex.min.js"></script>
<script src="assets/app.js"></script>
<script>
U.boot("ladder.html");
(function(){
  const D = window.DATA, L = D.ladder;
  const LV = {基础:"b",中档:"m",拔高:"h"};
  const RK = "ds432.rep", FK = "ds432.ladder.filter";
  const KEY = (no, lv) => "lad:t" + no + "-" + lv;
  const p2 = n => (n < 10 ? "0" : "") + n;
  const d0 = new Date();
  const TODAY = d0.getFullYear() + "-" + p2(d0.getMonth() + 1) + "-" + p2(d0.getDate());

  let filt = "all";
  try { filt = localStorage.getItem(FK) || "all"; } catch(e){}
  if (["all","undone","done"].indexOf(filt) < 0) filt = "all";

  const TOTAL = L.reduce((s,t) => s + t.items.length, 0);

  function rep(){ try { return JSON.parse(localStorage.getItem(RK) || "{}") || {}; } catch(e){ return {}; } }
  function isM(no, lv){ const r = rep()[KEY(no, lv)]; return !!r && r.m === 2; }
  // 掌握状态写进 ds432.rep 的 m（0 未掌握 / 2 已掌握），与破题诀、记忆曲线共用一份
  function setM(no, lv, on){
    const R = rep(), k = KEY(no, lv), r = R[k] || {n:0, t:0, ef:2.5, iv:0, lp:0, due:TODAY};
    r.m = on ? 2 : 0; r.t = Date.now();
    r.iv = on ? 5 : 1;
    { const p=TODAY.split("-"), d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+r.iv);
      r.due = d.getFullYear()+"-"+(d.getMonth()+1<10?"0":"")+(d.getMonth()+1)+"-"+(d.getDate()<10?"0":"")+d.getDate(); }
    R[k] = r;
    try { localStorage.setItem(RK, JSON.stringify(R)); } catch(e){}
    try { window.dispatchEvent(new CustomEvent("ds432:ext-change", {detail: RK})); } catch(e){}
    updateUI();
  }

  document.getElementById("nav").innerHTML = L.map(t=>'<a class="chip" href="#t'+t.no+'">'+t.no+'. '+U.esc(t.name)+'</a>').join("");

  document.getElementById("list").innerHTML = L.map(t=>{
    return '<div class="card" id="t'+t.no+'" data-topic="'+t.no+'" style="margin-bottom:14px">'+
      '<div class="spread"><h3 style="margin:0"><span class="mono small" style="color:var(--accent)">'+String(t.no).padStart(2,"0")+'</span> '+U.esc(t.name)+
      ' <span class="small muted tstat" data-t="'+t.no+'" style="font-weight:400"></span></h3>'+
      '<a class="btn sm" href="pojue.html#j'+String(t.no).padStart(2,"0")+'">对应破题诀 →</a></div>'+
      t.items.map(it=>
        '<div class="li" data-mk="'+KEY(t.no, it.level)+'" data-no="'+t.no+'" data-lv="'+it.level+'">'+
        '<div class="spread" style="align-items:flex-start"><div style="flex:1">'+
        '<div class="row" style="gap:6px;margin-bottom:6px"><span class="lv '+LV[it.level]+'">'+it.level+'</span>'+
        '<span class="chip">'+U.esc(it.code)+(it.tag?" · "+U.esc(it.tag):"")+'</span></div>'+
        '<div class="qq">'+U.md(it.q)+'</div></div>'+
        '<span class="mctl" data-mctl="'+KEY(t.no, it.level)+'" data-no="'+t.no+'" data-lv="'+it.level+'" style="margin-left:10px;flex:0 0 auto">'+
        '<button data-m="0">未掌握</button><button data-m="1">✓ 掌握</button></span></div>'+
        '<details style="margin-top:8px"><summary>答案与解析</summary><div class="in">'+
        (it.kp?'<div class="small muted" style="margin-bottom:6px">【考点】'+U.esc(it.kp)+'</div>':"")+
        (it.ans? U.md(it.ans) : '<div class="muted">无答案</div>')+
        '</div></details></div>').join("")+
      "</div>";
  }).join("");

  document.querySelectorAll("[data-mctl]").forEach(g=>{
    g.querySelectorAll("button[data-m]").forEach(b=>{
      b.addEventListener("click", ()=>{
        setM(+g.getAttribute("data-no"), g.getAttribute("data-lv"), b.getAttribute("data-m") === "1");
      });
    });
  });

  function counts(){
    let done = 0;
    L.forEach(t=>t.items.forEach(it=>{ if (isM(t.no, it.level)) done++; }));
    return {done, undone: TOTAL - done, pct: TOTAL ? Math.round(done / TOTAL * 100) : 0};
  }

  function updateUI(){
    const c = counts();

    document.getElementById("mstat").innerHTML =
      '掌握进度 <b>'+c.done+'</b> / '+TOTAL+
      '<span class="bar"><i style="width:'+c.pct+'%"></i></span>'+
      '<b>'+c.pct+'%</b><span class="muted">未掌握 '+c.undone+'</span>'+
      '<span style="flex:1"></span>'+
      '<span class="chip'+(filt==="all"?" on":"")+'" data-mf="all">全部 '+TOTAL+'</span>'+
      '<span class="chip'+(filt==="undone"?" on":"")+'" data-mf="undone">只看未掌握 '+c.undone+'</span>'+
      '<span class="chip'+(filt==="done"?" on":"")+'" data-mf="done">只看已掌握 '+c.done+'</span>';
    document.querySelectorAll("[data-mf]").forEach(el=>{
      el.addEventListener("click", ()=>{
        filt = el.getAttribute("data-mf");
        try { localStorage.setItem(FK, filt); } catch(e){}
        updateUI();
      });
    });

    // 每题：按钮态 + 卡片描边 + 按筛选显隐
    let shown = 0;
    document.querySelectorAll(".li[data-mk]").forEach(li=>{
      const mk = li.getAttribute("data-mk");
      const r = rep()[mk] || {};
      const on = r.m === 2;
      const g = li.querySelector("[data-mctl]");
      if (g){
        const b0 = g.querySelector('[data-m="0"]'), b1 = g.querySelector('[data-m="1"]');
        if (b0) b0.classList.toggle("on", !on);
        if (b1) b1.classList.toggle("on", on);
      }
      li.classList.toggle("done", on);
      const hide = (filt === "done" && !on) || (filt === "undone" && on);
      li.style.display = hide ? "none" : "";
      if (!hide) shown++;
    });

    // 每个题型：自身掌握数 + 全被筛掉时整张卡收起
    L.forEach(t=>{
      const n = t.items.length;
      let k = 0, vis = 0;
      t.items.forEach(it=>{ if (isM(t.no, it.level)) k++; });
      const lab = document.querySelector('.tstat[data-t="'+t.no+'"]');
      if (lab) lab.textContent = "掌握 " + k + " / " + n;
      const card = document.querySelector('[data-topic="'+t.no+'"]');
      if (card){
        card.querySelectorAll(".li[data-mk]").forEach(li=>{ if (li.style.display !== "none") vis++; });
        card.style.display = vis ? "" : "none";
      }
    });

    if (!shown && !document.getElementById("ladderEmpty")){
      const d = document.createElement("div");
      d.id = "ladderEmpty"; d.className = "card";
      d.innerHTML = '<p style="margin:0" class="muted">当前筛选下没有题目。</p>';
      document.getElementById("list").appendChild(d);
    } else if (shown && document.getElementById("ladderEmpty")) {
      document.getElementById("ladderEmpty").remove();
    }
  }

  updateUI();
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
})();
</script>
<script src="assets/notes.js" defer></script>
</body>
</html>
