<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>阶梯练 93 题 · 432 统计</title>
<link rel="stylesheet" href="assets/katex/katex.min.css">
<link rel="stylesheet" href="assets/app.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('ds432.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))</script>
<style>
  .lv{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;font-weight:600;letter-spacing:.4px}
  .lv.b{background:rgba(31,111,92,.12);color:var(--accent)}
  .lv.m{background:rgba(194,87,31,.12);color:var(--accent-2)}
  .lv.h{background:rgba(179,52,31,.12);color:var(--warn)}
  .li{border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;margin:8px 0;background:var(--panel)}
  .li .qq{font-family:var(--serif);font-size:14.5px}
  .ladder-nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
</style>
</head>
<body data-page="ladder.html">
<div class="shell">
  <aside class="side"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <div class="sub">LADDER · 31 题型 × 3 难度 = 93 题</div>
        <h1>阶梯练</h1>
      </div>
      <div class="actions"><button class="btn" id="themeBtn" title="切换主题">☀</button></div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <p style="margin:0">每招三题：<b>基础</b>只求会套模板，<b>中档</b>要能独立走完固定动作，<b>拔高</b>要能处理边界与证明。93 题 = 题库 47 + 自编 46，来源《432题型递进练习_93题》。先做题，答案折叠着——做完再点开。</p>
    </div>

    <div class="ladder-nav" id="nav"></div>
    <div id="list"></div>

    <footer class="foot">题目与答案均来自本机素材；答案区的【考点】行保留原文，便于对照破题诀。</footer>
  </main>
</div>

<script src="data/data.js"></script>
<script src="assets/katex/katex.min.js"></script>
<script src="assets/app.js"></script>
<script>
U.boot("ladder.html");
(function(){
  const D = window.DATA, L = D.ladder;
  const LV = {基础:"b",中档:"m",拔高:"h"};

  document.getElementById("nav").innerHTML = L.map(t=>'<a class="chip" href="#t'+t.no+'">'+t.no+'. '+t.name+'</a>').join("");

  document.getElementById("list").innerHTML = L.map(t=>{
    return '<div class="card" id="t'+t.no+'" style="margin-bottom:14px">'+
      '<div class="spread"><h3 style="margin:0"><span class="mono small" style="color:var(--accent)">'+String(t.no).padStart(2,"0")+'</span> '+t.name+'</h3>'+
      '<a class="btn sm" href="pojue.html#j'+String(t.no).padStart(2,"0")+'">对应破题诀 →</a></div>'+
      t.items.map((it,i)=>
        '<div class="li"><div class="spread" style="align-items:flex-start"><div style="flex:1">'+
        '<div class="row" style="gap:6px;margin-bottom:6px"><span class="lv '+LV[it.level]+'">'+it.level+'</span>'+
        '<span class="chip">'+it.code+(it.tag?" · "+U.esc(it.tag):"")+'</span></div>'+
        '<div class="qq">'+U.md(it.q)+'</div></div></div>'+
        '<details style="margin-top:8px"><summary>答案与解析</summary><div class="in">'+
        (it.kp?'<div class="small muted" style="margin-bottom:6px">【考点】'+U.esc(it.kp)+'</div>':"")+
        (it.ans? U.md(it.ans) : '<div class="muted">无答案</div>')+
        '</div></details></div>').join("")+
      "</div>";
  }).join("");
})();
</script>
</body>
</html>
